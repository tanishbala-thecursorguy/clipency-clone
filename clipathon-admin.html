  /* ============================================================
     PRIZES
     ============================================================ */
  var PRIZE_KINDS = ['overall','brand','special','season'];
  function renderPrizes(){
    Promise.all([
      q('prizes', function(b){ return b.eq('cycle_id',A.cycle.id).order('sort_order'); }),
      db().from('prize_awards').select('*, creators(creator_code, full_name), prizes(label)').eq('cycle_id',A.cycle.id),
      q('brands', function(b){ return b.eq('cycle_id',A.cycle.id).order('name'); })
    ]).then(function(r){
      var pz=r[0], aw=rows(r[1]), brands=r[2];
      var pub = pz.filter(function(p){ return p.published_at; })[0];
      var cash = pz.reduce(function(a,p){ return a + (p.cash_minor||0)*(p.seats||1); },0);

      $('#przBody').innerHTML =
        lede('What this cycle pays out.',
          'Write the tiers, then publish. Publishing freezes the amounts.',
          'The pool is published before registration opens and never revised once results are known, and the ' +
          'database enforces the second half. A prize table that can move after the winners are visible is not a ' +
          'prize table, it is a negotiation.') +
        '<div class="bar-t">' +
          (pub ? '<span class="chip ok">published ' + d(pub.published_at) + '</span>'
               : gate('finance','<button class="btn btn-sm" id="pzPub">Publish the pool</button>')) +
          gate('finance','<button class="btn-ghost btn-sm" id="pzNew">Add a tier</button>') +
          '<span class="hint">Tiers add up to ' + money(cash) + '. The cycle records a pool of ' +
            money(A.cycle.prize_pool_minor) + '.</span>' +
        '</div>' +
        '<div class="split">' +
          '<div class="card">' +
            '<div class="sec-h"><h2>Tiers</h2><span class="sh-sub">' + pz.length + '</span></div>' +
            table(['Tier','Kind','Ranks','Cash each','Non cash','Seats',''], pz, function(p){
              return '<tr><td class="wrap"><b>' + esc(p.label) + '</b></td>' +
                '<td class="mono-s">' + esc(p.kind) + '</td>' +
                '<td class="mono-s">' + (p.rank_from ? (p.rank_from + (p.rank_to && p.rank_to!==p.rank_from ? (' to ' + p.rank_to) : '')) : '-') + '</td>' +
                '<td class="mono-s">' + (p.cash_minor?money(p.cash_minor):'-') + '</td>' +
                '<td class="wrap">' + esc(p.non_cash||'-') + '</td>' +
                '<td class="mono-s">' + (p.seats||1) + '</td>' +
                '<td><div class="acts-wrap">' + (p.published_at
                  ? '<span class="chip ok">frozen</span>'
                  : gate('finance','<button class="b-xs" data-ep="' + p.id + '">Edit</button>' +
                                   '<button class="b-xs no" data-dp="' + p.id + '">Delete</button>')) + '</div></td></tr>';
            }, 'No prize tiers yet', 'Write the tiers during draft, then publish before registration opens.') +
          '</div>' +
          '<div class="card">' +
            '<div class="sec-h"><h2>Awards</h2><span class="sh-sub">' + aw.length + '</span></div>' +
            table(['Creator','Tier','Cash','Announced'], aw, function(x){
              return '<tr>' + who((x.creators||{}).full_name, (x.creators||{}).creator_code) +
                '<td>' + esc((x.prizes||{}).label||'-') + '</td>' +
                '<td class="mono-s">' + money(x.cash_minor) + '</td>' +
                '<td class="mono-s">' + (x.announced_at?d(x.announced_at):'not yet') + '</td></tr>';
            }, 'Nothing awarded yet', 'Awards appear once results are signed off.') +
          '</div>' +
        '</div>';

      var fields=function(p){ p=p||{};
        return F([{k:'label', label:'What it is called', value:p.label||'', full:true, ph:'e.g. Cycle winner'},
                  {k:'kind',  label:'Kind', type:'select', value:p.kind||'overall', opts:PRIZE_KINDS,
                   hint:'Overall ranks across the cycle. Brand ranks within one brand.'},
                  {k:'brand', label:'Which brand', type:'select', value:p.brand_id||'',
                   opts:[{v:'',t:'not brand specific'}].concat(brands.map(function(b){ return {v:b.id,t:b.name}; }))},
                  {k:'from',  label:'From rank', type:'number', min:1, value:p.rank_from||''},
                  {k:'to',    label:'To rank', type:'number', min:1, value:p.rank_to||''},
                  {k:'cash',  label:'Cash each, in rupees', type:'number', min:0, value:(p.cash_minor||0)/100},
                  {k:'nc',    label:'Non cash', value:p.non_cash||'', ph:'e.g. Brand hamper and a feature post'},
                  {k:'seats', label:'How many people win it', type:'number', min:1, value:p.seats||1},
                  {k:'ord',   label:'Order shown', type:'number', min:0, value:p.sort_order||0}]); };
      var patch=function(){ return { label:Vt('label'), kind:Vt('kind')||'overall', brand_id:Vt('brand'),
        rank_from:Vn('from'), rank_to:Vn('to'), cash_minor:Math.round((Vn('cash')||0)*100),
        non_cash:Vt('nc'), seats:Vn('seats')||1, sort_order:Vn('ord')||0 }; };

      var pb=$('#pzPub');
      if(pb) pb.onclick=function(){
        ask({ eyebrow:'Prizes', title:'Publish the prize pool?', danger:true,
          sub:'After this the amounts are frozen.',
          body:'<p class="m-p">Creators will see every tier, and the database will refuse any later change to the ' +
            'money. Check the totals now: ' + pz.length + ' tier' + (pz.length===1?'':'s') + ' worth ' + money(cash) +
            ' in cash across ' + pz.reduce(function(a,p){ return a+(p.seats||1); },0) + ' winners.</p>',
          cta:'Publish and freeze', run:function(){ return act('admin_publish_prizes',{p_cycle_id:A.cycle.id}); },
          after:function(){ renderPrizes(); }});
      };
      var pn=$('#pzNew');
      if(pn) pn.onclick=function(){
        if(pub) return toast('The pool is published. Tiers cannot change now.', true);
        ask({ eyebrow:'Prize tier', title:'Add a tier', body:fields(null), cta:'Add tier',
          run:function(){
            if(!Vt('label')){ toast('Give the tier a name', true); return false; }
            var p=patch(); p.cycle_id=A.cycle.id;
            return save(db().from('prizes').insert(p), 'Tier added');
          }, after:function(){ renderPrizes(); }});

      $$('#przBody [data-ep]').forEach(function(b){
        b.onclick=function(){
          var p=pz.filter(function(x){ return x.id===b.dataset.ep; })[0];
          ask({ eyebrow:'Prize tier', title:'Edit ' + p.label, body:fields(p), cta:'Save tier',
            run:function(){ return save(db().from('prizes').update(patch()).eq('id',p.id), 'Tier saved'); },
            after:function(){ renderPrizes(); }});
        };
      });
      $$('#przBody [data-dp]').forEach(function(b){
        b.onclick=function(){
          var p=pz.filter(function(x){ return x.id===b.dataset.dp; })[0];
          ask({ eyebrow:'Prize tier', title:'Delete "' + p.label + '"?', danger:true,
            sub:'Only possible while the pool is unpublished.',
            body:'<p class="m-p">The tier disappears from the published table creators will see.</p>',
            cta:'Delete tier',
            run:function(){ return save(db().from('prizes').delete().eq('id',p.id), 'Tier deleted'); },
            after:function(){ renderPrizes(); }});
        };
      });
    });
  }

  /* ============================================================
     PAYOUTS
     ============================================================ */
  function renderPayouts(){
    Promise.all([
      db().from('payouts').select('*, creators(creator_code, full_name, email)')
        .eq('cycle_id',A.cycle.id).order('created_at',{ascending:false}),
      db().from('prize_awards').select('id, cash_minor, creator_id, creators(creator_code, full_name), prizes(label)')
        .eq('cycle_id',A.cycle.id)
    ]).then(function(r){
      var list=rows(r[0]), awards=rows(r[1]);
      var owed = list.filter(function(x){ return x.status==='pending'||x.status==='approved'; });
      var done = list.filter(function(x){ return x.status==='sent'; });
      var covered = {}; list.forEach(function(p){ if(p.award_id) covered[p.award_id]=1; });
      var unpaid = awards.filter(function(a){ return !covered[a.id] && a.cash_minor; });

      $('#poBody').innerHTML =
        lede('Money owed and money sent.',
          'A payout goes pending, then approved, then sent. Marking it sent needs a real bank reference, so the ' +
          'record cannot drift away from what actually left the account.',
          'Never announce a timeline that is not financially cleared. Late prize money is the fastest way to lose ' +
          'the creators you just spent a whole cycle recruiting, and they talk to each other.') +
        '<div class="kpis">' +
          '<div class="kpi-s ' + (owed.length?'warn':'good') + '"><span class="k">Owed</span><span class="v">' +
            money(owed.reduce(function(a,x){ return a+(x.amount_minor||0); },0)) + '</span><span class="s">' + owed.length + ' waiting</span></div>' +
          '<div class="kpi-s good"><span class="k">Sent</span><span class="v">' +
            money(done.reduce(function(a,x){ return a+(x.amount_minor||0); },0)) + '</span><span class="s">' + done.length + ' paid</span></div>' +
          '<div class="kpi-s ' + (unpaid.length?'bad':'') + '"><span class="k">Awards with no payout</span><span class="v">' +
            unpaid.length + '</span><span class="s">' + money(unpaid.reduce(function(a,x){ return a+(x.cash_minor||0); },0)) + ' unrecorded</span></div>' +
        '</div>' +
        '<div class="bar-t">' + gate('finance','<button class="btn-ghost btn-sm" id="poNew">Record a payout</button>') +
          '<span class="hint">Every prize award with cash on it needs a payout row, otherwise it is money you have ' +
          'promised and not tracked.</span></div>' +
        '<div id="poT"></div>';

      $('#poT').innerHTML = table(
        ['Creator','Amount','How','Promised by','Status','Reference','Next step'],
        list, function(p){
          var c=p.creators||{};
          var late = p.promised_by && new Date(p.promised_by) < new Date() && p.status!=='sent';
          return '<tr>' + who(c.full_name, c.creator_code) +
            '<td class="mono-s"><b>' + money(p.amount_minor) + '</b></td>' +
            '<td class="mono-s">' + esc(p.method||'-') + (p.account_last4?(' &#183;&#183;&#183;&#183;'+esc(p.account_last4)):'') + '</td>' +
            '<td class="age ' + (late?'bad':'') + '">' + (p.promised_by?d(p.promised_by):'-') + '</td>' +
            '<td>' + pill(p.status) + '</td>' +
            '<td class="mono-s">' + esc(p.reference||'-') + '</td>' +
            '<td><div class="acts-wrap">' + gate('finance',
              (p.status==='pending'  ? '<button class="b-xs ok" data-pa="' + p.id + '">Approve</button>' : '') +
              (p.status==='approved' ? '<button class="b-xs ok" data-ps="' + p.id + '">Mark sent</button>' : '') +

                  {k:'ifsc',  label:'IFSC', value:p.ifsc||''},
                  {k:'by',    label:'Promised by', type:'datetime-local', value:dtLocal(p.promised_by),
                   hint:'Only put a date here that finance has actually cleared.'}]); };
      var patch=function(){ return { amount_minor:Math.round((Vn('amt')||0)*100), method:Vt('method'),
        upi_id:Vt('upi'), account_name:Vt('acname'), account_last4:Vt('l4'), ifsc:Vt('ifsc'),
        promised_by:Vdt('by') }; };

      var nb=$('#poNew');

        ask({ eyebrow:'Payout', title:'Record a payout', sub:'It starts as pending.',
          body:fields(null), cta:'Record it',
          wire:function(){
            var sel=$('#f_award');
            if(sel) sel.onchange=function(){
              var parts=(sel.value||'').split('|');
              if(parts.length===3) $('#f_amt').value = (Number(parts[2])||0)/100;
            };

          run:function(){
            var parts=(Vt('award')||'').split('|');

            var p=patch();
            p.cycle_id=A.cycle.id; p.creator_id=parts[0]; p.award_id=parts[1]; p.status='pending';
            if(!p.amount_minor){ toast('An amount is required', true); return false; }

          var p=list.filter(function(x){ return x.id===b.dataset.pe; })[0];

            run:function(){ return save(db().from('payouts').update(patch()).eq('id',p.id), 'Payout saved'); },
            after:function(){ renderPayouts(); }});

      });
      $$('#poT [data-pa]').forEach(function(b){
        b.onclick=function(){
          save(db().from('payouts').update({ status:'approved', approved_at:new Date().toISOString() })
            .eq('id',b.dataset.pa), 'Approved, ready to send').then(function(ok){ if(ok) renderPayouts(); });
        };
      });
      $$('#poT [data-ps]').forEach(function(b){
        b.onclick=function(){
          var p=list.filter(function(x){ return x.id===b.dataset.ps; })[0];
          ask({ eyebrow:'Payout', title:'Mark ' + money(p.amount_minor) + ' as sent?',
            sub:'A reference is required.',
            body:'<p class="m-p">Put in the UTR or transaction id from the actual transfer. Without one, this record ' +
              'is just a claim that the money moved.</p>' +
              F([{k:'ref', label:'Bank or UPI reference', full:true, ph:'UTR or transaction id'}]),
            cta:'Mark sent',
            run:function(){

              return save(db().from('payouts').update({ status:'sent', sent_at:new Date().toISOString(), reference:ref })
                .eq('id',p.id), 'Marked sent');
            }, after:function(){ renderPayouts(); }});
        };
      });
    });
  }

  var TICKET_STATES = ['open','in_progress','waiting_on_creator','resolved','closed'];
  function renderSupport(){
    db().from('support_tickets').select('*, creators(creator_code, full_name, email)')
      .order('created_at',{ascending:false}).limit(400)
      .then(function(res){
        var list=rows(res);
        var f = UI.spFilter || 'open';
        var open   = list.filter(function(t){ return t.status==='open'||t.status==='in_progress'; });
        var breach = open.filter(function(t){ return !t.first_response_at && t.sla_due_at && new Date(t.sla_due_at)<new Date(); });
        var pick = f==='open' ? open
                 : f==='mine' ? list.filter(function(t){ return t.status==='waiting_on_creator'; })
                 : f==='done' ? list.filter(function(t){ return t.status==='resolved'||t.status==='closed'; })
                 : list;

        $('#spBody').innerHTML =
          lede('Tickets from creators, across every cycle.',
            'Answer, then set where the ticket stands. The first response clock is the one that matters, so mark it ' +
            'the moment you actually reply.',
            'Support volume is a symptom, not the disease. A spike in one category usually means a brief is unclear ' +
            'or a step in the dashboard is doing something people did not expect. Read the categories, not just the ' +
            'count.') +
          '<div class="kpis">' +
            '<div class="kpi-s ' + (open.length?'warn':'good') + '"><span class="k">Open</span><span class="v">' + open.length + '</span><span class="s">need a human</span></div>' +
            '<div class="kpi-s ' + (breach.length?'bad':'good') + '"><span class="k">Past SLA</span><span class="v">' + breach.length + '</span><span class="s">no first response yet</span></div>' +
          '</div>' +
          '<div class="bar-t">' +
            [['open','Needs a human'],['mine','Waiting on the creator'],['done','Resolved'],['all','Everything']].map(function(x){
              return '<button class="f-chip ' + (f===x[0]?'on':'') + '" data-sf="' + x[0] + '">' + x[1] + '</button>';
            }).join('') + '<span class="grow"></span><span class="lab">' + pick.length + ' shown</span></div>' +
          '<div id="spT"></div>';

        $('#spT').innerHTML = table(
          ['Ref','Creator','About','Subject','Priority','First reply due','Status',''],
          pick, function(t){
            var c=t.creators||{};
            var over = !t.first_response_at && t.sla_due_at && new Date(t.sla_due_at)<new Date();
            return '<tr><td class="mono-s">' + esc(t.reference) + '</td>' +
              who(c.full_name, c.email) +
              '<td class="mono-s">' + esc(t.category) + '</td>' +
              '<td class="wrap">' + esc(t.subject) + '</td>' +
              '<td>' + pill(t.priority) + '</td>' +
              '<td class="age ' + (over?'bad':'') + '">' + (t.first_response_at ? 'replied' : dt(t.sla_due_at)) + '</td>' +
              '<td>' + pill(t.status) + '</td>' +
              '<td><div class="acts-wrap"><button class="b-xs" data-tk="' + t.id + '">Open</button></div></td></tr>';
          },
          f==='open' ? 'No tickets need a human' : 'Nothing here',
          f==='open' ? 'Everything has either been answered or is waiting on a creator.' : 'Try another filter.');

        $$('#spBody [data-sf]').forEach(function(b){ b.onclick=function(){ UI.spFilter=b.dataset.sf; renderSupport(); }; });
        $$('#spT [data-tk]').forEach(function(b){
          b.onclick=function(){ ticketModal(list.filter(function(x){ return x.id===b.dataset.tk; })[0]); };
        });
      });
  }

  function ticketModal(t){
    var c=t.creators||{};
    db().from('ticket_messages').select('*').eq('ticket_id',t.id).order('created_at')
      .then(function(res){
        var msgs=rows(res);
        ask({
          eyebrow:'Ticket ' + t.reference + ' &#183; ' + t.category,
          title:t.subject,
          sub:(c.full_name||'a creator') + ' &#183; ' + (c.email||'') + ' &#183; opened ' + dt(t.created_at),
          body:
            '<div class="thread">' +
              '<div class="tmsg"><div class="tm-h"><span>' + esc(c.full_name||'creator') + '</span><span>' + dt(t.created_at) + '</span></div>' +
              '<p>' + esc(t.body) + '</p></div>' +
              msgs.map(function(m){
                return '<div class="tmsg ' + (m.is_staff?'staff':'') + (m.is_internal?' note':'') + '">' +
                  '<div class="tm-h"><span>' + (m.is_staff?'us':esc(c.full_name||'creator')) + '</span>' +
                  (m.is_internal?'<span>internal note</span>':'') + '<span>' + dt(m.created_at) + '</span></div>' +
                  '<p>' + esc(m.body) + '</p></div>';
              }).join('') +
            '</div>' +
            F([{k:'reply', label:'Reply', type:'textarea', rows:4, ph:'What you are telling them.'},
               {k:'internal', label:'Keep it internal', type:'check', ph:'A note for the team, not the creator'},
               {k:'status', label:'Where the ticket stands now', type:'select', value:t.status, opts:TICKET_STATES},
               {k:'prio',   label:'Priority', type:'select', value:t.priority, opts:['critical','high','normal','low']}]) +
            (t.first_response_at
              ? '<p class="hint">First response was logged ' + dt(t.first_response_at) + '.</p>'
              : '<p class="hint">This has had no first response yet. Sending a reply that is not an internal note ' +
                'stops the SLA clock.</p>') +
            (can().support ? '' :
              '<div class="danger-note" style="margin-top:10px"><span>!</span><span>' +
              'Your role can read support but not answer it. Ops, reviewers and marketing can.</span></div>'),
          cta:'Save',
          run: can().support ? function(){
            var reply=Vt('reply'), internal=V('internal')===true;
            var patch={ status:Vt('status'), priority:Vt('prio') };
            if(reply && !internal && !t.first_response_at) patch.first_response_at=new Date().toISOString();
            if(patch.status==='resolved' && !t.resolved_at) patch.resolved_at=new Date().toISOString();
            var chain = reply
              ? db().from('ticket_messages').insert({ ticket_id:t.id, body:reply, is_staff:true, is_internal:internal })
                  .then(function(r){ if(r.error) throw r.error;
                    return db().from('support_tickets').update(patch).eq('id',t.id); })
              : db().from('support_tickets').update(patch).eq('id',t.id);
            return save(chain, reply ? 'Reply sent' : 'Ticket updated');
          } : null,
          after:function(){ renderSupport(); loadOverview().then(paintNav); },
          wire:lockTicketForm
        });
      });
  }

  /* Reading a ticket is fine for any operator. Typing a reply that can
     never be sent is not, so the fields go flat for those roles. */
  function lockTicketForm(){
    if(can().support) return;
    $$('#amBody input, #amBody textarea, #amBody select').forEach(function(el){
      el.disabled = true; el.title = WHY.support;
    });
  }

    settings:'Cycle settings', operators:'Operators', audit:'Audit log'
  };

  /* ---------- mobile nav sheet ----------
     The sidebar and the sheet are the same element, so there is one set
     of buttons and one source of truth for which section is on. */
  var mqMobile = window.matchMedia('(max-width:1000px)');
  function sheetIsOpen(){
    var el = document.getElementById('sideNav');
    return !!(el && el.classList.contains('open'));
  }
  function sheetOpen(on){
    var side  = document.getElementById('sideNav'),
        scrim = document.getElementById('mScrim'),
        bur   = document.getElementById('burger');
    if(!side) return;
    var want = !!on;
    if(want === sheetIsOpen()) return;
    side.classList.toggle('open', want);
    if(scrim) scrim.classList.toggle('on', want);
    if(bur){
      bur.setAttribute('aria-expanded', want ? 'true' : 'false');
      bur.setAttribute('aria-label', want ? 'Close menu' : 'Open menu');
    }
    /* Locking the body is what stops the page scrolling behind the
       sheet on iOS. Cleared on close so desktop is never left frozen. */
    document.body.style.overflow = want ? 'hidden' : '';
    if(want) side.scrollTop = 0;
  }
  function wireSheet(){
    var bur = document.getElementById('burger');
    if(bur) bur.addEventListener('click', function(){ sheetOpen(!sheetIsOpen()); });
    var scrim = document.getElementById('mScrim');
    if(scrim) scrim.addEventListener('click', function(){ sheetOpen(false); });
    document.addEventListener('keydown', function(e){
      if((e.key === 'Escape' || e.keyCode === 27) && sheetIsOpen()) sheetOpen(false);
    });
    /* Rotating to landscape or widening the window puts the sidebar back
       where it belongs, so the sheet state has to be dropped with it. */
    var onChange = function(){ if(!mqMobile.matches) sheetOpen(false); };
    if(mqMobile.addEventListener) mqMobile.addEventListener('change', onChange);
    else if(mqMobile.addListener)  mqMobile.addListener(onChange);
  }

  function go(v){
    if(!RENDER[v]) v='overview';
    A.view=v;
    sheetOpen(false);
    $$('.nav-item').forEach(function(b){ b.classList.toggle('on', b.dataset.v===v); });
    $$('.view').forEach(function(s){ s.classList.toggle('on', s.id==='v-'+v); });
    $('#aTitle').textContent = TITLES[v];
    $('#aCrumb').textContent = ((A.cycle && A.cycle.name) || 'Clipathon') + ' · ' + (A.role || '');
    try{ RENDER[v](); }
    catch(e){
      console.error('[admin] render ' + v, e);
      var host=$('#v-'+v+' > div');
      if(host) host.innerHTML = empty('This section could not load',
        'Refresh, and if it keeps happening the console log has the detail.');
    }
    try{ history.replaceState(null,'','#'+v); }catch(e){}
    window.scrollTo(0,0);
  }
  function reload(){
    return loadOverview().then(function(){ paintNav(); go(A.view); });
  }
  function paintNav(){
    var c=A.counts||{};
    var set=function(id,n){ var e=$(id); if(!e) return; e.textContent=n||0; e.style.display=n?'inline-flex':'none'; };
    set('#nQueue', c.queue); set('#nAcct', c.accounts_pending);
    set('#nQc', c.subs_queue); set('#nTick', c.tickets_open);
    /* The badge is painted here rather than once at boot, so that a role
       changed underneath you shows up on the next refresh instead of the
       sidebar claiming something the buttons no longer agree with. */
    var badge=$('#aRole');
    if(badge) badge.innerHTML = A.role ? ('<span class="role-chip">' + esc(A.role) + '</span>') : '';
  }

  function loadOverview(){
    return rpc('admin_overview', A.cycle && A.cycle.id ? { p_cycle_id:A.cycle.id } : {}).then(function(r){
      if(!r || !r.ok) return false;
      A.cycle  = r.cycle;
      A.counts = r.counts || {};
      A.role   = (r.me && r.me.role) || A.role;
      A.email  = (r.me && r.me.email) || A.email;
      return true;
    });
  }

  /* ============================================================
     The manual
     ============================================================
     One page that explains the whole thing, reachable from every
     screen, so nobody has to guess what a section is for. */
  function helpModal(){
    show({ eyebrow:'Clipathon admin', title:'How this console works',
      sub:'A cycle runs from draft to closed. Every section below belongs to one part of that run.',
      body:
        '<div class="m-h">The shape of a cycle</div>' +
        '<ol class="m-steps">' + PHASES.map(function(p){
          return '<li><b>' + PHASE[p].t + '</b> (' + PHASE[p].d + '). ' + esc(PHASE[p].job) + '.</li>'; }).join('') + '</ol>' +
        '<div class="m-h">Rules the database enforces, not this page</div>' +
        '<ul class="m-steps">' +
          '<li>Briefs are invisible until the cycle reaches <b>Brand reveal</b>.</li>' +
          '<li>A slot can only be taken during <b>Slot selection</b>, and a full brand refuses under load.</li>' +
          '<li>A creator with no verified handle cannot take a slot at all.</li>' +
          '<li>An announcement tied to an event must publish at least 24 hours ahead.</li>' +
          '<li>Scoring weights, once published, can never change.</li>' +
          '<li>Prize amounts, once published, can never change.</li>' +
          '<li>Results need two different signatures, and the second one locks them for good.</li>' +
          '<li>Metric snapshots and the points ledger are append only. A correction is a new row.</li>' +
          '<li>A referral only pays once the person it brought has a clip approved.</li>' +
        '</ul>' +
        '<div class="m-h">The two things people get wrong</div>' +
        '<ul class="m-steps">' +
          '<li><b>Repricing a task.</b> Leave back-credit on unless you have a reason. Otherwise the creator who ' +
            'did the task early is permanently worth less than the one who did it late.</li>' +
          '<li><b>Publishing.</b> Publishing the weights and publishing the pool are both one way. Do them once ' +
            'the numbers are settled, not while you are still thinking.</li>' +
        '</ul>' +
        '<div class="m-h">If a button is greyed out</div>' +
        '<p class="m-p">Your role cannot do that thing. Hover it and the tooltip says which role can. An owner can ' +
        'change roles under <b>Operators</b>.</p>'
    });
  }

  /* ============================================================
     Boot
     ============================================================ */
  function splash(html, buttons){
    $('#adminSplashMsg').innerHTML = html;
    var a=$('#adminSplashAct');
    if(buttons){ a.style.display=''; a.innerHTML=buttons; } else { a.style.display='none'; a.innerHTML=''; }
  }
  var SIGNOUT_BTN = '<button class="btn-ghost btn-sm" id="splashOut">Sign out and use another account</button>';
  function wireSplashOut(){
    var b=$('#splashOut');
    if(b) b.onclick=function(){
      var c=db();
      (c ? c.auth.signOut() : Promise.resolve()).then(function(){ location.href=CFG.signin; })
                                                .catch(function(){ location.href=CFG.signin; });
    };
  }

  function boot(again){
    var c=db();
    if(!c){ splash('Could not reach the server. Check your connection and reload the page.'); return; }
    if(!again) splash('Checking your access…');

    return c.auth.getSession().then(function(r){
      var s = r && r.data && r.data.session;
      if(!s){
        splash('You need to sign in before the admin console will open.',
          '<a class="btn" href="' + CFG.signin + '" style="text-decoration:none">Sign in</a>');
        return;
      }
      splash('Loading the cycle…');
      return loadOverview().then(function(ok){
        if(!ok){
          /* Signed in, but not on the operator list. Saying so plainly
             beats a blank screen or a redirect that loops. */
          splash('You are signed in, but this account is not a Clipathon operator.<br><br>' +
            'An owner can add you from the Operators section. If you are here as a creator, your dashboard is at ' +
            '<a class="lnk" href="' + CFG.dash + '">the Clipathon dashboard</a>.', SIGNOUT_BTN);
          wireSplashOut();
          return;
        }
        return c.auth.getUser().then(function(u){
          var email=(((u||{}).data||{}).user||{}).email || A.email || '';
          A.email = email;
          $('#aName').textContent = (email.split('@')[0]) || 'Operator';
          $('#aAva').textContent  = (email[0]||'A').toUpperCase();
        }).then(function(){
          return q('cycles', function(b){ return b.order('registration_closes',{ascending:false}); });
        }).then(function(cycles){
          A.cycles=cycles;
          var sel=$('#cycleSel');
          sel.innerHTML = cycles.map(function(x){
            return '<option value="'+x.id+'"' + (A.cycle && x.id===A.cycle.id?' selected':'') + '>' + esc(x.name) + '</option>';
          }).join('');
          sel.onchange=function(){
            A.cycle={ id:this.value };
            loadOverview().then(function(){ paintNav(); go(A.view); });
          };
          paintNav();
          /* Lowercased, because a link somebody typed by hand or a
             capitalised copy-paste should still land in the right place. */
          var h=(location.hash||'').replace('#','').toLowerCase();
          go(RENDER[h] ? h : 'overview');
          $('#adminSplash').classList.add('hide');
          $('#app').classList.remove('hide');
        });
      });
    }).catch(function(e){
      console.error('[admin] boot', e);
      splash('Something went wrong loading the console. Reload the page to try again.', SIGNOUT_BTN);
      wireSplashOut();
    });
  }

  /* ---------- chrome, wired once ---------- */
  wireSheet();
  $$('.nav-item').forEach(function(b){ if(b.dataset.v) b.onclick=function(){ go(b.dataset.v); }; });
  $('#aRefresh').onclick=function(){
    var b=$('#aRefresh'); b.disabled=true;
    reload().then(function(){ b.disabled=false; toast('Refreshed'); });
  };
  $('#aHelp').onclick=helpModal;
  document.addEventListener('click', function(e){
    var t = e.target && e.target.closest ? e.target.closest('[data-close]') : null;
    if(t) closeM(t.dataset.close);
  });
  $$('.veil').forEach(function(v){ v.addEventListener('click', function(e){ if(e.target===v) v.classList.remove('on'); }); });
  document.addEventListener('keydown', function(e){
    if(e.key==='Escape') $$('.veil.on').forEach(function(v){ v.classList.remove('on'); });
  });
  $('#tsw').onclick=function(){
    var h=document.documentElement, n=h.getAttribute('data-theme')==='dark'?'light':'dark';
    h.setAttribute('data-theme',n);
    $('#tswLab').textContent = n==='dark' ? 'Light mode' : 'Dark mode';
    try{ localStorage.setItem('clipency-theme',n); }catch(e){}
  };
  $('#aOut').onclick=function(){
    db().auth.signOut().then(function(){ location.href=CFG.signin; })
                       .catch(function(){ location.href=CFG.signin; });
  };
  window.addEventListener('hashchange', function(){
    var k=(location.hash||'').replace('#','').toLowerCase();
    if(RENDER[k]){ if(k!==A.view) go(k); return; }
    /* An unknown fragment leaves the address bar claiming one thing and
       the page showing another. Put the URL back rather than navigating
       somewhere the operator did not ask for. */
    try{ history.replaceState(null,'','#'+A.view); }catch(e){}
  });

  boot();

})();
</script>
</body>
</html>
