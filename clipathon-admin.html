<div id="toast"></div>
<script>
/* ============================================================
   CLIPATHON ADMIN CONSOLE
   ============================================================
   Reads go straight to the tables and views under RLS. Writes that
   matter go through the admin_* RPCs in migration 016, which carry
   the role check and the audit trail with them, so a bug on this
   page cannot skip either.

   The console is used by people who did not build it, often at
   speed. So every section states what it is for, every irreversible
   control says so before it fires, and a control your role cannot
   use is disabled with the reason on it rather than hidden.
   ============================================================ */
(function(){
  'use strict';

  var CFG = {
    url    : 'https://kszlfvsplkkmsgxqnakj.supabase.co',
    key    : 'sb_publishable_NvoWhIjNxWubRKKPo34JDw_13iNZkPd',
    signin : './clipathon-signin.html',
    dash   : './clipathon-dashboard.html'
  };

  var $  = function(s,r){ return (r||document).querySelector(s); };
  var $$ = function(s,r){ return Array.prototype.slice.call((r||document).querySelectorAll(s)); };

  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function comma(n){ return Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function num(n){ n=Math.round(Number(n)||0);
    return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M'
         : n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(n); }
  function dt(v){ return v? new Date(v).toLocaleString('en-IN',
    {day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}) : 'not set'; }
  function d(v){ return v? new Date(v).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '-'; }
  function money(minor){ return '₹' + comma((Number(minor)||0)/100); }
  function hoursSince(v){ return v ? (Date.now()-new Date(v).getTime())/3600000 : 0; }

  /* datetime-local wants local wall time, not an ISO string in UTC. */
  function dtLocal(v){
    if(!v) return '';
    var x=new Date(v), p=function(n){ return String(n).padStart(2,'0'); };
    return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+'T'+p(x.getHours())+':'+p(x.getMinutes());
  }

  function toast(m, bad){
    var t=$('#toast'); t.textContent=m;
    t.style.background = bad ? 'var(--no)' : 'var(--inv-bg)';
    t.style.color      = bad ? '#fff'      : 'var(--inv-fg)';
    t.classList.add('on'); clearTimeout(window.__t);
    window.__t=setTimeout(function(){ t.classList.remove('on'); }, bad?6000:3400);
  }
  function openM(id){ $('#'+id).classList.add('on'); }
  function closeM(id){ $('#'+id).classList.remove('on'); }

  /* ============================================================
     Client
     ============================================================ */
  var sb=null;
  function db(){
    if(sb) return sb;
    try{ sb = window.supabase.createClient(CFG.url, CFG.key, { db:{ schema:'clipathon' } }); }
    catch(e){ sb=null; }
    return sb;
  }

  /* Postgres speaks in codes. Operators should not have to. */
  function friendly(err){
    if(!err) return 'That did not work.';
    var m = String(err.message||err), c = err.code||'';
    if(c==='42501' || /row-level security/i.test(m))
      return 'Your role is not allowed to make that change.';
    if(c==='23514'){
      if(/announcements_24h/.test(m)) return 'An announcement has to go out at least 24 hours before its event.';
      if(/weights_sum/.test(m))       return 'The scoring weights have to add up to exactly 100.';
      if(/slots_sane/.test(m))        return 'That would leave more creators on the brand than it has seats.';
      if(/duration/.test(m))          return 'The minimum duration has to be below the maximum.';
      return 'The database refused that: it breaks a rule this cycle depends on.';
    }
    if(c==='23505') return 'Something with that name or code already exists.';
    if(c==='23503') return 'That refers to a record which no longer exists. Refresh and try again.';
    if(c==='P0001') return m.replace(/^.*?:\s*/,'');
    return m;
  }

  /* Every RPC returns a jsonb envelope, so one helper covers the whole
     "did it work, and what do I tell the operator" path. Both helpers
     resolve to a BOOLEAN, because the modal uses that to decide whether
     to close. Returning the envelope would close on failure too. */
  function rpc(fn,args){
    return db().rpc(fn,args||{}).then(function(r){
      if(r.error){ console.error('[admin]',fn,r.error); return { ok:false, message:friendly(r.error) }; }
      return r.data || { ok:true };
    }).catch(function(e){ return { ok:false, message:String(e.message||e) }; });
  }
  function act(fn,args,okMsg){
    return rpc(fn,args).then(function(r){
      var ok = !!(r && r.ok);
      if(ok) toast(r.message || okMsg || 'Done');
      else   toast((r && (r.message||r.error)) || 'That did not work', true);
      return ok;
    });
  }
  function save(builder, okMsg){
    return Promise.resolve(builder).then(function(r){
      if(r && r.error){ console.error('[admin] write', r.error); toast(friendly(r.error), true); return false; }
      toast(okMsg||'Saved'); return true;
    }).catch(function(e){ toast(friendly(e), true); return false; });
  }
  function q(rel, build){
    var b = db().from(rel).select('*');
    return (build ? build(b) : b).then(function(r){
      if(r.error){ console.error('[admin]',rel,r.error); return []; }
      return r.data || [];
    }).catch(function(){ return []; });
  }
  function rows(res){ if(res && res.error) console.error('[admin]', res.error); return (res && res.data) || []; }

  /* ============================================================
     State and roles
     ============================================================ */
  var A = { role:null, email:'', cycle:null, cycles:[], season:null, counts:{}, view:'overview' };
  var UI = {};

  function can(){
    var r = A.role, own = r==='owner';
    return {
      owner    : own,
      ops      : own || r==='ops',
      review   : own || r==='ops' || r==='reviewer',
      brands   : own || r==='ops' || r==='partnerships',
      sessions : own || r==='ops' || r==='partnerships' || r==='marketing',
      marketing: own || r==='ops' || r==='marketing',
      support  : own || r==='ops' || r==='reviewer' || r==='marketing',
      finance  : own || r==='finance'
    };
  }
  var WHY = {
    ops      : 'Only ops and owners can do this',
    review   : 'Only reviewers, ops and owners can do this',
    brands   : 'Only partnerships, ops and owners can do this',
    sessions : 'Only partnerships, marketing, ops and owners can do this',
    marketing: 'Only marketing, ops and owners can do this',
    support  : 'Only the roles that answer tickets can change one',
    finance  : 'Only finance and owners can do this',
    owner    : 'Only owners can do this'
  };
  /* A control your role cannot use is disabled with the reason on it.
     Hiding it makes the console look broken to the person who simply
     is not allowed to press it. */
  function gate(key, html){
    if(can()[key]) return html;
    return html.replace(/<button /g, '<button disabled title="' + esc(WHY[key]) + '" ');
  }

  /* ============================================================
     Shared render pieces
     ============================================================ */
  function lede(title, body, more){
    return '<div class="lede"><div class="li">i</div><div class="lt">' +
      '<b>' + esc(title) + '</b><span>' + body + '</span>' +
      (more ? '<details class="more"><summary>Why it works this way</summary><div class="mb">' + more + '</div></details>' : '') +
      '</div></div>';
  }
  function empty(head, sub){
    return '<div class="tbl-wrap"><div class="empty"><div class="ei">&#183;</div>' +
      '<div class="eh">' + esc(head) + '</div><div class="es">' + (sub||'') + '</div></div></div>';
  }
  function table(cols, list, rowFn, emptyHead, emptySub){
    if(!list || !list.length) return empty(emptyHead || 'Nothing here yet', emptySub || '');
    return '<div class="tbl-wrap"><table><thead><tr>' +
      cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + list.map(rowFn).join('') + '</tbody></table></div>';
  }
  var PILL = {
    approved:'ok', verified:'ok', sent:'ok', resolved:'ok', closed:'ok', complete:'ok', active:'ok',
    pending:'wait', needs_info:'wait', under_review:'wait', open:'wait', in_progress:'wait',
    waiting_on_creator:'wait', invited:'wait', submitted:'wait', link_submitted:'wait', file_uploaded:'wait',
    rejected:'no', disqualified:'no', failed:'no', cancelled:'no', withdrawn:'no', removed:'no',
    critical:'no', high:'wait', normal:'', low:''
  };
  function pill(s){
    return '<span class="chip ' + (PILL[s]||'') + '">' + esc(String(s||'-').replace(/_/g,' ')) + '</span>';
  }
  function age(v){
    var h = hoursSince(v);
    return '<span class="age ' + (h>24?'bad':h>12?'warn':'') + '">' +
      (h<1 ? Math.round(h*60)+'m' : h<48 ? Math.round(h)+'h' : Math.round(h/24)+'d') + '</span>';
  }
  function who(name, sub){
    return '<td class="who-cell"><b>' + esc(name||'-') + '</b><span>' + esc(sub||'') + '</span></td>';
  }
  function link(url, label){
    return url ? '<a class="lnk" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label||'open') + ' &#8599;</a>'
               : '<span class="mono-s">none</span>';
  }

  /* ============================================================
     Forms
     ============================================================
     One declarative helper, because eighteen hand-rolled forms is
     eighteen chances to mistype an id. */
  function F(fields){
    return '<div class="fgrid">' + fields.map(function(f){
      var v = f.value==null ? '' : String(f.value), id='f_'+f.k, inner;
      if(f.type==='textarea'){
        inner = '<textarea id="'+id+'"'+(f.rows?' rows="'+f.rows+'"':'')+' placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
      } else if(f.type==='select'){
        inner = '<select id="'+id+'">' + (f.opts||[]).map(function(o){
          var val = (o && typeof o==='object') ? o.v : o;
          var lab = (o && typeof o==='object') ? o.t : (String(o).replace(/_/g,' ') || '-');
          return '<option value="'+esc(val)+'"'+(String(val)===v?' selected':'')+'>'+esc(lab)+'</option>';
        }).join('') + '</select>';
      } else if(f.type==='check'){
        inner = '<label class="retro"><input type="checkbox" id="'+id+'"'+(f.value?' checked':'')+'> '+esc(f.ph||'Yes')+'</label>';
      } else {
        inner = '<input id="'+id+'" type="'+(f.type||'text')+'"' +
          (f.min!=null?' min="'+f.min+'"':'') + (f.max!=null?' max="'+f.max+'"':'') +
          (f.step!=null?' step="'+f.step+'"':'') +
          ' value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';
      }
      return '<div class="field'+((f.full||f.type==='textarea')?' full':'')+'">' +
        '<label>'+esc(f.label)+'</label>' + inner +
        (f.hint?'<span class="fh">'+f.hint+'</span>':'') + '</div>';
    }).join('') + '</div>';
  }
  function V(k){ var e=$('#f_'+k); if(!e) return null; return e.type==='checkbox'?e.checked:e.value; }
  function Vt(k){ var v=V(k); v=(v==null?'':String(v)).trim(); return v===''?null:v; }
  function Vn(k){ var v=Vt(k); return v==null?null:Number(v); }
  function Vlines(k){ return String(V(k)||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean); }
  function Vdt(k){ var v=Vt(k); return v?new Date(v).toISOString():null; }

  /* ============================================================
     Modals
     ============================================================ */
  /* run() must resolve to true for the modal to close. act() and save()
     already resolve to a boolean, so a failed write leaves the form up
     with whatever the operator typed still in it. */
  function ask(o){
    $('#amEyeb').textContent = o.eyebrow || 'Confirm';
    $('#amTitle').textContent = o.title;
    $('#amSub').innerHTML = o.sub || '';
    $('#amBody').innerHTML = o.body || '';
    $('#amGo').textContent = o.cta || 'Confirm';
    $('#amGo').disabled = false;
    $('#amGo').style.display = o.run ? '' : 'none';
    $('#amGo').className = 'btn' + (o.danger ? ' danger' : '');
    $('#amGo').onclick = function(){
      if(!o.run) return closeM('actModal');
      $('#amGo').disabled = true;
      var label = $('#amGo').textContent;
      $('#amGo').textContent = 'Working…';
      Promise.resolve(o.run()).then(function(ok){
        $('#amGo').disabled = false; $('#amGo').textContent = label;
        if(ok === true){ closeM('actModal'); if(o.after) o.after(); else reload(); }
      }).catch(function(e){
        $('#amGo').disabled = false; $('#amGo').textContent = label;
        toast(friendly(e), true);
      });
    };
    openM('actModal');
    if(o.wire) o.wire();
    var first = $('#amBody input, #amBody textarea, #amBody select');
    if(first) try{ first.focus(); }catch(e){}
  }
  function show(o){
    $('#dtEyeb').textContent = o.eyebrow || '';
    $('#dtTitle').textContent = o.title;
    $('#dtSub').innerHTML = o.sub || '';
    $('#dtBody').innerHTML = o.body || '';
    openM('detModal');
    if(o.wire) o.wire();
  }

  /* ============================================================
     The cycle clock
     ============================================================ */
  var PHASES = ['draft','registration','reveal','slot_selection','creation','tracking','finale','closed'];
  var PHASE = {
    draft:          { t:'Draft',          d:'setup', job:'Set the dates, load the briefs, publish the pool',
      say:'Nothing here is visible to creators yet. Fill in the cycle dates, write the five briefs, set the bonus tasks and publish the prize pool. Publishing the pool freezes it, so do that last.' },
    registration:   { t:'Registration',   d:'D10-5', job:'Clear the verification queue every day',
      say:'Entries are arriving. The promise is a decision inside 24 hours, which is roughly ninety reviews a day across five days. A backlog here lands at the exact moment a creator forms their first impression.' },
    reveal:         { t:'Topic reveal',   d:'D5-4',  job:'Run the brand sessions and answer questions',
      say:'Briefs are now visible. Creators are reading them and deciding what they want. Post session recordings within two hours so the people who could not attend are not behind.' },
    slot_selection: { t:'Slot selection', d:'D4',    job:'Watch the fill, then auto assign whoever is left',
      say:'The window is open and slots are being taken. Watch which brands fill first. Before the window closes, auto assign every approved creator who has not picked, so nobody is left out by hesitating.' },
    creation:       { t:'Creation',       d:'D3-1',  job:'Keep support fast, nothing else to do here',
      say:'Creators are filming. The console has little to do; support speed is the whole job. Answer tickets before the SLA, especially anything blocking an upload.' },
    tracking:       { t:'Tracking',       d:'D1-0',  job:'Verify entries in QC and capture snapshots',
      say:'Posts are live. Work the QC queue so nothing sits unverified, and capture metric snapshots at fixed times so everyone is measured over a comparable window.' },
    finale:         { t:'Finale',         d:'D0',    job:'Final snapshots, run scoring, get two sign offs',
      say:'Capture the final snapshot for every verified entry, run scoring, read the ranks, then have two different people sign off. The second signature locks the results permanently.' },
    closed:         { t:'Closed',         d:'after', job:'Award prizes, approve payouts, issue certificates',
      say:'Results are final. Announce awards, approve and send payouts against real references, and issue certificates. Payout speed is the single biggest driver of who comes back next cycle.' },
    archived:       { t:'Archived',       d:'done',  job:'This cycle is finished',
      say:'Nothing left to run here. Open the current cycle from the picker in the sidebar.' }
  };

  function renderOverview(){
    var c=A.counts, cy=A.cycle||{}, ph=PHASE[cy.status]||PHASE.draft;
    var target = cy.total_slots || 0;

    var kpi=function(label,val,sub,cls,go){
      return '<button class="kpi-s ' + (cls||'') + '"' + (go?' data-go="'+go+'"':'') + '>' +
        '<span class="k">' + esc(label) + '</span><span class="v">' + val + '</span>' +
        '<span class="s">' + esc(sub||'') + '</span></button>';
    };

    $('#ovBody').innerHTML =
      '<div class="todo"><div class="th">' + esc(cy.name||'Cycle') + ' &#183; ' + esc(ph.t) + ' &#183; ' + esc(ph.d) + '</div>' +
        '<h3>' + esc(ph.job) + '</h3><p>' + esc(ph.say) + '</p>' +
        '<div class="tl">' + jobLinks(cy.status) + '</div></div>' +

      '<div class="kpis">' +
        kpi('Waiting on review', c.queue||0, c.queue?'oldest first':'queue is clear', c.queue>20?'warn':(c.queue?'':'good'), 'queue') +
        kpi('Handles to check', c.accounts_pending||0, 'blocks slot selection', c.accounts_pending?'warn':'good', 'accounts') +
        kpi('Approved', c.approved||0, target?('of ' + comma(target) + ' seats'):'creators in', '', 'creators') +
        kpi('Ready for Day 4', c.ready||0, 'approved, login, handle', (c.approved && c.ready<c.approved)?'warn':'good', 'creators') +
        kpi('Slots taken', c.slots||0, (c.slots_auto||0) + ' auto assigned', '', 'slots') +
        kpi('Entries in QC', c.subs_queue||0, (c.subs_verified||0) + ' verified', c.subs_queue?'warn':'', 'qc') +
        kpi('Open tickets', c.tickets_open||0, (c.tickets_breach||0) + ' past SLA', c.tickets_breach?'bad':'', 'support') +
        kpi('Scored', c.scored||0, (c.locked?'signed off and locked':'not signed off'), c.locked?'good':'', 'scoring') +
      '</div>' +

      '<div class="split">' +
        '<div class="card">' +
          '<div class="sec-h"><h2>Where the cycle is</h2><span class="sh-sub">click a phase to move</span></div>' +
          gate('ops','<div class="phase-line">' + PHASES.map(function(p){
              return '<button data-phase="' + p + '" class="' + (cy.status===p?'on':'') + '">' +
                '<i>' + PHASE[p].d + '</i>' + PHASE[p].t + '</button>'; }).join('') + '</div>') +
          '<p class="hint">Moving the phase is what unlocks things for creators. Briefs stay invisible until ' +
            '<b>Brand reveal</b>, and a slot can only be taken during <b>Slot selection</b>. The database enforces ' +
            'both, so this is the real switch, not a label.</p>' +

          '<div class="hr"></div>' +
          '<div class="sec-h"><h2>The clock</h2><span class="sh-sub">all derived from one date</span></div>' +
          '<div class="clock-grid">' + clockTiles(cy) + '</div>' +
          gate('ops','<div class="bar-t" style="margin-top:14px">' +
              '<input class="srch" id="anchorIn" type="datetime-local" style="max-width:230px" value="' + dtLocal(cy.registration_closes) + '">' +
              '<button class="btn-ghost btn-sm" id="anchorGo">Re-date the whole cycle</button></div>') +
          '<p class="hint" style="margin-top:8px">Change when registration closes and every other date moves with it, ' +
            'including every session and every announcement. There is one date to get right, not eight.</p>' +

          gate('ops',
            '<div class="hr"></div>' +
            '<div class="sec-h"><h2>Adjust a single date</h2>' +
              '<span class="sh-sub">pin what should not move</span></div>' +
            '<div class="clock-edit" id="clockEdit">' + clockEditor(cy) + '</div>' +
            '<div class="bar-t" style="margin-top:12px">' +
              '<button class="btn-ghost btn-sm" id="clockSave">Save the clock</button></div>' +
            '<p class="hint" style="margin-top:8px">A <b>pinned</b> date is one you set yourself: it stays exactly ' +
              'where you put it, even when you re-date the cycle above. Leave a date unpinned and it keeps ' +
              'following registration close, which is the behaviour you already had. The database refuses a clock ' +
              'that runs out of order, so you cannot save a finale that lands before the cutoff.</p>') +
        '</div>' +

        '<div class="stack">' +
          '<div class="card">' +
            '<div class="sec-h"><h2>The funnel</h2><span class="sh-sub">where people drop out</span></div>' +
            [['Registered', c.registrations||0],
             ['Approved', c.approved||0],
             ['Created a login', c.with_login||0],
             ['Verified a handle', c.ready||0],
             ['Took a slot', c.slots||0],
             ['Posted and uploaded', c.subs_complete||0],
             ['Passed QC', c.subs_verified||0],
             ['Disqualified', c.subs_dq||0]].map(function(x){
              return '<div class="metric"><span class="m-k">' + x[0] + '</span><span class="m-v">' + comma(x[1]) + '</span></div>';
            }).join('') +
          '</div>' +
          '<div class="card">' +
            '<div class="sec-h"><h2>How entries are scored</h2>' +
              (cy.scoring_locked_at ? '<span class="sh-r"><span class="chip ok">locked</span></span>' : '') + '</div>' +
            renderWeights(cy) +
          '</div>' +
        '</div>' +
      '</div>';

    $$('#ovBody [data-go]').forEach(function(b){ b.onclick=function(){ go(b.dataset.go); }; });
    $$('#ovBody [data-phase]').forEach(function(b){
      b.onclick=function(){
        var p=b.dataset.phase;
        if(p===A.cycle.status) return toast('The cycle is already in ' + PHASE[p].t);
        ask({ eyebrow:'Cycle phase', title:'Move to ' + PHASE[p].t + '?',
          sub:'Creators see the change immediately.',
          body:'<p class="m-p">' + esc(PHASE[p].say) + '</p>',
          cta:'Move to ' + PHASE[p].t,
          run:function(){ return act('admin_set_cycle_status',{p_cycle_id:A.cycle.id,p_status:p}); } });
      };
    });
    /* Live pin feedback, so the row tints the moment you tick it rather than
       only after a save. */
    CLOCK_ROWS.forEach(function(r){
      var cb=$('#pin_'+r[0]); if(!cb) return;
      cb.onchange=function(){
        var row=$('.ce-row[data-row="'+r[0]+'"]');
        if(row) row.classList.toggle('pinned', cb.checked);
      };
    });

    var cs=$('#clockSave');
    if(cs) cs.onclick=function(){
      var vals={}, pins={}, i, miss=null;
      for(i=0;i<CLOCK_ROWS.length;i++){
        var key=CLOCK_ROWS[i][0], el=$('#ck_'+key);
        if(!el){ continue; }
        if(!el.value){ miss=CLOCK_ROWS[i][1]; break; }
        vals[key]=new Date(el.value);
        var cb=$('#pin_'+key);
        if(cb && cb.checked) pins[key]=true;
      }
      if(miss) return toast(miss + ' needs a date', true);

      /* The database refuses an out-of-order clock, but catching it here
         names the two dates in plain words instead of a constraint error. */
      var order=['registration_opens','registration_closes','brands_reveal_at',
                 'slots_open_at','slots_close_at','submission_cutoff_at','finale_at'];
      var label={}; CLOCK_ROWS.forEach(function(r){ label[r[0]]=r[1]; });
      for(i=1;i<order.length;i++){
        var a1=vals[order[i-1]], b1=vals[order[i]];
        if(a1 && b1 && b1 < a1)
          return toast(label[order[i]] + ' cannot be before ' + label[order[i-1]], true);
      }

      var pinned=Object.keys(pins);
      ask({ eyebrow:'Cycle clock', title:'Save the clock?',
        sub: pinned.length ? pinned.length + ' date' + (pinned.length===1?'':'s') + ' pinned'
                           : 'nothing pinned, everything follows the anchor',
        body:'<p class="m-p">Registration closes <b>' + esc(dt(vals.registration_closes)) + '</b>.' +
          (pinned.length
            ? ' Pinned: <b>' + pinned.map(function(k){ return esc(label[k]); }).join(', ') +
              '</b>. These stay put when you re-date the cycle.'
            : ' Every other date will follow it, as before.') + '</p>',
        cta:'Save the clock',
        run:function(){
          var patch={ clock_pins:pins };
          CLOCK_ROWS.forEach(function(r){
            if(vals[r[0]]) patch[r[0]]=vals[r[0]].toISOString();
          });
          return save(db().from('cycles').update(patch).eq('id',A.cycle.id), 'Clock saved');
        },
        after:function(){ boot(true); }});
    };

    var ag=$('#anchorGo');
    if(ag) ag.onclick=function(){
      var v=$('#anchorIn').value;
      if(!v) return toast('Pick a new date and time first', true);
      ask({ eyebrow:'Cycle clock', title:'Re-date the whole cycle?',
        sub:'Every other date is derived from this one.',
        body:'<p class="m-p">Registration will close on <b>' + esc(dt(new Date(v))) + '</b>. The reveal, the slot ' +
          'window, the submission cutoff and the finale all shift by the same amount, and so does every session ' +
          'and every announcement already scheduled.</p>',
        cta:'Re-date',
        run:function(){
          return save(db().from('cycles').update({ registration_closes:new Date(v).toISOString() }).eq('id',A.cycle.id),
                      'Cycle re-dated');
        }});
    };
    wireWeights();
  }

  /* Only the next date is highlighted. Marking every future date makes
     the highlight mean nothing, which is worse than not having one. */
  /* The six dates, each with a pin. registration_closes is the anchor, so it
     is always effectively pinned and its checkbox is not offered. */
  var CLOCK_ROWS = [
    ['registration_closes','Registration closes','the anchor'],
    ['registration_opens', 'Registration opens', 'close minus 5 days'],
    ['brands_reveal_at',   'Brands reveal',      'same moment as close'],
    ['slots_open_at',      'Slots open',         'close plus 1 day'],
    ['slots_close_at',     'Slots close',        'close plus 1 day 6 hours'],
    ['submission_cutoff_at','Submission cutoff', 'close plus 4 days 6 hours'],
    ['finale_at',          'Finale',             'close plus 5 days']
  ];

  function clockEditor(cy){
    var pins = cy.clock_pins || {};
    return CLOCK_ROWS.map(function(r){
      var key = r[0], anchor = (key === 'registration_closes');
      var pinned = anchor || pins[key] === true;
      return '<div class="ce-row' + (pinned ? ' pinned' : '') + '" data-row="' + key + '">' +
        '<span class="ce-k">' + r[1] + '<i>' + (anchor ? 'anchor' : r[2]) + '</i></span>' +
        '<input type="datetime-local" id="ck_' + key + '" value="' + dtLocal(cy[key]) + '">' +
        (anchor
          ? '<span class="ce-anchor">always kept</span>'
          : '<label class="ce-pin"><input type="checkbox" id="pin_' + key + '"' +
            (pinned ? ' checked' : '') + '> pin</label>') +
      '</div>';
    }).join('');
  }

  function clockTiles(cy){
    var rowsC = [['Registration closes','registration_closes'],['Brands reveal','brands_reveal_at'],
                 ['Slots open','slots_open_at'],['Slots close','slots_close_at'],
                 ['Submission cutoff','submission_cutoff_at'],['Finale','finale_at']];
    var now = new Date(), nextAt = null;
    rowsC.forEach(function(x){
      var t = cy[x[1]];
      if(t && new Date(t) > now && (nextAt === null || new Date(t) < new Date(nextAt))) nextAt = t;
    });
    return rowsC.map(function(x){
      var t = cy[x[1]], past = t && new Date(t) <= now, isNext = t && t === nextAt;
      return '<div class="c' + (isNext ? ' now' : '') + '"' + (past ? ' style="opacity:.5"' : '') + '>' +
        '<span>' + x[0] + (isNext ? ' &#183; next' : past ? ' &#183; done' : '') + '</span>' +
        '<b>' + dt(t) + '</b></div>';
    }).join('');
  }

  function jobLinks(status){
    var map = {
      draft:          [['settings','Cycle settings'],['brands','Briefs'],['tasks','Tasks and points'],['prizes','Prizes']],
      registration:   [['queue','Open the queue'],['accounts','Check handles'],['creators','Creators']],
      reveal:         [['schedule','Sessions and feed'],['brands','Briefs'],['support','Support']],
      slot_selection: [['slots','Slot allocation'],['accounts','Check handles'],['support','Support']],
      creation:       [['support','Support'],['schedule','Sessions and feed']],
      tracking:       [['qc','Quality control'],['scoring','Snapshots'],['support','Support']],
      finale:         [['scoring','Scoring and sign off'],['qc','Quality control']],
      closed:         [['prizes','Prizes'],['payouts','Payouts'],['points','Points ledger']],
      archived:       [['audit','Audit log']]
    };
    return (map[status]||map.draft).map(function(x){
      return '<button class="b-xs" data-go="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('');
  }

  function renderWeights(cy){
    var w = cy.scoring_weights || {};
    var rowsW = [['views','Views'],['engagement','Engagement rate'],['quality','Content quality'],['compliance','Brand compliance']];
    var locked = !!cy.scoring_locked_at;
    return '<p class="hint" style="margin-bottom:12px">Four numbers that must add to 100. They decide how a verified ' +
      'entry becomes a rank.</p>' +
      rowsW.map(function(x){
        return '<div class="wrow"><label>' + x[1] + '</label>' +
          '<input type="range" min="0" max="100" step="5" value="' + (w[x[0]]||0) + '" data-w="' + x[0] + '"' + (locked||!can().ops?' disabled':'') + '>' +
          '<b data-wv="' + x[0] + '">' + (w[x[0]]||0) + '%</b></div>';
      }).join('') +
      '<div class="wsum" id="wSum"></div>' +
      (locked
        ? '<div class="ok-note" style="margin-top:12px"><span>&#10003;</span><span>Published on ' + dt(cy.scoring_locked_at) +
          '. These cannot change now, which is the promise made to creators before the window opened.</span></div>'
        : gate('ops','<div class="bar-t" style="margin-top:12px">' +
            '<button class="btn-ghost btn-sm" id="wSave">Save weights</button>' +
            '<button class="btn btn-sm" id="wLock">Publish and lock</button></div>') +
          '<p class="hint" style="margin-top:8px">Locking is one way. After it the database refuses any change, ' +
          'so nobody can be accused of moving the goalposts once entries are in.</p>');
  }

  function wireWeights(){
    var upd=function(){
      var t=0;
      $$('[data-w]').forEach(function(r){ var v=Number(r.value); t+=v; $('[data-wv="'+r.dataset.w+'"]').textContent=v+'%'; });
      var s=$('#wSum');
      if(s){ s.textContent = t===100 ? 'Adds up to 100' : 'Adds up to ' + t + ', needs to be exactly 100';
             s.className='wsum ' + (t===100?'ok':'bad'); }
      var sv=$('#wSave'); if(sv) sv.disabled = (t!==100);
      var lk=$('#wLock'); if(lk) lk.disabled = (t!==100);
      return t;
    };
    $$('[data-w]').forEach(function(r){ r.oninput=upd; });
    upd();
    var sv=$('#wSave');
    if(sv) sv.onclick=function(){
      var w={}; $$('[data-w]').forEach(function(r){ w[r.dataset.w]=Number(r.value); });
      save(db().from('cycles').update({ scoring_weights:w }).eq('id',A.cycle.id), 'Weights saved')
        .then(function(ok){ if(ok) reload(); });
    };
    var lk=$('#wLock');
    if(lk) lk.onclick=function(){
      ask({ eyebrow:'Scoring', title:'Publish and lock the weights?', danger:true,
        sub:'This cannot be undone.',
        body:'<p class="m-p">Creators will be able to see exactly how they are judged, and the database will refuse ' +
          'any later change to these four numbers. Do this before the creation window opens, not after.</p>',
        cta:'Publish and lock',
        run:function(){ return act('admin_lock_scoring',{p_cycle_id:A.cycle.id},'Scoring model locked'); }});
    };
  }

    var n=$$('#qTable [data-pick]:checked').length;
    var b=$('#qApproveSel'); if(b) b.textContent = n ? ('Approve ' + n + ' selected') : 'Approve selected';

  function paintQueue(list){
    $('#qCount').textContent = list.length + (list.length===1?' waiting':' waiting');
    $('#qTable').innerHTML = table(
      ['','Creator','Profile','Following','Campus','Referred by','Waiting','Status','Decision'],
      list,
      function(r){
        return '<tr>' +
          '<td><input type="checkbox" data-pick="' + r.registration_id + '"></td>' +
          who(r.full_name, r.email) +
          '<td>' + link(r.primary_profile_url,'profile') + '</td>' +
          '<td class="mono-s">' + esc(r.follower_band||'-') + '</td>' +
          '<td class="mono-s">' + esc(r.campus||r.city||'-') + '</td>' +
          '<td class="mono-s">' + esc(r.ambassador_name||r.ref_code_used||'-') + '</td>' +

          '<td>' + pill(r.status) + '</td>' +

            '<button class="b-xs wait" data-rev="needs_info" data-id="' + r.registration_id + '">Needs info</button>' +
            '<button class="b-xs no"   data-rev="rejected"   data-id="' + r.registration_id + '">Reject</button>' +
          '</div></td></tr>';

      'Every registration in this cycle has had a decision. New ones appear here as they arrive.');

      b.onchange=function(){ b.closest('tr').classList.toggle('sel', b.checked); markSel(); };
    });
    $$('#qTable [data-rev]').forEach(function(b){
      if(!can().review){ b.disabled=true; b.title=WHY.review; return; }
      b.onclick=function(){
        var out=b.dataset.rev, id=b.dataset.id;
        if(out==='approved'){
          b.disabled=true;
          act('admin_review_registration',{p_registration_id:id,p_outcome:'approved'},'Approved')
            .then(function(ok){ if(ok) reload(); else b.disabled=false; });
          return;
        }
        var reject = out==='rejected';
        ask({ eyebrow:'Verification',
          title: reject ? 'Reject this registration?' : 'Ask this creator for more information?',
          sub: reject ? 'They can appeal once, through support.' : 'They get 24 hours to fix it.',
          body:'<p class="m-p">' + (reject
              ? 'Write the reason as if you were saying it to their face, because that is how it reads in the email.'
              : 'Say precisely what is wrong and what to do about it. Vague requests come back as support tickets.') + '</p>' +
            F([{k:'note', label:'Reason the creator will see', type:'textarea', rows:3,
                ph: reject ? 'e.g. The account has no posting history we could check.'

          cta: reject ? 'Reject' : 'Request more information',
          danger: reject,
          run:function(){
            var note=Vt('note');

            return act('admin_review_registration',{p_registration_id:id,p_outcome:out,p_note:note});
          }});
      };
    });
  }

          if(f==='verified') return r.status==='verified';

  function renderScoring(){
    Promise.all([
      db().from('v_cycle_results').select('*').eq('cycle_id',A.cycle.id).order('rank_overall').limit(500),
      db().from('submissions').select('id, status, post_url, registrations(creators(creator_code, full_name))')
        .eq('cycle_id',A.cycle.id).eq('status','verified').limit(900),
      db().from('metric_snapshots').select('submission_id, snapshot_no, is_final, captured_at, views')
        .eq('cycle_id',A.cycle.id).order('captured_at',{ascending:false}).limit(1500)
    ]).then(function(r){
      var results=rows(r[0]), verified=rows(r[1]), snaps=rows(r[2]);
      var byS={}; snaps.forEach(function(x){ (byS[x.submission_id]=byS[x.submission_id]||[]).push(x); });
      var locked = results.length && results.every(function(x){ return x.is_final; });
      var withFinal = verified.filter(function(s){ return (byS[s.id]||[]).some(function(x){ return x.is_final; }); }).length;

      $('#scBody').innerHTML =
        lede('Turn verified entries into ranks, then lock them.',
          'Capture a final snapshot for every verified entry, run scoring, read the ranks, then have two different ' +
          'people sign off. The second signature locks the results for good.',
          'Views and engagement are normalised across the cycle before the weights are applied, so a creator on a ' +
          'small brand is not punished for the brand being small. Snapshots are append only: a correction is a new ' +
          'capture, never an edit, which is why a disputed number can always be traced.') +
        '<div class="split">' +
          '<div class="card">' +
            '<div class="sec-h"><h2>Results</h2><span class="sh-sub">' + results.length + ' scored</span></div>' +
            (locked ? '<div class="ok-note" style="margin-bottom:12px"><span>&#10003;</span><span>' +
              'Signed off by two people and locked. Creators can see their rank, and nothing can rescore them.</span></div>' : '') +
            table(['#','Creator','Brand','Views','Score','In brand','State'],
              results, function(x){
                return '<tr><td class="mono-s">' + (x.rank_overall||'-') + '</td>' +
                  who(x.display_name||x.creator_code, x.creator_code) +
                  '<td>' + esc(x.brand_name||'') + '</td>' +
                  '<td class="mono-s">' + num(x.views) + '</td>' +
                  '<td class="mono-s"><b>' + (x.total_score==null?'-':x.total_score) + '</b></td>' +
                  '<td class="mono-s">' + (x.rank_in_brand||'-') + '</td>' +
                  '<td>' + (x.is_final?'<span class="chip ok">final</span>':'<span class="chip wait">provisional</span>') + '</td></tr>';
              },
              'Nothing scored yet',
              'Capture the final snapshots first, then run scoring.') +
          '</div>' +
          '<div class="stack">' +

  /* The code lives in task_secrets, not on the task, so it moves separately
     from the rest of the form. Switching a task off code proof clears it
     rather than leaving a stale code behind for the next time. */
  function saveTaskSecret(taskId, mode, code){
    if(mode === 'code' && code)
      return db().from('task_secrets').upsert({ task_id:taskId, verify_code:code });
    if(mode !== 'code')
      return db().from('task_secrets').delete().eq('task_id', taskId);
    return Promise.resolve({});
  }

  /* ============================================================
     The review queue
     ============================================================
     A pending claim has cost the creator nothing yet, and is worth nothing
     yet. Approving is what moves the ledger. */
  function renderTaskReview(list){
    var host=$('#tkReview');
    if(!host) return;
    var titleOf={}; list.forEach(function(t){ titleOf[t.id]=t; });

    db().from('task_completions')
      .select('id, task_id, completed_at, proof_url, proof_path, proof_note, registrations(creators(display_name, full_name, creator_code))')
      .eq('status','pending')
      .order('completed_at')
      .then(function(res){
        var pend=rows(res).filter(function(c){ return titleOf[c.task_id]; });
        if(!pend.length){ host.innerHTML=''; return; }

        host.innerHTML =
          '<div class="bar-t"><b>Waiting on you</b>' +
          '<span class="hint">Nothing here has been paid. The points appear on approval, not on the claim.</span></div>' +
          table(['Creator','Task','Proof','Claimed','Actions'], pend, function(c){
            var t=titleOf[c.task_id];
            var cr=((c.registrations||{}).creators)||{};
            var nm=cr.display_name || cr.full_name || cr.creator_code || 'Creator';
            var proof = c.proof_url  ? link(c.proof_url, 'open the link')
                      : c.proof_path ? '<button class="b-xs" data-shot="' + esc(c.proof_path) + '">View screenshot</button>'
                      : c.proof_note ? '<span class="mono-s">' + esc(c.proof_note) + '</span>'
                      : '<span class="mono-s">nothing attached</span>';
            return '<tr>' + who(nm, cr.creator_code||'') +
              '<td class="who-cell"><b>' + esc(t.title) + '</b><span>+' + t.points + ' points</span></td>' +
              '<td>' + proof + '</td>' +
              '<td class="mono-s">' + esc(dt(c.completed_at)) + '</td>' +
              '<td><div class="acts-wrap">' + gate('review',
                '<button class="b-xs ok" data-appr="' + c.id + '">Approve</button>' +
                '<button class="b-xs no" data-rej="' + c.id + '">Reject</button>') +
              '</div></td></tr>';
          }, 'Nothing waiting', '');

        $$('#tkReview [data-shot]').forEach(function(b){
          b.onclick=function(){
            b.disabled=true;
            db().storage.from('clipathon-proof').createSignedUrl(b.dataset.shot, 600)
              .then(function(r){
                b.disabled=false;
                var u=r && r.data && r.data.signedUrl;
                if(!u){ toast('Could not open that file', true); return; }
                window.open(u, '_blank', 'noopener');
              }).catch(function(){ b.disabled=false; toast('Could not open that file', true); });
          };
        });

        $$('#tkReview [data-appr]').forEach(function(b){
          b.onclick=function(){
            var c=pend.filter(function(x){ return x.id===b.dataset.appr; })[0], t=titleOf[c.task_id];
            reviewClaim(c.id, true, 'Approve "' + t.title + '"?',

        });
        $$('#tkReview [data-rej]').forEach(function(b){

            var c=pend.filter(function(x){ return x.id===b.dataset.rej; })[0], t=titleOf[c.task_id];
            reviewClaim(c.id, false, 'Reject this claim for "' + t.title + '"?',

              F([{k:'rnote', label:'Why', type:'textarea', rows:3, full:true,
                  ph:'The tag is not visible in the screenshot.'}]));

  function reviewClaim(id, approve, title, sub, body){
    ask({ eyebrow:'Review', title:title, sub:sub, danger:!approve, body:body,
      cta: approve ? 'Approve and pay' : 'Reject',
      run:function(){
        return db().rpc('admin_review_completion',
          { p_id:id, p_approve:approve, p_note: approve ? null : Vt('rnote') })
          .then(function(r){
            if(r.error){ toast(friendly(r.error), true); return false; }
            if(r.data !== true){ toast('That claim was already settled by someone else', true); return false; }
            toast(approve ? 'Approved, the points are in the ledger' : 'Rejected');
            return true;
          });
      },
      after:function(){ renderTasks(); }});
  }

  function renderTasks(){
    Promise.all([
      q('tasks', function(b){ return b.eq('cycle_id',A.cycle.id).order('sort_order').order('title'); }),
      db().from('task_completions').select('task_id, revoked_at, status'),
      q('task_links',   function(b){ return b.order('sort_order').order('title'); }),
      q('task_secrets'),
      q('brands',       function(b){ return b.eq('cycle_id',A.cycle.id).order('display_order'); })
    ]).then(function(r){
      var list=r[0], comps=rows(r[1]), links=r[2], secrets=r[3], brands=r[4];

      var codeBy={}; secrets.forEach(function(x){ codeBy[x.task_id]=x.verify_code; });
      list.forEach(function(t){ t.__code = codeBy[t.id] || ''; });

      var linksBy={};
      links.forEach(function(L){ (linksBy[L.task_id] = linksBy[L.task_id] || []).push(L); });

      var doneBy={}, pendBy={};
      comps.forEach(function(c){
        if(c.revoked_at) return;
        if(c.status === 'pending') pendBy[c.task_id]=(pendBy[c.task_id]||0)+1;
        else if(c.status !== 'rejected') doneBy[c.task_id]=(doneBy[c.task_id]||0)+1;
      });
      var live = list.filter(function(t){ return t.is_active; });
      var total = live.reduce(function(a,t){ return a+t.points; },0);

      $('#tkBody').innerHTML =
        lede('The bonus tasks, and what each one is worth.',
          'Change a number, press Save, done. Everything else about a task lives behind Edit.',
          'Repricing is retroactive by default: creators who already finished the task get the difference as a ' +
          'separate ledger entry. Without that, somebody who did the work on day one would be permanently worth ' +
          'less than somebody who did the same work on day four, purely because you changed your mind in between.') +
        '<div class="kpis">' +
          '<div class="kpi-s"><span class="k">Active tasks</span><span class="v">' + live.length + '</span><span class="s">of ' + list.length + ' written</span></div>' +
          '<div class="kpi-s"><span class="k">Points available</span><span class="v">' + comma(total) + '</span><span class="s">if one creator did everything</span></div>' +
          '<div class="kpi-s"><span class="k">Completions</span><span class="v">' + comma(comps.filter(function(c){ return !c.revoked_at && c.status !== 'pending' && c.status !== 'rejected'; }).length) + '</span><span class="s">across all creators</span></div>' +
          '<div class="kpi-s"><span class="k">Waiting on review</span><span class="v">' + comma(comps.filter(function(c){ return c.status === 'pending' && !c.revoked_at; }).length) + '</span><span class="s">claimed, not yet paid</span></div>' +
        '</div>' +
        '<div id="tkReview"></div>' +
        '<div class="bar-t">' + gate('ops','<button class="btn-ghost btn-sm" id="tkNew">Add a task</button>') +
          '<span class="hint">Untick <b>back-credit</b> on a row to change the price for future completions only.</span></div>' +
        '<div id="tkTable"></div>';

      $('#tkTable').innerHTML = table(
        ['Task','How it is proven','Links','Completed by','Points','Back-credit','Actions'],
        list, function(t){
          var n=doneBy[t.id]||0, pn=pendBy[t.id]||0, nl=(linksBy[t.id]||[]).length;
          return '<tr' + (t.is_active?'':' style="opacity:.5"') + '>' +
            '<td class="who-cell" style="max-width:300px"><b>' + esc(t.title) + '</b><span>' + esc(t.code) +
              (t.is_auto?' &#183; tracked':' &#183; self-ticked') +
              (t.unlock_status?(' &#183; from ' + esc((PHASE[t.unlock_status]||{}).t||t.unlock_status)):'') +
              (t.is_active?'':' &#183; DISABLED') + '</span></td>' +
            '<td class="mono-s">' + esc(t.is_auto ? 'in the database' : (VERIFY_SHORT[t.verify_mode] || 'honor')) +
              (t.verify_mode === 'code' && !t.__code && !t.is_auto ? '<br><span class="delta dn">no code set</span>' : '') + '</td>' +
            '<td>' + gate('ops','<button class="b-xs" data-links="' + t.id + '">' +
              (nl ? nl + ' link' + (nl===1?'':'s') : 'Add') + '</button>') + '</td>' +
            '<td class="mono-s">' + n + (pn ? '<br><span class="delta up">' + pn + ' waiting</span>' : '') + '</td>' +
            '<td><div class="tune">' +
              '<input type="number" min="1" value="' + t.points + '" data-pts="' + t.id + '" data-was="' + t.points + '"' + (can().ops?'':' disabled') + '>' +
              '<span class="delta same" data-dl="' + t.id + '">same</span></div></td>' +
            '<td><label class="retro" title="Adjust the creators who already finished it">' +
              '<input type="checkbox" data-retro="' + t.id + '" checked' + (can().ops?'':' disabled') + '> yes</label></td>' +
            '<td><div class="acts-wrap">' + gate('ops',
                '<button class="b-xs ok" data-save="' + t.id + '" disabled ' +
                  'title="Change the number on the left first">Save points</button>' +
                '<button class="b-xs" data-edit="' + t.id + '">Edit</button>' +
                '<button class="b-xs" data-tog="' + t.id + '">' + (t.is_active?'Disable':'Enable') + '</button>' +
                (t.verify_mode === 'roster' && !t.is_auto
                  ? '<button class="b-xs" data-roster="' + t.id + '">Paste roster</button>' : '') +
                (n?'':'<button class="b-xs no" data-del="' + t.id + '">Delete</button>')) +
            '</div></td></tr>';
        },
        'No tasks in this cycle yet',
        'Tasks are how a creator climbs the leaderboard without waiting for results. Add a few during draft.');

      var nb=$('#tkNew');
      if(nb) nb.onclick=function(){
        ask({ eyebrow:'Task', title:'Add a bonus task',
          sub:'It appears on every creator dashboard in this cycle.',
          body:taskFields(null), cta:'Add task',
          run:function(){
            if(!Vt('title')||!Vt('code')){ toast('A task needs a title and a short code', true); return false; }
            var p=taskPatch(); p.cycle_id=A.cycle.id; p.is_active=true;
            return save(db().from('tasks').insert(p), 'Task added');
          }, after:function(){ renderTasks(); }});
      };
      $$('#tkTable [data-pts]').forEach(function(inp){
        inp.oninput=function(){
          var was=Number(inp.dataset.was), now=Number(inp.value||0), diff=now-was;
          var dl=$('[data-dl="'+inp.dataset.pts+'"]');
          dl.textContent = diff===0?'same':(diff>0?'+'+diff:String(diff));
          dl.className='delta ' + (diff===0?'same':diff>0?'up':'dn');
          var sv=$('[data-save="'+inp.dataset.pts+'"]');
          if(sv) sv.disabled = (diff===0 || !(now>0));
        };
      });
      $$('#tkTable [data-save]').forEach(function(b){
        b.onclick=function(){
          var id=b.dataset.save, t=list.filter(function(x){ return x.id===id; })[0];
          var pts=Number($('[data-pts="'+id+'"]').value), retro=$('[data-retro="'+id+'"]').checked, n=doneBy[id]||0;
          var diff=pts-t.points;
          ask({ eyebrow:'Task points', title:'Change "' + t.title + '" to ' + pts + ' points?',
            sub: diff>0 ? ('Worth ' + diff + ' more than before.') : ('Worth ' + Math.abs(diff) + ' less than before.'),
            body:'<p class="m-p">' + (n
              ? (retro
                 ? '<b>' + n + ' creator' + (n===1?'':'s') + '</b> already finished this. Each gets a separate ' +
                   'ledger entry of <b>' + (diff>0?'+':'') + diff + '</b>, so everyone who did this task ends up ' +
                   'worth the same ' + pts + ' points. Nothing is overwritten, and the reason on each entry says ' +
                   'exactly why it appeared.'
                 : '<b>' + n + ' creator' + (n===1?'':'s') + '</b> already finished this and will keep the ' +
                   t.points + ' they earned. Only future completions pay ' + pts + '. Early and late finishers will ' +
                   'be worth different amounts for the same work.')
              : 'Nobody has finished this task yet, so there is no history to adjust.') + '</p>',
            cta:'Change the points',
            run:function(){ return act('admin_set_task_points',{p_task_id:id,p_points:pts,p_retro:retro}); },
            after:function(){ renderTasks(); }});

      });
      $$('#tkTable [data-edit]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.edit; })[0];
          ask({ eyebrow:'Task', title:'Edit ' + t.title,
            sub:'Points are changed from the row, so that the back-credit question gets asked properly.',
            body:taskFields(t), cta:'Save task',
            run:function(){
              var p=taskPatch(); delete p.points;   /* points only move through the repricing path */
              var code=Vt('vcode'), mode=p.verify_mode;
              return save(db().from('tasks').update(p).eq('id',t.id), 'Task saved')
                .then(function(ok){
                  if(!ok) return false;
                  return Promise.resolve(saveTaskSecret(t.id, mode, code)).then(function(){ return true; });
                });
            }, after:function(){ renderTasks(); }});
        };
      });
      $$('#tkTable [data-tog]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.tog; })[0];
          save(db().from('tasks').update({ is_active: !t.is_active }).eq('id',t.id),
               t.is_active?'Task disabled, creators no longer see it':'Task enabled')
            .then(function(ok){ if(ok) renderTasks(); });
        };
      });
      $$('#tkTable [data-links]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.links; })[0];
          linksModal(t, brands, linksBy[t.id]||[]);
        };
      });
      $$('#tkTable [data-roster]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.roster; })[0];
          rosterModal(t, brands);
        };
      });
      renderTaskReview(list);
      $$('#tkTable [data-del]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.del; })[0];
          ask({ eyebrow:'Task', title:'Delete "' + t.title + '"?', danger:true,
            sub:'Nobody has completed it, so nothing is lost.',
            body:'<p class="m-p">If you only want it off the dashboard, use <b>Disable</b> instead. That keeps the ' +
              'record and can be undone.</p>',
            cta:'Delete task',
            run:function(){ return save(db().from('tasks').delete().eq('id',t.id), 'Task deleted'); },
            after:function(){ renderTasks(); }});
        };
      });
    });
  }

      {k:'start', label:'Starts', type:'datetime-local', value:dtLocal(s.starts_at)},
      {k:'mins',  label:'Minutes', type:'number', min:1, value:s.duration_min||45},
      {k:'host',  label:'Who is running it', value:s.host||''},
      {k:'agenda',label:'Agenda', type:'textarea', rows:3, value:s.agenda||''},
      {k:'join',  label:'Join link', value:s.join_url||'', ph:'https://…'},

      starts_at:Vdt('start'), duration_min:Vn('mins')||45, host:Vt('host'), agenda:Vt('agenda'),
      join_url:Vt('join'), recording_url:Vt('rec'),
      recorded_at: Vt('rec') ? new Date().toISOString() : null };
  }
  function annFields(a, sessions){
    a = a || {};
    return F([
      {k:'title', label:'Headline', value:a.title||'', full:true},
      {k:'kind',  label:'Kind', type:'select', value:a.kind||'notice', opts:ANN_KINDS},
      {k:'ses',   label:'About a session?', type:'select', value:a.session_id||'',
       opts:[{v:'',t:'no session'}].concat((sessions||[]).map(function(s){ return {v:s.id,t:s.title}; }))},
      {k:'body',  label:'The message', type:'textarea', rows:4, value:a.body||''},
      {k:'event', label:'When the thing happens', type:'datetime-local', value:dtLocal(a.event_at),

      {k:'pub',   label:'When creators see it', type:'datetime-local', value:dtLocal(a.publish_at),
       hint:'Has to be at least 24 hours before the event. The database refuses anything later.'},

      {k:'crit',  label:'Critical', type:'check', value:!!a.is_critical, ph:'Mark as unmissable'}

      event_at:Vdt('event'), publish_at:Vdt('pub') || new Date().toISOString(),
      is_pinned:V('pin')===true, is_critical:V('crit')===true };

  /* ============================================================
     CREATORS
     ============================================================ */
  /* The number is OTP collected at signup and sits on the creator row.
     Shown here because "email them" is not how you reach a creator on
     slot day, and a number you have to open a SQL client to find is a
     number you do not have. wa.me wants digits only, no plus. */
  function phoneCell(x){
    var raw = String(x.phone || '').trim();
    if(!raw) return '<td class="mono-s">-</td>';
    var digits = raw.replace(/[^0-9]/g, '');
    var tick = x.phone_verified_at
      ? ' <span class="chip ok" title="Verified by OTP at signup">otp</span>' : '';
    return '<td class="mono-s"><span data-ph="' + esc(raw) + '" class="lnk" ' +
      'title="Click to copy">' + esc(raw) + '</span>' + tick +
      (digits.length >= 10
        ? ' <a class="lnk" href="https://wa.me/' + esc(digits) + '" target="_blank" rel="noopener">wa &#8599;</a>'
        : '') + '</td>';
  }

  /* The handle comes out of the view already cleaned: a verified
     connected account if there is one, otherwise parsed out of the URL
     they registered with, minus the ?stkn= token Instagram staples on
     when a profile is shared from the app. The tick means somebody put
     our code in that bio and the check passed, which is a different
     claim from "they typed an instagram url". */
  function igCell(x){
    var h = String(x.ig_handle || '').trim().replace(/^@/, '');
    if(!h){
      /* Registered with something that is not Instagram. Better to offer
         the link they gave than to print a dash and lose it. */
      var u = String(x.primary_profile_url || '').trim();
      return '<td class="mono-s">' + (/^https?:\/\//i.test(u) ? link(u, 'profile') : '-') + '</td>';
    }
    var tick = x.ig_verified
      ? ' <span class="chip ok" title="Bio code checked, this account is theirs">ok</span>' : '';
    return '<td class="mono-s"><a class="lnk" href="https://instagram.com/' +
      encodeURIComponent(h) + '" target="_blank" rel="noopener">@' + esc(h) + '</a>' + tick + '</td>';
  }

  /* Every creator is already a referrer. creators.referral_code has
     existed since the schema was written, and the bridge page accepts it
     with no ref_links row behind it, so a creator's own link works the
     moment they register. This is the only place it was ever visible.

     The counters are what stop it being decoration: taps on the link,
     and how many of those became signups. A link nobody tapped and a
     link fifty people tapped without registering are different problems,
     and one number cannot tell them apart. */
  function ownLinkCell(x){
    var code = String(x.referral_code || '').trim().toUpperCase();
    if(!code) return '<td class="mono-s">-</td>';
    var taps = x.own_link_taps || 0, signups = x.own_link_signups || 0;
    return '<td class="mono-s">' +
      '<span class="lnk" data-cl="' + esc(code) + '" title="Click to copy the link">/r/' + esc(code.toLowerCase()) + '</span>' +
      '<span class="hint" style="display:block">' +
        (taps ? taps + (taps === 1 ? ' tap' : ' taps') : 'no taps yet') +
        (signups ? ' &#183; <b>' + signups + '</b> signed up' : '') +

  /* ============================================================
     Creator export
     ============================================================
     Tanish builds the WhatsApp group by hand, so the file has to be
     something a person can work down a column of, not a database dump.
     Three decisions follow from that:

       1. The phone is written as TEXT, three ways. Excel treats a cell
          starting with + as a formula and a cell of digits as a number,
          and either one silently destroys a phone number: +919876543210
          becomes #NAME? and 9876543210 loses nothing yet but will the
          moment somebody's number has a leading zero. So: the number as
          stored, the bare digits, and a wa.me link that opens the chat
          in one click.
       2. It exports WHAT IS ON SCREEN. Filter to "No login yet", export,
          and you have exactly the people to chase rather than a list to
          re-filter in Excel.
       3. Real .xlsx when the library is there, CSV when it is not.
          A failed export is worse than a plain one.
     ============================================================ */

  /* The digits WhatsApp wants: country code, no plus, no spaces. Indian
     numbers get 91 put back on when somebody registered with ten digits
     and no country code, which is most of them. */
  function waDigits(phone){
    var d = String(phone || '').replace(/[^0-9]/g, '');
    if(!d) return '';
    if(d.length === 10) d = '91' + d;              /* bare Indian mobile */
    if(d.length === 11 && d.charAt(0) === '0') d = '91' + d.slice(1);
    return d;
  }

  function exportRows(list, regById){
    return list.map(function(x){
      var reg  = regById[x.creator_id] || {};
      var wa   = waDigits(x.phone);
      var cats = reg.content_categories;
      return {
        'Name'            : x.full_name || '',
        'Phone'           : String(x.phone || ''),
        'WhatsApp number' : wa,
        'Open chat'       : wa ? 'https://wa.me/' + wa : '',
        'Email'           : x.email || '',
        'Instagram'       : x.ig_handle ? '@' + String(x.ig_handle).replace(/^@/, '') : '',
        'Profile link'    : x.primary_profile_url || '',
        'Second link'     : reg.secondary_profile_url || '',
        'Followers'       : reg.follower_band || '',
        'Categories'      : Array.isArray(cats) ? cats.join(', ') : (cats || ''),
        'Creator code'    : x.creator_code || '',
        'Their ref code'  : x.referral_code || '',
        'Came in on'      : x.ref_code_used || '',
        'Entry'           : x.registration_status || '',
        'Has login'       : x.has_login ? 'yes' : 'no',
        'Handle verified' : x.has_verified_account ? 'yes' : 'no',
        'Ready for slot'  : x.ready_for_slot_selection ? 'yes' : 'no',
        'Has slot'        : x.has_slot ? 'yes' : 'no',
        'Registered'      : reg.created_at ? dt(reg.created_at) : '',
        'Last seen'       : x.last_login_at ? dt(x.last_login_at) : 'never'
      };
    });
  }

  function download(blob, name){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
  }

  function toCsv(rows){
    if(!rows.length) return '';
    var head = Object.keys(rows[0]);
    var cell = function(v){
      v = String(v == null ? '' : v);
      /* A leading +, =, -, @ is how a spreadsheet is talked into running
         something. Prefix it so the cell stays a phone number. */
      if(/^[=+\-@]/.test(v)) v = "'" + v;
      return '"' + v.replace(/"/g, '""') + '"';
    };
    return '﻿' + head.map(cell).join(',') + '\r\n' +
      rows.map(function(r){ return head.map(function(k){ return cell(r[k]); }).join(','); }).join('\r\n');
  }

  function exportCreators(list, regById){
    if(!list || !list.length){ toast('Nothing to export with this filter', true); return; }
    var rows = exportRows(list, regById);
    var stamp = new Date().toISOString().slice(0, 10);
    var base  = 'clipathon-creators-' + stamp;

    if(!window.XLSX){
      download(new Blob([toCsv(rows)], {type:'text/csv;charset=utf-8'}), base + '.csv');
      toast(rows.length + ' creators exported as CSV');
      return;
    }

    try{
      var head = Object.keys(rows[0]);
      var ws = XLSX.utils.json_to_sheet(rows, { header: head });

      /* Force every cell to text. json_to_sheet types a run of digits as
         a number, and a phone number that becomes a number is a phone
         number you cannot dial. */
      var ref = XLSX.utils.decode_range(ws['!ref']);
      for(var R = ref.s.r + 1; R <= ref.e.r; R++){
        for(var C = ref.s.c; C <= ref.e.c; C++){
          var cell = ws[XLSX.utils.encode_cell({r:R, c:C})];
          if(cell && cell.v != null){ cell.t = 's'; cell.v = String(cell.v); cell.z = '@'; }
        }
      }

      /* Column widths from the longest thing in each column, so nothing
         opens as a row of ####. */
      ws['!cols'] = head.map(function(k){
        var w = k.length;
        rows.forEach(function(r){ w = Math.max(w, String(r[k] == null ? '' : r[k]).length); });
        return { wch: Math.min(Math.max(w + 2, 9), 46) };
      });
      /* Autofilter puts a dropdown on every header, which is what makes
         the file sortable by hand. Freeze panes is not in the free
         SheetJS build, so it is not set here: a line that silently does
         nothing is worse than an honest absence. */
      ws['!autofilter'] = { ref: ws['!ref'] };

      var wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Creators');
      XLSX.writeFile(wb, base + '.xlsx');
      toast(rows.length + ' creators exported');
    }catch(e){
      console.error('[admin] xlsx export failed, falling back to csv', e);
      download(new Blob([toCsv(rows)], {type:'text/csv;charset=utf-8'}), base + '.csv');
      toast(rows.length + ' creators exported as CSV');
    }
  }

  /* ============================================================
     AMBASSADORS
     ============================================================ */
  /* ============================================================
     DEEP LINKS
     ============================================================
     One link per influencer. Three jobs, in this order of value:

       1. it credits them. The code rides the whole way to the
          registration form and fills itself in, so a creator who
          forgets to type a code no longer costs somebody a referral.
       2. it counts taps. Registrations were always attributable;
          what was invisible is how many people tapped and never
          finished, which is the number that tells you whether the
          influencer or the landing page is the problem.
       3. it tries to get people out of the Instagram browser, which
          is where signups go to die: the OTP email opens in another
          app and passwords do not autofill.

     Job 3 is best effort and the table says so. Android hands over
     reliably. iOS often refuses, and the "Out" column is where you
     watch that happen rather than guess about it.
     ============================================================ */
  function linkBase(){
    return /^https?:/.test(location.origin) ? location.origin : 'https://clipency.in';
  }
  /* The code is stored upper case so one code means one owner no matter
     how anybody types it, but nobody should have to read SHOUTING out of
     an Instagram bio. Every link we hand out is lower case, and the
     bridge upper-cases whatever it is given, so /r/aarav and /r/AARAV
     land on the same person and are counted on the same row. */
  function linkCode(code){ return String(code || '').trim().toLowerCase(); }
  function deepUrl(code){ return linkBase() + '/r/' + encodeURIComponent(linkCode(code)); }

  /* A code a person can read out on a call and type without a typo.
     Digits rather than letters on the tail: it reads cleanly in lower
     case in a bio, and there is no O against 0 or I against 1 to argue
     about when somebody types it by hand. Returned upper case because
     that is how it is stored; the link lower-cases it. */
  function suggestCode(name){
    var base = String(name || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 10);
    if(base.length < 3) base = 'CLIP' + base;
    var tail = String(Math.floor(Math.random() * 90) + 10);
    return (base + tail).slice(0, 24);
  }

  var DEST_OPTS = [
    { v:'/clipathon',          t:'Clipathon landing page' },
    { v:'/clipathon/register', t:'Straight to the questions' },
    { v:'/clipathon/signin',   t:'Straight to sign in' }
  ];
  var CHANNELS = ['instagram','youtube','tiktok','whatsapp','x','linkedin','offline','other'];

    ]).then(function(r){
      var list = rows(r[0]), amb = r[1] || {};
      if(!Array.isArray(amb)) amb = [];

      var tot = list.reduce(function(a, x){
        a.clicks += (x.clicks || 0); a.people += (x.visitors || 0);
        a.regs   += (x.registrations || 0); a.appr += (x.approved || 0);
        a.out    += (x.escaped || 0); a.stuck += (x.trapped || 0);
        return a;
      }, {clicks:0, people:0, regs:0, appr:0, out:0, stuck:0});

      var pct = function(n, d){ return d > 0 ? Math.round(n / d * 100) + '%' : '-'; };

      $('#dlBody').innerHTML =
        lede('One trackable link per influencer.',
          'Generate a link, the influencer puts it in their bio, and the code travels all the way to the ' +
          'registration form and fills itself in. Nobody has to remember to type anything.',
          'The link goes to a bridge page that records the tap, remembers the code and then tries to hand the ' +
          'person to their real browser. On Android that works. On iOS, Instagram often refuses to let go and ' +
          'the person is shown a card telling them which menu to tap. The Out column counts how often the ' +
          'handoff actually fired, so this is measured rather than assumed. Conv is registrations divided by ' +
          'unique people, not by taps.') +

        '<div class="kpis">' +
          '<div class="kpi-s"><span class="k">Taps</span><span class="v">' + tot.clicks + '</span>' +

            '<span class="s">' + tot.stuck + ' had to be shown how</span></div>' +
          '<div class="kpi-s"><span class="k">Registered</span><span class="v">' + tot.regs + '</span>' +
            '<span class="s">' + pct(tot.regs, tot.people) + ' of the people who tapped</span></div>' +
          '<div class="kpi-s"><span class="k">Approved</span><span class="v">' + tot.appr + '</span>' +
            '<span class="s">the number that actually counts</span></div>' +
        '</div>' +

        '<div class="bar-t">' +
          gate('marketing', '<button class="btn-ghost btn-sm" id="dlNew">New influencer link</button>') +
          gate('marketing', '<button class="btn-ghost btn-sm" id="dlExist">Link an existing code</button>') +
          '<span class="hint">' + list.length + ' link' + (list.length === 1 ? '' : 's') + ' in this cycle.</span>' +
        '</div>' +

        table(['Who','Code','Where','Taps','People','Out','Registered','Approved','Conv','Active',''],
          list, function(x){
            var stuck = (x.trapped || 0);
            return '<tr>' + who(x.label, x.notes || (x.dest === '/clipathon' ? 'lands on the landing page' : 'lands on ' + x.dest)) +
              '<td class="mono-s"><b title="Stored as ' + esc(x.code) + '. Case does not matter in a link.">/r/' +
                esc(String(x.code || '').toLowerCase()) + '</b></td>' +
              '<td class="mono-s">' + esc(x.channel) + '</td>' +
              '<td class="mono-s">' + (x.clicks || 0) + '</td>' +
              '<td class="mono-s">' + (x.visitors || 0) + '</td>' +
              '<td class="mono-s">' + (x.escaped || 0) +
                (stuck ? '<span class="hint"> / ' + stuck + ' stuck</span>' : '') + '</td>' +
              '<td class="mono-s">' + (x.registrations || 0) + '</td>' +
              '<td class="mono-s"><b>' + (x.approved || 0) + '</b></td>' +
              '<td class="mono-s">' + pct(x.registrations || 0, x.visitors || 0) + '</td>' +
              '<td>' + (x.is_active ? '<span class="chip ok">on</span>' : '<span class="chip no">off</span>') + '</td>' +
              '<td><div class="acts-wrap">' +
                '<button class="b-xs" data-dlcopy="' + esc(x.code) + '">Copy</button>' +
                gate('marketing', '<button class="b-xs" data-dledit="' + x.link_id + '">Edit</button>') +
              '</div></td></tr>';
          },
          'No links generated yet',
          'Generate one per influencer. The code in the link is the same code the registration form fills in, ' +
          'so taps and signups end up on the same row.');

      /* ---- copy ---- */
      $$('#dlBody [data-dlcopy]').forEach(function(b){
        b.onclick = function(){
          var url = deepUrl(b.dataset.dlcopy);
          var done = function(){ toast('Link copied'); };
          if(navigator.clipboard && navigator.clipboard.writeText){
            navigator.clipboard.writeText(url).then(done).catch(function(){ show({
              eyebrow:'Deep link', title:'Copy this by hand',
              body:'<div class="mono-s" style="word-break:break-all">' + esc(url) + '</div>' }); });
          } else {
            show({ eyebrow:'Deep link', title:'Copy this by hand',
              body:'<div class="mono-s" style="word-break:break-all">' + esc(url) + '</div>' });
          }
        };
      });

      /* ---- new influencer: the ambassador row and the link together ----
         The ambassador row is what makes register_creator resolve the
         code to a person rather than just storing the text, which is
         what the referral points system reads. So both are written, and
         the link is only worth having if the first one landed. */
      var newFields = function(){
        return F([
          {k:'nm',  label:'Influencer name', value:'', full:true, ph:'Aarav Menon'},
          {k:'em',  label:'Email', type:'email', value:'', ph:'aarav@example.com',
           hint:'Required. It is how you reach them about their numbers.'},
          {k:'ph',  label:'Phone', value:''},
          {k:'hd',  label:'Handle or where they post', value:'', ph:'@aaravmakes'},
          {k:'cd',  label:'Code', value:'', ph:'aarav07',
           hint:'Type it however you like. Letters, numbers, dot, dash or underscore, 3 to 24 characters. ' +
                'The link is handed out in lower case and matching ignores case, so aarav07 and AARAV07 ' +
                'are the same person.'},
          {k:'ch',  label:'Channel', type:'select', value:'instagram', opts:CHANNELS},
          {k:'ds',  label:'Lands on', type:'select', value:'/clipathon', opts:DEST_OPTS},
          {k:'rw',  label:'What they get', value:'', full:true,
           hint:'Your note, not shown to anybody outside the console.'}
        ]);
      };

      var nb = $('#dlNew');
      if(nb) nb.onclick = function(){
        ask({ eyebrow:'Deep link', title:'New influencer link', cta:'Generate',
          sub:'Creates the person, their code and the link in one go.',
          body:newFields(),
          run:function(){
            var name = Vt('nm'), email = Vt('em');
            if(!name || !email){ toast('Needs a name and an email', true); return false; }
            var code = (Vt('cd') || suggestCode(name)).toUpperCase().replace(/[^A-Z0-9._-]/g,'');
            if(!/^[A-Z0-9][A-Z0-9._-]{2,23}$/.test(code)){
              toast('That code will not work. Letters, numbers, dot, dash or underscore, 3 to 24 characters.', true);
              return false;
            }
            var handle = Vt('hd');
            return db().from('ambassadors').insert({
              cycle_id: A.cycle.id, full_name:name, email:email, phone:Vt('ph'),
              campus: handle || 'Influencer', ref_code:code, reward_note:Vt('rw'), is_active:true
            }).select('id').single().then(function(res){
              if(res.error){ toast(friendly(res.error), true); return false; }
              return save(db().from('ref_links').insert({
                cycle_id: A.cycle.id, code:code,
                label: name + (handle ? ' (' + handle + ')' : ''),
                channel: V('ch') || 'instagram',
                dest: V('ds') || '/clipathon',
                ambassador_id: res.data.id,
                notes: Vt('rw')
              }), 'Link ready. Copy it from the row.');
            }).catch(function(e){ toast(friendly(e), true); return false; });
          },
          after:function(){ renderLinks(); }});
      };

      /* ---- an existing ambassador who now needs a link ---- */
      var eb = $('#dlExist');
      if(eb) eb.onclick = function(){
        var free = amb.filter(function(a){
          return !list.some(function(x){ return x.code === String(a.ref_code || '').toUpperCase(); });
        });
        if(!free.length){
          show({ eyebrow:'Deep link', title:'Every ambassador already has a link',
            body:'<p class="hint">Add an ambassador on the Ambassadors page first, or use New influencer link, ' +
                 'which creates the person and the link together.</p>' });
          return;
        }
        ask({ eyebrow:'Deep link', title:'Link an existing code', cta:'Generate',
          sub:'For somebody already on the Ambassadors page.',
          body:F([
            {k:'ab', label:'Ambassador', type:'select', full:true,
             opts:free.map(function(a){ return { v:a.id, t:a.full_name + '  ' + a.ref_code }; })},
            {k:'ch', label:'Channel', type:'select', value:'instagram', opts:CHANNELS},
            {k:'ds', label:'Lands on', type:'select', value:'/clipathon', opts:DEST_OPTS}
          ]),
          run:function(){
            var a = free.filter(function(x){ return x.id === V('ab'); })[0];
            if(!a){ toast('Pick somebody', true); return false; }
            var code = String(a.ref_code || '').toUpperCase();
            if(!/^[A-Z0-9][A-Z0-9._-]{2,23}$/.test(code)){
              toast('Their code has characters a link cannot carry. Fix it on the Ambassadors page first.', true);
              return false;
            }
            return save(db().from('ref_links').insert({
              cycle_id: A.cycle.id, code:code, label:a.full_name,
              channel: V('ch') || 'instagram', dest: V('ds') || '/clipathon',
              ambassador_id: a.id
            }), 'Link ready');
          },
          after:function(){ renderLinks(); }});
      };

      /* ---- edit ---- */
      $$('#dlBody [data-dledit]').forEach(function(b){
        b.onclick = function(){
          var x = list.filter(function(y){ return String(y.link_id) === b.dataset.dledit; })[0];
          if(!x) return;
          ask({ eyebrow:'Deep link', title:'Edit ' + x.label, cta:'Save',
            sub:'The code cannot change. It is printed in somebody\'s bio and every tap so far is counted against it.',
            body:F([
              {k:'lb', label:'Who it is for', value:x.label, full:true},
              {k:'ch', label:'Channel', type:'select', value:x.channel, opts:CHANNELS},
              {k:'ds', label:'Lands on', type:'select', value:x.dest, opts:DEST_OPTS},
              {k:'nt', label:'Note', value:x.notes || '', full:true},
              {k:'on', label:'Active', type:'check', value:!!x.is_active,
               ph:'Off stops the tap from being credited'}
            ]),
            run:function(){
              return save(db().from('ref_links').update({
                label: Vt('lb') || x.label, channel: V('ch'), dest: V('ds'),
                notes: Vt('nt'), is_active: V('on') === true, updated_at: new Date().toISOString()
              }).eq('id', x.link_id), 'Saved');
            },
            after:function(){ renderLinks(); }});
        };
      });
    });
  }

      if(nb) nb.onclick=function(){

          run:function(){
            if(!Vt('name')||!Vt('code')){ toast('Needs a name and a code', true); return false; }
            var p=patch(); p.cycle_id=A.cycle.id;
            return save(db().from('ambassadors').insert(p), 'Ambassador added');
          }, after:function(){ renderAmbassadors(); }});

      $$('#abBody [data-ea2]').forEach(function(b){
        b.onclick=function(){
          var a=list.filter(function(x){ return x.id===b.dataset.ea2; })[0];
