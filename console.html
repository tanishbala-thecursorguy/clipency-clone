/* ============================================================
   WALLET — credit a client, move money on and off campaigns
   ------------------------------------------------------------
   Every figure here is read back from the database after each
   action rather than adjusted locally, because the rpcs apply
   floors the browser does not know about (delivered work and the
   platform fee are both committed and cannot be reclaimed).
   ============================================================ */
async function walletModal(clientId, clientName){
  var mine=CLI.camps.filter(function(c){return c.client_user_id===clientId;});

  function feeOf(c){
    if(c.platform_fee_amount!=null&&c.platform_fee_amount!=='')return num(c.platform_fee_amount);
    return Math.round(num(c.budget)*num(c.platform_fee_percent)/100*100)/100;
  }
  function poolOf(c){ return Math.max(Math.round((num(c.budget)-feeOf(c))*100)/100,0); }
  function freeOf(c){ return Math.max(Math.round((num(c.budget)-num(c.budget_used)-feeOf(c))*100)/100,0); }

  var LAB='display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;'+
          'text-transform:uppercase;color:var(--ink-40);margin-bottom:5px';

  function body(bal, ledger){
    return '<div class="eyeb">Wallet</div><h3>'+esc(clientName)+'</h3>'+
      '<p class="m-sub">Credit the wallet once money has actually arrived. Allocation moves it onto a campaign budget.</p>'+

      '<div class="kpis" style="margin:16px 0">'+
        '<div class="kpi"><span class="lab">Balance</span><div class="big">'+money(bal)+'</div>'+
          '<div class="sub-t">unallocated</div></div>'+
        '<div class="kpi"><span class="lab">On campaigns</span><div class="big">'+
          money(mine.reduce(function(a,c){return a+toUsd(c.budget,c);},0))+'</div>'+
          '<div class="sub-t">'+mine.length+' campaign'+(mine.length===1?'':'s')+'</div></div>'+
      '</div>'+

      '<div style="display:grid;grid-template-columns:1fr 130px;gap:8px;align-items:end;margin-bottom:6px">'+
        '<div><label style="'+LAB+'">Add funds (USD)</label>'+
          '<input class="inp" id="wlAmt" type="number" step="any" placeholder="1000"></div>'+
        '<button class="btn ok" id="wlAdd">Add funds</button>'+
      '</div>'+
      '<input class="inp" id="wlNote" placeholder="Reference — bank transfer, invoice number…" style="margin-bottom:14px">'+

      (mine.length
        ? '<label style="'+LAB+'">Campaign budgets</label>'+
          '<table style="margin-top:6px"><thead><tr><th>Campaign</th><th>Budget</th><th>Fee</th>'+
          '<th>Creators</th><th>Spent</th><th>Returnable</th><th>Move (USD)</th></tr></thead><tbody>'+
          mine.map(function(c){
            return '<tr>'+
              '<td><b>'+esc(c.title)+'</b><div style="font-size:10px;color:var(--ink-40)">'+
                num(c.platform_fee_percent)+'% fee</div></td>'+
              /* Budgets are in the campaign's own currency; the wallet is USD.
                 Allocation converts at the campaign's stamped rate, server side. */
              '<td class="mono">'+moneyIn(num(c.budget),ccyOf(c))+'</td>'+
              '<td class="mono">'+moneyIn(feeOf(c),ccyOf(c))+'</td>'+
              '<td class="mono">'+moneyIn(poolOf(c),ccyOf(c))+'</td>'+
              '<td class="mono">'+moneyIn(num(c.budget_used),ccyOf(c))+'</td>'+
              '<td class="mono">'+moneyIn(freeOf(c),ccyOf(c))+
                (ccyOf(c)!=='USD'?'<div style="font-size:10px;color:var(--ink-40)">≈ '+money(Math.floor(toUsd(freeOf(c),c)*100)/100)+'</div>':'')+'</td>'+
              '<td style="white-space:nowrap">'+
                '<input class="inp" id="wlA-'+esc(c.id)+'" type="number" step="any" placeholder="0" '+
                  'style="width:82px;display:inline-block;padding:6px 8px"> '+
                '<button class="btn sm ok"    data-alloc="'+esc(c.id)+'">→</button> '+
                '<button class="btn sm ghost" data-dealloc="'+esc(c.id)+'">←</button>'+
              '</td></tr>';
          }).join('')+'</tbody></table>'+
          '<p style="font-size:11.5px;color:var(--ink-40);margin-top:8px">'+
            '→ moves wallet money (USD) onto the campaign, converted to its own currency at its stamped rate. ← returns it. Only the returnable amount can come back: '+
            'delivered work and the platform fee are already committed.</p>'
        : '<p style="font-size:12px;color:var(--danger)">No campaigns are linked to this client yet, so there is nothing to allocate to.</p>')+

      '<div style="margin-top:16px"><label style="'+LAB+'">Recent movements</label>'+
        (ledger.length
          ? '<table style="margin-top:6px"><tbody>'+ledger.slice(0,8).map(function(l){
              var pos=num(l.amount)>0;
              return '<tr><td class="mono" style="width:96px">'+day(l.created_at)+'</td>'+
                '<td>'+esc(l.note||l.kind)+'</td>'+
                '<td class="mono" style="text-align:right;color:'+(pos?'var(--gold)':'var(--ink-70)')+'">'+
                  (pos?'+':'')+money(num(l.amount))+'</td></tr>';
            }).join('')+'</tbody></table>'
          : '<p style="font-size:12px;color:var(--ink-40);margin-top:6px">Nothing yet.</p>')+
      '</div>'+

      '<div class="mrow"><button class="btn ghost" onclick="closeModal()">Close</button></div>'+
      '<div class="msg" id="wlMsg"></div>';
  }

  async function load(){
    var w=await sb.from('client_wallet_ledger')
      .select('id,kind,amount,campaign_id,note,created_at')
      .eq('client_user_id',clientId).order('created_at',{ascending:false}).limit(50);
    var rows=w.data||[];
    var bal=rows.reduce(function(a,r){return a+num(r.amount);},0);
    return {bal:Math.round(bal*100)/100, rows:rows};
  }

  var d=await load();
  openModal(body(d.bal,d.rows), function(){ wire(); });

  function wire(){
    var msg=$('#wlMsg');
    function say(t,cls){ msg.className='msg '+(cls||''); msg.textContent=t; }

    async function refresh(){
      /* Re-read campaigns as well: allocation changes budget, and the
         returnable column is derived from it. */
      var c=await sb.from('campaigns')
        .select('id,title,status,client_user_id,budget,budget_used,platform_fee_percent,platform_fee_amount,currency,fx_rate_per_usd')
        .order('title');
      CLI.camps=c.data||[];
      mine=CLI.camps.filter(function(x){return x.client_user_id===clientId;});
      var d2=await load();
      CLI.bal=CLI.bal||{}; CLI.bal[clientId]=d2.bal;
      closeModal();
      openModal(body(d2.bal,d2.rows), function(){ wire(); });
    }

    var add=$('#wlAdd');
    if(add)add.onclick=async function(){
      var amt=parseFloat($('#wlAmt').value);
      if(!(amt>0))return say('Enter an amount greater than zero.','err');
      add.disabled=true;say('Adding…');
      try{
        var r=await sb.rpc('admin_credit_client',{p_client:clientId,p_amount:amt,p_note:$('#wlNote').value.trim()||null});
        if(r.error)throw new Error(r.error.message);
        await refresh();
      }catch(e){say(e.message,'err');add.disabled=false;}
    };

    $$('[data-alloc]').forEach(function(b){
      b.onclick=async function(){
        var id=b.dataset.alloc, amt=parseFloat(($('#wlA-'+id)||{value:''}).value);
        if(!(amt>0))return say('Enter an amount to allocate.','err');
        b.disabled=true;say('Allocating…');
        try{
          var r=await sb.rpc('admin_allocate_budget',{p_campaign:id,p_amount:amt,p_note:null});
          if(r.error)throw new Error(r.error.message);
          await refresh();
        }catch(e){say(e.message,'err');b.disabled=false;}
      };
    });

    $$('[data-dealloc]').forEach(function(b){
      b.onclick=async function(){
        var id=b.dataset.dealloc, amt=parseFloat(($('#wlA-'+id)||{value:''}).value);
        if(!(amt>0))return say('Enter an amount to return.','err');
        b.disabled=true;say('Returning…');
        try{
          var r=await sb.rpc('admin_deallocate_budget',{p_campaign:id,p_amount:amt,p_note:null});
          if(r.error)throw new Error(r.error.message);
          await refresh();
        }catch(e){say(e.message,'err');b.disabled=false;}
      };
    });
  }
}

function clientModal(){
  openModal(
    '<div class="eyeb">New client</div><h3>Create a client login</h3>'+
    '<p class="m-sub">You set the password and pass it on — there is no signup and no invite email. If the email already has a Clipency account, it keeps its clipper access and gains the client dashboard; the password you set here becomes the password for both.</p>'+
    '<div style="margin-top:18px">'+
      '<div style="margin-bottom:12px"><label style="display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px">Email *</label><input class="inp" id="ncEmail" type="email" placeholder="brand@company.com"></div>'+
      '<div style="margin-bottom:6px"><label style="display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px">Password *</label><input class="inp" id="ncPass" type="text" placeholder="at least 8 characters"></div>'+
      '<p style="font-size:11.5px;color:var(--ink-40);margin-bottom:12px">Shown as plain text on purpose — you have to read it out to them.</p>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+
        '<div style="margin-bottom:12px"><label style="display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px">Contact name</label><input class="inp" id="ncName" placeholder="Tal"></div>'+
        '<div style="margin-bottom:12px"><label style="display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px">Company</label><input class="inp" id="ncCo" placeholder="Tal\'s Pod"></div>'+
      '</div>'+
      '<label style="display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px">Campaigns they can see</label>'+
      '<div id="ncCamps" style="max-height:170px;overflow-y:auto;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;font-size:13px">'+
        (CLI.camps.length?CLI.camps.map(function(c){
          return '<label style="display:flex;align-items:center;gap:9px;padding:5px 0;'+(c.client_user_id?'opacity:.45':'cursor:pointer')+'">'+
            '<input type="checkbox" value="'+esc(c.id)+'"'+(c.client_user_id?' disabled':'')+'>'+
            '<span style="flex:1">'+esc(c.title)+'</span>'+
            '<span style="font-size:10.5px;color:var(--ink-40)">'+(c.client_user_id?'already assigned':esc(c.status||''))+'</span></label>';
        }).join(''):'No campaigns exist yet.')+
      '</div>'+
    '</div>'+
    '<div class="mrow"><button class="btn ok" id="ncSave">Create client</button>'+
      '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
    '<div class="msg" id="ncMsg"></div>',
  function(){
    $('#ncSave').onclick=async function(){
      var msg=$('#ncMsg'), btn=this;
      var email=$('#ncEmail').value.trim(), pass=$('#ncPass').value;
      var fail=function(t){msg.className='msg err';msg.textContent=t;btn.disabled=false;btn.textContent='Create client';};
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email))return fail('Enter a valid email address.');
      if(pass.length<8)return fail('Password must be at least 8 characters.');
      btn.disabled=true;btn.textContent='Creating…';msg.className='msg';msg.textContent='';
      try{
        var ids=$$('#ncCamps input:checked').map(function(i){return i.value;});
        var r=await sb.functions.invoke('admin-create-client',{body:{
          email:email,password:pass,
          full_name:$('#ncName').value.trim(),
          company_name:$('#ncCo').value.trim(),
          campaign_ids:ids}});
        if(r.error){
          var m=''; try{m=(await r.error.context.json()).error||'';}catch(e){}
          throw new Error(m||r.error.message||'Could not create the client.');
        }
        var d=r.data||{};
        msg.className='msg ok';
        var line=(d.reused_existing?'Client access granted':'Client created')+' · '+
                 (d.campaigns_linked||0)+' campaign'+(d.campaigns_linked===1?'':'s')+' linked';
        /* One email is one account. If this address already belonged to a
           clipper, the password just set is now their password for BOTH
           dashboards — say so, or you will hand out a password that silently
           changed someone's clipper login. */
        if(d.reused_existing){
          line+=' — this email already had a'+(d.prior_role==='clipper'?' clipper':'n')+
                ' account, so the new password now applies to both dashboards.';
        }
        msg.textContent=line;
        setTimeout(function(){closeModal();render(true);},d.reused_existing?3200:900);
      }catch(e){fail(e.message);}
    };
  });
}

/* Which campaigns can THIS client see. A campaign may be on several client
   dashboards, so nothing is greyed out any more — the old modal disabled every
   campaign that already belonged to someone, which made sharing impossible. */
function clientCampaignsModal(userId,email){
  openModal(
    '<div class="eyeb">Campaign access</div><h3>'+esc(email||'Client')+'</h3>'+
    '<p class="m-sub">Ticked campaigns appear on this client\'s dashboard. A campaign can be shared with several clients — the owner is the one whose wallet funds it, everyone else sees it read-only.</p>'+
    '<div id="ccList" style="max-height:320px;overflow-y:auto;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;margin-top:16px;font-size:13px">'+
      (CLI.camps.length?CLI.camps.map(function(c){
        var on=isLinked(c.id,userId);
        var owner=ownerOf(c.id);
        var others=clientsOn(c.id).filter(function(l){return l.client_user_id!==userId;});
        var note = owner===userId ? 'owner · funds it'
                 : others.length  ? 'shared with '+others.length+' other'+(others.length===1?'':'s')
                 : esc(c.status||'');
        return '<label style="display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer">'+
          '<input type="checkbox" value="'+esc(c.id)+'"'+(on?' checked':'')+'>'+
          '<span style="flex:1">'+esc(c.title)+'</span>'+
          '<span style="font-size:10.5px;color:'+(owner===userId?'var(--gold)':'var(--ink-40)')+'">'+note+'</span></label>';
      }).join(''):'No campaigns exist yet.')+
    '</div>'+
    '<div class="mrow"><button class="btn ok" id="ccSave">Save access</button>'+
      '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
    '<div class="msg" id="ccMsg"></div>',
  function(){
    $('#ccSave').onclick=async function(){
      var msg=$('#ccMsg'), btn=this;
      btn.disabled=true;btn.textContent='Saving…';msg.className='msg';msg.textContent='';
      try{
        /* One call with the full list, rather than a loop of per-campaign
           writes. The old loop could half-apply and leave the sheet in a state
           that matched neither what you saw nor what you wanted. */
        var ids=$$('#ccList input:checked').map(function(i){return i.value;});
        var r=await sb.rpc('admin_set_client_campaigns',{p_client:userId,p_campaigns:ids});
        if(r.error)throw new Error(r.error.message);
        var d=r.data||{};
        msg.className='msg ok';
        msg.textContent=(d.added||0)+' added · '+(d.removed||0)+' removed · '+(d.linked||0)+' campaign'+(d.linked===1?'':'s')+' visible';
        setTimeout(function(){closeModal();render(true);},900);
      }catch(e){msg.className='msg err';msg.textContent=e.message;btn.disabled=false;btn.textContent='Save access';}
    };
  });
}

/* The other direction: which clients can see THIS campaign. */
function campaignClientsModal(campId,title){
  var owner=ownerOf(campId);
  openModal(
    '<div class="eyeb">Client access</div><h3>'+esc(title||'Campaign')+'</h3>'+
    '<p class="m-sub">Ticked clients see this campaign on their dashboard. Pick one owner — their wallet funds it and only they can allocate or pull budget back. Everyone else sees it read-only.</p>'+
    '<div id="qcList" style="max-height:320px;overflow-y:auto;border:1px solid var(--hair);border-radius:10px;padding:10px 12px;margin-top:16px;font-size:13px">'+
      (CLI.rows.length?CLI.rows.map(function(c){
        var on=isLinked(campId,c.id);
        return '<label style="display:flex;align-items:center;gap:9px;padding:6px 0;cursor:pointer">'+
          '<input type="checkbox" class="qc-on" value="'+esc(c.id)+'"'+(on?' checked':'')+'>'+
          '<span style="flex:1">'+esc(c.company_name||c.full_name||c.email||'Client')+
            '<span style="color:var(--ink-40);font-size:11px"> · '+esc(c.email||'')+'</span></span>'+
          '<label style="display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink-40);cursor:pointer">'+
            '<input type="radio" name="qcOwner" class="qc-own" value="'+esc(c.id)+'"'+(owner===c.id?' checked':'')+'> owner</label>'+
        '</label>';
      }).join(''):'No client accounts yet.')+
    '</div>'+
    '<div class="mrow"><button class="btn ok" id="qcSave">Save access</button>'+
      '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
    '<div class="msg" id="qcMsg"></div>',
  function(){
    /* Marking someone owner implies they can see it, so tick them too. */
    $$('#qcList .qc-own').forEach(function(r){
      r.onchange=function(){
        var box=$$('#qcList .qc-on').find(function(b){return b.value===r.value;});
        if(box) box.checked=true;
      };
    });
    $('#qcSave').onclick=async function(){
      var msg=$('#qcMsg'), btn=this;
      btn.disabled=true;btn.textContent='Saving…';msg.className='msg';msg.textContent='';
      try{
        var ids=$$('#qcList .qc-on:checked').map(function(i){return i.value;});
        var own=$$('#qcList .qc-own:checked').map(function(i){return i.value;})[0]||null;
        if(own&&ids.indexOf(own)<0) ids.push(own);
        var r=await sb.rpc('admin_set_campaign_clients',
          {p_campaign_id:campId,p_clients:ids,p_owner:own});
        if(r.error)throw new Error(r.error.message);
        var d=r.data||{};
        msg.className='msg ok';
        msg.textContent=(d.linked||0)+' client'+(d.linked===1?'':'s')+' can see this'+(d.owner?' · owner set':' · no owner, nobody can fund it');
        setTimeout(function(){closeModal();render(true);},900);
      }catch(e){msg.className='msg err';msg.textContent=e.message;btn.disabled=false;btn.textContent='Save access';}
    };
  });
}


/* ============================================================
   PAYOUTS
   Withdrawal requests. Marking paid goes through
   admin_process_payout(p_id, p_ref) so the staff check and the
   status transition stay in the database.
   ============================================================ */
var PO={rows:[], methods:[], tab:'pending', q:''};

RENDERERS.payouts=async function(force){
  if(force||!PO.rows.length){
    var r=await sb.from('payout_requests')
      .select('id,user_id,email,display_name,amount,currency,status,admin_note,transaction_reference,requested_at,paid_at,payment_method_snapshot')
      .order('requested_at',{ascending:false}).limit(400);
    if(r.error)throw new Error(r.error.message);
    PO.rows=r.data||[];
    var m=await sb.from('user_payment_methods').select('user_id,method_type,upi_id,paypal_email,bank_account,extra_details,is_primary');
    PO.methods=m.data||[];
  }
  var all=PO.rows;
  COUNTS.payouts=all.filter(function(p){return p.status==='pending';}).length;

  var f=all.filter(function(p){
    if(PO.tab!=='all'&&p.status!==PO.tab)return false;
    if(PO.q){var q=PO.q.toLowerCase();
      if(!((p.email||'').toLowerCase().indexOf(q)>-1||(p.display_name||'').toLowerCase().indexOf(q)>-1))return false;}
    return true;
  });
  var n=function(st){return all.filter(function(p){return st==='all'||p.status===st;}).length;};
  var pendingSum=all.filter(function(p){return p.status==='pending';}).reduce(function(a,p){return a+num(p.amount);},0);
  var paidSum=all.filter(function(p){return p.status==='paid';}).reduce(function(a,p){return a+num(p.amount);},0);
  var shown=f.reduce(function(a,p){return a+num(p.amount);},0);

  var methodFor=function(uid,snap){
    if(snap){try{var o=typeof snap==='string'?JSON.parse(snap):snap;
      if(o&&(o.detail||o.type))return (o.type||'')+(o.detail?' · '+o.detail:'');}catch(e){}}
    var m=PO.methods.filter(function(x){return x.user_id===uid;});
    var p=m.filter(function(x){return x.is_primary;})[0]||m[0];
    if(!p)return null;
    var t=String(p.method_type||'').toLowerCase();
    var d=p.upi_id||p.paypal_email||p.bank_account||p.extra_details||'';
    return (t==='upi'?'UPI':t==='paypal'?'PayPal':t==='crypto'?'Crypto':p.method_type)+(d?' · '+d:'');
  };

  return '<div class="head"><div class="eyeb">Payout Control</div><h1>Withdrawals.</h1>'+
    '<p class="sub">Process clipper withdrawal requests. Mark as paid once the transfer has actually gone out.</p></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><span class="lab">Pending</span><div class="big" style="color:'+(pendingSum?'var(--warn)':'var(--ink-2)')+'">'+money(pendingSum)+'</div><div class="sub-t">'+fmt(n('pending'))+' request'+(n('pending')===1?'':'s')+'</div></div>'+
      '<div class="kpi"><span class="lab">Paid out</span><div class="big">'+money(paidSum)+'</div><div class="sub-t">'+fmt(n('paid'))+' transfers</div></div>'+
      '<div class="kpi"><span class="lab">In view</span><div class="big">'+money(shown)+'</div><div class="sub-t">'+fmt(f.length)+' rows</div></div>'+
      '<div class="kpi"><span class="lab">Rejected</span><div class="big">'+fmt(n('rejected'))+'</div><div class="sub-t">declined requests</div></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="ch"><div class="seg" id="poTabs">'+
        ['pending','paid','rejected','all'].map(function(t){
          return '<button class="'+(PO.tab===t?'on':'')+'" data-t="'+t+'">'+t.charAt(0).toUpperCase()+t.slice(1)+

  $$('[data-po]').forEach(function(b){b.onclick=function(){payoutModal(b.dataset.po);};});
};

function payoutModal(id){
  var p=PO.rows.filter(function(x){return String(x.id)===String(id);})[0];
  if(!p)return;
  openModal(
    '<div class="eyeb">Confirm payout</div><h3>'+money(p.amount)+' to '+esc(p.display_name||p.email||'clipper')+'</h3>'+
    '<p class="m-sub">Only mark this paid once the money has actually left your account. It is recorded as a completed transfer.</p>'+
    '<div style="margin-top:18px">'+
      '<label style="display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px">Transaction reference</label>'+
      '<input class="inp" id="poRef" placeholder="UTR / transaction id (optional)">'+
      '<p style="font-size:11.5px;color:var(--ink-40);margin-top:7px">Stored against the request so you can reconcile it later.</p>'+
    '</div>'+
    '<div class="mrow"><button class="btn ok" id="poGo">Mark as paid</button>'+
      '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
    '<div class="msg" id="poMsg"></div>',
  function(){
    $('#poGo').onclick=async function(){
      var msg=$('#poMsg'), btn=this;
      btn.disabled=true;btn.textContent='Processing…';msg.className='msg';msg.textContent='';
      try{
        var r=await sb.rpc('admin_process_payout',{p_id:id,p_ref:$('#poRef').value.trim()||null});
        if(r.error)throw new Error(r.error.message);
        msg.className='msg ok';msg.textContent='Marked paid.';
        setTimeout(function(){closeModal();render(true);},600);
      }catch(e){msg.className='msg err';msg.textContent=e.message;btn.disabled=false;btn.textContent='Mark as paid';}
    };
  });
}

      tile('Accounts to verify', fmt(d.accounts_pending_verification), 'handles waiting', '#accounts', num(d.accounts_pending_verification)>0)+
      tile('Active campaigns', fmt(d.active_campaigns), 'of '+fmt(d.total_campaigns)+' total', '#campaigns')+
    '</div>'+

    '<div class="kpis">'+
      tile('Clippers', fmt(d.total_clippers), 'registered', '#users')+
      tile('Views delivered', fmtK(d.total_approved_views), 'from approved clips', '#reviews')+
      tile('Earnings accrued', money(d.total_earnings_accrued), money(d.payouts_paid_amount)+' paid out', '#payouts')+
      tile('Online now', fmt(d.sessions_active_now), fmt(d.logins_last_24h)+' logins in 24h', '#logs')+
    '</div>'+

    '<div class="card"><div class="ch"><div><h2>Last 14 days</h2>'+

      (days.length
       ? '<div style="display:flex;align-items:flex-end;gap:5px;height:110px;margin-bottom:10px">'+
         days.map(function(x){
           var h=Math.round(num(x.submissions)/max*100);
           return '<div style="flex:1;display:flex;flex-direction:column;justify-content:flex-end;height:100%" title="'+
             esc(String(x.day).slice(5))+' · '+fmt(x.submissions)+' submitted, '+fmt(x.approvals)+' approved">'+
             '<div style="background:var(--gold);border-radius:3px 3px 0 0;height:'+Math.max(h,2)+'%;'+
             'transition:height .5s var(--ease)"></div></div>';}).join('')+'</div>'+
         '<div style="display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--ink-40)">'+
           '<span>'+esc(String(days[0].day).slice(5))+'</span><span>'+esc(String(days[days.length-1].day).slice(5))+'</span></div>'+
         '<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px;padding-top:16px;border-top:1px solid var(--hair)">'+
           [['Submitted','submissions'],['Approved','approvals'],['Rejected','rejections'],['Views','views_submitted']].map(function(p){
             var t=days.reduce(function(a,x){return a+num(x[p[1]]);},0);

    '</div>';
};

var US={rows:[], admins:[], reviewers:[], q:'', role:''};

RENDERERS.users=async function(force){
  if(force||!US.rows.length){
    var p=await sb.from('profiles').select('id,email,full_name,username,role,company_name,country,created_at')
      .order('created_at',{ascending:false}).limit(1000);
    if(p.error)throw new Error(p.error.message);
    US.rows=p.data||[];
    var a=await sb.from('admin_users').select('email'); US.admins=(a.data||[]).map(function(x){return String(x.email||'').toLowerCase();});
    var r=await sb.from('reviewer_users').select('email,user_id'); US.reviewers=r.data||[];
  }
  var all=US.rows;
  var isRev=function(u){return US.reviewers.some(function(x){return x.user_id===u.id||String(x.email||'').toLowerCase()===String(u.email||'').toLowerCase();});};
  var isAdm=function(u){return US.admins.indexOf(String(u.email||'').toLowerCase())>-1;};
  var f=all.filter(function(u){

    if(US.role==='reviewer'&&!isRev(u))return false;

    if(US.q){var q=US.q.toLowerCase();
      if(!((u.email||'').toLowerCase().indexOf(q)>-1||(u.full_name||'').toLowerCase().indexOf(q)>-1))return false;}
    return true;
  });
  var byRole={};
  all.forEach(function(u){var r=u.role||'·';byRole[r]=(byRole[r]||0)+1;});

      '<div class="kpi"><span class="lab">Clients</span><div class="big">'+fmt(byRole.client||0)+'</div><div class="sub-t">campaign dashboards</div></div>'+
      '<div class="kpi"><span class="lab">Staff</span><div class="big">'+fmt(US.admins.length+US.reviewers.length)+'</div><div class="sub-t">'+fmt(US.admins.length)+' admin · '+fmt(US.reviewers.length)+' reviewer</div></div>'+
    '</div>'+
    '<div class="card"><div class="ch"><div><h2>All users</h2><div class="cs">'+fmt(f.length)+' shown</div></div></div>'+
      '<div style="display:grid;grid-template-columns:1fr 170px;gap:10px;margin-bottom:16px">'+
        '<input class="inp" id="usQ" placeholder="Search name or email…" value="'+esc(US.q)+'">'+
        '<select class="inp" id="usRole"><option value="">All roles</option>'+
          ['clipper','client','admin','reviewer'].map(function(r){return '<option'+(US.role===r?' selected':'')+'>'+r+'</option>';}).join('')+'</select>'+
      '</div>'+
      (f.length
       ? '<table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Country</th><th>Joined</th></tr></thead><tbody>'+
         f.slice(0,200).map(function(u){
           var badges=(isAdm(u)?'<span class="chip ok">admin</span> ':'')+(isRev(u)?'<span class="chip ok">reviewer</span> ':'');
           return '<tr>'+
             '<td><b>'+esc(u.full_name||u.username||'·')+'</b></td>'+
             '<td class="mono">'+esc(u.email||'·')+'</td>'+
             '<td>'+badges+'<span class="chip">'+esc(u.role||'·')+'</span></td>'+
             '<td>'+esc(u.country||'·')+'</td>'+
             '<td class="mono">'+day(u.created_at)+'</td>'+

         (f.length>200?'<div style="font-size:12px;color:var(--ink-40);margin-top:12px">Showing the first 200 of '+fmt(f.length)+'.</div>':'')

var PR={rows:[], open:null, tab:'draft'};

             '<td style="white-space:nowrap"><button class="btn sm ghost" data-prview="'+p.id+'">'+(open?'Hide':'Preview')+'</button></td>'+
           '</tr>'+
           (open?'<tr><td colspan="5" style="padding:0 16px 18px">'+
             '<iframe sandbox="" title="Email preview" style="width:100%;height:520px;border:1px solid var(--hair-2);border-radius:10px;background:#fff" srcdoc="'+esc(p.html.replace(/\{first_name\}/g,'there'))+'"></iframe>'+
             '<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center">'+
               '<button class="btn sm ghost" data-prtest="'+p.id+'">Send me a test</button>'+

  $$('[data-prtest]').forEach(function(b){b.onclick=async function(){

  $$('[data-prno]').forEach(function(b){b.onclick=async function(){

/* ============================================================
   APPLICATIONS
   The gate for private campaigns. Approving is what makes a
   private campaign visible to that clipper at all — the RLS
   policy on `campaigns` keys off exactly this table — so this
   page is the whole gate, not a formality in front of one.

   This lived in /auth/admin/admin-applications.js and was loaded
   by a <script src>. That file has to land on a path the deploy
   actually serves, and when it does not the tag 404s, the page
   never registers, and the queue silently does not exist — which
   is precisely what happened. Nothing else in this console is
   loaded that way. Now neither is this.
   ============================================================ */
  /* ---- page registration, right after Accounts ---- */
  if(!PAGES.some(function(p){return p.id==='applications';})){
    var at=PAGES.findIndex(function(p){return p.id==='accounts';});
    PAGES.splice(at<0?PAGES.length:at+1,0,
      {id:'applications',label:'Applications',ic:'⚿',staff:true});

  var toastEl=null;
  function toast(msg){
    if(!toastEl){toastEl=document.createElement('div');toastEl.className='t-toast';document.body.appendChild(toastEl);}
    toastEl.textContent=msg;
    toastEl.classList.remove('is-open'); void toastEl.offsetWidth;
    toastEl.classList.add('is-open');
    clearTimeout(toastEl._t);
    toastEl._t=setTimeout(function(){toastEl.classList.remove('is-open');},2800);
  }

  var AP={tab:'pending',rows:[],loaded:false,campaign:null,platform:null};

  function profileUrl(a){
    if(a.account_url)return a.account_url;
    var h=String(a.account_handle||a.account_username||'').replace(/^@/,'');
    if(!h)return null;
    var p=String(a.account_platform||'').toLowerCase();
    if(p==='instagram')return 'https://instagram.com/'+encodeURIComponent(h);
    if(p==='tiktok')return 'https://tiktok.com/@'+encodeURIComponent(h);

    return null;
  }

  RENDERERS.applications=async function(force){

      AP.loaded=true;
    }
    var count=function(set,t){
      return t==='all'?set.length:set.filter(function(x){return x.status===t;}).length;};

    /* Two different questions, so two different sets, named rather than
       implied. The sidebar badge asks "how much work is there in total",

    var all=AP.rows;
    var rows=AP.campaign
      ? all.filter(function(x){return String(x.campaign_id)===String(AP.campaign)&&
          (!AP.platform||String(x.account_platform||'').toLowerCase()===AP.platform);})

    COUNTS.applications=count(all,'pending');

    var list=AP.tab==='all'?rows:rows.filter(function(x){return x.status===AP.tab;});
    /* Oldest first in the pending queue — somebody has been waiting. */

    var card=function(a){

          '<div><div class="ap-h">'+(url
            ? '<a href="'+esc(url)+'" target="_blank" rel="noopener">@'+esc(String(h).replace(/^@/,''))+' ↗</a>'

            '<div class="ap-sub">'+esc(a.account_platform||'·')+' · '+

              (num(a.attempt)>1?' · <b>second attempt</b>':'')+'</div></div>'+
          '<div style="margin-left:12px"><div class="ap-h" style="font-size:13px">'+esc(a.campaign_title||'·')+'</div>'+
            '<div class="ap-sub">the campaign they want in on</div></div>'+

        '</div>'+
        '<div class="ap-rec">'+
          '<div><span class="k">Approved clips</span><span class="v">'+fmt(approved)+'</span></div>'+
          '<div><span class="k">Total views</span><span class="v">'+fmtK(a.past_total_views)+'</span></div>'+
          '<div><span class="k">Rejected</span><span class="v"'+(rejected>approved?' style="color:var(--danger)"':'')+'>'+fmt(rejected)+'</span></div>'+
          '<div><span class="k">Handle verified</span><span class="v" style="font-size:12.5px;padding-top:3px">'+

        (num(a.attempt)>1&&a.status==='pending'

    return '<span id="apPage" hidden></span>'+
      '<div class="head"><div class="eyeb">Private campaigns</div><h1>Who gets let in.</h1>'+
      '<p class="sub">Approving an application is what makes a private campaign visible to that clipper, and it binds them to the one account they applied with — clips from any other account are refused. A rejection needs a reason, because they read it.</p></div>'+
      '<div class="kpis">'+
        '<div class="kpi"><span class="lab">Waiting</span><div class="big"'+(n('pending')?' style="color:var(--warn)"':'')+'>'+fmt(n('pending'))+'</div><div class="sub-t">need a decision</div></div>'+
        '<div class="kpi"><span class="lab">Approved</span><div class="big">'+fmt(n('approved'))+'</div><div class="sub-t">clippers on private work</div></div>'+
        '<div class="kpi"><span class="lab">Rejected</span><div class="big">'+fmt(n('rejected'))+'</div><div class="sub-t">turned down</div></div>'+
        '<div class="kpi"><span class="lab">Second attempts</span><div class="big">'+

          '</div><div class="sub-t">final call pending</div></div>'+
      '</div>'+
      '<div class="card">'+
        (AP.campaign?'<div class="ch" style="border:0;padding-bottom:0"><div style="font-size:12.5px;color:var(--ink-70)">'+

           '<button class="btn sm ghost" id="apAll" style="margin-left:8px">Show every campaign</button></div></div>':'')+
        '<div class="ch"><div class="seg" id="apTabs">'+

        '</div></div>'+
        (list.length
          ? '<div id="apList" class="t-stagger">'+list.slice(0,200).map(card).join('')+'</div>'
          : '<div class="empty"><div class="ei">⚿</div><b>Nothing waiting</b>'+
            '<p>No applications with this status. Private campaigns only generate one when a clipper asks to join.</p></div>')+
      '</div>';
  };

  RENDERERS.applications.after=function(){
    var l=$('#apList');
    if(l)requestAnimationFrame(function(){l.classList.add('is-shown');});

    $$('#apTabs button').forEach(function(b){
      b.onclick=function(){AP.tab=b.dataset.t;render();};});

    $$('[data-apok]').forEach(function(b){b.onclick=async function(){
      b.disabled=true;b.textContent='…';
      try{
        var r=await sb.rpc('admin_review_application',{p_id:b.dataset.apok,p_approve:true});

        toast('✓ Approved — the campaign is now visible to them');

    };});

    $$('[data-apno]').forEach(function(b){b.onclick=function(){
      var id=b.dataset.apno;
      openModal(
        '<div class="eyeb">Private campaign</div><h3>Turn this application down</h3>'+
        '<p class="sub" style="margin-top:8px">The clipper sees this sentence on their dashboard, so write the actual reason. '+
        'If this is their second attempt it is the last thing they hear about this campaign.</p>'+
        '<div style="margin-top:14px"><textarea class="inp" id="apReason" rows="3" '+

          'placeholder="e.g. Your recent clips average under 500 views — build the account up and apply again."></textarea></div>'+
        '<div class="mrow"><button class="btn danger" id="apRejGo">Reject</button>'+
          '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
        '<div class="msg" id="apRejMsg"></div>',
      function(){

        ta.focus();
        go.onclick=async function(){

        };
      });
    };});

/* ============================================================
   CREATORS
   Four screens, each its own URL so Back works and any of them
   opens in a new tab:
     #creators                     every creator, with filters
     #creators?view=campaign&c=ID  creators in one campaign, with
                                   the accounts they use there
     #creators?view=new            signed up, never joined a campaign
     #creators?u=ID                one creator's profile
   On a profile: connect an account by username (verified now, no
   bio code), optionally straight into a campaign with the
   application bypassed, submit clips in bulk, decide applications.

   Bulk clips are ordinary pending submissions, so every rule a
   creator's own submission meets still applies. With client review
   on they land in the brand's Review to approve or reject.
   Admin only; every RPC checks cx_is_admin().
   ============================================================ */
var CR={ov:null,
        all:{q:'',plat:'',seg:'all',sort:'newest',off:0},
        camp:{q:'',plat:'',access:'all',sort:'clips',off:0},
        fresh:{q:'',plat:'',days:'7',off:0},
        list:null,listKey:'',lastList:'',
        user:null,detail:null,
        plat:'youtube',handle:'',linkCamp:'',bypass:true,
        acct:'',bcamp:'',urls:'',last:null,focus:null};
var CR_PAGE=50;

function crParams(){
  var h=(location.hash||'').split('?')[1]||'', o={};
  h.split('&').forEach(function(kv){if(!kv)return;var i=kv.indexOf('=');
    o[decodeURIComponent(i<0?kv:kv.slice(0,i))]=decodeURIComponent(i<0?'':kv.slice(i+1));});
  return o;
}
function crHref(o){
  var qs=Object.keys(o||{}).filter(function(k){return o[k]!==''&&o[k]!=null;})
    .map(function(k){return encodeURIComponent(k)+'='+encodeURIComponent(o[k]);}).join('&');
  return '#creators'+(qs?'?'+qs:'');
}
function crUrl(p,h){
  h=String(h||'').replace(/^@/,'');
  if(!h)return null;
  p=String(p||'').toLowerCase();
  if(p==='instagram')return 'https://instagram.com/'+encodeURIComponent(h);
  if(p==='tiktok')return 'https://tiktok.com/@'+encodeURIComponent(h);

}
/* While a list loads the old screen stays up, so if someone kept typing the
   box holds more than the filter that was sent. Keep what they typed. */
function crLiveQ(f,scr){
  var el=document.getElementById('crQ');
  return el&&el.dataset.scr===scr?el.value:f.q;
}
function crLines(t){
  return String(t||'').split(/[\s,]+/).map(function(x){return x.trim();}).filter(Boolean);
}
function crPlats(r){
  var b=[];
  if(num(r.ig))b.push('IG '+fmt(r.ig));
  if(num(r.yt))b.push('YT '+fmt(r.yt));
  if(num(r.tt))b.push('TT '+fmt(r.tt));
  return b.length?b.join(' · '):'<span style="color:var(--ink-25)">none</span>';
}
function crSel(id,val,opts,style){
  return '<select class="inp" id="'+id+'" style="width:auto;'+(style||'')+'">'+opts.map(function(o){
    return '<option value="'+esc(o[0])+'"'+(String(o[0])===String(val)?' selected':'')+'>'+esc(o[1])+'</option>';}).join('')+'</select>';
}
var CR_PLAT_OPTS=[['','Any platform'],['instagram','Has Instagram'],['youtube','Has YouTube'],['tiktok','Has TikTok']];
function crAccessChip(s){
  if(!s)return '';
  return '<span class="chip '+(s==='approved'?'ok':s==='rejected'?'no':'wait')+'">'+esc(s)+'</span>';
}
function crPager(total,off){
  if(total<=CR_PAGE)return '<div class="cs" style="margin-top:12px">'+fmt(total)+' '+(total===1?'creator':'creators')+'</div>';
  return '<div style="display:flex;align-items:center;gap:10px;margin-top:14px">'+
    '<span class="cs">'+fmt(off+1)+'–'+fmt(Math.min(off+CR_PAGE,total))+' of '+fmt(total)+'</span>'+
    '<button class="btn sm ghost" id="crPrev"'+(off>0?'':' disabled')+'>← Prev</button>'+
    '<button class="btn sm ghost" id="crNext"'+(off+CR_PAGE<total?'':' disabled')+'>Next →</button></div>';

async function crLoad(){
  var r=await sb.rpc('admin_creator_detail',{p_user:CR.user});
  if(r.error)throw new Error(r.error.message);
  CR.detail=r.data||null;
  var d=CR.detail||{};
  var ok=(d.accounts||[]).filter(function(a){return a.status==='verified';});
  if(!ok.some(function(a){return String(a.id)===String(CR.acct);}))CR.acct=ok.length?String(ok[0].id):'';
  if(!(d.campaigns||[]).some(function(c){return String(c.id)===String(CR.bcamp);}))
    CR.bcamp=(d.campaigns||[]).length?String(d.campaigns[0].id):'';
  if(CR.linkCamp&&!(d.campaigns||[]).some(function(c){return String(c.id)===String(CR.linkCamp);}))CR.linkCamp='';
}

            ? '<button class="btn sm ok" data-crapok="'+esc(a.id)+'">Approve</button> '+
              '<button class="btn sm danger" data-crapno="'+esc(a.id)+'">Reject</button>'
            : '')+'</td></tr>';}).join('')+'</tbody></table>'
    : '<div class="empty" style="padding:22px 10px"><b>No applications</b><p>They only exist for private campaigns.</p></div>';

  var clipRows=clips.length
    ? '<table><thead><tr><th>Campaign</th><th>Account</th><th>Clip</th><th>Status</th><th>Views</th><th>Sent</th></tr></thead><tbody>'+
      clips.slice(0,50).map(function(s){

          '<td class="mono">'+(s.clip_url?'<a href="'+esc(s.clip_url)+'" target="_blank" rel="noopener">Open ↗</a>':'·')+'</td>'+
          '<td><span class="chip '+(s.status==='approved'?'ok':s.status==='rejected'?'no':'wait')+'">'+esc(st)+'</span></td>'+
          '<td class="mono">'+fmtK(s.views)+'</td>'+
          '<td class="mono">'+day(s.created_at)+'</td></tr>';}).join('')+'</tbody></table>'
    : '<div class="empty" style="padding:22px 10px"><b>No clips yet</b></div>';

  return '<span id="crPage" data-scr="profile" hidden></span>'+back+head+kpis+joinedCard+
    '<div class="card"><div class="ch"><div><h2>Connected accounts</h2>'+
      '<div class="cs">Connecting here verifies the account straight away, no bio code. Only do it for accounts you know are theirs.</div></div></div>'+
      acctRows+addForm+'</div>'+
    '<div class="card"><div class="ch"><div><h2>Submit clips in bulk</h2>'+
      '<div class="cs">Paste the links to their posts. Each one is checked on its own, so a bad link never blocks the rest.</div></div></div>'+
      bulk+'</div>'+
    '<div class="card"><div class="ch"><div><h2>Applications</h2>'+
      '<div class="cs">Approving lets this account see and submit to that private campaign.</div></div></div>'+appRows+'</div>'+

RENDERERS.creators=async function(force){
  var P=crParams();
  if(P.u)return crProfileScreen(force,P.u);
  var view=P.view==='campaign'?'campaign':P.view==='new'?'new':'all';
  CR.lastList=location.hash||'#creators';
  var ov=await crOverview(force);
  var body=view==='campaign'?await crCampaignScreen(force,P.c||'')
          :view==='new'?await crNewScreen(force,P.days||'')
          :await crAllScreen(force);
  return '<span id="crPage" data-scr="'+view+'" hidden></span>'+
    crHead('Browse every creator, see who is in each campaign and who just signed up. Open a creator to connect their accounts, put them in a campaign and submit clips for them.')+
    crKpis(ov,view)+crTabs(view)+body;
};

RENDERERS.creators.after=function(){
  var scrEl=$('#crPage'), scr=scrEl?scrEl.dataset.scr:'all';
  var F=scr==='campaign'?CR.camp:scr==='new'?CR.fresh:CR.all;

  /* ---- list screens ---- */
  var q=$('#crQ');
  if(q){
    if(CR.focus==='q'){q.focus();var L=q.value.length;try{q.setSelectionRange(L,L);}catch(e){}}
    var t;
    q.oninput=function(){clearTimeout(t);var v=q.value;
      t=setTimeout(function(){F.q=v.trim().length>=2?v:'';F.off=0;CR.focus='q';
        if(v.trim().length===1)return; render();},300);};
  }
  var bindSel=function(id,key){var el=$(id);if(el)el.onchange=function(){F[key]=el.value;F.off=0;CR.focus=null;render();};};
  bindSel('#crPlatF','plat'); bindSel('#crSeg','seg'); bindSel('#crSort','sort'); bindSel('#crAccess','access');
  var dz=$('#crDays'); if(dz)dz.onchange=function(){location.hash=crHref({view:'new',days:dz.value});};
  var cp=$('#crCampPick'); if(cp)cp.onchange=function(){location.hash=crHref({view:'campaign',c:cp.value});};
  var pv=$('#crPrev'); if(pv)pv.onclick=function(){F.off=Math.max(0,F.off-CR_PAGE);CR.focus=null;render();};
  var nx=$('#crNext'); if(nx)nx.onclick=function(){F.off=F.off+CR_PAGE;CR.focus=null;render();};
  $$('[data-crrow]').forEach(function(tr){tr.onclick=function(e){
    if(e.target.closest('a,button,select,input'))return;
    location.hash=crHref({u:tr.dataset.crrow});};});

  /* ---- profile ---- */
  var pl=$('#crPlat'); if(pl)pl.onchange=function(){CR.plat=pl.value;};
  var hd=$('#crHandle'); if(hd)hd.oninput=function(){CR.handle=hd.value;};
  var lk=$('#crLinkCamp'); if(lk)lk.onchange=function(){CR.linkCamp=lk.value;CR.bypass=true;CR.focus=null;render();};
  var bp=$('#crBypass'); if(bp)bp.onchange=function(){CR.bypass=bp.checked;};
  var add=$('#crAdd');
  if(add)add.onclick=async function(){
    var msg=$('#crAddMsg'), h=(hd&&hd.value||'').trim();
    if(!h){msg.className='msg err';msg.textContent='Type their username.';return;}
    add.disabled=true;add.textContent='Connecting…';msg.className='msg';msg.textContent='';
    try{
      var r=await sb.rpc('admin_connect_account',{p_user:CR.user,p_platform:CR.plat,p_handle:h,
        p_campaign:CR.linkCamp||null,p_bypass:!!CR.bypass});
      if(r.error)throw new Error(r.error.message);
      var res=r.data||{};
      var what=res.result==='already'?'Already connected':res.result==='verified'?'Verified @'+res.handle:'Connected @'+res.handle;
      var acc=res.access==='approved'?', approved for the campaign':res.access==='pending'?', sent to Applications':res.access==='open'?', ready for the campaign':'';
      if(res.id)CR.acct=String(res.id);
      if(CR.linkCamp)CR.bcamp=CR.linkCamp;
      CR.handle=''; CR.focus=null; CR.ov=null;
      toast(what+acc);
      render(true);
    }catch(e){msg.className='msg err';msg.textContent=e.message||String(e);add.disabled=false;add.textContent='Connect';}
  };

  var ac=$('#crAcct'); if(ac)ac.onchange=function(){CR.acct=ac.value;CR.focus=null;render();};
  var bc=$('#crCamp'); if(bc)bc.onchange=function(){CR.bcamp=bc.value;CR.focus=null;render();};
  var ta=$('#crUrls'), send=$('#crSend');
  if(ta)ta.oninput=function(){
    CR.urls=ta.value;
    var n=crLines(ta.value).length;
    if(send){send.disabled=!n;send.textContent='Submit '+(n?fmt(n)+' ':'')+(n===1?'clip':'clips');}
  };
  var gr=$('#crGrant');
  if(gr)gr.onclick=async function(){
    gr.disabled=true;gr.textContent='Approving…';
    try{
      var r=await sb.rpc('admin_grant_campaign_access',{p_account:CR.acct,p_campaign:CR.bcamp});
      if(r.error)throw new Error(r.error.message);
      toast('Approved for this campaign'); CR.focus=null; CR.ov=null; render(true);
    }catch(e){toast(e.message||String(e));gr.disabled=false;gr.textContent='Approve this account for it';}
  };
  if(send)send.onclick=async function(){
    var urls=crLines(ta&&ta.value), msg=$('#crSendMsg');
    if(!urls.length)return;
    if(urls.length>100){msg.className='msg err';msg.textContent='Up to 100 links at a time. You pasted '+urls.length+'.';return;}
    send.disabled=true;send.textContent='Submitting…';msg.className='msg';msg.textContent='';
    try{
      var r=await sb.rpc('admin_bulk_submit_clips',{p_user:CR.user,p_account:CR.acct,p_campaign:CR.bcamp,p_urls:urls});
      if(r.error)throw new Error(r.error.message);
      CR.last=r.data||{submitted:0,failed:0,results:[]};
      /* keep only the refused links in the box, so they can be fixed and re-sent */
      CR.urls=(CR.last.results||[]).filter(function(x){return !x.ok;}).map(function(x){return x.url;}).join('\n');
      toast(fmt(CR.last.submitted)+' submitted'+(CR.last.failed?', '+fmt(CR.last.failed)+' refused':''));
      CR.focus=null; CR.ov=null; render(true);
    }catch(e){
      msg.className='msg err';msg.textContent=e.message||String(e);
      send.disabled=false;send.textContent='Submit '+fmt(urls.length)+' '+(urls.length===1?'clip':'clips');
    }
  };

  /* ---- applications: profile and campaign screens ---- */
  $$('[data-crapok]').forEach(function(b){b.onclick=async function(e){
    e.stopPropagation();
    b.disabled=true;b.textContent='…';
    try{
      var r=await sb.rpc('admin_review_application',{p_id:b.dataset.crapok,p_approve:true});
      if(r.error)throw new Error(r.error.message);
      toast('Approved: the campaign is now visible to them'); CR.focus=null; CR.ov=null; render(true);
    }catch(err){b.disabled=false;b.textContent='Approve';toast(err.message||String(err));}
  };});
  $$('[data-crapno]').forEach(function(b){b.onclick=function(e){
    e.stopPropagation();
    var id=b.dataset.crapno;
    openModal(
      '<div class="eyeb">Private campaign</div><h3>Turn this application down</h3>'+
      '<p class="sub" style="margin-top:8px">The creator sees this sentence on their dashboard, so write the actual reason.</p>'+
      '<div style="margin-top:14px"><textarea class="inp" id="crRej" rows="3" style="resize:vertical;font-family:inherit;line-height:1.6"></textarea></div>'+
      '<div class="mrow"><button class="btn danger" id="crRejGo">Reject</button>'+
        '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
      '<div class="msg" id="crRejMsg"></div>',
    function(){
      var ta2=$('#crRej'), go=$('#crRejGo'), m=$('#crRejMsg');
      ta2.focus();
      go.onclick=async function(){
        var reason=(ta2.value||'').trim();
        if(!reason){m.className='msg err';m.textContent='A rejection needs a reason. The creator sees it.';return;}
        go.disabled=true;go.textContent='Rejecting…';
        try{
          var r=await sb.rpc('admin_review_application',{p_id:id,p_approve:false,p_reason:reason});
          if(r.error)throw new Error(r.error.message);
          closeModal(); toast('Application rejected'); CR.focus=null; CR.ov=null; render(true);
        }catch(err){m.className='msg err';m.textContent=err.message||String(err);go.disabled=false;go.textContent='Reject';}
      };
    });
  };});
};

RENDERERS.analytics=async function(){
  var t=await sb.from('v_top_clippers').select('*').order('total_views',{ascending:false}).limit(15);
  var c=await sb.from('v_campaign_performance').select('*').order('total_views',{ascending:false}).limit(20);
  var rv=await sb.from('v_reviewer_throughput').select('*').order('total_reviewed',{ascending:false}).limit(10);
  var top=t.data||[], camps=c.data||[], revs=rv.data||[];

  var bar=function(v,max){
    var p=max?Math.max(2,Math.round(v/max*100)):0;
    return '<div style="height:4px;border-radius:2px;background:var(--hair);margin-top:5px">'+
      '<i style="display:block;height:100%;border-radius:2px;background:var(--gold);width:'+p+'%"></i></div>';
  };
  var maxV=Math.max.apply(null,top.map(function(x){return num(x.total_views);}).concat([1]));
  var maxC=Math.max.apply(null,camps.map(function(x){return num(x.total_views);}).concat([1]));

  return '<div class="head"><div class="eyeb">Analytics</div><h1>What is working.</h1>'+
    '<p class="sub">Top clippers, campaign performance and reviewer throughput.</p></div>'+

    '<div class="card"><div class="ch"><div><h2>Top clippers</h2><div class="cs">By views delivered</div></div></div>'+
      (top.length
       ? '<table><thead><tr><th>#</th><th>Clipper</th><th>Views</th><th>Approved</th><th>Earned</th><th>Campaigns</th></tr></thead><tbody>'+
         top.map(function(r,i){
           return '<tr><td class="mono">'+(i+1)+'</td>'+
             '<td><b>'+esc(r.name||'·')+'</b><div class="mono" style="font-size:10.5px;color:var(--ink-40)">'+esc(r.email||'')+'</div></td>'+
             '<td><b>'+fmtK(r.total_views)+'</b>'+bar(num(r.total_views),maxV)+'</td>'+
             '<td class="mono">'+fmt(r.approved_submissions)+' / '+fmt(r.total_submissions)+'</td>'+
             '<td class="mono">'+money(r.total_earnings)+'</td>'+
             '<td class="mono">'+fmt(r.campaigns_participated)+'</td></tr>';}).join('')+'</tbody></table>'
       : '<div class="empty"><div class="ei">↗</div><b>No clipper data yet</b><p>Rankings appear once clips are approved.</p></div>')+
    '</div>'+

    '<div class="card"><div class="ch"><div><h2>Campaign performance</h2><div class="cs">Views, approval rate and spend</div></div></div>'+
      (camps.length
       ? '<table><thead><tr><th>Campaign</th><th>Views</th><th>Clips</th><th>Approval</th><th>Clippers</th><th>Spend</th></tr></thead><tbody>'+
         camps.map(function(r){
           return '<tr><td><b>'+esc(r.title||'·')+'</b><div style="font-size:10.5px;color:var(--ink-40)">'+esc(r.status||'')+'</div></td>'+
             '<td><b>'+fmtK(r.total_views)+'</b>'+bar(num(r.total_views),maxC)+'</td>'+
             '<td class="mono">'+fmt(r.approved_submissions)+' / '+fmt(r.total_submissions)+'</td>'+
             '<td class="mono">'+(r.approval_rate_pct!=null?Math.round(num(r.approval_rate_pct))+'%':'·')+'</td>'+
             '<td class="mono">'+fmt(r.unique_clippers)+'</td>'+
             '<td class="mono">'+money(r.spent_usd)+'</td></tr>';}).join('')+'</tbody></table>'
       : '<div class="empty"><div class="ei">▶</div><b>No campaign data yet</b><p>Performance appears once clips land.</p></div>')+
    '</div>'+

    '<div class="card"><div class="ch"><div><h2>Reviewer throughput</h2><div class="cs">Who is clearing the queue</div></div></div>'+
      (revs.length
       ? '<table><thead><tr><th>Reviewer</th><th>Reviewed</th><th>Approved</th><th>Rejected</th><th>Avg time</th><th>Last</th></tr></thead><tbody>'+
         revs.map(function(r){
           return '<tr><td><b>'+esc(r.reviewer||'·')+'</b></td>'+
             '<td class="mono"><b>'+fmt(r.total_reviewed)+'</b></td>'+
             '<td class="mono">'+fmt(r.approved)+'</td>'+
             '<td class="mono">'+fmt(r.rejected)+'</td>'+
             '<td class="mono">'+(r.avg_review_time_hours!=null?Number(r.avg_review_time_hours).toFixed(1)+'h':'·')+'</td>'+
             '<td class="mono">'+ago(r.last_review_at)+'</td></tr>';}).join('')+'</tbody></table>'
       : '<div class="empty"><div class="ei">✓</div><b>No reviews recorded</b><p>Throughput appears once clips are reviewed.</p></div>')+
    '</div>';
};

function euTagClass(id){var h=0,s=String(id);for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return 't'+(h%EU_TAGS);}
function euCamp(id){return EU.camps.filter(function(c){return String(c.id)===String(id);})[0]||null;}
function euCreator(id){return EU.creators.filter(function(c){return String(c.id)===String(id);})[0]||null;}
function euPlat(url){
  var u=String(url||'').toLowerCase();
  if(/instagram\.com|instagr\.am/.test(u))return 'instagram';
  if(/tiktok\.com/.test(u))return 'tiktok';
  if(/youtube\.com|youtu\.be/.test(u))return 'youtube';
  return null;
}
function euValidUrl(u){return /^https?:\/\/[^\s]+\.[^\s]+/i.test(String(u||'').trim());}
function euUrl(t){t=String(t||'').trim(); return t&&!/^https?:\/\//i.test(t)?'https://'+t:t;}
/* One key per post however the link is written (www./m., tracking params, youtu.be vs
   /shorts, /reel vs /p, a username in the path). Null = not a single reel / Short / TikTok
   video, so profiles, playlists, search pages and random sites are refused. */
function euKey(raw){
  var u; try{u=new URL(euUrl(raw));}catch(e){return null;}
  var h=u.hostname.toLowerCase().replace(/^(www|m|mobile)\./,''), p=u.pathname.replace(/\/+$/,''), m;
  if(h==='instagram.com'||h==='instagr.am'){m=p.match(/^(?:\/[^\/]+)?\/(?:reels?|p|tv)\/([A-Za-z0-9_-]{5,})$/); return m?'ig:'+m[1]:null;}
  if(h==='youtu.be'){m=p.match(/^\/([A-Za-z0-9_-]{11})$/); return m?'yt:'+m[1]:null;}
  if(h==='youtube.com'){
    m=p.match(/^\/(?:shorts|live|embed)\/([A-Za-z0-9_-]{11})$/); if(m)return 'yt:'+m[1];
    var v=p==='/watch'?u.searchParams.get('v'):''; return /^[A-Za-z0-9_-]{11}$/.test(v||'')?'yt:'+v:null;
  }
  if(h==='tiktok.com'){m=p.match(/^\/@[^\/]+\/video\/(\d{8,})$/); if(m)return 'tt:'+m[1]; m=p.match(/^\/t\/([A-Za-z0-9]+)$/); return m?'tts:'+m[1]:null;}
  if(h==='vm.tiktok.com'||h==='vt.tiktok.com'){m=p.match(/^\/([A-Za-z0-9]+)$/); return m?'tts:'+m[1]:null;}
  return null;
}
/* Every link on the sheet, checked against itself, the other rows and every clip already
   on Clipency. Inside a row the first copy wins; across rows every copy is flagged, so
   you choose whose row keeps it. */
function euCheck(){
  var seen={}, out={}, owners={};
  EU.rows.forEach(function(r){r.links.forEach(function(l){var k=String(l||'').trim()&&euKey(l);
    if(k){(owners[k]=owners[k]||[]); if(owners[k].indexOf(r)<0)owners[k].push(r);}});});
  EU.rows.forEach(function(r){
    out[r.id]=r.links.map(function(l){
      var t=String(l||'').trim(); if(!t)return {empty:true};
      var k=euKey(t), plat=euPlat(euUrl(t));
      if(!k)return {plat:plat,msg:plat?'Not a single '+PLAT_NAME[plat]+' video. Paste the reel / Short / video link, not a profile or page.'
                                       :'Not a reel link. Only Instagram reels, YouTube Shorts / videos and TikTok videos.'};
      var used=EU.used[k];
      if(used)return {plat:plat,key:k,msg:'Already submitted'+(used.who?' by '+used.who:'')+(used.camp?' to '+used.camp:'')+'. A link can only go in once.'};
      if(seen[k]===r)return {plat:plat,key:k,msg:'Same link twice in this row.'};
      var other=(owners[k]||[]).filter(function(x){return x!==r;})[0];
      if(other){var o=euCreator(other.creator); return {plat:plat,key:k,msg:'Duplicate: the same link is in '+(o?o.name+'’s':'another')+' row. Keep it in one row only.'};}
      seen[k]=r;
      return {plat:plat,key:k,ok:true,warn:(r.lerr||{})[euUrl(t)]||''};
    });
  });
  return out;
}
function euRowId(){return 'r'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
/* A creator in exactly one live campaign gets it pre-picked. */
function euDefaultCamps(uid){var m=(EU.member[uid]||[]).filter(euCamp);return m.length===1?[m[0]]:[];}
/* Ready = creator + campaign + at least one good link, and no bad ones left in the row. */
function euReady(r,chk){
  var st=(chk||euCheck())[r.id]||[];
  return !!(r.creator&&r.camps.length&&st.some(function(s){return s.ok;})&&st.every(function(s){return s.ok||s.empty;}));
}
function euReadyLinks(chk){
  chk=chk||euCheck();
  return EU.rows.filter(function(r){return euReady(r,chk);}).reduce(function(n,r){return n+chk[r.id].filter(function(s){return s.ok;}).length;},0);
}
function euAccount(userId,plat){
  var mine=EU.accounts.filter(function(a){return String(a.user_id)===String(userId)&&a.status!=='rejected';});
  var ver=function(a){return a.status==='verified'||a.status==='approved'||a.is_verified;};
  var pick=function(list){return list.filter(ver)[0]||list[0]||null;};
  return (plat&&pick(mine.filter(function(a){return String(a.platform).toLowerCase()===plat;})))||pick(mine);
}
/* Only rows you added by hand are saved; the pre-listed creators are rebuilt from the database. */
function euSave(){
  try{localStorage.setItem(EU_KEY,JSON.stringify({
    extra:EU.rows.filter(function(r){return !r.fixed;}).map(function(r){return {id:r.id,creator:r.creator,links:r.links,camps:r.camps};}),
    sent:EU.rows.filter(function(r){return r.lastSent;}).map(function(r){return [r.creator,r.lastSent];})
  }));}catch(e){}
}
function euLoadSaved(){try{return JSON.parse(localStorage.getItem(EU_KEY)||'{}')||{};}catch(e){return {};}}

RENDERERS.easyupload=async function(force){

    var cr=await sb.rpc('admin_list_creators',{p_view:'all',p_q:null,p_platform:null,p_segment:'all',p_sort:'newest',p_limit:1000,p_offset:0});

    EU.used={};
    (cs.data||[]).forEach(function(r){
      add(r.user_id,r.campaign_id);

    var saved=euLoadSaved(), sent={}; (saved.sent||[]).forEach(function(x){sent[x[0]]=x[1];});
    var keep={}; EU.rows.forEach(function(r){keep[r.fixed?'c:'+r.creator:r.id]=r;});
    EU.rows=EU.creators.filter(function(c){return (member[c.id]||[]).some(function(id){return pre.indexOf(id)>=0;});})
      .map(function(c){var old=keep['c:'+c.id];
        return old||{id:'c:'+c.id,fixed:true,creator:c.id,links:[''],camps:euDefaultCamps(c.id),lastSent:sent[c.id]||null,err:''};})
      .concat((EU.loaded?EU.rows.filter(function(r){return !r.fixed;}):(saved.extra||[]).map(function(r){
        return {id:r.id,fixed:false,creator:r.creator,links:(r.links&&r.links.length)?r.links:[r.link||''],camps:r.camps||[],lastSent:null,err:''};})));
    EU.loaded=true;
  }
  var today=new Date().toISOString().slice(0,10);
  var ready=euReadyLinks();
  var sentToday=EU.rows.filter(function(r){return String(r.lastSent||'').slice(0,10)===today;}).length;
  var preNames=EU.camps.filter(function(c){return EU_PRELIST.test(c.title||'');}).map(function(c){return c.title.replace(/\s*\{.*\}\s*$/,'');});

      '<div class="kpi"><span class="lab">Sent today</span><div class="big" id="euKSent">'+fmt(sentToday)+'</div><div class="sub-t">from this sheet</div></div>'+
      '<div class="kpi"><span class="lab">Creators listed</span><div class="big">'+fmt(EU.rows.filter(function(r){return r.fixed;}).length)+'</div>'+
        '<div class="sub-t">'+(preNames.length?'from '+esc(preNames.join(' + ')):'no matching campaign is live')+'</div></div>'+
      '<div class="kpi"><span class="lab">Live campaigns</span><div class="big">'+fmt(EU.camps.length)+'</div><div class="sub-t">accepting clips</div></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="eu-bar">'+
        '<input class="inp" id="euQ" placeholder="Search creators…" value="'+esc(EU.q)+'" autocomplete="off">'+
        '<span class="sp"></span>'+
        '<button class="btn ghost sm" id="euAdd">+ Add creator</button>'+
        '<button class="btn sm" id="euAll">Submit all filled</button>'+

/* The link cell: one box per link, + adds another. Status lines are filled by euMarks(). */
function euLinksHtml(r){

    return '<div class="eu-li" data-i="'+i+'"><div class="eu-lrow">'+
      '<input class="eu-link" data-link="'+i+'" placeholder="'+(i?'Another link…':'Paste reel / short / TikTok link')+'" value="'+esc(l)+'" autocomplete="off">'+
      '<span class="eu-plat"></span><span class="eu-lok"></span>'+
      (n>1?'<button class="eu-lx" data-lx="'+i+'" title="Remove this link">×</button>':'')+

/* Repaint every link's status (platform, ✓, duplicate / bad-link note) without touching
   the inputs, so typing never loses focus. */
function euMarks(){
  var chk=euCheck();
  $$('#euTable tr[data-row]').forEach(function(tr){
    var r=EU.rows.filter(function(x){return x.id===tr.dataset.row;})[0]; if(!r)return;
    var st=chk[r.id]||[];
    $$('.eu-li',tr).forEach(function(li){
      var s=st[+li.dataset.i]||{empty:true}, msg=li.querySelector('.eu-lmsg');
      li.classList.toggle('bad',!s.ok&&!s.empty);
      li.querySelector('.eu-plat').textContent=s.plat?(PLAT_NAME[s.plat]||s.plat):'';
      li.querySelector('.eu-lok').textContent=s.ok&&!s.warn?'✓':'';
      msg.textContent=s.msg||s.warn||''; msg.classList.toggle('warn',!!(s.ok&&s.warn));
    });
    var send=tr.querySelector('[data-send]'), good=st.filter(function(s){return s.ok;}).length;
    if(send&&send.textContent!=='…'){send.disabled=!euReady(r,chk); send.textContent=good>1?'Submit '+good:'Submit';}
  });
  euCounts(chk);
}
function euPaint(){

  });

      '<th style="width:26%"><span class="hi">◎</span>Campaign</th>'+

function euRepaintRow(r,focusLink){
  var tr=$('#euTable tr[data-row="'+r.id+'"]'); if(!tr)return null;
  var tmp=document.createElement('tbody'); tmp.innerHTML=euRowHtml(r);
  var fresh=tmp.firstElementChild; tr.replaceWith(fresh); euBindRow(fresh);
  if(focusLink!=null&&focusLink!==false){
    var at=focusLink===true?Math.max(0,r.links.findIndex(function(l){return !String(l).trim();})):focusLink;
    var i=fresh.querySelector('[data-link="'+at+'"]'); if(i){i.focus(); i.setSelectionRange(i.value.length,i.value.length);}
  }
  euMarks();
  return fresh;
}
function euCounts(chk){
  var ready=euReadyLinks(chk), today=new Date().toISOString().slice(0,10);
  var all=$('#euAll'); if(all){all.disabled=!ready; all.textContent=ready?'Submit all filled ('+ready+' link'+(ready>1?'s':'')+')':'Submit all filled';}
  var kr=$('#euKReady'); if(kr){kr.textContent=fmt(ready); kr.style.color=ready?'var(--warn)':'';}
  var ks=$('#euKSent'); if(ks)ks.textContent=fmt(EU.rows.filter(function(r){return String(r.lastSent||'').slice(0,10)===today;}).length);
}
function euRowOf(el){var tr=el.closest('tr[data-row]');return tr&&EU.rows.filter(function(r){return r.id===tr.dataset.row;})[0];}
function euBindRow(tr){
  var r=EU.rows.filter(function(x){return x.id===tr.dataset.row;})[0]; if(!r)return;
  function clearErr(){r.err=''; tr.classList.remove('bad'); var e=tr.querySelector('.eu-err'); if(e)e.remove();}
  $$('[data-link]',tr).forEach(function(inp){
    var i=+inp.dataset.link;
    inp.oninput=function(){
      r.links[i]=inp.value; if(r.lerr)delete r.lerr[euUrl(inp.value)]; clearErr();
      if(!r.fixed)euSave(); euMarks();
    };
    /* pasting a list (one per line, or spaces / commas) fills one box per link */
    inp.onpaste=function(e){
      var t=((e.clipboardData||window.clipboardData).getData('text')||''), parts=t.split(/[\s,]+/).filter(Boolean);
      if(parts.length<2)return;
      e.preventDefault(); clearErr();
      var cur=String(r.links[i]||'').trim();
      r.links=r.links.slice(0,i).concat(cur?[cur]:[],parts,r.links.slice(i+1));
      if(!r.fixed)euSave(); euRepaintRow(r,i+(cur?1:0)+parts.length-1);
    };
    inp.onkeydown=function(e){
      if(e.key==='Enter'){
        e.preventDefault();
        if(e.metaKey||e.ctrlKey){if(euReady(r))euSubmit([r]); return;}
        if(!r.camps.length){var b=tr.querySelector('[data-pick="camps"]'); if(b)b.click(); return;}
        if(String(inp.value).trim())euAddLink(r,i+1);
      }else if(e.key==='Backspace'&&!inp.value&&r.links.length>1){e.preventDefault(); euDelLink(r,i,true);}
    };
  });
  $$('[data-lx]',tr).forEach(function(b){b.onclick=function(e){e.stopPropagation(); euDelLink(r,+b.dataset.lx);};});
  var plus=tr.querySelector('[data-plus]'); if(plus)plus.onclick=function(e){e.stopPropagation(); euAddLink(r,r.links.length);};
  $$('[data-pick]',tr).forEach(function(b){b.onclick=function(e){e.stopPropagation(); euOpenPicker(b,r,b.dataset.pick);};});
  var send=tr.querySelector('[data-send]'); if(send)send.onclick=function(){euSubmit([r]);};
  var del=tr.querySelector('[data-del]'); if(del)del.onclick=function(){EU.rows=EU.rows.filter(function(x){return x!==r;}); euSave(); euPaint();};
}
/* + / Enter: a fresh box after `at` (reuses an empty one if it is already there) */
function euAddLink(r,at){
  if(at<r.links.length&&!String(r.links[at]).trim()){euRepaintRow(r,at); return;}
  r.links.splice(at,0,''); if(!r.fixed)euSave(); euRepaintRow(r,at);
}
function euDelLink(r,i,focusPrev){
  r.links.splice(i,1); if(!r.links.length)r.links=[''];
  if(!r.fixed)euSave(); euRepaintRow(r,focusPrev?Math.max(0,i-1):false);
}
function euAddRow(){
  var r={id:euRowId(),fixed:false,creator:null,links:[''],camps:[],lastSent:null,err:''};
  EU.rows.push(r); euSave(); euPaint();
  var b=$('#euTable tr[data-row="'+r.id+'"] [data-pick="creator"]'); if(b)b.click();
}

/* ---- dropdowns: campaigns (multi, the creator's own first) and creator (for added rows) ---- */
var euPopEl=null;
function euClosePicker(){if(euPopEl){euPopEl.remove();euPopEl=null;}}
function euOpenPicker(anchor,row,kind){
  euClosePicker();
  var multi=kind==='camps';   /* the campaign list (single choice); else the creator list */
  var pop=document.createElement('div'); pop.className='eu-pop'; euPopEl=pop;
  var term='', kb=0;
  function items(){
    var t=term.trim().toLowerCase();
    if(multi){
      var mine=(EU.member[row.creator]||[]);
      return EU.camps.filter(function(c){return !t||(c.title+' '+(c.brand_name||'')).toLowerCase().indexOf(t)>=0;})
        .map(function(c){return {c:c,mine:mine.indexOf(c.id)>=0};})
        .sort(function(a,b){return (b.mine?1:0)-(a.mine?1:0);});
    }
    return EU.creators.filter(function(c){return !t||(c.name+' '+c.email).toLowerCase().indexOf(t)>=0;}).slice(0,80);
  }
  function paint(){
    var list=items();
    if(kb>=list.length)kb=Math.max(0,list.length-1);
    var html='', lastMine=null;
    list.forEach(function(it,i){
      if(multi){
        if(it.mine!==lastMine){html+='<div class="plab">'+(it.mine?'Their campaigns':'Other live campaigns')+'</div>'; lastMine=it.mine;}
        var on=row.camps.indexOf(it.c.id)>=0;
        html+='<button class="eu-opt'+(on?' on':'')+(i===kb?' kb':'')+'" data-v="'+esc(it.c.id)+'"><span class="ck" style="border-radius:50%">'+(on?'●':'')+'</span>'+
          '<span class="eu-tag '+euTagClass(it.c.id)+'">'+esc(it.c.title)+'</span>'+
          (it.c.is_private?'<span class="em" style="margin-left:auto">private</span>':'')+'</button>';
      }else{
        var on2=String(row.creator)===String(it.id);
        html+='<button class="eu-opt'+(on2?' on':'')+(i===kb?' kb':'')+'" data-v="'+esc(it.id)+'">'+
          '<span class="eu-av">'+esc((it.name[0]||'?').toUpperCase())+'</span>'+
          '<span style="min-width:0;display:flex;flex-direction:column"><span>'+esc(it.name)+'</span><span class="em">'+esc(it.email)+'</span></span></button>';
      }
    });
    pop.innerHTML='<div class="pin"><input placeholder="'+(multi?'Search campaigns…':'Search creators by name or email…')+'" value="'+esc(term)+'"></div>'+
      (multi?'':'<div class="plab">Select a creator</div>')+
      '<div class="plist">'+(list.length?html:'<div class="eu-none">'+(multi?'No live campaigns match.':'No creator matches.')+'</div>')+'</div>';
    var inp=pop.querySelector('input'); inp.focus(); inp.setSelectionRange(term.length,term.length);
    inp.oninput=function(){term=inp.value; kb=0; paint();};
    inp.onkeydown=function(e){
      var l=items();
      if(e.key==='ArrowDown'){e.preventDefault();kb=Math.min(l.length-1,kb+1);paint();}
      else if(e.key==='ArrowUp'){e.preventDefault();kb=Math.max(0,kb-1);paint();}
      else if(e.key==='Enter'){e.preventDefault(); if(l[kb])choose(multi?l[kb].c.id:l[kb].id);}
      else if(e.key==='Escape'){euClosePicker();}
    };
    $$('.eu-opt',pop).forEach(function(o){o.onclick=function(e){e.stopPropagation();choose(o.dataset.v);};});
  }
  function choose(id){
    row.err='';
    if(multi){
      /* one link = one campaign: picking replaces, then straight into the link box */
      row.camps=[id];
      if(!row.fixed)euSave(); euClosePicker(); euRepaintRow(row,true);
    }else{
      row.creator=id; if(!row.camps.length)row.camps=euDefaultCamps(id);
      euSave(); euClosePicker(); euRepaintRow(row,true);
    }
  }
  pop.addEventListener('click',function(e){e.stopPropagation();});
  document.body.appendChild(pop);
  var rc=anchor.getBoundingClientRect(), H=window.innerHeight, below=H-rc.bottom-16, above=rc.top-16, up=below<260&&above>below;
  pop.style.maxHeight=Math.min(380,Math.max(180,up?above:below))+'px';
  pop.style.left=Math.max(12,Math.min(rc.left,window.innerWidth-332))+'px';
  if(up)pop.style.bottom=(H-rc.top+4)+'px'; else pop.style.top=(rc.bottom+4)+'px';
  paint();
}
document.addEventListener('click',function(){euClosePicker();});
document.addEventListener('keydown',function(e){if(e.key==='Escape')euClosePicker();});
window.addEventListener('hashchange',euClosePicker);

/* ---- submit: one RPC call per campaign, from the creator's account on the link's platform.
        Success clears the link (campaign kept if it is their only one) for the next clip. ---- */
async function euSubmit(list){
  var chk=euCheck();
  list=list.filter(function(r){return euReady(r,chk);});
  if(!list.length)return;
  var ok=0, bad=0;
  for(var i=0;i<list.length;i++){
    var r=list[i], cid=r.camps[0], camp=euCamp(cid), cname=euCreator(r.creator);
    var tr=$('#euTable tr[data-row="'+r.id+'"]'), btn=tr&&tr.querySelector('[data-send]');
    if(btn){btn.disabled=true;btn.textContent='…';}
    /* the good links, grouped by platform so each goes in from the matching account */
    var groups={}, sent=[], fails={};
    chk[r.id].forEach(function(s,k){if(s.ok)(groups[s.plat]=groups[s.plat]||[]).push(euUrl(r.links[k]));});
    for(var plat in groups){
      var urls=groups[plat], acct=euAccount(r.creator,plat);
      if(!acct||(acct.platform&&String(acct.platform).toLowerCase()!==plat)){
        urls.forEach(function(u){fails[u]='No connected '+(PLAT_NAME[plat]||plat)+' account for this creator.';}); continue;
      }
      try{
        /* private campaigns only accept approved accounts; the admin is vouching for this clip */
        if(camp&&camp.is_private&&(EU.member[r.creator]||[]).indexOf(camp.id)<0){
          var g=await sb.rpc('admin_grant_campaign_access',{p_account:acct.id,p_campaign:camp.id});
          if(g.error&&!/already/i.test(g.error.message))throw new Error(g.error.message);
        }
        var res=await sb.rpc('admin_bulk_submit_clips',{p_user:r.creator,p_account:acct.id,p_campaign:cid,p_urls:urls});
        if(res.error)throw new Error(res.error.message);
        var got=(res.data&&res.data.results)||[];
        urls.forEach(function(u){
          var one=got.filter(function(x){return x.url===u;})[0];
          if(one&&one.ok)sent.push(u); else fails[u]=(one&&one.reason)||'Refused';
        });
      }catch(e){urls.forEach(function(u){fails[u]=e.message||String(e);});}
    }
    sent.forEach(function(u){var k=euKey(u); if(k)EU.used[k]={who:cname?cname.name:'',camp:camp?camp.title:''};});
    if(sent.length){
      r.lastSent=new Date().toISOString();
      var m=EU.member[r.creator]=EU.member[r.creator]||[]; if(m.indexOf(cid)<0)m.push(cid);
    }
    var left=Object.keys(fails);
    /* sent links leave the row; failed ones stay with their reason, ready to fix or retry */
    r.links=r.links.filter(function(l){var u=euUrl(l); return String(l).trim()&&fails[u];});
    if(!r.links.length)r.links=[''];
    r.lerr=fails; ok+=sent.length; bad+=left.length;
    if(left.length){r.err=(sent.length?'Sent '+sent.length+'. ':'')+left.length+' link'+(left.length>1?'s':'')+' not sent, see below.';}
    else{r.err=''; r.camps=euDefaultCamps(r.creator);}
    euSave();
    var fresh=euRepaintRow(r,list.length===1?0:false);
    if(fresh&&!left.length)fresh.classList.add('flash');
  }
  var c=list.length===1?euCreator(list[0].creator):null;
  euToast(ok?ok+' link'+(ok>1?'s':'')+' submitted'+(c?' for '+c.name:'')+(bad?', '+bad+' failed':'')
            :'Not submitted. See the red row for why.');
}
var euToastEl=null;
function euToast(msg){
  if(!euToastEl){euToastEl=document.createElement('div');euToastEl.className='t-toast';document.body.appendChild(euToastEl);}
  euToastEl.textContent=msg;
  euToastEl.classList.remove('is-open'); void euToastEl.offsetWidth;
  euToastEl.classList.add('is-open');
  clearTimeout(euToastEl._t);
  euToastEl._t=setTimeout(function(){euToastEl.classList.remove('is-open');},2800);
}

RENDERERS.easyupload.after=function(){
  euPaint();
  var q=$('#euQ'); if(q)q.oninput=function(){EU.q=q.value; euPaint();};
  $('#euAdd').onclick=function(e){e.stopPropagation(); euAddRow();};
  $('#euAll').onclick=function(){euSubmit(EU.rows.slice());};
};

/* ============================================================
   BOOT
   ============================================================ */
async function boot(){
  try{
    await ensureSupabase();
    var u=await sb.auth.getUser();
    if(u.error||!u.data||!u.data.user){location.replace('/admin-signin');return;}
    ME=u.data.user;

    /* role: prefer the RPC, fall back to admin_users, same as the old console */
    try{
      var ac=await sb.rpc('admin_access_check');
      if(!ac.error&&ac.data&&ac.data.role)ROLE=ac.data.role;
      else throw new Error('rpc');
    }catch(e){
      var a=await sb.from('admin_users').select('email').eq('email',ME.email).limit(1);
      ROLE=(a.data||[]).length?'admin':'clipper';
    }

    if(ROLE!=='admin'&&ROLE!=='reviewer'){
      $('#bootMsg').innerHTML='Signed in as <b>'+esc(ME.email)+'</b>, which is not a staff account.'+
        '<br><a href="/admin-signin" style="color:var(--gold)">Sign in as admin →</a>';
      return;
    }

    var name=(ME.user_metadata&&ME.user_metadata.full_name)||(ME.email||'').split('@')[0]||'Admin';
    $('#meName').textContent=name;
    $('#meRole').textContent=ROLE;
    $('#meAv').textContent=(name[0]||'A').toUpperCase();

    paintApps();
    $('#boot').classList.add('hide');
    $('#app').style.display='';
    if(!location.hash)location.hash=ROLE==='reviewer'?'#reviews':'#command';
    await render(true);
    /* Offered last, and only for the doors this account can open. */
    if(window.CXRouteSwitch)
      CXRouteSwitch.mount({sb:sb,current:'admin',into:document.getElementById('cxRouteSlot')});
  }catch(e){
    fatal('The console could not start.', e);
  }
}
boot();
