<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Clipency | Console</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   CLIPENCY CONSOLE
   One file. One URL. Hash routing (#reviews, #clients …).
   No shared script, no patch scripts, no path allowlist, no
   cache-buster juggling — the six things that made the old
   admin fail silently cannot happen here.
   Design follows the clipper dashboard: light by default,
   monochrome with a single gold accent.
   ============================================================ */
:root{
  --bg:#FAF9F6; --bg-2:#F3F1EC; --surface:#FFF; --surface-2:#F5F3EE; --raise:#FFF;
  --ink:#141210; --ink-2:#000;
  --ink-70:rgba(20,18,16,.72); --ink-55:rgba(20,18,16,.56);
  --ink-40:rgba(20,18,16,.42); --ink-25:rgba(20,18,16,.24);
  --hair:rgba(20,18,16,.1); --hair-2:rgba(20,18,16,.17);
  --gold:#8C6A45; --gold-2:#A98352; --gold-dim:rgba(140,106,69,.09); --gold-line:rgba(140,106,69,.3);
  --accent:#141210; --inv-bg:#100E0C; --inv-fg:#fff;
  --ok:#8C6A45; --warn:#B8860B; --danger:#A8736A;
  --sans:'Plus Jakarta Sans',system-ui,sans-serif; --display:'Instrument Serif',serif; --mono:'JetBrains Mono',monospace;
  --ease:cubic-bezier(.16,1,.3,1); --shadow:0 1px 2px rgba(0,0,0,.04),0 20px 50px -30px rgba(0,0,0,.25);
}
[data-theme="dark"]{
  --bg:#0B0A08; --bg-2:#0E0D0B; --surface:#141210; --surface-2:#1A1714; --raise:#211D19;
  --ink:#EFEBE3; --ink-2:#FFFDF8;
  --ink-70:rgba(239,235,227,.7); --ink-55:rgba(239,235,227,.55);
  --ink-40:rgba(239,235,227,.4); --ink-25:rgba(239,235,227,.24);
  --hair:rgba(239,235,227,.08); --hair-2:rgba(239,235,227,.15);
  --gold:#D8AA74; --gold-2:#EFC894; --gold-dim:rgba(216,170,116,.12); --gold-line:rgba(216,170,116,.32);
  --accent:#D8AA74; --inv-bg:#F3EFE7; --inv-fg:#0B0A08;
  --ok:#D8AA74; --warn:#E0B44A; --danger:#C98A7D;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 26px 60px -34px rgba(0,0,0,.9);
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  transition:background-color .35s var(--ease),color .35s var(--ease);}
a{color:inherit;text-decoration:none}
::selection{background:var(--gold-dim)}

/* ---------- boot ---------- */
#boot{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:var(--bg)}
#boot.hide{display:none}
#boot b{font-weight:600;font-size:12.5px;letter-spacing:.26em}
#boot .ld{width:110px;height:2px;border-radius:2px;background:var(--hair);overflow:hidden}
#boot .ld i{display:block;height:100%;width:40%;background:var(--accent);animation:ldm 1.1s var(--ease) infinite}
@keyframes ldm{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}
#boot .msg{font-size:12px;color:var(--ink-40);text-align:center;max-width:420px;line-height:1.6}

/* ---------- layout ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh}
.side{border-right:1px solid var(--hair);background:var(--bg-2);display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;overflow-y:auto}
.brand{padding:22px 20px 16px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--hair)}
.brand .mk{font-size:15px}
.brand b{font-weight:600;font-size:11.5px;letter-spacing:.24em}
.brand span{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);
  border:1px solid var(--hair-2);border-radius:999px;padding:1px 7px;margin-left:auto}
.nl{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-40);padding:16px 20px 7px}
.nav{padding:0 10px}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 11px;border-radius:10px;color:var(--ink-55);
  font-size:13.5px;font-weight:500;margin-bottom:2px;position:relative;
  transition:background .18s,color .18s,transform .18s var(--ease)}
.nav a:hover{background:var(--surface);color:var(--ink);transform:translateX(2px)}
.nav a.on{background:var(--inv-bg);color:var(--inv-fg)}
.nav a .ic{width:15px;text-align:center;font-size:13px;opacity:.85}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:9.5px;background:var(--gold-dim);color:var(--gold);
  border-radius:999px;padding:1px 7px}
.nav a.on .ct{background:rgba(255,255,255,.16);color:var(--inv-fg)}
.sp{flex:1}
.me{padding:14px;border-top:1px solid var(--hair);display:flex;align-items:center;gap:10px}
.me .av{width:32px;height:32px;border-radius:50%;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:15px}
.me .t{flex:1;min-width:0}
.me .t b{display:block;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me .t span{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40)}
.main{min-width:0}
.wrap{max-width:1160px;padding:0 30px}
.top{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--hair)}
.top .wrap{display:flex;align-items:center;gap:12px;padding:14px 30px}
.crumb{font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-40)}

/* ---------- type ---------- */
.head{padding:32px 0 20px}
.eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--gold);margin-bottom:9px}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.05;color:var(--ink-2);letter-spacing:-.01em}
.sub{color:var(--ink-55);font-size:14px;margin-top:8px;max-width:620px}
h2{font-family:var(--display);font-weight:400;font-size:21px;color:var(--ink-2)}

/* ---------- bits ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;font-family:var(--sans);font-size:13px;
  font-weight:600;padding:9px 16px;border-radius:10px;border:1px solid transparent;cursor:pointer;
  background:var(--inv-bg);color:var(--inv-fg);transition:transform .2s var(--ease),opacity .2s,box-shadow .2s}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.btn:active{transform:translateY(0)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.ghost{background:none;color:var(--ink-70);border-color:var(--hair-2)}
.btn.ghost:hover{border-color:var(--accent);color:var(--ink)}
.btn.sm{padding:6px 12px;font-size:12px;border-radius:8px}
.btn.ok{background:var(--gold);color:#fff}
.btn.danger{background:none;color:var(--danger);border-color:var(--danger)}
.btn.danger:hover{background:var(--danger);color:#fff}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:22px 24px;margin-bottom:16px;
  animation:rise .5s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card:nth-child(2){animation-delay:.04s}.card:nth-child(3){animation-delay:.08s}
.ch{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:16px}
.ch .cs{font-size:12.5px;color:var(--ink-40);margin-top:2px}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--hair);border-radius:14px;padding:17px 19px;
  animation:rise .5s var(--ease) both;transition:transform .25s var(--ease),box-shadow .25s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.kpi:nth-child(2){animation-delay:.05s}.kpi:nth-child(3){animation-delay:.1s}.kpi:nth-child(4){animation-delay:.15s}
.kpi .lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40)}
.kpi .big{font-family:var(--display);font-size:30px;line-height:1.15;margin-top:7px;color:var(--ink-2)}
.kpi .sub-t{font-size:11.5px;color:var(--ink-40);margin-top:2px}

.seg{display:inline-flex;gap:3px;background:var(--surface-2);border:1px solid var(--hair);border-radius:11px;padding:3px}
.seg button{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px 13px;border:none;border-radius:8px;
  background:none;color:var(--ink-55);cursor:pointer;transition:background .2s,color .2s}
.seg button.on{background:var(--inv-bg);color:var(--inv-fg)}
.seg button .n{font-family:var(--mono);font-size:9.5px;opacity:.65;margin-left:5px}
.cr-seg a{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:8px;
  color:var(--ink-55);text-decoration:none;transition:background .2s,color .2s}
.cr-seg a.on{background:var(--inv-bg);color:var(--inv-fg)}
.cr-seg a .n{font-family:var(--mono);font-size:9.5px;opacity:.65;margin-left:5px}
.cr-tbl tbody tr[data-crrow]:hover td{color:var(--ink)}
#view.is-loading{opacity:.55;transition:opacity .15s}
#view.is-loading button,#view.is-loading select,#view.is-loading a{pointer-events:none}

.inp{width:100%;font-family:var(--sans);font-size:13.5px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--hair);border-radius:9px;padding:8px 12px;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--accent)}
.inp::placeholder{color:var(--ink-25)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--ink-40);font-weight:400;padding:0 10px 10px 0;border-bottom:1px solid var(--hair);white-space:nowrap}
td{padding:12px 10px 12px 0;border-bottom:1px solid var(--hair);color:var(--ink-70);vertical-align:top}
tbody tr{transition:background .15s}
tbody tr:hover{background:var(--surface-2)}
tr:last-child td{border-bottom:none}
.mono{font-family:var(--mono);font-size:11.5px}

.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font-family:var(--mono);
  font-size:9px;letter-spacing:.1em;text-transform:uppercase;border:1px solid var(--hair-2);color:var(--ink-55)}
.chip.ok{border-color:var(--gold-line);background:var(--gold-dim);color:var(--gold)}
.chip.wait{border-color:rgba(184,134,11,.3);background:rgba(184,134,11,.08);color:var(--warn)}
.chip.no{border-color:rgba(168,115,106,.35);background:rgba(168,115,106,.08);color:var(--danger)}

.empty{text-align:center;padding:44px 20px}
.empty .ei{font-size:26px;color:var(--ink-25);margin-bottom:10px}
.empty b{display:block;font-family:var(--display);font-weight:400;font-size:17px;color:var(--ink);margin-bottom:5px}
.empty p{font-size:13px;color:var(--ink-55);max-width:400px;margin:0 auto;line-height:1.6}

/* ---------- modal ---------- */
.veil{position:fixed;inset:0;z-index:70;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.55);backdrop-filter:blur(4px);padding:20px}
.veil.on{display:flex;animation:fin .25s ease both}
@keyframes fin{from{opacity:0}to{opacity:1}}
.modal{width:100%;max-width:520px;max-height:90vh;overflow-y:auto;background:var(--surface);
  border:1px solid var(--hair-2);border-radius:18px;padding:28px;box-shadow:var(--shadow);
  animation:min .4s var(--ease) both}
@keyframes min{from{opacity:0;transform:scale(.96) translateY(12px)}to{opacity:1;transform:none}}
.modal h3{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink-2);line-height:1.2}
.modal .m-sub{font-size:13px;color:var(--ink-55);margin-top:6px}
.mrow{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--hair)}
.mrow .btn{flex:1}
.msg{font-size:12.5px;margin-top:10px;min-height:17px}
.msg.err{color:var(--danger)}
/* 'warn' = the action succeeded but something after it did not. Approving a
   clip whose metrics cannot be read is the main case: red would imply the
   approval failed, green would hide a real problem. */
.msg.warn{color:var(--amber,#B4863C)} .msg.ok{color:var(--gold)}

.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;text-align:center;
  background:var(--gold-dim);border:1px solid var(--gold-line);border-radius:12px;padding:15px;margin:16px 0}
.metrics .v{font-family:var(--display);font-size:20px;color:var(--ink-2)}
.metrics .l{font-family:var(--mono);font-size:8px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-top:3px}

/* ---------- fail-safe ---------- */
#fatal{position:fixed;inset:0;z-index:99999;display:none;background:var(--bg);color:var(--ink);padding:40px;overflow:auto}
#fatal.on{display:block}
#fatal .box{max-width:640px;margin:0 auto}
#fatal pre{background:var(--surface-2);border:1px solid var(--hair);padding:14px;border-radius:10px;
  font-size:11.5px;line-height:1.6;white-space:pre-wrap;color:var(--ink-55);margin-top:14px}

@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;align-items:center}
  .brand,.nl,.me{display:none}
  .nav{display:flex;padding:8px}
  .nav a{white-space:nowrap}
  .kpis{grid-template-columns:repeat(2,1fr)}
  h1{font-size:30px}
}

/* Logo is white ink on transparent: brightness(0) paints it black for light
   mode while keeping the alpha edges clean. invert() would lift the
   transparent pixels and leave a halo. */
.cx-logo{height:26px;width:auto;display:block;filter:brightness(0);transition:filter .3s ease}
[data-theme="dark"] .cx-logo{filter:none}

/* ============================================================
   APPLICATIONS — private campaign queue
   ============================================================ */
:root{--duration-quick:150ms;--duration-fast:250ms;--duration-slow:400ms;
--duration-very-slow:500ms;--duration-stagger:40ms;
--ease-smooth-out:cubic-bezier(0.22,1,0.36,1);--ease-in-out:ease-in-out;
--toast-open:350ms;--toast-close:250ms;--toast-distance:16px;
--toast-blur:2px;--toast-scale:0.97;--toast-ease:cubic-bezier(0.22,1,0.36,1);
--stagger-dur:500ms;--stagger-distance:12px;--stagger-stagger:40ms;
--stagger-blur:3px;--stagger-ease:cubic-bezier(0.22,1,0.36,1);}
.t-toast{position:fixed;left:50%;bottom:24px;z-index:9000;padding:11px 20px;border-radius:11px;
background:var(--ink-2,#111);color:var(--paper,#fff);font-size:13px;font-weight:600;
box-shadow:0 18px 40px -18px rgba(0,0,0,.5);pointer-events:none;max-width:88vw;
opacity:0;transform:translate(-50%,var(--toast-distance)) scale(var(--toast-scale));
filter:blur(var(--toast-blur));will-change:transform,opacity,filter;
transition:opacity var(--toast-close) var(--toast-ease),
transform var(--toast-close) var(--toast-ease),
filter var(--toast-close) var(--toast-ease);}
.t-toast.is-open{opacity:1;transform:translate(-50%,0) scale(1);filter:blur(0);
transition:opacity var(--toast-open) var(--toast-ease),
transform var(--toast-open) var(--toast-ease),
filter var(--toast-open) var(--toast-ease);}
@media (prefers-reduced-motion:reduce){.t-toast{transition:none !important;}}
.t-stagger > *{opacity:0;transform:translateY(var(--stagger-distance));filter:blur(var(--stagger-blur));}
.t-stagger.is-shown > *{animation:t-stagger-in var(--stagger-dur) var(--stagger-ease) both;}
under the ~300ms where the last item starts to feel late. A queue of
forty applications must not take a second and a half to appear, so
everything past the sixth arrives with the sixth. */
.t-stagger.is-shown > *:nth-child(1){animation-delay:0ms;}
.t-stagger.is-shown > *:nth-child(2){animation-delay:calc(var(--stagger-stagger) * 1);}
.t-stagger.is-shown > *:nth-child(3){animation-delay:calc(var(--stagger-stagger) * 2);}
.t-stagger.is-shown > *:nth-child(4){animation-delay:calc(var(--stagger-stagger) * 3);}
.t-stagger.is-shown > *:nth-child(5){animation-delay:calc(var(--stagger-stagger) * 4);}
.t-stagger.is-shown > *:nth-child(n+6){animation-delay:calc(var(--stagger-stagger) * 5);}
@keyframes t-stagger-in{from{opacity:0;transform:translateY(var(--stagger-distance));
filter:blur(var(--stagger-blur));}to{opacity:1;transform:translateY(0);filter:blur(0);}}
@media (prefers-reduced-motion:reduce){.t-stagger > *{opacity:1;transform:none;filter:none;}
.t-stagger.is-shown > *{animation:none !important;}}
.ap-card{border:1px solid var(--hair,rgba(0,0,0,.1));border-radius:14px;padding:16px 18px;
margin-bottom:12px;background:var(--paper,transparent);
transition:border-color var(--duration-fast) var(--ease-smooth-out),
transform var(--duration-fast) var(--ease-smooth-out);}
.ap-card:hover{border-color:var(--gold,#C4956A);transform:translateY(-1px);}
.ap-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;}
.ap-av{width:38px;height:38px;border-radius:11px;flex:none;overflow:hidden;
border:1px solid var(--hair,rgba(0,0,0,.1));display:flex;align-items:center;
justify-content:center;font-size:15px;color:var(--gold,#C4956A);}
.ap-av img{width:100%;height:100%;object-fit:cover;}
.ap-h{font-weight:700;font-size:14.5px;letter-spacing:-.01em;}
.ap-sub{font-size:11.5px;color:var(--ink-40,#888);}
.ap-act{margin-left:auto;display:flex;gap:8px;}
.ap-rec{display:flex;gap:20px;flex-wrap:wrap;margin-top:12px;padding-top:12px;
border-top:1px solid var(--hair,rgba(0,0,0,.08));}
.ap-rec div{min-width:86px;}
.ap-rec .k{display:block;font-family:var(--mono,monospace);font-size:8.5px;letter-spacing:.18em;
text-transform:uppercase;color:var(--ink-40,#888);}
.ap-rec .v{font-size:15px;font-weight:700;}
.ap-note{margin-top:12px;padding:10px 13px;border-radius:10px;font-size:12.5px;line-height:1.55;
background:var(--paper-2,rgba(0,0,0,.03));color:var(--ink-70,#444);}
.ap-note b{font-weight:600;}
.ap-flag{margin-top:10px;font-size:12px;color:var(--warn,#B08D4B);}
</style>
</head>
<body>

<div id="boot"><img class="cx-logo" src="/Clipencylogo.png" alt="Clipency" style="height:30px;margin:0 auto 14px"><div class="ld"><i></i></div><div class="msg" id="bootMsg">Opening the console…</div></div>

<div id="fatal"><div class="box">
  <div class="eyeb" style="color:var(--danger)">Console error</div>
  <h1 style="font-size:26px">Something failed.</h1>
  <p class="sub" id="fatalMsg"></p>
  <pre id="fatalStack"></pre>
  <p style="margin-top:18px"><a class="btn ghost" href="#command" onclick="location.reload()">Reload</a></p>
</div></div>

<div class="app" id="app" style="display:none">
  <aside class="side">
    <div class="brand"><img class="cx-logo" src="/Clipencylogo.png" alt="Clipency"><span>Console</span></div>
    <div class="nl">Operations</div>
    <nav class="nav" id="nav"></nav>
    <div class="nl" id="appsLabel" hidden>Products</div>
    <nav class="nav" id="apps" hidden></nav>
    <div class="sp"></div>
    <div class="me">
      <span class="av" id="meAv">A</span>
      <span class="t"><b id="meName">…</b><span id="meRole">…</span></span>
      <button class="btn ghost sm" id="themeBtn" title="Light / dark">&#9681;</button>
    </div>
    <div style="padding:0 14px 14px"><button class="btn ghost sm" id="signOut" style="width:100%">Sign out</button></div>
  </aside>

  <main class="main">
    <div class="top"><div class="wrap">
      <span class="crumb" id="crumb">Console</span>
      <span id="cxRouteSlot" style="margin-left:14px"></span>
      <span class="sp"></span>
      <button class="btn ghost sm" id="refreshBtn">&#8635; Refresh</button>
    </div></div>
    <div class="wrap" id="view"></div>
    <div style="height:70px"></div>
  </main>
</div>

<div class="veil" id="veil"><div class="modal" id="modal"></div></div>

<script>
/* ============================================================
   BOOT + FAIL-SAFE
   Nothing here can end in a blank screen: every failure path
   paints #fatal with the reason.
   ============================================================ */
var $=function(s,c){return (c||document).querySelector(s);};
var $$=function(s,c){return Array.prototype.slice.call((c||document).querySelectorAll(s));};
var esc=function(v){return String(v==null?'':v).replace(/[&<>"']/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var num=function(v){return Number(v)||0;};
var fmt=function(n){return num(n).toLocaleString('en-US');};
var fmtK=function(n){n=num(n);return n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?(n/1e3).toFixed(1)+'K':String(Math.round(n));};
var money=function(n){return '$'+num(n).toFixed(2);};
/* Campaign currencies. A campaign is priced in its own currency: its rate,
   budget, caps and fees are all native. The database validates the code
   (cx_campaign_default_fx) and stamps fx_rate_per_usd from cx_fx_rates. */
var CCYS=[{c:'USD',s:'$'},{c:'INR',s:'\u20B9'},{c:'EUR',s:'\u20AC'},{c:'GBP',s:'\u00A3'},
          {c:'AUD',s:'A$'},{c:'CAD',s:'C$'},{c:'JPY',s:'\u00A5'}];
var ccyOf=function(c){var k=String((c&&c.currency)||'USD').toUpperCase();
  return CCYS.some(function(x){return x.c===k;})?k:'USD';};
var csym=function(code){var k=String(code||'USD').toUpperCase();
  for(var i=0;i<CCYS.length;i++)if(CCYS[i].c===k)return CCYS[i].s;return '$';};
var moneyIn=function(n,code){var k=String(code||'USD').toUpperCase();
  return csym(k)+num(n).toLocaleString(k==='INR'?'en-IN':'en-US',
    {minimumFractionDigits:k==='JPY'?0:2,maximumFractionDigits:k==='JPY'?0:2});};
/* A native campaign amount in USD, at the campaign's own stamped rate. */
var toUsd=function(n,c){var f=num(c&&c.fx_rate_per_usd);return ccyOf(c)==='USD'||!(f>0)?num(n):num(n)/f;};
var day=function(d){return d?new Date(d).toLocaleDateString('en-US',{day:'numeric',month:'short'}):'·';};
var ago=function(d){if(!d)return'·';var m=Math.round((Date.now()-new Date(d))/6e4);
  return m<1?'just now':m<60?m+'m ago':m<1440?Math.round(m/60)+'h ago':Math.round(m/1440)+'d ago';};

function fatal(msg, err){
  $('#boot').classList.add('hide');
  $('#fatalMsg').textContent=msg;
  /* A __friendly error already explains itself in prose — showing its
     stack on top of that just buries the explanation. */
  var body=(err&&err.__friendly) ? err.message
         : ((err&&(err.stack||err.message))||String(err||''));
  var st=$('#fatalStack');
  st.style.whiteSpace='pre-wrap';
  st.style.wordBreak='break-word';
  st.textContent=body;
  $('#fatal').classList.add('on');
}
window.addEventListener('error',function(e){fatal('A script error stopped the console.', e.error||e.message);});
window.addEventListener('unhandledrejection',function(e){fatal('A background request failed.', e.reason);});

/* ------------------------------------------------------------------
   supabase-js loader.

   This used to be a bare  window.supabase.createClient(...)  on load.
   When the CDN script in <head> failed to fetch — blocked by an ISP,
   a content blocker, or a slow/offline jsdelivr — window.supabase was
   undefined and the whole console died with an unreadable
   "Cannot read properties of undefined". That is exactly the failure
   this rebuild exists to prevent.

   So: try three independent CDNs in turn, and if all three fail, say
   so in plain words instead of throwing.
   ------------------------------------------------------------------ */
var SB_CDNS=[
  'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0',
  'https://unpkg.com/@supabase/supabase-js@2.118.0',
  'https://esm.sh/@supabase/supabase-js@2.118.0?bundle&target=es2018'
];
function loadScript(src){
  return new Promise(function(res,rej){
    var s=document.createElement('script');
    s.src=src; s.async=false;
    s.onload=function(){res();};
    s.onerror=function(){rej(new Error('blocked or unreachable: '+src));};
    document.head.appendChild(s);
    setTimeout(function(){rej(new Error('timed out: '+src));},12000);
  });
}
async function ensureSupabase(){
  if(window.supabase&&window.supabase.createClient){
    sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
    return;
  }
  var tried=[];
  for(var i=0;i<SB_CDNS.length;i++){
    /* the <head> tag already attempted #0; retrying it is still worth
       one shot, since a transient failure is the common case */
    try{
      await loadScript(SB_CDNS[i]+(SB_CDNS[i].indexOf('?')<0?'?r=':'&r=')+Date.now());
      if(window.supabase&&window.supabase.createClient){
        sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        return;
      }
      tried.push(SB_CDNS[i]+' — loaded but exported nothing');
    }catch(e){ tried.push(e.message); }
  }
  var err=new Error(
    'The Supabase library could not be downloaded from any of three CDNs.\n\n'+
    'That is a network problem, not a problem with this page. The usual causes '+
    'are an ad/content blocker, a corporate or ISP filter, or being offline.\n\n'+
    'Attempts:\n  · '+tried.join('\n  · ')
  );
  err.__friendly=true;
  throw err;
}

var RENDERERS={};   /* pages register themselves here */
var busy=false, again=false, againForce=false;
async function render(force){
  /* A render asked for while one is running (a filter changed mid-load) is
     queued, not dropped, so the screen never shows results for a filter that
     is no longer the one on screen. */
  if(busy){again=true;againForce=againForce||!!force;return;}
  busy=true;
  var id=currentId();
  paintNav();
  $('#crumb').textContent=(PAGES.filter(function(p){return p.id===id;})[0]||{}).label||'Console';
  var view=$('#view');
  /* Creators re-renders on every filter change. Keeping the current screen
     (dimmed) instead of a loading page means the filter box is never pulled
     out from under someone typing in it. */
  var keep=id==='creators'&&view.dataset.page==='creators';
  if(keep)view.classList.add('is-loading');
  else view.innerHTML='<div class="head"><div class="eyeb">Loading</div><h1>One moment…</h1></div>';
  view.dataset.page='';
  try{
    var fn=RENDERERS[id];
    if(!fn){
      /* Unknown page renders a panel, never a blank screen. This is the exact
         failure the old admin turned into a black page. */
      view.innerHTML='<div class="head"><div class="eyeb">Not found</div><h1>No such page.</h1>'+
        '<p class="sub">“'+esc(id)+'” is not a console page. Pick one from the sidebar.</p></div>';
      view.classList.remove('is-loading');
      busy=false; return;
    }
    var html=await fn(force);
    if(typeof html!=='string'||!html.trim())
      throw new Error('The '+id+' page returned nothing to display.');
    view.innerHTML=html;
    view.dataset.page=id;
    view.classList.remove('is-loading');
    if(fn.after)fn.after();
  }catch(e){
    view.classList.remove('is-loading');
    view.innerHTML='<div class="head"><div class="eyeb" style="color:var(--danger)">Error</div>'+
      '<h1>This page failed.</h1><p class="sub">'+esc(e.message||String(e))+'</p></div>'+
      '<div class="card"><div class="empty"><div class="ei">◎</div><b>The rest of the console still works</b>'+
      '<p>Use the sidebar to move elsewhere, or hit Refresh to try again.</p></div></div>';
  }
  busy=false;
  if(again){var f2=againForce;again=false;againForce=false;render(f2);}
}
window.addEventListener('hashchange',function(){render();});

/* Who holds the decision. On a campaign with a client attached, a new clip
   waits for the client (client_review_clip) and approves itself when
   review_due_at passes (cx_auto_approve_due, every 15 minutes). Clipency
   can still decide at any time; that overrides the wait. */
function rvLeft(iso){
  var ms=new Date(iso).getTime()-Date.now();
  if(!(ms>0))return 'any minute';
  var h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000);
  return 'in '+(h>=24?Math.floor(h/24)+'d '+(h%24)+'h':h>0?h+'h '+m+'m':Math.max(m,1)+'m');
}
function rvWho(s){
  var t='';
  if(s.status==='pending'&&s.review_due_at)t='With the client · auto-approves '+rvLeft(s.review_due_at);
  else if(s.review_source==='client')t=s.status==='rejected'?'Rejected by the client':'Approved by the client';
  else if(s.review_source==='auto')t='Auto-approved (client did not act)';
  return t?'<div style="font-size:10.5px;color:var(--ink-40);margin-top:5px;white-space:nowrap">'+esc(t)+'</div>':'';
}

/* Uphold or dismiss a client flag. Confirm first — upholding costs a clipper
   real money and dismissing puts a clip the client objected to back in front
   of them, so neither should be a stray click. */
async function resolveFlag(flagId,uphold,btn){
  var f=(RV.flags||[]).filter(function(x){return String(x.flag_id)===String(flagId);})[0]||{};
  var msg=uphold
    ? 'Uphold this flag?\n\n'+(f.handle||'The clip')+' stays offline and permanently loses '+money(f.frozen_amount)+
      '.\nThe money stays with the campaign.\n\nThe clipper will see:\n"'+(f.reason||'')+'"'
    : 'Dismiss this flag?\n\n'+(f.handle||'The clip')+' goes back live and gets '+money(f.frozen_amount)+
      ' returned.\nThe client who flagged it will see it is back.';
  if(!confirm(msg))return;
  btn.disabled=true; btn.textContent=uphold?'Upholding…':'Restoring…';
  try{
    var r=await sb.rpc('admin_resolve_flag',{p_flag_id:flagId,p_uphold:uphold,p_note:null});
    if(r.error)throw new Error(r.error.message);
    RV.rows=[]; RV.flags=[];      // force a refetch so the tab counts are right
    render(true);
  }catch(e){
    alert('Could not resolve the flag: '+e.message);
    btn.disabled=false; btn.textContent=uphold?'Uphold':'Dismiss';
  }
}

function reviewModal(id){
  var s=RV.rows.filter(function(x){return String(x.id)===String(id);})[0];
  if(!s)return;
  var camp=RV.camps.filter(function(c){return String(c.id)===String(s.campaign_id);})[0]||{};
  var rate=num(camp.rpm)?'$'+(num(camp.rpm)/1000).toFixed(2)+' per 1K views':'no rate set';
  var approved=s.status==='approved';

  openModal(
    '<div class="eyeb">'+(approved?'Approved submission':'Review submission')+'</div>'+
    '<h3>'+esc(s.handle||'·')+'</h3>'+
    '<p class="m-sub">'+esc(s.campaign_title||'·')+' · '+esc(s.platform||'·')+' · '+rate+'</p>'+
    (s.clip_url?'<a class="btn ghost" style="width:100%;margin-top:16px" href="'+esc(s.clip_url)+'" target="_blank" rel="noopener">&#128279; Open clip proof ↗</a>':
      '<p class="msg err">No clip URL on this submission.</p>')+
    (s.status==='pending'&&s.review_due_at
      ?'<p class="msg" style="color:var(--warn)">The client is reviewing this clip. It approves itself '+esc(rvLeft(s.review_due_at))+
       ' unless they act. Approving or rejecting here decides it now.</p>':'')+
    (s.rejection_reason?'<p class="msg err">Prior rejection: '+esc(s.rejection_reason)+'</p>':'')+
    (s.appeal_note?'<p class="msg" style="color:var(--warn)">Appeal: '+esc(s.appeal_note)+'</p>':'')+
    '<div class="metrics">'+
      '<div><div class="v" id="rmV">'+(s.views_count?fmt(s.views_count):'·')+'</div><div class="l">Views</div></div>'+
      '<div><div class="v" id="rmL">'+(s.views_count?fmt(s.likes):'·')+'</div><div class="l">Likes</div></div>'+
      '<div><div class="v" id="rmC">'+(s.views_count?fmt(s.comments):'·')+'</div><div class="l">Comments</div></div>'+
      '<div><div class="v" id="rmA">'+(num(s.approved_amount)?money(s.approved_amount):'·')+'</div><div class="l">Earned</div></div>'+
    '</div>'+
    '<p style="font-size:12px;color:var(--ink-40);line-height:1.55">'+
      (approved?'Refreshed automatically — every 12 hours for the first 3 days, then daily to day 14.'
              :'Approving reads the live counts from the platform and calculates earnings from the campaign rate.')+'</p>'+
    '<div class="mrow">'+
      (approved?'<button class="btn ghost" id="rmRefresh">&#8635; Refresh metrics</button>'
               :'<button class="btn ok" id="rmApprove">&#10003; Approve</button>')+
      (s.status!=='rejected'?'<button class="btn danger" id="rmReject">&#10007; Reject</button>':'')+
      '<button class="btn ghost" onclick="closeModal()">Close</button>'+
    '</div>'+
    '<div class="msg" id="rmMsg"></div>',
  function(){
    var msg=$('#rmMsg');
    var say=function(t,cls){msg.className='msg '+(cls||'');msg.textContent=t;};

    /* force:true on purpose.

       clip_metrics_eligible() refuses clips on a paused campaign, or on one
       that has spent its budget. That guard exists to stop background
       refreshes burning ScrapeCreators credits on clips nobody is watching
       any more — it is a cost control for BACKGROUND refreshes.

       A human pressing Approve is not that. It happens once, on demand, and
       the view count is exactly what the earnings are calculated from. Without
       the override, approving a clip submitted more than two weeks ago failed
       with "Metrics only refresh for approved clips on an active, in-budget
       campaign, within 14 days of submission" and the clip was approved with
       no views and no earnings. */
    async function pull(){
      var r=await sb.functions.invoke('fetch-clip-metrics',{body:{submission_id:id,force:true}});
      if(r.error){
        var d=''; try{d=(await r.error.context.json()).reason||(await r.error.context.json()).message||'';}catch(e){}
        throw new Error(d||r.error.message||'Could not read the clip.');
      }
      var f=await sb.from('clip_submissions')
        .select('views_count,likes,comments,engagement_rate,approved_amount,metrics_status,metrics_error')
        .eq('id',id).maybeSingle();
      if(f.data){
        Object.assign(s,f.data);
        $('#rmV').textContent=fmt(f.data.views_count);
        $('#rmL').textContent=fmt(f.data.likes);
        $('#rmC').textContent=fmt(f.data.comments);
        $('#rmA').textContent=money(f.data.approved_amount);
      }
      return f.data||{};
    }

    var ap=$('#rmApprove');
    if(ap)ap.onclick=async function(){
      ap.disabled=true;ap.textContent='Approving…';say('');

      /* Approval and metrics are two separate steps, and only the first one
         decides whether the clip is approved.

         The old version wrapped both in one try/catch. When the metrics
         fetch threw — ScrapeCreators rate-limited, out of credits, clip gone
         private, network blip — the catch reported the error and left the
         list untouched, so the row stayed under Pending and the Approved
         tab stayed empty. The clip WAS approved in the database. The console
         simply never said so, which reads as "approving does nothing".

         So: the approval is committed and the list refreshed no matter what
         happens next. Metrics failing is a warning, not an undo. */
      var approved=false;
      try{
        var r=await sb.rpc('admin_approve_submission',{p_id:id,p_amount:0,p_views:0});
        if(r.error)throw new Error(r.error.message);
        approved=true;
        s.status='approved';
      }catch(e){
        say(e.message||'Could not approve this clip.','err');
        ap.disabled=false;ap.textContent='✓ Approve';
        return;
      }

      ap.textContent='Reading metrics…';
      try{
        var d=await pull();
        if(d.metrics_status!=='ok'){
          say('Approved. The metrics could not be read yet'+(d.metrics_error?': '+d.metrics_error:'.')+' They will retry automatically.','warn');
        }else if(num(d.views_count)<500){
          say('Approved — but only '+fmt(d.views_count)+' views, under the 500 minimum. Reject if that is not acceptable.','warn');
        }else{
          say('Approved · '+fmt(d.views_count)+' views · '+money(d.approved_amount),'ok');
          setTimeout(function(){closeModal();render(true);},900);
          return;
        }
      }catch(e){
        /* Approved, metrics unavailable. Say exactly that. */
        say('Approved. Metrics could not be read right now ('+(e.message||'unknown error')+'). The scheduled refresh will fill them in.','warn');
      }

      ap.textContent='✓ Approved';
      render(true);
    };

    var rf=$('#rmRefresh');
    if(rf)rf.onclick=async function(){
      rf.disabled=true;rf.textContent='Reading…';say('');
      try{var d=await pull();say('Updated · '+fmt(d.views_count)+' views · '+money(d.approved_amount),'ok');render(true);}
      catch(e){say(e.message,'err');}
      rf.disabled=false;rf.textContent='↻ Refresh metrics';
    };

    var rj=$('#rmReject');
    if(rj)rj.onclick=async function(){
      var reason=prompt('Rejection reason (shown to the clipper):','');
      if(reason===null)return;
      if(!reason.trim()){say('A reason is required.','err');return;}
      rj.disabled=true;rj.textContent='Rejecting…';
      try{
        var r=await sb.rpc('admin_reject_submission',{p_id:id,p_reason:reason});
        if(r.error)throw new Error(r.error.message);
        closeModal();render(true);
      }catch(e){say(e.message,'err');rj.disabled=false;rj.textContent='✗ Reject';}
    };
  });
}


/* ============================================================
   CAMPAIGNS
   Rate is stored as rpm = dollars per 1,000,000 views, so
   rpm 1000 means $1.00 per 1,000. The form shows both so the
   number cannot be misread — that mismatch has bitten before.
   ============================================================ */
var CP={rows:[], clients:[], communities:[], apps:[], prates:{}, q:'', status:''};

/* Which of the two rate columns is live. `rpm` prices a million views;
   `rate_per_video` prices one approved clip flat. They are different
   units, so no screen may print one under the other's label. */
function isPerVideo(c){return String((c&&c.payout_model)||'per_view')==='per_video';}
var PLATS=['instagram','youtube','tiktok'];
var PLAT_NAME={instagram:'Instagram',youtube:'YouTube',tiktok:'TikTok'};
/* One dashboard per platform (campaigns.platform_split): the platforms a
   split campaign is shown as, the one that keeps the budget first. */
function cpSplitParts(c){
  var keep=String((c&&c.platform_split)||'').trim().toLowerCase();
  var plats=String((c&&c.platform)||'').split(',').map(function(p){return p.trim().toLowerCase();}).filter(Boolean);
  if(!keep||plats.length<2)return null;
  if(plats.indexOf(keep)<0)plats=[keep].concat(plats);
  return {keep:keep,order:[keep].concat(plats.filter(function(p){return p!==keep;}))};
}
/* "Vingo {UGC Campaign}" + youtube -> "Vingo · YouTube", as the portal names it. */
function cpPartTitle(title,p){
  var raw=String(title||'').trim(), clean=raw.replace(/\s*[\[{(][^\]})]*[\]})]/g,'').replace(/\s{2,}/g,' ').trim();
  return (clean||raw)+' \u00b7 '+(PLAT_NAME[p]||p);
}

      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">'+

        '</select>'+
        '<p style="font-size:11.5px;color:var(--ink-40);margin-top:6px">The client whose wallet funds this campaign and who can allocate or pull budget back. '+

    '</div>'+
    '<div class="mrow"><button class="btn ok" id="cfSave">'+(isNew?'Create campaign':'Save changes')+'</button>'+
      '<button class="btn ghost" onclick="closeModal()">Cancel</button></div>'+
    '<div class="msg" id="cfMsg"></div>',
  function(){
    /* ---- banner / icon upload -------------------------------------------
       Files go to the existing public `campaign-banners` bucket, which is
       already admin-write / public-read, so no new storage setup is needed.
       The URL is held here and written with the rest of the form, so a
       failed save never leaves a half-attached image. */
    var UP={banner:c.asset_url||null, icon:c.icon_url||null};
    var upmsg=$('#cf-upmsg');

    /* ---- payout model switch --------------------------------------------
       Swapping the model swaps which rate field is on screen AND which one
       the save validates, so the two can never disagree. The hidden field is
       left untouched — its value is zeroed on save, not here, so cancelling
       out of the modal changes nothing. */
    CF_MODEL=perVideo?'per_video':'per_view';
    function cfCcy(){var el=$('#cf-ccy');return el?el.value:ccyOf(c);}
    /* Currency switch. A new campaign just relabels: the admin is typing
       prices in the currency they picked. An existing one converts every
       amount in the form, from whatever currency it currently shows, at the
       rate the database will use (cx_fx_rates, and the campaign's own stamped
       rate for its current currency), so what is on screen is what saving
       will write. */
    var CF_FX_ORIG=num(c.fx_rate_per_usd)>0?num(c.fx_rate_per_usd):1;
    var CF_SHOWN=ccyOf(c);
    function cfRate(code){
      if(code===ccyOf(c))return CF_FX_ORIG;
      if(code==='USD')return 1;
      var r=CF_RATES&&CF_RATES.rates&&num(CF_RATES.rates[code]);
      return r>0?r:null;
    }
    var CF_MONEY=['#cf-rate','#cf-rpv','#cf-budget','#cf-cvid','#cf-crpm','#cf-feeamt','#cf-maxpay','#cf-maxpaycr'];
    (function(){var el=$('#cf-ccy');if(!el)return;
      el.onchange=async function(){
        var to=el.value, hint=$('#cf-ccyhint');
        if(!isNew){
          if(!CF_RATES){
            try{var fr=await sb.rpc('cx_fx_rates_public');if(!fr.error)CF_RATES=fr.data;}catch(e){}
          }
          var a=cfRate(CF_SHOWN), b=cfRate(to);
          if(!(a>0)||!(b>0)){
            el.value=CF_SHOWN;
            hint.style.color='var(--danger)';
            hint.textContent='Could not load today\'s exchange rates, so the currency was not changed. Try again.';
            return;
          }
          var kk=b/a;
          CF_MONEY.forEach(function(sel){var f=$(sel);if(!f||f.value.trim()==='')return;
            var v=parseFloat(f.value);if(!isFinite(v))return;
            f.value=String(Math.round(v*kk*100)/100);});
          $$('.cf-pr-money').forEach(function(f){if(f.value.trim()==='')return;
            var v=parseFloat(f.value);if(!isFinite(v))return;
            f.value=String(Math.round(v*kk*100)/100);});
          CF_SHOWN=to;
          hint.style.color='';
          hint.innerHTML=(to===ccyOf(c)
            ? 'Back to '+esc(to)+'. Nothing will be converted.'
            : 'Converted from '+esc(ccyOf(c))+' at 1 USD = '+(Math.round(cfRate(to)*10000)/10000)+' '+esc(to)+
              (CF_RATES&&CF_RATES.as_of?' ('+esc(CF_RATES.as_of)+')':'')+'. Saving restates the whole campaign'+
              (num(c.budget_used)>0?', including its approved clips. Creators keep exactly the USD they were credited.':'.'));
        }
        $$('.cf-sym').forEach(function(x){x.textContent=csym(to);});
        paintModel();};})();
    $$('.cf-pr').forEach(function(row){
      var on=$('.cf-pr-on',row);

    function wireUpload(key,maxMB){
      var zone=$('#cf-'+key+'-zone'), input=$('#cf-'+key);
      if(!zone||!input)return;
      zone.onclick=function(){input.click();};
      input.onchange=async function(){
        var f=input.files&&input.files[0];
        if(!f)return;
        if(!/^image\//.test(f.type)){
          upmsg.textContent='That is not an image file.';upmsg.style.color='var(--danger)';return;
        }
        if(f.size>maxMB*1024*1024){
          upmsg.textContent='That image is over '+maxMB+'MB. Please use a smaller file.';
          upmsg.style.color='var(--danger)';return;
        }
        upmsg.style.color='';upmsg.textContent='Uploading '+key+'…';
        try{
          var ext=(f.name.split('.').pop()||'jpg').toLowerCase().replace(/[^a-z0-9]/g,'')||'jpg';
          var path='campaigns/'+(id||'new')+'-'+key+'-'+Date.now()+'.'+ext;
          var up=await sb.storage.from('campaign-banners').upload(path,f,{upsert:true,contentType:f.type});
          if(up.error)throw new Error(up.error.message);
          var pub=sb.storage.from('campaign-banners').getPublicUrl(path);
          var url=pub&&pub.data&&pub.data.publicUrl;
          if(!url)throw new Error('Uploaded, but no public URL came back.');
          UP[key]=url;
          var img=$('#cf-'+key+'-img'), ph=$('#cf-'+key+'-ph');
          if(img){img.src=url;img.style.display='';}
          if(ph)ph.style.display='none';
          upmsg.textContent=(key==='banner'?'Banner':'Icon')+' uploaded. It saves with the campaign.';
        }catch(e){
          upmsg.style.color='var(--danger)';
          upmsg.textContent='Could not upload: '+(e.message||e);
        }
      };
    }
    wireUpload('banner',5);

    /* Live split. Three parties can be in a campaign now — Clipency, the
       agency and the creators — and the fee can sit inside or outside the
       budget. Every combination is arithmetic somebody will get wrong from a
       description, so show the numbers instead of explaining them. */
    function drawSplit(){
      var el=$('#cf-split'), mel=$('#cf-margin'); if(!el)return;
      var pv=CF_MODEL==='per_video';
      var b=parseFloat($('#cf-budget').value)||0;
      var pct=parseFloat($('#cf-feepct').value)||0;
      var amt=(($('#cf-feeamt')||{}).value||'').trim();
      var onTop=(($('#cf-feemode')||{}).value||'inclusive')==='on_top';
      var fee=amt!==''?(parseFloat(amt)||0):Math.round(b*pct/100*100)/100;
      if(!onTop&&fee>b)fee=b;

      var creatorRate = pv ? (parseFloat(($('#cf-rpv')||{}).value)||0)
                           : (parseFloat(($('#cf-rate')||{}).value)||0);
      var brandRate   = pv ? (parseFloat(($('#cf-cvid')||{}).value)||0)
                           : (parseFloat(($('#cf-crpm')||{}).value)||0);
      var spendable = onTop ? b : Math.round((b-fee)*100)/100;
      /* the margin is earned per delivered unit, so the creator share is just
         the ratio of the two rates — the same thing campaign_rate_ratio() does */
      var ratio = (brandRate>0 && creatorRate>0) ? Math.min(creatorRate/brandRate,1) : 1;
      var pool  = Math.round(spendable*ratio*100)/100;
      var agency= Math.round((spendable-pool)*100)/100;

      el.innerHTML='Client funds <b>'+moneyIn(b,cfCcy())+'</b> &nbsp;·&nbsp; '+
        'Clipency keeps <b>'+moneyIn(fee,cfCcy())+'</b>'+(amt!==''?' (fixed)':'')+
        (onTop?' <span style="color:var(--ink-40)">invoiced on top — the whole budget stays spendable</span>'
              :' <span style="color:var(--ink-40)">taken out of the budget</span>')+
        (amt!==''?'<div style="color:var(--ink-40);margin-top:4px">A fixed fee overrides the percentage.</div>':'');

      if(!mel)return;
      var unit=pv?'video':'1,000 views';
      if(brandRate>0&&creatorRate>0&&brandRate<creatorRate){
        mel.innerHTML='<span style="color:var(--danger)">The brand rate is below the creator rate — '+
          'the agency would be paying to work. Check the two figures.</span>';
        return;
      }
      if(!(brandRate>0)||!(creatorRate>0)||agency<=0){
        mel.innerHTML='<span style="color:var(--ink-40)">No agency margin — the brand is billed the creator rate. '+
          'Creators can earn <b style="color:var(--gold)">'+moneyIn(pool,cfCcy())+'</b>.</span>';
        return;
      }
      var cap = pv && brandRate>0 ? Math.floor(spendable/brandRate) : 0;
      mel.innerHTML=
        'Brand billed <b>'+moneyIn(brandRate,cfCcy())+'</b> / '+unit+' &nbsp;·&nbsp; '+
        'creator paid <b style="color:var(--gold)">'+moneyIn(creatorRate,cfCcy())+'</b> / '+unit+' &nbsp;·&nbsp; '+
        'agency keeps <b>'+moneyIn(Math.round((brandRate-creatorRate)*100)/100,cfCcy())+'</b> / '+unit+
        '<div style="margin-top:5px">'+moneyIn(spendable,cfCcy())+
          (cap>0?' buys <b>'+fmt(cap)+'</b> videos':'')+
          ' &nbsp;·&nbsp; creator pool <b>'+moneyIn(pool,cfCcy())+'</b>'+
          ' &nbsp;·&nbsp; agency margin <b>'+moneyIn(agency,cfCcy())+'</b> if it delivers in full</div>'+
        '<div style="color:var(--ink-40);margin-top:4px">Earned per delivered '+unit+
          ', not reserved up front. The brand dashboard shows their own rate and never a creator figure.</div>';
    }
    ['#cf-budget','#cf-feepct','#cf-feeamt','#cf-feemode','#cf-rate','#cf-rpv','#cf-cvid','#cf-crpm']
      .forEach(function(sel){
        var el=$(sel); if(el){el.oninput=drawSplit; el.onchange=drawSplit;}
      });
    paintModel();

    /* unpaid-platform exceptions: chips for the creators named, a search box
       to add one (admin_find_creators), x to remove. The ids live on the box. */
    (function(){
      var box=$('#cf-unpaid'); if(!box)return;
      var ids=[]; try{ids=JSON.parse(box.dataset.ids||'[]')||[];}catch(e){ids=[];}
      var names={};
      function labelOf(p){return p.username?'@'+String(p.username).replace(/^@/,''):(p.name||p.display_name||p.full_name||p.email||p.id);}
      function paint(){
        box.dataset.ids=JSON.stringify(ids);
        $('#cf-unpaid-chips').innerHTML=ids.length?ids.map(function(id){
          return '<span class="chip ok" style="display:inline-flex;align-items:center;gap:6px">'+esc(names[id]||(id.slice(0,8)+'\u2026'))+
            '<button type="button" data-unpaid-rm="'+esc(id)+'" aria-label="Remove" style="border:0;background:none;cursor:pointer;color:inherit;font-size:13px;line-height:1;padding:0">\u00d7</button></span>';}).join('')
          :'<span style="font-size:12px;color:var(--ink-40)">Nobody named.</span>';
        $$('[data-unpaid-rm]').forEach(function(b){b.onclick=function(){ids=ids.filter(function(x){return x!==b.dataset.unpaidRm;});paint();};});
      }
      if(ids.length){
        Promise.resolve(sb.from('profiles').select('id,username,display_name,full_name,email').in('id',ids)).then(function(r){
          (r&&r.data||[]).forEach(function(p){names[String(p.id)]=labelOf(p);}); paint();},function(){});
      }
      paint();
      var q=$('#cf-unpaid-q'),hits=$('#cf-unpaid-hits'),tm;
      if(q)q.oninput=function(){
        clearTimeout(tm); var v=q.value.trim(); if(v.length<2){hits.innerHTML='';return;}
        tm=setTimeout(async function(){
          var r=await sb.rpc('admin_find_creators',{p_q:v});
          var list=(!r.error&&Array.isArray(r.data)?r.data:[]).filter(function(p){return ids.indexOf(String(p.id))<0;}).slice(0,6);
          hits.innerHTML=list.length?list.map(function(p){var lab=labelOf(p);
            return '<button type="button" class="btn sm ghost" data-unpaid-add="'+esc(p.id)+'" data-lab="'+esc(lab)+'" style="justify-content:flex-start">'+esc(lab)+
              (p.email&&lab!==p.email?' <span style="color:var(--ink-40)">'+esc(p.email)+'</span>':'')+'</button>';}).join('')
            :'<span style="font-size:12px;color:var(--ink-40)">No creator matches.</span>';
          $$('[data-unpaid-add]').forEach(function(b){b.onclick=function(){var id=String(b.dataset.unpaidAdd);if(ids.indexOf(id)<0)ids.push(id);names[id]=b.dataset.lab;q.value='';hits.innerHTML='';paint();};});
        },250);
      };
    })();
    $('#cfSave').onclick=async function(){
      var msg=$('#cfMsg'), btn=this;
      var title=$('#cf-title').value.trim();
      var rate=parseFloat($('#cf-rate').value);
      var rpv=parseFloat($('#cf-rpv').value);
      var model=CF_MODEL;
      var budget=parseFloat($('#cf-budget').value);
      var fail=function(t){msg.className='msg err';msg.textContent=t;btn.disabled=false;btn.textContent=isNew?'Create campaign':'Save changes';};
      if(!title)return fail('A title is required.');
      var cvid=parseFloat($('#cf-cvid').value);
      var crpm=parseFloat($('#cf-crpm').value);
      if(model==='per_video'){
        if(!(rpv>=0))return fail('Enter a rate per video. 0 is allowed for a campaign that pays nothing.');
        if(isFinite(cvid)&&cvid>0&&cvid<rpv)
          return fail('The brand rate is below the creator rate — the agency would be paying to work.');
      }else{
        if(!(rate>=0))return fail('Enter a rate. 0 is allowed for a campaign that pays nothing.');
        if(isFinite(crpm)&&crpm>0&&crpm<rate)
          return fail('The brand rate is below the creator rate — the agency would be paying to work.');
      }
      if(!(budget>=0))return fail('Enter a budget. 0 is allowed, for example a YouTube-only campaign that pays nothing.');
      /* platform rows: read and check before anything is written */
      var prRows=[], prErr=null;
      $$('.cf-pr').forEach(function(row){
        if(prErr||!$('.cf-pr-on',row).checked)return;
        var pk=row.dataset.p, cr=parseFloat($('.cf-pr-cr',row).value), brs=$('.cf-pr-br',row).value.trim(), br=parseFloat(brs);
        if(!(cr>=0)){prErr='Enter a creator rate for '+PLAT_NAME[pk]+' (0 is allowed).';return;}
        if(brs!==''&&!(br>=0)){prErr='The brand price for '+PLAT_NAME[pk]+' is not a number.';return;}
        if(brs!==''&&br>0&&br<cr){prErr='The '+PLAT_NAME[pk]+' brand price is below its creator rate.';return;}
        var b2=brs===''?0:br;
        prRows.push(model==='per_video'
          ? {platform:pk, rate_per_video:Math.round(cr*100)/100, client_rate_per_video:Math.round(b2*100)/100, rpm:0, client_rpm:0}
          : {platform:pk, rpm:Math.round(cr*1000*100)/100, client_rpm:Math.round(b2*1000*100)/100, rate_per_video:0, client_rate_per_video:0});
      });
      if(prErr)return fail(prErr);
      btn.disabled=true;btn.textContent='Saving…';msg.className='msg';msg.textContent='';
      try{
        var numOrNull=function(sel){
          var v=parseFloat(($(sel)||{value:''}).value);
          return isFinite(v)&&v>0?v:null;
        };
        var payload={
          title:title,
          brand_name:$('#cf-brand').value.trim()||null,
          /* Exactly one rate is live and the other is zeroed, so no screen
             can read a stale figure from the model that is not in play.
             $ per 1,000 -> per 1,000,000, kept to 2dp rather than rounded to
             a whole number so rates like $0.125 per 1K survive the trip. */
          payout_model:model,
          /* Validated and upper-cased by the database; changing it re-prices
             fx_rate_per_usd, and is refused once a clip is approved. */
          rpm:model==='per_view'?Math.round((rate||0)*1000*100)/100:0,
          rate_per_video:model==='per_video'?Math.round((rpv||0)*100)/100:0,
          rate_label:model==='per_video'?'Rate per Video':'Rate per 1M Views',
          is_private:!!$('#cf-private').checked,
          platform_split:($('#cf-psplit')&&$('#cf-psplit').value)||null,
          unpaid_hidden_for:(function(){try{var v=JSON.parse(($('#cf-unpaid')||{dataset:{}}).dataset.ids||'[]');return Array.isArray(v)?v:[];}catch(e){return [];}})(),
          unpaid_hidden_mode:($('#cf-unpaid-mode')&&$('#cf-unpaid-mode').value)==='all_but_listed'?'all_but_listed':'listed',
          client_emails:!!$('#cf-cemails').checked,
          budget:budget,
          platform:$('#cf-platform').value.trim()||null,
          genre:$('#cf-genre').value.trim()||null,
          start_date:$('#cf-start').value||null,
          end_date:$('#cf-end').value||null,
          status:$('#cf-status').value,

          /* payout rules — blank means no limit, except the minimum which
             is NOT NULL and defaults to 0 */
          platform_fee_percent:Math.min(100,Math.max(0,parseFloat($('#cf-feepct').value)||0)),
          platform_fee_amount:($('#cf-feeamt').value.trim()===''?null:Math.max(0,parseFloat($('#cf-feeamt').value)||0)),

          /* Per-view rules gate on views, per-video rules gate on delivered
             videos per creator. Both are stored either way — only the live
             model is enforced, so switching a campaign back does not lose the
             other set. */
          min_views_per_clip:Math.max(0,parseInt($('#cf-minv').value,10)||0),
          max_views_per_clip:numOrNull('#cf-maxv'),
          max_pay_per_clip:numOrNull('#cf-maxpay'),
          min_videos_per_creator:Math.max(0,parseInt($('#cf-minvid').value,10)||0),
          max_videos_per_creator:(function(){var v=parseInt($('#cf-maxvid').value,10);
            return isFinite(v)&&v>0?v:null;})(),
          max_pay_per_creator:numOrNull('#cf-maxpaycr'),

          /* The agency layer. A blank brand rate means no margin: the brand is
             billed the creator rate and the split preview says so. */
          client_rate_per_video:model==='per_video'&&isFinite(cvid)&&cvid>0
            ? Math.round(cvid*100)/100 : 0,
          client_rpm:model==='per_view'&&isFinite(crpm)&&crpm>0
            ? Math.round(crpm*1000*100)/100 : 0,
          community_id:$('#cf-community').value||null,
          fee_mode:$('#cf-feemode').value==='on_top'?'on_top':'inclusive',

          /* the clipper-facing brief */
          requirements:$('#cf-reqs').value.trim()||null,
          description:$('#cf-desc').value.trim()||null,
          content_assets_url:$('#cf-content').value.trim()||null,
          guidelines_url:$('#cf-guide').value.trim()||null,

          asset_url:UP.banner,
          icon_url:UP.icon,

          updated_at:new Date().toISOString()
        };
        /* New campaign: the currency goes in with the row. Existing campaign:
           a change goes through the conversion, which restates the campaign,
           its brand rates and its clips in one transaction, and the update
           below then writes the (already converted) form values. */
        if(isNew)payload.currency=cfCcy();
        else if(cfCcy()!==ccyOf(c)){
          var cv=await sb.rpc('admin_convert_campaign_currency',{p_campaign:id,p_currency:cfCcy()});
          if(cv.error)throw new Error('Currency not changed: '+cv.error.message);
        }
        var campId=id;
        if(isNew){
          payload.created_by=ME.id; payload.created_at=new Date().toISOString();
          var ins=await sb.from('campaigns').insert(payload).select('id').maybeSingle();
          if(ins.error)throw new Error(ins.error.message);
          campId=ins.data&&ins.data.id;
        }else{
          var up=await sb.from('campaigns').update(payload).eq('id',id);
          if(up.error)throw new Error(up.error.message);
        }
        /* Platform rates go through their own staff-only call, after the row
           exists (a new campaign has no id before the insert). */
        if(campId){
          var prs=await sb.rpc('admin_set_platform_rates',{p_campaign:campId,p_rates:prRows});
          if(prs.error)throw new Error('Campaign saved, but the platform rates were not: '+prs.error.message);
        }
        /* Ownership goes through the staff-guarded RPC, never the payload.
           This sets the OWNER only — it must not drop the other clients who
           share the campaign, so the existing viewers are sent through
           unchanged and the owner is added to that list. */
        var chosen=$('#cf-client').value||null;
        var before=isNew?null:(c.client_user_id||null);
        if(campId&&chosen!==before){
          var keep=clientsOn(campId).map(function(l){return l.client_user_id;});
          if(chosen&&keep.indexOf(chosen)<0)keep.push(chosen);
          if(!chosen&&before)keep=keep.filter(function(u){return u!==before;});
          var lk=await sb.rpc('admin_set_campaign_clients',
            {p_campaign_id:campId,p_clients:keep,p_owner:chosen});
          if(lk.error)throw new Error('Campaign saved, but client access failed: '+lk.error.message);
        }
        closeModal();render(true);
      }catch(e){fail(e.message);}
    };
  });
}

/* ============================================================
   CLIENTS
   Client logins exist only here — there is no client signup.
   A client with no campaign linked sees an empty dashboard,
   which is why that state is called out in red.
   ============================================================ */
var CLI={rows:[], camps:[], links:[]};

/* Campaign ↔ client is many-to-many now. campaigns.client_user_id still exists
   and still means OWNER (whose wallet funds it); everyone else on the campaign
   is a viewer. These helpers read campaign_clients so nothing in the UI has to
   care which of the two it is looking at. */
function linksFor(clientId){ return CLI.links.filter(function(l){return l.client_user_id===clientId;}); }
function clientsOn(campId){ return CLI.links.filter(function(l){return l.campaign_id===campId;}); }
function isLinked(campId,clientId){ return CLI.links.some(function(l){return l.campaign_id===campId&&l.client_user_id===clientId;}); }
function ownerOf(campId){ var o=CLI.links.find(function(l){return l.campaign_id===campId&&l.is_owner;}); return o?o.client_user_id:null; }

RENDERERS.clients=async function(force){
  if(force||!CLI.rows.length){
    /* Was .eq('role','client'), which hid any clipper who was also given client
       access — their role stays 'clipper'. admin_list_clients() filters on
       client_access instead and counts shared campaigns. */
    var p=await sb.rpc('admin_list_clients');
    if(p.error)throw new Error(p.error.message);
    CLI.rows=(p.data||[]).map(function(r){
      return {id:r.user_id,email:r.email,full_name:r.full_name,
              company_name:r.company_name,role:r.role,created_at:r.created_at};
    });
    var c=await sb.from('campaigns').select('id,title,status,client_user_id,budget,budget_used,platform_fee_percent,platform_fee_amount,currency,fx_rate_per_usd').order('title');
    CLI.camps=c.data||[];
    var lk=await sb.rpc('admin_campaign_links');
    if(lk.error)throw new Error(lk.error.message);
    CLI.links=lk.data||[];
    /* Balances come from the ledger, summed here, so the figure on screen is
       always the sum of rows the client can see too. Staff read every row
       through the cwl_select policy. */
    var w=await sb.from('client_wallet_ledger').select('client_user_id,amount').limit(5000);
    CLI.bal={};
    (w.data||[]).forEach(function(r){
      CLI.bal[r.client_user_id]=(CLI.bal[r.client_user_id]||0)+num(r.amount);
    });
  }
  var list=CLI.rows, all=CLI.camps;
  var linked=all.filter(function(c){return clientsOn(c.id).length;}).length;

  return '<div class="head"><div class="eyeb">Client Access</div><h1>Clients.</h1>'+
    '<p class="sub">Create a client login and choose which campaigns it can see. Clients cannot sign up themselves.</p></div>'+
    '<div class="kpis">'+
      '<div class="kpi"><span class="lab">Client accounts</span><div class="big">'+fmt(list.length)+'</div><div class="sub-t">can sign in</div></div>'+
      '<div class="kpi"><span class="lab">Campaigns linked</span><div class="big">'+fmt(linked)+'</div><div class="sub-t">visible to a client</div></div>'+
      '<div class="kpi"><span class="lab">Unassigned</span><div class="big" style="color:'+(all.length-linked?'var(--warn)':'var(--ink-2)')+'">'+fmt(all.length-linked)+'</div><div class="sub-t">no client sees these</div></div>'+
      '<div class="kpi"><span class="lab">Portal</span><div class="big" style="font-size:15px;padding-top:9px"><a href="/client-signin" target="_blank" rel="noopener" style="color:var(--gold)">client-signin ↗</a></div><div class="sub-t">where they log in</div></div>'+
    '</div>'+
    '<div class="card"><div class="ch">'+
      '<div><h2>Client accounts</h2><div class="cs">'+fmt(list.length)+' account'+(list.length===1?'':'s')+'</div></div>'+
      '<button class="btn ok" id="clNew">+ New client</button></div>'+
      (list.length
       ? '<table><thead><tr><th>Client</th><th>Email</th><th>Company</th><th>Campaigns</th><th>Wallet</th><th>Added</th><th></th></tr></thead><tbody>'+
         list.map(function(c){
           var mine=linksFor(c.id);
           return '<tr>'+
             '<td><b>'+esc(c.full_name||'·')+'</b>'+
               (c.role&&c.role.toLowerCase()!=='client'?' <span class="chip" style="font-size:9.5px">also '+esc(c.role)+'</span>':'')+'</td>'+
             '<td class="mono">'+esc(c.email||'·')+'</td>'+
             '<td>'+esc(c.company_name||'·')+'</td>'+
             /* Owner vs viewer matters: only the owner's wallet funds a campaign. */
             '<td>'+(mine.length?mine.map(function(m){
                        return '<span class="chip '+(m.is_owner?'ok':'')+'" title="'+(m.is_owner?'Owns this — their wallet funds it':'Shared view only')+'">'+
                               esc(m.campaign_title)+(m.is_owner?'':' · view')+'</span>';}).join(' ')
                              :'<span style="color:var(--danger);font-size:12px">none — dashboard will be empty</span>')+'</td>'+
             '<td class="mono"><b>'+money(CLI.bal&&CLI.bal[c.id]||0)+'</b></td>'+
             '<td class="mono">'+day(c.created_at)+'</td>'+
             '<td style="white-space:nowrap">'+
               '<button class="btn sm ok" data-wal="'+esc(c.id)+'" data-wn="'+esc(c.full_name||c.email||'Client')+'">Funds</button> '+
               '<button class="btn sm ghost" data-cl="'+esc(c.id)+'" data-em="'+esc(c.email||'')+'">Campaigns</button></td>'+
           '</tr>';}).join('')+'</tbody></table>'
       : '<div class="empty"><div class="ei">◎</div><b>No client accounts yet</b>'+
         '<p>Create one to give a brand access to its own dashboard, showing only the campaigns you link to it.</p></div>')+

};
