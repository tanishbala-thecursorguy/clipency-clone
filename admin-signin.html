<!DOCTYPE html>
<html lang="en" data-theme="light">
<script>
/* Theme follows the visitor's one site-wide choice (clipency-theme). */
(function(){var t;try{t=localStorage.getItem('clipency-theme');}catch(e){}document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipency | Admin Sign In</title>
<meta name="robots" content="noindex, nofollow">
<script>
/* Admin entry point (linked from the landing footer → Products → Admin).
   Signs in with Supabase, then asks admin_access_check whether this account
   is staff. Anyone else is signed straight back out. */
window.CLIPENCY_SITE = {
  ADMIN_CONSOLE_URL: "/console",
  SUPABASE_URL:      "https://spwtkdgpgeutrhwcjrpy.supabase.co",
  SUPABASE_ANON_KEY: "sb_publishable_IInNrDBLK3dINHSyWaUDzg_UWF63j0B"
};
</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js" defer></script>
<link rel="icon" href="/favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B0B0B; --paper:#F5F2ED; --gold:#D8AA74; --bronze:#8C6A45;
  --ink-70:rgba(11,11,11,.7); --ink-55:rgba(11,11,11,.55); --ink-40:rgba(11,11,11,.42); --ink-25:rgba(11,11,11,.25);
  --line:rgba(11,11,11,.1); --field:#FFFFFF; --err:#B4462F;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Inter',system-ui,-apple-system,sans-serif;
  --card:rgba(255,255,255,.72); --chip:#FFFFFF;
}
[data-theme="dark"]{
  --ink:#EFEBE3; --paper:#12100E; --bronze:#D8AA74;
  --ink-70:rgba(239,235,227,.72); --ink-55:rgba(239,235,227,.56); --ink-40:rgba(239,235,227,.42); --ink-25:rgba(239,235,227,.26);
  --line:rgba(239,235,227,.1); --field:#1C1916; --err:#E0A196; --card:rgba(28,25,22,.78); --chip:#1C1916;
}
[data-theme="dark"] button{background:#EFEBE3;color:#0B0A08;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;}
body{
  background:var(--paper); color:var(--ink); font-family:var(--sans); -webkit-font-smoothing:antialiased;
  display:flex; flex-direction:column; align-items:center; justify-content:center; min-height:100vh; padding:24px 16px;
  background-image:radial-gradient(1200px 600px at 50% -10%, rgba(216,170,116,.18), transparent 60%);
}
.back{
  position:fixed; top:22px; left:22px; display:inline-flex; align-items:center; gap:8px; padding:10px 16px;
  border-radius:999px; background:var(--chip); color:var(--ink-70); text-decoration:none; font-size:13px; letter-spacing:.04em;
  box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);
}
.back:hover{color:var(--ink);}
.card{
  width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:22px;
  padding:40px 36px 32px; box-shadow:0 30px 80px -30px rgba(60,40,20,.25); backdrop-filter:blur(8px);
}
.brand{display:flex; align-items:center; gap:10px; font-size:12px; letter-spacing:.32em; font-weight:600; text-transform:uppercase;}
.brand .tag{color:var(--bronze); font-weight:500; letter-spacing:.28em; padding-left:10px; border-left:1px solid var(--ink-25);}
h1{font-family:var(--serif); font-weight:500; font-size:36px; line-height:1.1; margin-top:28px;}
.sub{color:var(--ink-55); font-size:13.5px; margin-top:8px; line-height:1.55;}
form{margin-top:28px; display:grid; gap:16px;}
label{display:block; font-size:10.5px; letter-spacing:.24em; text-transform:uppercase; color:var(--ink-40); margin-bottom:7px;}
input{
  width:100%; font:inherit; font-size:14.5px; color:var(--ink); background:var(--field); border:1px solid var(--line);
  border-radius:12px; padding:13px 14px; outline:none; transition:border-color .2s, box-shadow .2s;
}
input:focus{border-color:var(--gold); box-shadow:0 0 0 3px rgba(216,170,116,.22);}
button{
  margin-top:6px; width:100%; border:0; border-radius:12px; padding:14px; background:var(--ink); color:#fff;
  font:inherit; font-size:14.5px; font-weight:500; letter-spacing:.02em; cursor:pointer; transition:opacity .2s;
}
button[disabled]{opacity:.55; cursor:default;}
.msg{min-height:20px; font-size:12.5px; line-height:1.5; color:var(--err); text-align:center;}
.msg.ok{color:var(--bronze);}
.foot{margin-top:22px; text-align:center; font-size:12px; color:var(--ink-40); letter-spacing:.03em;}
.foot a{color:var(--bronze); text-decoration:none;}
@media (max-width:480px){ .card{padding:32px 22px 26px;} h1{font-size:30px;} .back{top:14px; left:14px;} }
</style>
</head>
<body>
<a class="back" href="/">&#8592; Back to site</a>

<main class="card">
  <div class="brand">Clipency <span class="tag">Admin</span></div>
  <h1>Admin console</h1>
  <p class="sub">Restricted to Clipency staff. Sign in with your admin account to review clips, manage campaigns and process payouts.</p>

  <form id="f" novalidate>
    <div>
      <label for="em">Email address</label>
      <input id="em" type="email" autocomplete="username" placeholder="you@clipency.in" required>
    </div>
    <div>
      <label for="pw">Password</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <button id="go" type="submit">Sign in to console &#8594;</button>
    <p class="msg" id="msg" role="status"></p>
  </form>

  <p class="foot">Not staff? <a href="/signup">Clipper sign-in</a> · <a href="/client-signin">Client sign-in</a></p>
</main>

<script>
(function(){
  var CFG = window.CLIPENCY_SITE, sb = null;
  var f = document.getElementById('f'), em = document.getElementById('em'), pw = document.getElementById('pw');
  var go = document.getElementById('go'), msg = document.getElementById('msg');
  function say(t, ok){ msg.textContent = t || ''; msg.className = 'msg' + (ok ? ' ok' : ''); }
  function client(){
    if(!sb && window.supabase && window.supabase.createClient) sb = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);
    return sb;
  }
  async function staffRole(c){
    var r = await c.rpc('admin_access_check');
    return (!r.error && r.data && r.data.role) || null;
  }

  /* Already signed in as staff? Go straight to the console. */
  window.addEventListener('load', async function(){
    var c = client(); if(!c) return;
    try{
      var s = await c.auth.getSession();
      if(s.data && s.data.session){
        var role = await staffRole(c);
        if(role === 'admin' || role === 'reviewer') location.replace(CFG.ADMIN_CONSOLE_URL);
      }
    }catch(e){}
  });

  f.addEventListener('submit', async function(ev){
    ev.preventDefault();
    var c = client();
    if(!c){ say('Still loading, try again in a second.'); return; }
    if(!em.value.trim() || !pw.value){ say('Enter your email and password.'); return; }
    go.disabled = true; say('Signing in…', true);
    try{
      var r = await c.auth.signInWithPassword({ email: em.value.trim(), password: pw.value });
      if(r.error) throw new Error(/invalid login/i.test(r.error.message) ? 'Email or password is incorrect.' : r.error.message);
      var role = await staffRole(c);
      if(role !== 'admin' && role !== 'reviewer'){
        await c.auth.signOut();
        throw new Error('This account does not have admin access.');
      }
      say('Signed in. Opening the console…', true);
      location.replace(CFG.ADMIN_CONSOLE_URL);
    }catch(e){
      say(e.message || 'Something went wrong. Please try again.');
      go.disabled = false;
    }
  });
})();
</script>
</body>
</html>
