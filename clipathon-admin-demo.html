  var r=regOf(c.id); return r && r.status==='approved' && c.auth_user_id && verifiedHandle(c.id); });
var bi=0, filled=[0,0,0,0,0];
for(var s=0;s<ready.length;s++){
  var b = DB.brands[bi % 5];
  var guard=0;
  while(filled[bi%5] >= b.slots_taken && guard<10){ bi++; b = DB.brands[bi % 5]; guard++; }
  if(filled[bi%5] >= b.slots_taken) break;
  filled[bi%5]++;
  var auto = chance(0.12);
  DB.slots.push({ id:uid(), cycle_id:CID, registration_id:regOf(ready[s].id).id, brand_id:b.id,
    auto_assigned:auto, selected_at:hrs(-int(80,96)), changed_from:null, changed_at:null,
    changed_by:null, change_reason:null, created_at:hrs(-int(80,96)) });
  bi++;
}
DB.brands.forEach(function(b,i){ b.slots_taken = filled[i]; });

/* ---------- submissions and snapshots ----------
   The cycle is past the cutoff, so most slots turned into an entry.
   A slice is still in the QC queue, which is the whole point of the
   screen, and a few are disqualified for the reasons that actually
   come up. */
DB.submissions = []; DB.metric_snapshots = [];
var DQ = ['late','incomplete','taken_down','brand_non_compliant','artificial_engagement','not_original','wrong_brand'];
DB.slots.forEach(function(sl, n){
  if(!chance(0.86)) return;                       /* some never submitted */
  var reg = DB.registrations.filter(function(r){ return r.id===sl.registration_id; })[0];
  var cr  = creatorOf(reg.creator_id);
  var handle = cr.email.split('@')[0].replace('.','');
  var st, quality=null, compliance=null, dq=null, note=null;
  var roll = rnd();
  if(roll < 0.62)      st='verified';
  else if(roll < 0.80) st='complete';             /* waiting on QC */
  else if(roll < 0.86) st='under_review';
  else if(roll < 0.91) st='link_submitted';       /* incomplete */
  else if(roll < 0.95) st='rejected';
  else                 st='disqualified';

  var complete = (st!=='link_submitted');
  if(st==='verified'){ quality=int(58,96); compliance=int(65,100); }
  if(st==='rejected'){ quality=int(30,62); compliance=int(40,80);
    note='The disclosure is missing from the caption. Add it and resubmit before the cutoff.'; }
  if(st==='disqualified'){ dq=pick(DQ);
    note = dq==='artificial_engagement' ? 'The view curve does not match the comment count. We checked twice.'
         : dq==='taken_down' ? 'The post was deleted before we could verify it.'
         : dq==='late' ? 'Posted after the cutoff.'
         : 'Does not follow the brief.'; }

  var sub = { id:uid(), cycle_id:CID, registration_id:sl.registration_id, brand_id:sl.brand_id,
    slot_id:sl.id, post_url:'https://instagram.com/reel/'+handle.slice(0,8)+int(1000,9999),
    platform:'instagram', platform_post_id:String(int(100000,999999)), posted_at:hrs(-int(22,70)),
    link_submitted_at:hrs(-int(22,70)), link_valid:st!=='disqualified', link_checked_at:hrs(-int(2,20)),
    link_error:null,
    file_name: complete ? (handle.slice(0,10)+'-raw.mp4') : null,
    file_bytes: complete ? int(40,320)*1000000 : null,
    file_mime: complete ? 'video/mp4' : null,
    drive_file_id:null, drive_url: complete ? 'https://drive.test/'+handle : null,
    file_uploaded_at: complete ? hrs(-int(21,68)) : null,
    is_complete: complete, status:st, qc_note:note,
    qc_by: (st==='verified'||st==='rejected'||st==='disqualified') ? uid() : null,
    qc_at: (st==='verified'||st==='rejected'||st==='disqualified') ? hrs(-int(2,18)) : null,
    compliance_score:compliance, quality_score:quality,
    scored_by:null, scored_at:null, dq_reason:dq, dq_note:null,
    dq_at: dq ? hrs(-int(2,18)) : null,
    approved_at: st==='verified' ? hrs(-int(2,18)) : null,
    created_at:hrs(-int(22,70)), updated_at:hrs(-int(1,20)) };
  DB.submissions.push(sub);

  /* snapshots: two captures for most verified entries, the second final */
  if(st==='verified'){
    var v1 = int(1200, 240000);
    DB.metric_snapshots.push({ id:uid(), submission_id:sub.id, cycle_id:CID, snapshot_no:1,
      is_final:false, captured_at:hrs(-18), views:v1, likes:Math.round(v1*0.061),
      comments:Math.round(v1*0.0042), shares:Math.round(v1*0.0031), saves:Math.round(v1*0.0090),
      engagement_rate:null, screenshot_url:null, raw:null, captured_by:null, source:'manual' });
    if(chance(0.82)){
      var v2 = Math.round(v1 * (1.15 + rnd()*0.9));
      DB.metric_snapshots.push({ id:uid(), submission_id:sub.id, cycle_id:CID, snapshot_no:2,
        is_final:true, captured_at:hrs(-3), views:v2, likes:Math.round(v2*0.058),
        comments:Math.round(v2*0.0040), shares:Math.round(v2*0.0029), saves:Math.round(v2*0.0086),
        engagement_rate:null, screenshot_url:null, raw:null, captured_by:null, source:'manual' });
    }
  }
});

   funnel is deliberately lossy, and the leaderboard is much shorter

var referrers = DB.creators.slice(0, 120);

  var n = chance(0.55) ? int(1,5) : 0;
  for(var k=0;k<n;k++){
    var target = DB.creators[int(150, DB.creators.length-1)];
    if(target.id===rf.id) continue;
    var treg = regOf(target.id);
    if(!treg) continue;
    var stage, paid=0, sub=null;

    else if(roll<0.70) stage='submitted';

      qualifying_submission_id:sub, points_awarded:paid,
      points_awarded_at: paid?made:null, created_at:made, updated_at:made };

/* ============================================================
   THE FAKE CLIENT
   ============================================================
   Enough of PostgREST to satisfy the console: filters, ordering,
   limits, embedded relations, inserts, updates and deletes. It is
   not a database. It is the smallest thing that makes every screen
   behave the way the real one does.
   ============================================================ */

/* Which column joins to which table, for the embedded selects the
   console uses (`*, creators(full_name)` and friends). */
var FK = {
  creators:'creator_id', brands:'brand_id', registrations:'registration_id',
  prizes:'prize_id', tasks:'task_id', sessions:'session_id', cycles:'cycle_id',
  submissions:'submission_id', ambassadors:'ambassador_id'
};
var TARGET = { referrer_id:'creators', referred_creator_id:'creators', creator_id:'creators',
  brand_id:'brands', registration_id:'registrations', prize_id:'prizes', task_id:'tasks',
  session_id:'sessions', submission_id:'submissions', ambassador_id:'ambassadors' };

/* Split "a, b(x, y), c:fk(z)" into top level pieces. */
function splitTop(s){
  var out=[], depth=0, cur='';
  for(var i=0;i<s.length;i++){
    var ch=s[i];
    if(ch==='(') depth++;
    if(ch===')') depth--;
    if(ch===',' && depth===0){ out.push(cur.trim()); cur=''; continue; }
    cur+=ch;
  }
  if(cur.trim()) out.push(cur.trim());
  return out;
}
function embedsOf(sel){
  return splitTop(sel||'*').filter(function(p){ return p.indexOf('(')>-1; }).map(function(p){
    var open=p.indexOf('('), head=p.slice(0,open).trim(), inner=p.slice(open+1, p.lastIndexOf(')'));
    var alias=head, col=null, rel=head;
    if(head.indexOf(':')>-1){ alias=head.split(':')[0].trim(); col=head.split(':')[1].trim(); rel=TARGET[col]||col; }
    else { col = FK[head] || (head.replace(/s$/,'')+'_id'); }
    return { alias:alias, col:col, rel:rel, inner:inner };
  });
}
function byId(rel,id){
  var t=DB[rel]||[];
  for(var i=0;i<t.length;i++) if(t[i].id===id) return t[i];
  return null;
}
function hydrate(row, sel){
  var em=embedsOf(sel);
  if(!em.length) return row;
  var out={}; for(var k in row) out[k]=row[k];
  em.forEach(function(e){
    var target = byId(e.rel, row[e.col]);
    out[e.alias] = target ? hydrate(target, e.inner) : null;
  });
  return out;
}

function tableOf(rel){ return VIEWS[rel] ? VIEWS[rel]() : (DB[rel] || []); }

/* ---------- the query builder ---------- */
function Q(rel){
  var st = { rel:rel, sel:'*', eq:[], sorts:[], lim:null, op:null, val:null };
  var api = {
    select:function(s){ st.sel = s || '*'; return api; },
    eq:function(c,v){ st.eq.push([c,v]); return api; },
    neq:function(c,v){ st.eq.push([c,v,'neq']); return api; },
    order:function(c,o){ st.sorts.push([c, !(o && o.ascending===false)]); return api; },
    limit:function(n){ st.lim=n; return api; },
    insert:function(v){ st.op='insert'; st.val=v; return api; },
    update:function(v){ st.op='update'; st.val=v; return api; },
    delete:function(){ st.op='delete'; return api; },
    then:function(res, rej){ return Promise.resolve(run(st)).then(res, rej); }
  };
  return api;
}
function matches(row, eqs){
  return eqs.every(function(e){
    return e[2]==='neq' ? row[e[0]] !== e[1] : row[e[0]] === e[1];
  });
}
function run(st){
  var live = DB[st.rel];

  if(st.op && !live) return { data:null, error:{ message:'no such table: '+st.rel } };

  if(st.op==='insert'){
    var rowsIn = Array.isArray(st.val) ? st.val : [st.val];
    var made = rowsIn.map(function(v){
      var row={ id:uid(), created_at:new Date().toISOString(), updated_at:new Date().toISOString() };
      for(var k in v) row[k]=v[k];
      live.push(row); return row;
    });
    return { data:made, error:null };
  }
  if(st.op==='update'){
    var hit = live.filter(function(r){ return matches(r, st.eq); });
    hit.forEach(function(r){ for(var k in st.val) r[k]=st.val[k]; r.updated_at=new Date().toISOString(); });
    /* the real schema derives the rest of the clock from one anchor */
    if(st.rel==='cycles' && st.val.registration_closes) hit.forEach(deriveClock);
    return { data:hit, error:null };
  }
  if(st.op==='delete'){
    var keep=[], gone=[];
    live.forEach(function(r){ (matches(r, st.eq) ? gone : keep).push(r); });
    DB[st.rel]=keep;
    return { data:gone, error:null };
  }

  var rows = tableOf(st.rel).filter(function(r){ return matches(r, st.eq); });
  st.sorts.slice().reverse().forEach(function(s){
    var col=s[0], asc=s[1];
    rows = rows.slice().sort(function(a,b){
      var x=a[col], y=b[col];
      if(x==null && y==null) return 0;
      if(x==null) return 1;
      if(y==null) return -1;
      if(x<y) return asc?-1:1;
      if(x>y) return asc?1:-1;
      return 0;
    });
  });
  if(st.lim) rows = rows.slice(0, st.lim);
  return { data: rows.map(function(r){ return hydrate(r, st.sel); }), error:null };
}

function deriveClock(cy){
  var t = new Date(cy.registration_closes).getTime();
  var H = 3600000;
  cy.brands_reveal_at      = new Date(t + 4*24*H + 12*H).toISOString();
  cy.slots_open_at         = new Date(t + 5*24*H).toISOString();
  cy.slots_close_at        = new Date(t + 5*24*H + 8*H).toISOString();
  cy.submission_cutoff_at  = new Date(t + 8*24*H + 13*H).toISOString();
  cy.finale_at             = new Date(t + 9*24*H + 15*H).toISOString();
}

var ME = { role:'owner', email:'ayush@clipency.in' };

function has(roles){ return ME.role==='owner' || roles.indexOf(ME.role) > -1; }
function deny(roles){ return { ok:false, message:'Not permitted. This action needs one of: ' + roles.join(', ') }; }
function cycle(){ return DB.cycles[0]; }
function audit(action, table){

    target_table:table, target_id:uid(), cycle_id:CID, old_data:null, new_data:null,

function ledger(creatorId, source, amount, reason){
  DB.points_ledger.unshift({ id:uid(), season_id:SEASON_ID, cycle_id:CID, creator_id:creatorId,
    source:source, amount:amount, reason:reason, task_completion_id:null, referral_id:null,

}

/* Approving a registration advances any referral pointing at that
   creator, which is what the trigger in 009 does. */
function advanceReferral(creatorId, stage, pay){
  DB.referrals.forEach(function(r){
    if(r.referred_creator_id !== creatorId) return;
    if(r.stage==='approved' || r.stage==='rejected') return;
    r.stage = stage; r.stage_changed_at = new Date().toISOString();
    if(pay && !r.points_awarded){
      r.points_awarded = 250; r.points_awarded_at = new Date().toISOString();
      var who = creatorOf(r.referred_creator_id);
      ledger(r.referrer_id, 'referral', 250, 'Referral approved: ' + (who?who.full_name:'a creator'));
    }
  });
}

/* Locking the results is what turns a rank into an award. Until then a
   prize tier is a promise about a position nobody officially holds. */
function awardPrizes(){
  DB.prize_awards = [];
  var ranked = DB.scores.slice().sort(function(a,b){ return a.rank_overall - b.rank_overall; });
  var takenBy = {};
  DB.prizes.forEach(function(pz){
    if(pz.kind === 'overall' && pz.rank_from){
      for(var r = pz.rank_from; r <= (pz.rank_to || pz.rank_from); r++){
        var sc = ranked[r-1];
        if(!sc) continue;
        var reg = byId('registrations', byId('submissions', sc.submission_id).registration_id);
        DB.prize_awards.push({ id:uid(), prize_id:pz.id, cycle_id:CID, creator_id:reg.creator_id,
          submission_id:sc.submission_id, season_id:SEASON_ID, final_rank:r,
          cash_minor:pz.cash_minor, non_cash:pz.non_cash, announced_at:null,
          created_at:new Date().toISOString() });
        takenBy[reg.creator_id] = true;
      }
    }
    if(pz.kind === 'brand'){
      DB.brands.forEach(function(b){
        var top = ranked.filter(function(x){ return x.brand_id === b.id; })[0];
        if(!top) return;
        var reg = byId('registrations', byId('submissions', top.submission_id).registration_id);
        DB.prize_awards.push({ id:uid(), prize_id:pz.id, cycle_id:CID, creator_id:reg.creator_id,
          submission_id:top.submission_id, season_id:SEASON_ID, final_rank:top.rank_overall,
          cash_minor:pz.cash_minor, non_cash:pz.non_cash + ' (' + b.name + ')', announced_at:null,
          created_at:new Date().toISOString() });
      });
    }
  });
  /* Results points, which is the third source on the season board. */
  ranked.slice(0, 50).forEach(function(sc, i){
    var reg = byId('registrations', byId('submissions', sc.submission_id).registration_id);
    ledger(reg.creator_id, 'result', Math.max(50, 1000 - i*18), 'Finished ' + (i+1) + ' overall in Cycle 01');
  });
}

      screenshot_url:a.p_screenshot||null, raw:null, captured_by:null, source:'manual' });
    return { ok:true, message:'Snapshot ' + (prev.length+1) + ' captured' + (a.p_is_final?', marked final':'') };
  },
  admin_run_scoring: function(){
    if(!has(['ops'])) return deny(['ops']);
    var cy = cycle();
    if(DB.scores.some(function(s){ return s.locked_at; }))
      return { ok:false, message:'These results are signed off and locked. Nothing can rescore them.' };
    var w = cy.scoring_weights;
    var verified = DB.submissions.filter(function(s){ return s.status==='verified'; });
    var rowsS = [];
    verified.forEach(function(s){
      var fin = DB.metric_snapshots.filter(function(m){ return m.submission_id===s.id && m.is_final; })[0];
      if(!fin) return;
      rowsS.push({ sub:s, snap:fin });
    });
    if(!rowsS.length) return { ok:false, message:'No verified entry has a final snapshot yet. Capture those first.' };
    var maxV = Math.max.apply(null, rowsS.map(function(r){ return r.snap.views; }));
    var maxE = Math.max.apply(null, rowsS.map(function(r){ return r.snap.engagement_rate; }));
    DB.scores = rowsS.map(function(r){
      var vs = maxV ? Math.round(r.snap.views / maxV * 100) : 0;
      var es = maxE ? Math.round(r.snap.engagement_rate / maxE * 100) : 0;
      var q  = r.sub.quality_score || 0, c = r.sub.compliance_score || 0;
      var total = Math.round((vs*w.views + es*w.engagement + q*w.quality + c*w.compliance) / 100 * 100) / 100;
      return { id:uid(), cycle_id:CID, submission_id:r.sub.id, brand_id:r.sub.brand_id,
        snapshot_id:r.snap.id, views_score:vs, engagement_score:es, quality_score:q,
        compliance_score:c, weights_used:w, total_score:total, rank_in_brand:null, rank_overall:null,
        verified_by:null, verified_at:null, signed_off_by_1:null, signed_off_by_2:null,
        locked_at:null, computed_at:new Date().toISOString(), updated_at:new Date().toISOString() };
    });
    DB.scores.sort(function(a,b){ return b.total_score - a.total_score; });
    DB.scores.forEach(function(s,i){ s.rank_overall = i+1; });
    var per={};
    DB.scores.forEach(function(s){ per[s.brand_id]=(per[s.brand_id]||0)+1; s.rank_in_brand=per[s.brand_id]; });
    audit('scoring_run','scores');
    return { ok:true, message:'Scored ' + DB.scores.length + ' entries and ranked them.' };
  },
  admin_signoff: function(){
    if(!has(['ops'])) return deny(['ops']);
    if(!DB.scores.length) return { ok:false, message:'Run scoring before signing anything off.' };
    var first = DB.scores[0];
    if(first.locked_at) return { ok:false, message:'Already signed off and locked.' };
    if(!first.signed_off_by_1){
      DB.scores.forEach(function(s){ s.signed_off_by_1 = ME.email; });
      audit('results_signed_1','scores');
      return { ok:true, message:'Your signature is recorded. A second, different operator has to sign before the results lock.' };
    }
    if(first.signed_off_by_1 === ME.email)
      return { ok:false, message:'You have already signed. The second signature has to be somebody else.' };
    DB.scores.forEach(function(s){ s.signed_off_by_2 = ME.email; s.locked_at = new Date().toISOString(); });
    awardPrizes();
    audit('results_locked','scores');
    return { ok:true, message:'Signed off and locked. Ranks are final, and the prize awards have been created.' };
  },
  admin_set_cycle_status: function(a){
    if(!has(['ops'])) return deny(['ops']);
    var cy = byId('cycles', a.p_cycle_id); if(!cy) return { ok:false, error:'not_found' };
    cy.status = a.p_status;
    audit('cycle_status_changed','cycles');
    return { ok:true, message:'The cycle is now in ' + a.p_status.replace(/_/g,' ') + '.' };
  },
  admin_auto_assign: function(){
    if(!has(['ops'])) return deny(['ops']);
    var ready = VIEWS.v_creator_readiness().filter(function(r){
      return r.ready_for_slot_selection && !r.has_slot; });
    if(!ready.length) return { ok:true, message:'Everybody who is ready already has a slot.' };
    var n=0;
    ready.forEach(function(r){
      var fill = VIEWS.v_brand_fill().filter(function(b){ return b.slots_left>0; });
      if(!fill.length) return;
      fill.sort(function(x,y){ return y.slots_left - x.slots_left; });
      var reg = DB.registrations.filter(function(x){ return x.creator_id===r.creator_id; })[0];
      DB.slots.push({ id:uid(), cycle_id:CID, registration_id:reg.id, brand_id:fill[0].brand_id,
        auto_assigned:true, selected_at:new Date().toISOString(), changed_from:null, changed_at:null,
        changed_by:null, change_reason:'Auto assigned at the window close', created_at:new Date().toISOString() });
      n++;
    });
    audit('slots_auto_assigned','slots');
    return { ok:true, message:'Placed ' + n + ' creator' + (n===1?'':'s') + ' onto the emptiest brands.' };
  },
  admin_move_slot: function(a){
    if(!has(['ops'])) return deny(['ops']);
    var sl = byId('slots', a.p_slot_id); if(!sl) return { ok:false, error:'not_found' };
    var fill = VIEWS.v_brand_fill().filter(function(b){ return b.brand_id===a.p_brand_id; })[0];
    if(!fill || fill.slots_left<=0) return { ok:false, message:'That brand is full. Nobody can be moved onto it.' };
    sl.changed_from = sl.brand_id; sl.brand_id = a.p_brand_id;
    sl.changed_at = new Date().toISOString(); sl.change_reason = a.p_reason || null;
    sl.auto_assigned = false;
    audit('slot_moved','slots');
    return { ok:true, message:'Moved to ' + fill.name + '.' };
  },
  admin_set_task_points: function(a){
    if(!has(['ops'])) return deny(['ops']);
    var t = byId('tasks', a.p_task_id); if(!t) return { ok:false, error:'not_found' };
    var was = t.points, diff = a.p_points - was;
    t.points = a.p_points;
    var n = 0;
    if(a.p_retro && diff !== 0){
      DB.task_completions.filter(function(c){ return c.task_id===t.id && !c.revoked_at; }).forEach(function(c){
        var reg = byId('registrations', c.registration_id);
        if(!reg) return;
        ledger(reg.creator_id, 'task', diff,
          'Task repriced from ' + was + ' to ' + a.p_points + ': ' + t.title);
        n++;
      });
    }
    audit('task_points_changed','tasks');
    return { ok:true, message: n
      ? ('Now worth ' + a.p_points + '. ' + n + ' creator' + (n===1?'':'s') + ' adjusted by ' + (diff>0?'+':'') + diff + '.')
      : ('Now worth ' + a.p_points + '.') };
  },
  admin_adjust_points: function(a){
    if(!has(['ops'])) return deny(['ops']);
    ledger(a.p_creator_id, 'adjustment', a.p_amount, a.p_reason);
    audit('points_adjusted','points_ledger');
    return { ok:true, message:(a.p_amount>0?'Added ':'Removed ') + Math.abs(a.p_amount) + ' points.' };
  },
  admin_lock_scoring: function(){
    if(!has(['ops'])) return deny(['ops']);
    var cy=cycle();
    if(cy.scoring_locked_at) return { ok:false, message:'Already published and locked.' };
    cy.scoring_locked_at = new Date().toISOString();
    audit('scoring_locked','cycles');
    return { ok:true, message:'Published. The weights cannot change now.' };
  },
  admin_publish_prizes: function(){
    if(!has(['finance'])) return deny(['finance']);
    if(DB.prizes.some(function(p){ return p.published_at; }))
      return { ok:false, message:'The pool is already published, so the amounts are frozen.' };
    var stamp = new Date().toISOString();
    DB.prizes.forEach(function(p){ p.published_at = stamp; });
    audit('prizes_published','prizes');
    return { ok:true, message:'Published. The amounts are frozen from here.' };
  },
  admin_upsert_operator: function(a){
    if(!has([])) return deny(['owner']);
    var e = String(a.p_email||'').trim().toLowerCase();
    var row = DB.admin_users.filter(function(u){ return u.email.toLowerCase()===e; })[0];
    if(row){ row.role=a.p_role; row.is_active=a.p_active; }
    else {
      if(e.indexOf('@clipency.in')<0 && e.indexOf('@')<0)
        return { ok:false, message:'That email has no login yet. They need to sign in once before you can grant a role.' };
      DB.admin_users.push({ id:uid(), user_id:uid(), email:e, full_name:e.split('@')[0],
        role:a.p_role, is_active:a.p_active, created_at:new Date().toISOString(), created_by:null });
    }
    audit('operator_role_set','admin_users');
    return { ok:true, message:'Role set to ' + a.p_role + '.' };
  }
};

window.supabase = {

<script>
/* ============================================================

   Reads go straight to the tables and views under RLS. Writes that
   matter go through the admin_* RPCs in migration 016, which carry
   the role check and the audit trail with them, so a bug on this
   page cannot skip either.

   The console is used by people who did not build it, often at
   speed. So every section states what it is for, every irreversible
   control says so before it fires, and a control your role cannot
   use is disabled with the reason on it rather than hidden.
   ============================================================ */
(function(){
  'use strict';

  var CFG = {
    url    : 'https://spwtkdgpgeutrhwcjrpy.supabase.co',
    key    : 'sb_publishable_IInNrDBLK3dINHSyWaUDzg_UWF63j0B',
    signin : './clipathon-signin.html',
    dash   : './clipathon-dashboard.html'
  };

  var $  = function(s,r){ return (r||document).querySelector(s); };

  function esc(v){ return String(v==null?'':v).replace(/[&<>"']/g,function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function comma(n){ return Math.round(Number(n)||0).toLocaleString('en-IN'); }
  function num(n){ n=Math.round(Number(n)||0);
    return n>=1e6?(n/1e6).toFixed(1).replace(/\.0$/,'')+'M'
         : n>=1e3?(n/1e3).toFixed(1).replace(/\.0$/,'')+'K' : String(n); }
  function dt(v){ return v? new Date(v).toLocaleString('en-IN',
    {day:'numeric',month:'short',hour:'numeric',minute:'2-digit',hour12:true}) : 'not set'; }
  function d(v){ return v? new Date(v).toLocaleDateString('en-IN',{day:'numeric',month:'short'}) : '-'; }
  function money(minor){ return '₹' + comma((Number(minor)||0)/100); }
  function hoursSince(v){ return v ? (Date.now()-new Date(v).getTime())/3600000 : 0; }

  /* datetime-local wants local wall time, not an ISO string in UTC. */
  function dtLocal(v){
    if(!v) return '';
    var x=new Date(v), p=function(n){ return String(n).padStart(2,'0'); };
    return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+'T'+p(x.getHours())+':'+p(x.getMinutes());

  function toast(m, bad){
    var t=$('#toast'); t.textContent=m;

  function openM(id){ $('#'+id).classList.add('on'); }

  /* ============================================================
     Client
     ============================================================ */
  var sb=null;
  function db(){
    if(sb) return sb;
    try{ sb = window.supabase.createClient(CFG.url, CFG.key, { db:{ schema:'clipathon' } }); }
    catch(e){ sb=null; }
    return sb;
  }

  /* Postgres speaks in codes. Operators should not have to. */
  function friendly(err){
    if(!err) return 'That did not work.';
    var m = String(err.message||err), c = err.code||'';
    if(c==='42501' || /row-level security/i.test(m))
      return 'Your role is not allowed to make that change.';
    if(c==='23514'){
      if(/announcements_24h/.test(m)) return 'An announcement has to go out at least 24 hours before its event.';
      if(/weights_sum/.test(m))       return 'The scoring weights have to add up to exactly 100.';
      if(/slots_sane/.test(m))        return 'That would leave more creators on the brand than it has seats.';
      if(/duration/.test(m))          return 'The minimum duration has to be below the maximum.';
      return 'The database refused that: it breaks a rule this cycle depends on.';
    }
    if(c==='23505') return 'Something with that name or code already exists.';
    if(c==='23503') return 'That refers to a record which no longer exists. Refresh and try again.';
    if(c==='P0001') return m.replace(/^.*?:\s*/,'');
    return m;
  }

  /* Every RPC returns a jsonb envelope, so one helper covers the whole
     "did it work, and what do I tell the operator" path. Both helpers
     resolve to a BOOLEAN, because the modal uses that to decide whether
     to close. Returning the envelope would close on failure too. */
  function rpc(fn,args){
    return db().rpc(fn,args||{}).then(function(r){
      if(r.error){ console.error('[admin]',fn,r.error); return { ok:false, message:friendly(r.error) }; }
      return r.data || { ok:true };
    }).catch(function(e){ return { ok:false, message:String(e.message||e) }; });
  }
  function act(fn,args,okMsg){
    return rpc(fn,args).then(function(r){
      var ok = !!(r && r.ok);
      if(ok) toast(r.message || okMsg || 'Done');
      else   toast((r && (r.message||r.error)) || 'That did not work', true);
      return ok;
    });
  }
  function save(builder, okMsg){
    return Promise.resolve(builder).then(function(r){
      if(r && r.error){ console.error('[admin] write', r.error); toast(friendly(r.error), true); return false; }
      toast(okMsg||'Saved'); return true;
    }).catch(function(e){ toast(friendly(e), true); return false; });
  }
  function q(rel, build){
    var b = db().from(rel).select('*');
    return (build ? build(b) : b).then(function(r){
      if(r.error){ console.error('[admin]',rel,r.error); return []; }
      return r.data || [];
    }).catch(function(){ return []; });
  }
  function rows(res){ if(res && res.error) console.error('[admin]', res.error); return (res && res.data) || []; }

  /* ============================================================
     State and roles
     ============================================================ */
  var A = { role:null, email:'', cycle:null, cycles:[], season:null, counts:{}, view:'overview' };
  var UI = {};

  function can(){
    var r = A.role, own = r==='owner';
    return {
      owner    : own,
      ops      : own || r==='ops',
      review   : own || r==='ops' || r==='reviewer',
      brands   : own || r==='ops' || r==='partnerships',
      sessions : own || r==='ops' || r==='partnerships' || r==='marketing',
      marketing: own || r==='ops' || r==='marketing',
      support  : own || r==='ops' || r==='reviewer' || r==='marketing',
      finance  : own || r==='finance'
    };
  }
  var WHY = {
    ops      : 'Only ops and owners can do this',
    review   : 'Only reviewers, ops and owners can do this',
    brands   : 'Only partnerships, ops and owners can do this',
    sessions : 'Only partnerships, marketing, ops and owners can do this',
    marketing: 'Only marketing, ops and owners can do this',
    support  : 'Only the roles that answer tickets can change one',
    finance  : 'Only finance and owners can do this',
    owner    : 'Only owners can do this'
  };
  /* A control your role cannot use is disabled with the reason on it.
     Hiding it makes the console look broken to the person who simply
     is not allowed to press it. */
  function gate(key, html){
    if(can()[key]) return html;
    return html.replace(/<button /g, '<button disabled title="' + esc(WHY[key]) + '" ');
  }

  /* ============================================================
     Shared render pieces
     ============================================================ */
  function lede(title, body, more){
    return '<div class="lede"><div class="li">i</div><div class="lt">' +
      '<b>' + esc(title) + '</b><span>' + body + '</span>' +
      (more ? '<details class="more"><summary>Why it works this way</summary><div class="mb">' + more + '</div></details>' : '') +
      '</div></div>';
  }
  function empty(head, sub){
    return '<div class="tbl-wrap"><div class="empty"><div class="ei">&#183;</div>' +
      '<div class="eh">' + esc(head) + '</div><div class="es">' + (sub||'') + '</div></div></div>';
  }
  function table(cols, list, rowFn, emptyHead, emptySub){
    if(!list || !list.length) return empty(emptyHead || 'Nothing here yet', emptySub || '');
    return '<div class="tbl-wrap"><table><thead><tr>' +
      cols.map(function(c){ return '<th>' + esc(c) + '</th>'; }).join('') +
      '</tr></thead><tbody>' + list.map(rowFn).join('') + '</tbody></table></div>';
  }
  var PILL = {
    approved:'ok', verified:'ok', sent:'ok', resolved:'ok', closed:'ok', complete:'ok', active:'ok',
    pending:'wait', needs_info:'wait', under_review:'wait', open:'wait', in_progress:'wait',
    waiting_on_creator:'wait', invited:'wait', submitted:'wait', link_submitted:'wait', file_uploaded:'wait',
    rejected:'no', disqualified:'no', failed:'no', cancelled:'no', withdrawn:'no', removed:'no',
    critical:'no', high:'wait', normal:'', low:''
  };
  function pill(s){
    return '<span class="chip ' + (PILL[s]||'') + '">' + esc(String(s||'-').replace(/_/g,' ')) + '</span>';
  }
  function age(v){
    var h = hoursSince(v);
    return '<span class="age ' + (h>24?'bad':h>12?'warn':'') + '">' +
      (h<1 ? Math.round(h*60)+'m' : h<48 ? Math.round(h)+'h' : Math.round(h/24)+'d') + '</span>';
  }
  function who(name, sub){
    return '<td class="who-cell"><b>' + esc(name||'-') + '</b><span>' + esc(sub||'') + '</span></td>';
  }
  function link(url, label){
    return url ? '<a class="lnk" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(label||'open') + ' &#8599;</a>'
               : '<span class="mono-s">none</span>';
  }

  /* ============================================================
     Forms
     ============================================================
     One declarative helper, because eighteen hand-rolled forms is
     eighteen chances to mistype an id. */
  function F(fields){
    return '<div class="fgrid">' + fields.map(function(f){
      var v = f.value==null ? '' : String(f.value), id='f_'+f.k, inner;
      if(f.type==='textarea'){
        inner = '<textarea id="'+id+'"'+(f.rows?' rows="'+f.rows+'"':'')+' placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea>';
      } else if(f.type==='select'){
        inner = '<select id="'+id+'">' + (f.opts||[]).map(function(o){
          var val = (o && typeof o==='object') ? o.v : o;
          var lab = (o && typeof o==='object') ? o.t : (String(o).replace(/_/g,' ') || '-');
          return '<option value="'+esc(val)+'"'+(String(val)===v?' selected':'')+'>'+esc(lab)+'</option>';
        }).join('') + '</select>';
      } else if(f.type==='check'){
        inner = '<label class="retro"><input type="checkbox" id="'+id+'"'+(f.value?' checked':'')+'> '+esc(f.ph||'Yes')+'</label>';
      } else {
        inner = '<input id="'+id+'" type="'+(f.type||'text')+'"' +
          (f.min!=null?' min="'+f.min+'"':'') + (f.max!=null?' max="'+f.max+'"':'') +
          (f.step!=null?' step="'+f.step+'"':'') +
          ' value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'">';
      }
      return '<div class="field'+((f.full||f.type==='textarea')?' full':'')+'">' +
        '<label>'+esc(f.label)+'</label>' + inner +
        (f.hint?'<span class="fh">'+f.hint+'</span>':'') + '</div>';
    }).join('') + '</div>';
  }
  function V(k){ var e=$('#f_'+k); if(!e) return null; return e.type==='checkbox'?e.checked:e.value; }
  function Vt(k){ var v=V(k); v=(v==null?'':String(v)).trim(); return v===''?null:v; }
  function Vn(k){ var v=Vt(k); return v==null?null:Number(v); }
  function Vlines(k){ return String(V(k)||'').split('\n').map(function(s){ return s.trim(); }).filter(Boolean); }
  function Vdt(k){ var v=Vt(k); return v?new Date(v).toISOString():null; }

  /* ============================================================
     Modals
     ============================================================ */
  /* run() must resolve to true for the modal to close. act() and save()
     already resolve to a boolean, so a failed write leaves the form up
     with whatever the operator typed still in it. */
  function ask(o){
    $('#amEyeb').textContent = o.eyebrow || 'Confirm';
    $('#amTitle').textContent = o.title;
    $('#amSub').innerHTML = o.sub || '';
    $('#amBody').innerHTML = o.body || '';
    $('#amGo').textContent = o.cta || 'Confirm';
    $('#amGo').disabled = false;
    $('#amGo').style.display = o.run ? '' : 'none';
    $('#amGo').className = 'btn' + (o.danger ? ' danger' : '');
    $('#amGo').onclick = function(){
      if(!o.run) return closeM('actModal');
      $('#amGo').disabled = true;
      var label = $('#amGo').textContent;
      $('#amGo').textContent = 'Working…';
      Promise.resolve(o.run()).then(function(ok){
        $('#amGo').disabled = false; $('#amGo').textContent = label;
        if(ok === true){ closeM('actModal'); if(o.after) o.after(); else reload(); }
      }).catch(function(e){
        $('#amGo').disabled = false; $('#amGo').textContent = label;
        toast(friendly(e), true);
      });
    };
    openM('actModal');
    if(o.wire) o.wire();
    var first = $('#amBody input, #amBody textarea, #amBody select');
    if(first) try{ first.focus(); }catch(e){}
  }
  function show(o){
    $('#dtEyeb').textContent = o.eyebrow || '';
    $('#dtTitle').textContent = o.title;
    $('#dtSub').innerHTML = o.sub || '';
    $('#dtBody').innerHTML = o.body || '';
    openM('detModal');
    if(o.wire) o.wire();
  }

  /* ============================================================
     The cycle clock
     ============================================================ */
  var PHASES = ['draft','registration','reveal','slot_selection','creation','tracking','finale','closed'];
  var PHASE = {
    draft:          { t:'Draft',          d:'setup', job:'Set the dates, load the briefs, publish the pool',

  /* Only the next date is highlighted. Marking every future date makes
     the highlight mean nothing, which is worse than not having one. */
  function clockTiles(cy){
    var rowsC = [['Registration closes','registration_closes'],['Brands reveal','brands_reveal_at'],
                 ['Slots open','slots_open_at'],['Slots close','slots_close_at'],
                 ['Submission cutoff','submission_cutoff_at'],['Finale','finale_at']];
    var now = new Date(), nextAt = null;
    rowsC.forEach(function(x){
      var t = cy[x[1]];
      if(t && new Date(t) > now && (nextAt === null || new Date(t) < new Date(nextAt))) nextAt = t;
    });
    return rowsC.map(function(x){
      var t = cy[x[1]], past = t && new Date(t) <= now, isNext = t && t === nextAt;
      return '<div class="c' + (isNext ? ' now' : '') + '"' + (past ? ' style="opacity:.5"' : '') + '>' +
        '<span>' + x[0] + (isNext ? ' &#183; next' : past ? ' &#183; done' : '') + '</span>' +
        '<b>' + dt(t) + '</b></div>';
    }).join('');
  }

  function jobLinks(status){
    var map = {
      draft:          [['settings','Cycle settings'],['brands','Briefs'],['tasks','Tasks and points'],['prizes','Prizes']],
      registration:   [['queue','Open the queue'],['accounts','Check handles'],['creators','Creators']],
      reveal:         [['schedule','Sessions and feed'],['brands','Briefs'],['support','Support']],
      slot_selection: [['slots','Slot allocation'],['accounts','Check handles'],['support','Support']],
      creation:       [['support','Support'],['schedule','Sessions and feed']],
      tracking:       [['qc','Quality control'],['scoring','Snapshots'],['support','Support']],
      finale:         [['scoring','Scoring and sign off'],['qc','Quality control']],
      closed:         [['prizes','Prizes'],['payouts','Payouts'],['points','Points ledger']],
      archived:       [['audit','Audit log']]
    };
    return (map[status]||map.draft).map(function(x){
      return '<button class="b-xs" data-go="' + x[0] + '">' + esc(x[1]) + '</button>'; }).join('');
  }

  function renderWeights(cy){
    var w = cy.scoring_weights || {};
    var rowsW = [['views','Views'],['engagement','Engagement rate'],['quality','Content quality'],['compliance','Brand compliance']];
    var locked = !!cy.scoring_locked_at;
    return '<p class="hint" style="margin-bottom:12px">Four numbers that must add to 100. They decide how a verified ' +
      'entry becomes a rank.</p>' +
      rowsW.map(function(x){
        return '<div class="wrow"><label>' + x[1] + '</label>' +
          '<input type="range" min="0" max="100" step="5" value="' + (w[x[0]]||0) + '" data-w="' + x[0] + '"' + (locked||!can().ops?' disabled':'') + '>' +
          '<b data-wv="' + x[0] + '">' + (w[x[0]]||0) + '%</b></div>';
      }).join('') +
      '<div class="wsum" id="wSum"></div>' +
      (locked
        ? '<div class="ok-note" style="margin-top:12px"><span>&#10003;</span><span>Published on ' + dt(cy.scoring_locked_at) +
          '. These cannot change now, which is the promise made to creators before the window opened.</span></div>'
        : gate('ops','<div class="bar-t" style="margin-top:12px">' +
            '<button class="btn-ghost btn-sm" id="wSave">Save weights</button>' +
            '<button class="btn btn-sm" id="wLock">Publish and lock</button></div>') +
          '<p class="hint" style="margin-top:8px">Locking is one way. After it the database refuses any change, ' +
          'so nobody can be accused of moving the goalposts once entries are in.</p>');
  }

  function wireWeights(){
    var upd=function(){
      var t=0;
      $$('[data-w]').forEach(function(r){ var v=Number(r.value); t+=v; $('[data-wv="'+r.dataset.w+'"]').textContent=v+'%'; });
      var s=$('#wSum');
      if(s){ s.textContent = t===100 ? 'Adds up to 100' : 'Adds up to ' + t + ', needs to be exactly 100';
             s.className='wsum ' + (t===100?'ok':'bad'); }
      var sv=$('#wSave'); if(sv) sv.disabled = (t!==100);
      var lk=$('#wLock'); if(lk) lk.disabled = (t!==100);
      return t;
    };
    $$('[data-w]').forEach(function(r){ r.oninput=upd; });
    upd();
    var sv=$('#wSave');
    if(sv) sv.onclick=function(){
      var w={}; $$('[data-w]').forEach(function(r){ w[r.dataset.w]=Number(r.value); });
      save(db().from('cycles').update({ scoring_weights:w }).eq('id',A.cycle.id), 'Weights saved')
        .then(function(ok){ if(ok) reload(); });
    };
    var lk=$('#wLock');
    if(lk) lk.onclick=function(){
      ask({ eyebrow:'Scoring', title:'Publish and lock the weights?', danger:true,
        sub:'This cannot be undone.',
        body:'<p class="m-p">Creators will be able to see exactly how they are judged, and the database will refuse ' +
          'any later change to these four numbers. Do this before the creation window opens, not after.</p>',
        cta:'Publish and lock',
        run:function(){ return act('admin_lock_scoring',{p_cycle_id:A.cycle.id},'Scoring model locked'); }});
    };
  }

  function paintQueue(list){
    $('#qCount').textContent = list.length + (list.length===1?' waiting':' waiting');

            '<button class="b-xs no"   data-rev="rejected"   data-id="' + r.registration_id + '">Reject</button>' +
          '</div></td></tr>';
      },

      'Every registration in this cycle has had a decision. New ones appear here as they arrive.');

    $$('#qTable [data-pick]').forEach(function(b){
      b.onchange=function(){ b.closest('tr').classList.toggle('sel', b.checked); markSel(); };
    });
    $$('#qTable [data-rev]').forEach(function(b){
      if(!can().review){ b.disabled=true; b.title=WHY.review; return; }
      b.onclick=function(){
        var out=b.dataset.rev, id=b.dataset.id;
        if(out==='approved'){
          b.disabled=true;
          act('admin_review_registration',{p_registration_id:id,p_outcome:'approved'},'Approved')
            .then(function(ok){ if(ok) reload(); else b.disabled=false; });
          return;
        }
        var reject = out==='rejected';
        ask({ eyebrow:'Verification',

          sub: reject ? 'They can appeal once, through support.' : 'They get 24 hours to fix it.',
          body:'<p class="m-p">' + (reject
              ? 'Write the reason as if you were saying it to their face, because that is how it reads in the email.'

          cta: reject ? 'Reject' : 'Request more information',
          danger: reject,
          run:function(){
            var note=Vt('note');

            return act('admin_review_registration',{p_registration_id:id,p_outcome:out,p_note:note});
          }});
      };
    });
  }

      $$('#slTable [data-move]').forEach(function(b){

                    {k:'why', label:'Reason', full:true, ph:'Support ticket reference, or why the swap was agreed',
                     hint:'This lands in the audit log against your name.'}]),
            cta:'Move',

  /* ============================================================
     QUALITY CONTROL
     ============================================================ */
  var DQ = ['late','incomplete','taken_down','brand_non_compliant','artificial_engagement','not_original','wrong_brand','other'];
  function renderQC(){
    db().from('submissions')
      .select('*, brands(name), registrations(creators(creator_code, full_name, email))')
      .eq('cycle_id',A.cycle.id).order('created_at').limit(900)
      .then(function(res){
        var list=rows(res);
        var f = UI.qcFilter || 'queue';
        var pick = list.filter(function(r){
          if(f==='queue')    return ['complete','under_review','link_submitted','file_uploaded'].indexOf(r.status)>=0;
          if(f==='verified') return r.status==='verified';
          if(f==='dq')       return r.status==='disqualified' || r.status==='rejected';
          return true;
        });
        $('#qcBody').innerHTML =
          lede('Check every entry before it can be scored.',
            'An entry needs two things: the live post and the raw file. Both present, on brief, not faked. ' +
            'Verifying is what lets it count and what pays any referral behind it.',
            'The two paths exist because a link can be deleted and a file cannot be checked for reach. Together they ' +
            'prove the same clip was really posted. Quality and compliance are your judgement, 0 to 100, and they ' +
            'feed straight into the score, so use the same yardstick all the way down the queue.') +
          '<div class="bar-t">' +
            [['queue','Waiting on you'],['verified','Verified'],['dq','Rejected and DQ'],['all','Everything']].map(function(x){
              return '<button class="f-chip ' + (f===x[0]?'on':'') + '" data-qf="' + x[0] + '">' + x[1] + '</button>';
            }).join('') +
            '<span class="grow"></span><span class="lab">' + pick.length + ' of ' + list.length + '</span>' +
          '</div><div id="qcTable"></div>';

        $('#qcTable').innerHTML = table(
          ['Creator','Brand','Post','Raw file','Both in','Quality','Compliance','Status',''],
          pick, function(s){
            var c=((s.registrations||{}).creators)||{};
            return '<tr>' + who(c.full_name, c.creator_code) +
              '<td>' + esc((s.brands||{}).name||'-') + '</td>' +
              '<td>' + link(s.post_url,'post') + '</td>' +
              '<td class="mono-s">' + esc(s.file_name || (s.drive_url?'on drive':'none')) + '</td>' +
              '<td>' + (s.is_complete?'<span class="chip ok">yes</span>':'<span class="chip no">no</span>') + '</td>' +
              '<td class="mono-s">' + (s.quality_score==null?'-':s.quality_score) + '</td>' +
              '<td class="mono-s">' + (s.compliance_score==null?'-':s.compliance_score) + '</td>' +
              '<td>' + pill(s.status) + '</td>' +
              '<td><div class="acts-wrap">' + gate('review','<button class="b-xs" data-qc="' + s.id + '">Review</button>') + '</div></td></tr>';
          },
          f==='queue' ? 'Nothing waiting in QC' : 'Nothing here',
          f==='queue' ? 'Entries appear once a creator has submitted both the post link and the raw file.'
                      : 'Try another filter.');

        $$('#qcBody [data-qf]').forEach(function(b){ b.onclick=function(){ UI.qcFilter=b.dataset.qf; renderQC(); }; });
        $$('#qcTable [data-qc]').forEach(function(b){
          b.onclick=function(){ qcModal(list.filter(function(x){ return x.id===b.dataset.qc; })[0]); };
        });
      });
  }

  function qcModal(s){
    var c=((s.registrations||{}).creators)||{};
    var fire=function(action, needDq){
      return function(){
        if(needDq && !Vt('dq')) return toast('Pick a reason for the disqualification', true);
        act('admin_qc_submission',{
          p_submission_id:s.id, p_action:action, p_note:Vt('note'),
          p_quality:Vn('quality'), p_compliance:Vn('compliance'),
          p_dq_reason: action==='disqualify' ? Vt('dq') : null
        }).then(function(ok){ if(ok){ closeM('actModal'); reload(); } });
      };
    };
    ask({
      eyebrow:'QC &#183; ' + ((s.brands||{}).name||''),
      title: c.full_name || 'Submission',
      sub: s.is_complete ? 'Both the post and the file are in.'
                         : 'Incomplete. This cannot be verified until both the post link and the raw file are present.',
      body:
        '<div class="m-facts">' +
          '<div><span>Post</span><b>' + link(s.post_url,'open the post') + '</b></div>' +
          '<div><span>Raw file</span><b>' + esc(s.file_name || (s.drive_url?'on drive':'missing')) + '</b></div>' +
          '<div><span>Submitted</span><b>' + dt(s.created_at) + '</b></div>' +
          '<div><span>Now</span><b>' + esc(String(s.status||'').replace(/_/g,' ')) + '</b></div>' +
        '</div>' +
        F([{k:'quality',    label:'Content quality, 0 to 100', type:'number', min:0, max:100,
            value: s.quality_score==null?'':s.quality_score, hint:'Craft: hook, pacing, sound, framing.'},
           {k:'compliance', label:'Brand compliance, 0 to 100', type:'number', min:0, max:100,
            value: s.compliance_score==null?'':s.compliance_score, hint:'Did they follow the brief, mandatories and disclosure?'},
           {k:'note',       label:'Note the creator will see', type:'textarea', rows:3, value:s.qc_note||'',
            ph:'What to fix, or why it did not pass.'},
           {k:'dq',         label:'Only if disqualifying, the reason', type:'select', full:true,
            opts:[{v:'',t:'not a disqualification'}].concat(DQ)}]) +
        '<div class="bar-t" style="margin-top:4px">' +
          '<button class="b-xs ok"   id="qcVerify">Verify, it counts</button>' +
          '<button class="b-xs wait" id="qcReject">Send back to fix</button>' +
          '<button class="b-xs no"   id="qcDq">Disqualify</button>' +
        '</div>' +
        '<p class="hint" style="margin-top:8px">Verifying is what makes the entry count toward results and what pays ' +
        'any referral behind this creator. Sending back lets them resubmit before the cutoff. Disqualifying does not.</p>',
      cta:'Save the scores only',
      run:function(){
        return act('admin_qc_submission',{ p_submission_id:s.id, p_action:'review', p_note:Vt('note'),
          p_quality:Vn('quality'), p_compliance:Vn('compliance') }, 'Scores saved');
      },
      wire:function(){
        $('#qcVerify').onclick = fire('verify');
        $('#qcReject').onclick = fire('reject');
        $('#qcDq').onclick     = fire('disqualify', true);
      }
    });
  }

  /* ============================================================
     SCORING AND SIGN OFF
     ============================================================ */
  function renderScoring(){
    Promise.all([
      db().from('v_cycle_results').select('*').eq('cycle_id',A.cycle.id).order('rank_overall').limit(500),
      db().from('submissions').select('id, status, post_url, registrations(creators(creator_code, full_name))')
        .eq('cycle_id',A.cycle.id).eq('status','verified').limit(900),
      db().from('metric_snapshots').select('submission_id, snapshot_no, is_final, captured_at, views')
        .eq('cycle_id',A.cycle.id).order('captured_at',{ascending:false}).limit(1500)
    ]).then(function(r){
      var results=rows(r[0]), verified=rows(r[1]), snaps=rows(r[2]);
      var byS={}; snaps.forEach(function(x){ (byS[x.submission_id]=byS[x.submission_id]||[]).push(x); });
      var locked = results.length && results.every(function(x){ return x.is_final; });
      var withFinal = verified.filter(function(s){ return (byS[s.id]||[]).some(function(x){ return x.is_final; }); }).length;

      $('#scBody').innerHTML =
        lede('Turn verified entries into ranks, then lock them.',
          'Capture a final snapshot for every verified entry, run scoring, read the ranks, then have two different ' +
          'people sign off. The second signature locks the results for good.',
          'Views and engagement are normalised across the cycle before the weights are applied, so a creator on a ' +
          'small brand is not punished for the brand being small. Snapshots are append only: a correction is a new ' +
          'capture, never an edit, which is why a disputed number can always be traced.') +
        '<div class="split">' +
          '<div class="card">' +
            '<div class="sec-h"><h2>Results</h2><span class="sh-sub">' + results.length + ' scored</span></div>' +
            (locked ? '<div class="ok-note" style="margin-bottom:12px"><span>&#10003;</span><span>' +
              'Signed off by two people and locked. Creators can see their rank, and nothing can rescore them.</span></div>' : '') +
            table(['#','Creator','Brand','Views','Score','In brand','State'],
              results, function(x){
                return '<tr><td class="mono-s">' + (x.rank_overall||'-') + '</td>' +
                  who(x.display_name||x.creator_code, x.creator_code) +
                  '<td>' + esc(x.brand_name||'') + '</td>' +
                  '<td class="mono-s">' + num(x.views) + '</td>' +
                  '<td class="mono-s"><b>' + (x.total_score==null?'-':x.total_score) + '</b></td>' +
                  '<td class="mono-s">' + (x.rank_in_brand||'-') + '</td>' +
                  '<td>' + (x.is_final?'<span class="chip ok">final</span>':'<span class="chip wait">provisional</span>') + '</td></tr>';
              },
              'Nothing scored yet',
              'Capture the final snapshots first, then run scoring.') +
          '</div>' +
          '<div class="stack">' +
            '<div class="card">' +
              '<div class="sec-h"><h2>Run the numbers</h2></div>' +
              '<div class="metric"><span class="m-k">Verified entries</span><span class="m-v">' + verified.length + '</span></div>' +
              '<div class="metric"><span class="m-k">With a final snapshot</span><span class="m-v">' + withFinal + '</span></div>' +
              (withFinal < verified.length
                ? '<div class="danger-note" style="margin-top:12px"><span>!</span><span>' +
                  (verified.length-withFinal) + ' verified entr' + (verified.length-withFinal===1?'y has':'ies have') +
                  ' no final snapshot yet. Scoring will skip them.</span></div>'
                : '') +
              gate('ops','<div class="bar-t" style="margin-top:13px">' +
                '<button class="btn-ghost btn-sm" id="scRun">Run scoring</button>' +
                '<button class="btn btn-sm" id="scSign">Sign off</button></div>') +
              '<p class="hint" style="margin-top:8px">Scoring is re-runnable until sign off, so running it early to ' +
              'sanity check the spread costs nothing.</p>' +
              '<div class="danger-note" style="margin-top:12px"><span>!</span><span>' +
              'Sign off needs <b>two different people</b>. Your signature alone does nothing. The second one locks ' +
              'the results, and after that nothing can rescore them. That is deliberate.</span></div>' +
            '</div>' +
            '<div class="card">' +
              '<div class="sec-h"><h2>Snapshots</h2><span class="sh-sub">' + verified.length + ' verified entries</span></div>' +
              '<p class="hint" style="margin-bottom:10px">Capture at fixed points so everyone is measured over the ' +
              'same window. Tick <b>final</b> on the last one: that is the row scoring reads.</p>' +
              gate('ops', table(['Creator','Post','Captured','Latest views',''], verified, function(s){
                var c=((s.registrations||{}).creators)||{}, hist=byS[s.id]||[];
                var last=hist[0], fin=hist.some(function(x){ return x.is_final; });
                return '<tr>' + who(c.full_name, c.creator_code) +
                  '<td>' + link(s.post_url,'post') + '</td>' +
                  '<td class="mono-s">' + (last?(hist.length + ' &#183; ' + d(last.captured_at)):'none') +
                    (fin?' <span class="chip ok">final</span>':'') + '</td>' +
                  '<td class="mono-s">' + (last?num(last.views):'-') + '</td>' +
                  '<td><div class="acts-wrap"><button class="b-xs" data-snap="' + s.id + '">Capture</button></div></td></tr>';
              }, 'No verified entries yet', 'Verify entries in QC and they show up here.')) +
            '</div>' +
          '</div>' +
        '</div>';

      var run=$('#scRun');
      if(run) run.onclick=function(){
        run.disabled=true;
        act('admin_run_scoring',{p_cycle_id:A.cycle.id}).then(function(){ renderScoring(); });
      };
      var sg=$('#scSign');
      if(sg) sg.onclick=function(){
        ask({ eyebrow:'Results', title:'Sign off these results?', danger:true,
          sub:'Two different people have to sign.',
          body:'<p class="m-p">Your signature is recorded now. When a second, different operator signs, the results ' +
            'lock permanently: no rescoring, no edits, ever. Read the ranks before you sign, not after.</p>',
          cta:'Sign off',
          run:function(){ return act('admin_signoff',{p_cycle_id:A.cycle.id}); },
          after:function(){ renderScoring(); loadOverview().then(paintNav); }});
      };
      $$('#scBody [data-snap]').forEach(function(b){
        b.onclick=function(){
          var id=b.dataset.snap, hist=byS[id]||[], last=hist[0];
          ask({ eyebrow:'Snapshot', title:'Capture the numbers',
            sub: last ? ('Last captured ' + dt(last.captured_at) + ' at ' + num(last.views) + ' views.')
                      : 'Nothing captured for this entry yet.',
            body:F([{k:'views',    label:'Views',    type:'number', min:0, value:last?last.views:0},
                    {k:'likes',    label:'Likes',    type:'number', min:0, value:0},
                    {k:'comments', label:'Comments', type:'number', min:0, value:0},
                    {k:'shares',   label:'Shares',   type:'number', min:0, value:0},
                    {k:'saves',    label:'Saves',    type:'number', min:0, value:0},
                    {k:'shot',     label:'Screenshot link', ph:'https://…', hint:'Optional, but it settles arguments.'},
                    {k:'final',    label:'Is this the final one?', type:'check', full:true,
                     ph:'Yes, score from this snapshot',
                     hint:'Only the final snapshot is read by scoring. Earlier ones are history.'}]),
            cta:'Capture',
            run:function(){
              return act('admin_capture_snapshot',{
                p_submission_id:id, p_views:Vn('views')||0, p_likes:Vn('likes')||0,
                p_comments:Vn('comments')||0, p_shares:Vn('shares')||0, p_saves:Vn('saves')||0,
                p_is_final: V('final')===true, p_screenshot:Vt('shot')
              },'Snapshot captured');
            },
            after:function(){ renderScoring(); }});
        };
      });
    });
  }

  /* ============================================================
     BRANDS AND BRIEFS
     ============================================================ */
  function brandFields(b){
    b = b || {};
    return F([
      {k:'name',  label:'Brand name', value:b.name||'', ph:'e.g. Northwind Coffee'},
      {k:'slug',  label:'Short code', value:b.slug||'', ph:'northwind', hint:'Lowercase, no spaces. Used in links.'},
      {k:'cat',   label:'Category', value:b.category||'', ph:'e.g. Food and drink'},
      {k:'slots', label:'Seats', type:'number', min:1, value:b.slots_total||100,
       hint:'Cannot go below the number already taken.'},
      {k:'sum',   label:'One line creators see first', type:'textarea', rows:2, value:b.summary||''},
      {k:'brief', label:'The full brief', type:'textarea', rows:6, value:b.brief||'',
       hint:'What the brand wants, who it is for, what a good clip looks like.'},
      {k:'must',  label:'Mandatory, one per line', type:'textarea', rows:4, value:(b.must_include||[]).join('\n'),
       hint:'Things every clip has to contain. Compliance is scored against this.'},
      {k:'never', label:'Never say, one per line', type:'textarea', rows:3, value:(b.never_say||[]).join('\n')},
      {k:'tags',  label:'Hashtags, one per line', type:'textarea', rows:2, value:(b.hashtags||[]).join('\n')},
      {k:'ments', label:'Mentions, one per line', type:'textarea', rows:2, value:(b.mentions||[]).join('\n')},
      {k:'disc',  label:'Disclosure text', value:b.disclosure_text||'', ph:'e.g. Paid partnership with…',
       hint:'Required by law in most places. Put the exact wording here.'},
      {k:'style', label:'Content style', value:b.content_style||'', ph:'e.g. handheld, spoken to camera'},
      {k:'dmin',  label:'Shortest clip, seconds', type:'number', min:1, value:b.duration_min_sec||15},
      {k:'dmax',  label:'Longest clip, seconds', type:'number', min:1, value:b.duration_max_sec||60},
      {k:'rew',   label:'What the brand gives', value:b.reward_note||'', ph:'e.g. Product hamper plus ₹5,000'},
      {k:'drive', label:'Asset folder link', value:b.drive_folder||'', ph:'https://…'},
      {k:'logo',  label:'Logo link', value:b.logo_url||'', ph:'https://…'},
      {k:'ord',   label:'Order on the page', type:'number', min:0, value:b.display_order||0}
    ]);
  }
  function brandPatch(){
    return {
      name:Vt('name'), slug:Vt('slug'), category:Vt('cat'),
      slots_total:Vn('slots'), summary:Vt('sum'), brief:Vt('brief'),
      must_include:Vlines('must'), never_say:Vlines('never'),
      hashtags:Vlines('tags'), mentions:Vlines('ments'),
      disclosure_text:Vt('disc'), content_style:Vt('style'),
      duration_min_sec:Vn('dmin'), duration_max_sec:Vn('dmax'),
      reward_note:Vt('rew'), drive_folder:Vt('drive'), logo_url:Vt('logo'),
      display_order:Vn('ord')||0
    };
  }

  function renderBrands(){
    q('brands', function(b){ return b.eq('cycle_id',A.cycle.id).order('display_order').order('name'); })
      .then(function(list){
        $('#brBody').innerHTML =
          lede('The briefs creators work from.',
            'Everything a creator needs to make the right clip: what to say, what never to say, how long, and what ' +
            'they get for it.',
            'Briefs stay invisible until the cycle reaches <b>Brand reveal</b>, and that is enforced by the database, ' +
            'not by this page. So you can write and rewrite them in the open during draft without leaking anything.') +
          '<div class="bar-t">' + gate('brands','<button class="btn-ghost btn-sm" id="brNew">Add a brand</button>') +
            '<span class="hint">' + list.length + ' brand' + (list.length===1?'':'s') + ' in this cycle, ' +
            comma(list.reduce(function(a,b){ return a+(b.slots_total||0); },0)) + ' seats in total.</span></div>' +
          (list.length ? '<div class="stack">' + list.map(function(b){
            return '<div class="card">' +
              '<div class="sec-h"><h2>' + esc(b.name) + '</h2>' +
                '<span class="sh-sub">' + esc(b.category||'no category') + ' &#183; ' + b.slots_taken + ' of ' + b.slots_total + ' seats</span>' +
                '<span class="sh-r">' + gate('brands',
                  '<button class="btn-ghost btn-sm" data-eb="' + b.id + '">Edit</button>') + '</span></div>' +
              '<p class="hint">' + esc(b.summary||'No summary written yet.') + '</p>' +
              (b.must_include && b.must_include.length
                ? '<div class="m-h">Every clip must</div><ul class="m-steps">' +
                  b.must_include.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
              (b.never_say && b.never_say.length
                ? '<div class="m-h">Never say</div><ul class="m-steps">' +
                  b.never_say.map(function(x){ return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>' : '') +
              '<div class="m-facts" style="margin-top:13px;margin-bottom:0">' +
                '<div><span>Length</span><b>' + (b.duration_min_sec||'?') + ' to ' + (b.duration_max_sec||'?') + ' seconds</b></div>' +
                '<div><span>Reward</span><b>' + esc(b.reward_note||'not set') + '</b></div>' +
              '</div></div>';
          }).join('') + '</div>'
          : empty('No brands in this cycle yet',
                  'Add the brands during draft, before registration opens, so creators know what they are entering.'));

        var nb=$('#brNew');
        if(nb) nb.onclick=function(){
          ask({ eyebrow:'Brand', title:'Add a brand to this cycle',
            sub:'It stays hidden from creators until the reveal.',
            body:brandFields(null), cta:'Add brand',
            run:function(){
              if(!Vt('name')||!Vt('slug')){ toast('A brand needs a name and a short code', true); return false; }
              var p=brandPatch(); p.cycle_id=A.cycle.id;
              return save(db().from('brands').insert(p), 'Brand added');
            }, after:function(){ renderBrands(); }});
        };
        $$('#brBody [data-eb]').forEach(function(btn){
          btn.onclick=function(){
            var b=list.filter(function(x){ return x.id===btn.dataset.eb; })[0];
            ask({ eyebrow:'Brand', title:'Edit ' + b.name,
              sub: b.slots_taken ? (b.slots_taken + ' creator' + (b.slots_taken===1?' has':'s have') + ' already taken a seat here.')
                                 : 'Nobody has taken a seat here yet.',
              body:brandFields(b), cta:'Save brand',
              run:function(){ return save(db().from('brands').update(brandPatch()).eq('id',b.id), 'Brand saved'); },
              after:function(){ renderBrands(); }});
          };
        });
      });
  }

     TASKS AND POINTS
     ============================================================ */

  function taskPatch(){
    return { title:Vt('title'), code:Vt('code'), category:Vt('cat')||'setup',
      points:Vn('points'), sort_order:Vn('order')||0, blurb:Vt('blurb'), why:Vt('why'),
      how_steps:Vlines('steps'), is_auto:V('auto')===true, unlock_status:Vt('unlock'), target_route:Vt('route') };
  }

  function renderTasks(){
    Promise.all([
      q('tasks', function(b){ return b.eq('cycle_id',A.cycle.id).order('sort_order').order('title'); }),
      db().from('task_completions').select('task_id, revoked_at')
    ]).then(function(r){
      var list=r[0], comps=rows(r[1]);
      var doneBy={};
      comps.forEach(function(c){ if(!c.revoked_at) doneBy[c.task_id]=(doneBy[c.task_id]||0)+1; });
      var live = list.filter(function(t){ return t.is_active; });
      var total = live.reduce(function(a,t){ return a+t.points; },0);

      $('#tkBody').innerHTML =
        lede('The bonus tasks, and what each one is worth.',
          'Change a number, press Save, done. Everything else about a task lives behind Edit.',
          'Repricing is retroactive by default: creators who already finished the task get the difference as a ' +
          'separate ledger entry. Without that, somebody who did the work on day one would be permanently worth ' +
          'less than somebody who did the same work on day four, purely because you changed your mind in between.') +
        '<div class="kpis">' +
          '<div class="kpi-s"><span class="k">Active tasks</span><span class="v">' + live.length + '</span><span class="s">of ' + list.length + ' written</span></div>' +
          '<div class="kpi-s"><span class="k">Points available</span><span class="v">' + comma(total) + '</span><span class="s">if one creator did everything</span></div>' +
          '<div class="kpi-s"><span class="k">Completions</span><span class="v">' + comma(comps.filter(function(c){ return !c.revoked_at; }).length) + '</span><span class="s">across all creators</span></div>' +
        '</div>' +
        '<div class="bar-t">' + gate('ops','<button class="btn-ghost btn-sm" id="tkNew">Add a task</button>') +
          '<span class="hint">Untick <b>back-credit</b> on a row to change the price for future completions only.</span></div>' +
        '<div id="tkTable"></div>';

      $('#tkTable').innerHTML = table(
        ['Task','Category','Completed by','Points','Back-credit','Actions'],
        list, function(t){
          var n=doneBy[t.id]||0;
          return '<tr' + (t.is_active?'':' style="opacity:.5"') + '>' +
            '<td class="who-cell" style="max-width:300px"><b>' + esc(t.title) + '</b><span>' + esc(t.code) +
              (t.is_auto?' &#183; tracked':' &#183; self-ticked') +
              (t.unlock_status?(' &#183; from ' + esc((PHASE[t.unlock_status]||{}).t||t.unlock_status)):'') +
              (t.is_active?'':' &#183; DISABLED') + '</span></td>' +
            '<td class="mono-s">' + esc(t.category) + '</td>' +
            '<td class="mono-s">' + n + '</td>' +
            '<td><div class="tune">' +
              '<input type="number" min="1" value="' + t.points + '" data-pts="' + t.id + '" data-was="' + t.points + '"' + (can().ops?'':' disabled') + '>' +
              '<span class="delta same" data-dl="' + t.id + '">same</span></div></td>' +
            '<td><label class="retro" title="Adjust the creators who already finished it">' +
              '<input type="checkbox" data-retro="' + t.id + '" checked' + (can().ops?'':' disabled') + '> yes</label></td>' +
            '<td><div class="acts-wrap">' + gate('ops',
                '<button class="b-xs ok" data-save="' + t.id + '" disabled ' +
                  'title="Change the number on the left first">Save points</button>' +
                '<button class="b-xs" data-edit="' + t.id + '">Edit</button>' +
                '<button class="b-xs" data-tog="' + t.id + '">' + (t.is_active?'Disable':'Enable') + '</button>' +
                (n?'':'<button class="b-xs no" data-del="' + t.id + '">Delete</button>')) +
            '</div></td></tr>';
        },
        'No tasks in this cycle yet',
        'Tasks are how a creator climbs the leaderboard without waiting for results. Add a few during draft.');

      var nb=$('#tkNew');
      if(nb) nb.onclick=function(){
        ask({ eyebrow:'Task', title:'Add a bonus task',
          sub:'It appears on every creator dashboard in this cycle.',
          body:taskFields(null), cta:'Add task',
          run:function(){
            if(!Vt('title')||!Vt('code')){ toast('A task needs a title and a short code', true); return false; }
            var p=taskPatch(); p.cycle_id=A.cycle.id; p.is_active=true;
            return save(db().from('tasks').insert(p), 'Task added');
          }, after:function(){ renderTasks(); }});
      };
      $$('#tkTable [data-pts]').forEach(function(inp){
        inp.oninput=function(){
          var was=Number(inp.dataset.was), now=Number(inp.value||0), diff=now-was;
          var dl=$('[data-dl="'+inp.dataset.pts+'"]');
          dl.textContent = diff===0?'same':(diff>0?'+'+diff:String(diff));
          dl.className='delta ' + (diff===0?'same':diff>0?'up':'dn');
          var sv=$('[data-save="'+inp.dataset.pts+'"]');
          if(sv) sv.disabled = (diff===0 || !(now>0));
        };
      });
      $$('#tkTable [data-save]').forEach(function(b){
        b.onclick=function(){
          var id=b.dataset.save, t=list.filter(function(x){ return x.id===id; })[0];
          var pts=Number($('[data-pts="'+id+'"]').value), retro=$('[data-retro="'+id+'"]').checked, n=doneBy[id]||0;
          var diff=pts-t.points;
          ask({ eyebrow:'Task points', title:'Change "' + t.title + '" to ' + pts + ' points?',
            sub: diff>0 ? ('Worth ' + diff + ' more than before.') : ('Worth ' + Math.abs(diff) + ' less than before.'),
            body:'<p class="m-p">' + (n
              ? (retro
                 ? '<b>' + n + ' creator' + (n===1?'':'s') + '</b> already finished this. Each gets a separate ' +
                   'ledger entry of <b>' + (diff>0?'+':'') + diff + '</b>, so everyone who did this task ends up ' +
                   'worth the same ' + pts + ' points. Nothing is overwritten, and the reason on each entry says ' +
                   'exactly why it appeared.'
                 : '<b>' + n + ' creator' + (n===1?'':'s') + '</b> already finished this and will keep the ' +
                   t.points + ' they earned. Only future completions pay ' + pts + '. Early and late finishers will ' +
                   'be worth different amounts for the same work.')
              : 'Nobody has finished this task yet, so there is no history to adjust.') + '</p>',
            cta:'Change the points',
            run:function(){ return act('admin_set_task_points',{p_task_id:id,p_points:pts,p_retro:retro}); },
            after:function(){ renderTasks(); }});
        };
      });
      $$('#tkTable [data-edit]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.edit; })[0];
          ask({ eyebrow:'Task', title:'Edit ' + t.title,
            sub:'Points are changed from the row, so that the back-credit question gets asked properly.',
            body:taskFields(t), cta:'Save task',
            run:function(){
              var p=taskPatch(); delete p.points;   /* points only move through the repricing path */
              return save(db().from('tasks').update(p).eq('id',t.id), 'Task saved');
            }, after:function(){ renderTasks(); }});
        };
      });
      $$('#tkTable [data-tog]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.tog; })[0];
          save(db().from('tasks').update({ is_active: !t.is_active }).eq('id',t.id),
               t.is_active?'Task disabled, creators no longer see it':'Task enabled')
            .then(function(ok){ if(ok) renderTasks(); });
        };
      });
      $$('#tkTable [data-del]').forEach(function(b){
        b.onclick=function(){
          var t=list.filter(function(x){ return x.id===b.dataset.del; })[0];
          ask({ eyebrow:'Task', title:'Delete "' + t.title + '"?', danger:true,
            sub:'Nobody has completed it, so nothing is lost.',
            body:'<p class="m-p">If you only want it off the dashboard, use <b>Disable</b> instead. That keeps the ' +
              'record and can be undone.</p>',
            cta:'Delete task',
            run:function(){ return save(db().from('tasks').delete().eq('id',t.id), 'Task deleted'); },
            after:function(){ renderTasks(); }});
        };
      });
    });
  }

  /* ============================================================
     SESSIONS AND THE FEED
     ============================================================ */
  var SESSION_KINDS = ['rules','brand_deep_dive','workshop','walkthrough','other'];
  var ANN_KINDS = ['session','deadline','notice'];

  function sessionFields(s, brands){
    s = s || {};
    return F([
      {k:'title', label:'Title', value:s.title||'', full:true, ph:'e.g. Rules and scoring, live'},
      {k:'kind',  label:'Kind', type:'select', value:s.kind||'rules', opts:SESSION_KINDS},
      {k:'brand', label:'About a brand?', type:'select', value:s.brand_id||'',
       opts:[{v:'',t:'not brand specific'}].concat((brands||[]).map(function(b){ return {v:b.id,t:b.name}; }))},
      {k:'start', label:'Starts', type:'datetime-local', value:dtLocal(s.starts_at)},
      {k:'mins',  label:'Minutes', type:'number', min:1, value:s.duration_min||45},
      {k:'host',  label:'Who is running it', value:s.host||''},
      {k:'agenda',label:'Agenda', type:'textarea', rows:3, value:s.agenda||''},
      {k:'join',  label:'Join link', value:s.join_url||'', ph:'https://…'},
      {k:'rec',   label:'Recording link', value:s.recording_url||'', ph:'https://…',
       hint:'Post this within two hours so anyone who missed it is not behind.'}

  function sessionPatch(){
    return { title:Vt('title'), kind:Vt('kind')||'other', brand_id:Vt('brand'),
      starts_at:Vdt('start'), duration_min:Vn('mins')||45, host:Vt('host'), agenda:Vt('agenda'),
      join_url:Vt('join'), recording_url:Vt('rec'),
      recorded_at: Vt('rec') ? new Date().toISOString() : null };
  }
  function annFields(a, sessions){
    a = a || {};
    return F([
      {k:'title', label:'Headline', value:a.title||'', full:true},
      {k:'kind',  label:'Kind', type:'select', value:a.kind||'notice', opts:ANN_KINDS},
      {k:'ses',   label:'About a session?', type:'select', value:a.session_id||'',
       opts:[{v:'',t:'no session'}].concat((sessions||[]).map(function(s){ return {v:s.id,t:s.title}; }))},
      {k:'body',  label:'The message', type:'textarea', rows:4, value:a.body||''},
      {k:'event', label:'When the thing happens', type:'datetime-local', value:dtLocal(a.event_at),
       hint:'Leave blank if it is not tied to a moment.'},
      {k:'pub',   label:'When creators see it', type:'datetime-local', value:dtLocal(a.publish_at),
       hint:'Has to be at least 24 hours before the event. The database refuses anything later.'},

  function annPatch(){

      event_at:Vdt('event'), publish_at:Vdt('pub') || new Date().toISOString(),
      is_pinned:V('pin')===true, is_critical:V('crit')===true };

            '<div class="sec-h"><h2>Sessions</h2><span class="sh-sub">' + ses.length + '</span>' +
              '<span class="sh-r">' + gate('sessions','<button class="btn-ghost btn-sm" id="shNewS">Add a session</button>') + '</span></div>' +
            table(['Session','When','Host','Recording',''], ses, function(s){
              return '<tr>' + who(s.title, String(s.kind||'').replace(/_/g,' ')) +

                '<td class="mono-s">' + esc(s.host||'-') + '</td>' +

      var na=$('#shNewA');
      if(na) na.onclick=function(){

          run:function(){

      $$('#shBody [data-es]').forEach(function(b){
        b.onclick=function(){
          var s=ses.filter(function(x){ return x.id===b.dataset.es; })[0];
          ask({ eyebrow:'Session', title:'Edit ' + s.title, body:sessionFields(s, brands), cta:'Save session',
            run:function(){ return save(db().from('sessions').update(sessionPatch()).eq('id',s.id), 'Session saved'); },
            after:function(){ renderSchedule(); }});
        };
      });
      $$('#shBody [data-ds]').forEach(function(b){
        b.onclick=function(){
          var s=ses.filter(function(x){ return x.id===b.dataset.ds; })[0];
          ask({ eyebrow:'Session', title:'Delete "' + s.title + '"?', danger:true,

        b.onclick=function(){
          var a=ann.filter(function(x){ return x.id===b.dataset.ea; })[0];
          ask({ eyebrow:'Feed', title:'Edit this post', body:annFields(a, ses), cta:'Save post',
            run:function(){ return save(db().from('announcements').update(annPatch()).eq('id',a.id), 'Post saved'); },
            after:function(){ renderSchedule(); }});
        };
      });
      $$('#shBody [data-da]').forEach(function(b){
        b.onclick=function(){
          var a=ann.filter(function(x){ return x.id===b.dataset.da; })[0];
          ask({ eyebrow:'Feed', title:'Delete "' + a.title + '"?', danger:true,
            sub:'It disappears from every creator dashboard.',
            body:'<p class="m-p">If creators have already read it, deleting it makes the timeline confusing. ' +
              'Consider posting a correction instead.</p>',
            cta:'Delete post',
            run:function(){ return save(db().from('announcements').delete().eq('id',a.id), 'Post deleted'); },
            after:function(){ renderSchedule(); }});
