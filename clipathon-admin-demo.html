<!DOCTYPE html>
<!-- clipathon-admin DEMO build 2026-08-21
     The operations console. Everything the team does during a cycle
     happens here: the verification queue, the account checker, slot
     control, QC, scoring and signoff, points, prizes, payouts and
     support. It shares the clipper dashboard's design system so the
     two consoles feel like one product.

     Consequential actions go through the admin_* RPCs in migration 016
     rather than raw table writes, so the role check and the audit trail
     cannot be skipped by a bug on this page. -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clipathon Admin, demo</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0B0A08">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script>
(function(){var t='light';try{t=localStorage.getItem('clipency-theme')||'light';}catch(e){}
document.documentElement.setAttribute('data-theme',t==='dark'?'dark':'light');})();
</script>
<style>
/* ============================================================
   CLIPENCY - CLIPPER DASHBOARD
   dark = ink + gold  ·  light = paper + ink (inverted)
   ============================================================ */
:root{
  --display:'Instrument Serif',Georgia,serif;
  --sans:'Plus Jakarta Sans',-apple-system,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.16,1,.3,1);
  --ok:#4E9E6A; --ok-dim:rgba(78,158,106,.13); --ok-line:rgba(78,158,106,.34);
  --no:#C4553C; --no-dim:rgba(196,85,60,.13); --no-line:rgba(196,85,60,.34);
  --wait:#B08D4B; --wait-dim:rgba(176,141,75,.13); --wait-line:rgba(176,141,75,.34);
}
[data-theme="dark"]{
  --bg:#0B0A08; --bg-2:#0E0D0B;
  --surface:#141210; --surface-2:#1A1714; --raise:#211D19;
  --ink:#EFEBE3; --ink-2:#FFFDF8;
  --ink-70:rgba(239,235,227,.7); --ink-55:rgba(239,235,227,.55);
  --ink-40:rgba(239,235,227,.4); --ink-25:rgba(239,235,227,.24);
  --hair:rgba(239,235,227,.08); --hair-2:rgba(239,235,227,.15);
  --gold:#D8AA74; --gold-2:#EFC894; --gold-dim:rgba(216,170,116,.12);
  --gold-line:rgba(216,170,116,.32);
  --accent:#D8AA74;                 /* gold in dark */
  --inv-bg:#F3EFE7; --inv-fg:#0B0A08;   /* KPI blocks: white on black */
  --inv-fg-55:rgba(11,10,8,.6); --inv-fg-25:rgba(11,10,8,.25);
  --bar-track:rgba(239,235,227,.09);
  --bar-fill:linear-gradient(90deg,#8C6A45,#D8AA74 60%,#EFC894);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 26px 60px -34px rgba(0,0,0,.9);
  --grid:rgba(239,235,227,.032);
  color-scheme:dark;
}
[data-theme="light"]{
  --bg:#FAF9F6; --bg-2:#F3F1EC;
  --surface:#FFFFFF; --surface-2:#F5F3EE; --raise:#FFFFFF;
  --ink:#141210; --ink-2:#000000;
  --ink-70:rgba(20,18,16,.72); --ink-55:rgba(20,18,16,.56);
  --ink-40:rgba(20,18,16,.42); --ink-25:rgba(20,18,16,.24);
  --hair:rgba(20,18,16,.1); --hair-2:rgba(20,18,16,.17);
  --gold:#8C6A45; --gold-2:#A98352; --gold-dim:rgba(140,106,69,.09);
  --gold-line:rgba(140,106,69,.3);
  --accent:#141210;                 /* ink in light */
  --inv-bg:#100E0C; --inv-fg:#FFFFFF;   /* KPI blocks: black on white */
  --inv-fg-55:rgba(255,255,255,.6); --inv-fg-25:rgba(255,255,255,.25);
  --bar-track:rgba(20,18,16,.1);
  --bar-fill:linear-gradient(90deg,#3A342C,#141210);
  --shadow:0 1px 2px rgba(60,50,35,.05),0 22px 50px -32px rgba(60,50,35,.3);
  --grid:rgba(20,18,16,.04);
  color-scheme:light;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.6;
  font-weight:400;-webkit-font-smoothing:antialiased;min-height:100vh;letter-spacing:-.005em;}
::selection{background:var(--accent);color:var(--bg);}
a{color:inherit;}
/* THEME SWITCHING - read before changing.
   The old approach put a .5s transition on EVERY element (html.theming *).
   Gradients (topbar, bar fills, .lb.top) can't animate background-image, so
   they snapped to the new theme instantly while thousands of other elements
   were still mid-fade - that's the half-light/half-dark "bars" artifact.
   Now: View Transitions crossfade the whole document in one composited pass.
   The class-based fallback below is only for browsers without it, and is
   scoped to the few surfaces that matter. */
::view-transition-old(root),::view-transition-new(root){
  animation-duration:.45s;animation-timing-function:cubic-bezier(.16,1,.3,1);mix-blend-mode:normal;}
html.theming body,html.theming .side,html.theming .card,html.theming .camp,
html.theming .kpi,html.theming .topbar,html.theming .modal,html.theming .nav-item{
  transition:background-color .42s ease,border-color .42s ease,color .42s ease !important;}
.grid-bg{position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(ellipse 75% 55% at 55% 0%,#000,transparent 72%);
          mask-image:radial-gradient(ellipse 75% 55% at 55% 0%,#000,transparent 72%);}

/* splash */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:15px;background:var(--bg);}
#splash.hide{display:none;}
#splash .mk{display:flex;align-items:center;gap:10px;}
#splash .mk svg{width:21px;height:21px;}
#splash .mk b{font-weight:600;font-size:12.5px;letter-spacing:.26em;}
#splash .ld{width:110px;height:2px;border-radius:2px;background:var(--bar-track);overflow:hidden;}
#splash .ld i{display:block;height:100%;width:40%;background:var(--accent);animation:ldm 1.1s var(--ease) infinite;}
@keyframes ldm{0%{transform:translateX(-110%);}100%{transform:translateX(350%);}}
#splash .msg{font-size:12px;color:var(--ink-40);}

/* ============================================================
   Shell
   ============================================================ */
.app{position:relative;z-index:1;display:grid;grid-template-columns:238px 1fr;min-height:100vh;}
.app.hide{display:none;}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--hair);
  background:var(--bg-2);padding:24px 14px 16px;}
.logo{display:flex;align-items:center;gap:9px;padding:0 10px;margin-bottom:28px;text-decoration:none;}
.logo svg{width:19px;height:19px;}
.logo b{font-weight:700;font-size:12.5px;letter-spacing:.26em;}
.nav-lab{font-family:var(--mono);font-size:9px;letter-spacing:.28em;color:var(--ink-40);text-transform:uppercase;padding:0 12px;margin:15px 0 6px;}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border-radius:10px;border:1px solid transparent;
  background:none;color:var(--ink-55);font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;
  text-align:left;position:relative;transition:all .26s ease;text-decoration:none;}
.nav-item svg{width:15px;height:15px;flex:none;}
.nav-item:hover{color:var(--ink);background:var(--surface-2);}
.nav-item.on{color:var(--accent);background:var(--gold-dim);border-color:var(--gold-line);}
[data-theme="light"] .nav-item.on{background:var(--surface-2);border-color:var(--hair-2);}
.nav-item.on::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:2px;border-radius:2px;background:var(--accent);}
.nav-item.on::after{content:"";position:absolute;right:12px;width:5px;height:5px;border-radius:50%;background:var(--accent);}
.curr-wrap{margin-top:auto;}
.curr-sel{width:100%;font-family:var(--mono);font-size:11.5px;color:var(--ink-70);background:var(--surface);
  border:1px solid var(--hair);border-radius:9px;padding:9px 11px;cursor:pointer;outline:none;}
.user{display:flex;align-items:center;gap:10px;margin-top:12px;padding:11px 8px 0;border-top:1px solid var(--hair);}
.ava{width:32px;height:32px;border-radius:9px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:15px;background:var(--gold-dim);color:var(--accent);border:1px solid var(--gold-line);}
.user .nm{font-size:13px;font-weight:600;line-height:1.3;}
.user .rl{font-size:10.5px;color:var(--ink-40);}
.user .out{margin-left:auto;background:none;border:none;color:var(--ink-40);cursor:pointer;padding:4px;}
.user .out:hover{color:var(--no);}

.main{padding:0 40px 70px;max-width:1400px;width:100%;}
/* solid background + mask (not a gradient) so the colour can actually
   transition between themes; the mask does the fade-out at the bottom edge */
.topbar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:14px;padding:16px 0;
  background:var(--bg);
  -webkit-mask-image:linear-gradient(#000 72%,transparent);
          mask-image:linear-gradient(#000 72%,transparent);}
.topbar .sp{margin-left:auto;}
.me-pill{display:flex;align-items:center;gap:8px;padding:5px 14px 5px 5px;border-radius:999px;
  border:1px solid var(--hair);background:var(--surface);font-size:12.5px;font-weight:600;}
.me-pill .ava{width:25px;height:25px;border-radius:7px;font-size:12px;}

/* ---- theme switch (image 4) ---- */
.tsw-wrap{display:flex;align-items:center;gap:12px;}
.tsw-lab{font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;
  color:var(--accent);white-space:nowrap;transition:color .4s;}
[data-theme="light"] .tsw-lab{color:var(--ink-55);}
.tsw{position:relative;width:58px;height:30px;border-radius:16px;cursor:pointer;flex:none;padding:0;
  border:1px solid var(--gold-line);background:var(--surface);transition:border-color .4s,background .4s;}
[data-theme="light"] .tsw{border-color:var(--hair-2);}
.tsw:hover{border-color:var(--accent);}
.tsw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;
  background:var(--inv-bg);display:flex;align-items:center;justify-content:center;
  transition:transform .5s var(--ease),background .4s;}
[data-theme="light"] .tsw i{transform:translateX(28px);background:var(--inv-bg);}
.tsw i svg{width:12px;height:12px;position:absolute;transition:opacity .35s ease,transform .5s var(--ease);}
.tsw .mo{color:#0B0A08;opacity:1;}
.tsw .su{color:#FFF;opacity:0;transform:rotate(-90deg) scale(.5);}
[data-theme="light"] .tsw .mo{opacity:0;transform:rotate(90deg) scale(.5);}
[data-theme="light"] .tsw .su{opacity:1;transform:none;}

/* ---- tutorial-mode "?" button (beside the theme switch) ---- */
.tut-wrap{display:flex;align-items:center;gap:9px;}
.tut-lab{display:flex;align-items:center;gap:6px;font-family:var(--sans);font-size:10.5px;font-weight:600;
  letter-spacing:.24em;text-transform:uppercase;color:var(--ink-55);white-space:nowrap;transition:color .35s;}
.tut-wrap:hover .tut-lab{color:var(--accent);}
.tut-lab .arw{font-size:12px;color:var(--accent);transition:transform .4s var(--ease);}
.tut-wrap:hover .tut-lab .arw{transform:translateX(3px);}
.tut-btn{width:30px;height:30px;flex:none;border-radius:50%;cursor:pointer;padding:0;
  border:1px solid var(--gold-line);background:var(--surface);color:var(--ink-55);
  font-family:var(--display);font-size:16px;line-height:1;
  transition:color .3s,border-color .3s,transform .4s var(--ease),background .4s;}
[data-theme="light"] .tut-btn{border-color:var(--hair-2);}
.tut-btn:hover{color:var(--accent);border-color:var(--accent);transform:translateY(-1px);}
.tut-btn.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);}
.topbar .divi{width:1px;height:20px;background:var(--hair-2);}

.crumb{font-family:var(--mono);font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:4px;}
h1.pg{font-family:var(--display);font-weight:400;font-size:44px;line-height:1.02;color:var(--ink-2);letter-spacing:-.01em;}
.pg-sub{color:var(--ink-55);font-size:13.5px;margin-top:6px;max-width:560px;}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;margin-bottom:22px;flex-wrap:wrap;}
.view{display:none;} .view.on{display:block;animation:vIn .42s var(--ease) both;}
@keyframes vIn{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:none;}}

.card{background:var(--surface);border:1px solid var(--hair);border-radius:16px;padding:20px 22px;box-shadow:var(--shadow);}
.lab{font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--ink-40);}
.big{font-family:var(--display);font-weight:400;font-size:34px;line-height:1.05;color:var(--ink-2);margin-top:6px;letter-spacing:-.01em;}
.big.gold{color:var(--gold);}
.sub-t{font-size:11.5px;color:var(--ink-40);margin-top:4px;}
.num{font-family:var(--sans);font-weight:700;font-variant-numeric:tabular-nums;}

/* inverted KPI block */
.kpi{background:var(--inv-bg);color:var(--inv-fg);border-radius:16px;padding:19px 21px;position:relative;overflow:hidden;box-shadow:var(--shadow);
  transition:transform .45s var(--ease);}
.kpi:hover{transform:translateY(-2px);}
.kpi .lab{color:var(--inv-fg-55);}
.kpi .big{color:var(--inv-fg);}
.kpi .sub-t{color:var(--inv-fg-55);}
.kpi .spark{position:absolute;left:0;right:0;bottom:0;height:32px;opacity:.18;}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:13.5px;
  font-weight:600;cursor:pointer;padding:11px 20px;border-radius:10px;border:none;background:var(--gold);color:#161310;
  transition:transform .35s var(--ease),background .3s;}
[data-theme="light"] .btn{background:var(--inv-bg);color:var(--inv-fg);}
.btn:hover{transform:translateY(-1px);background:var(--gold-2);}
[data-theme="light"] .btn:hover{background:#2A251F;}
.btn:disabled{opacity:.4;cursor:default;transform:none;}
.btn-ghost{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--sans);font-size:13px;
  font-weight:500;cursor:pointer;padding:10px 18px;border-radius:10px;background:transparent;color:var(--ink-70);
  border:1px solid var(--hair-2);transition:all .3s;}
.btn-ghost:hover{border-color:var(--accent);color:var(--ink);}
.btn-sm{padding:7px 13px;font-size:12px;border-radius:8px;}

.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 11px;border-radius:999px;font-size:11px;font-weight:600;
  border:1px solid var(--hair-2);color:var(--ink-55);background:var(--surface-2);}
.chip.gold{color:var(--gold);border-color:var(--gold-line);background:var(--gold-dim);}
.chip.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-dim);}
.chip.no{color:var(--no);border-color:var(--no-line);background:var(--no-dim);}
.chip.wait{color:var(--wait);border-color:var(--wait-line);background:var(--wait-dim);}
.dot-live{width:5px;height:5px;border-radius:50%;background:var(--ok);animation:bl 1.8s ease infinite;}
@keyframes bl{50%{opacity:.3;}}

.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:13px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:13px;}

table{width:100%;border-collapse:collapse;}
th{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);font-weight:400;
  text-align:left;padding:9px 12px;border-bottom:1px solid var(--hair);}
td{padding:12px;border-bottom:1px solid var(--hair);font-size:13px;color:var(--ink-70);}
tr:last-child td{border-bottom:none;}
tbody tr{transition:background .2s;}
tbody tr:hover{background:var(--surface-2);}

/* ============================================================
   PROGRESS BAR - gold in dark, ink in light, animates on hover
   ============================================================ */
.prog{position:relative;cursor:default;padding:2px 0;}
.prog .track{height:7px;border-radius:99px;background:var(--bar-track);overflow:hidden;position:relative;transition:height .4s var(--ease);}
.prog .fill{height:100%;border-radius:99px;background:var(--bar-fill);width:0;position:relative;overflow:hidden;
  transition:width 1.15s var(--ease);}
.prog .fill::after{content:"";position:absolute;inset:0;transform:translateX(-100%);opacity:0;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.75),transparent);}
.prog .bubble{position:absolute;top:-28px;left:0;transform:translateX(-50%);padding:3px 9px;border-radius:7px;
  background:var(--inv-bg);color:var(--inv-fg);font-family:var(--mono);font-size:10px;white-space:nowrap;
  opacity:0;transition:opacity .3s,top .35s var(--ease);pointer-events:none;}
/* hover - on the bar itself, or anywhere on the campaign card */
.prog:hover .track,.camp:hover .prog .track{height:11px;}
.prog:hover .fill::after,.camp:hover .prog .fill::after{opacity:.55;animation:sweep 1.2s var(--ease) infinite;}
.prog:hover .bubble{opacity:1;top:-32px;}
@keyframes sweep{0%{transform:translateX(-100%);}100%{transform:translateX(240%);}}
.prog-meta{display:flex;justify-content:space-between;margin-top:8px;font-size:11px;color:var(--ink-40);}

.seg{display:inline-flex;gap:3px;padding:3px;border:1px solid var(--hair);border-radius:10px;background:var(--surface-2);}
.seg button{padding:6px 14px;border-radius:7px;border:none;background:none;cursor:pointer;font-family:var(--sans);
  font-size:12px;font-weight:600;color:var(--ink-55);transition:all .26s;}
.seg button.on{background:var(--gold-dim);color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold-line);}
[data-theme="light"] .seg button.on{background:var(--inv-bg);color:var(--inv-fg);box-shadow:none;}
.seg.mono button{font-family:var(--mono);font-size:10px;letter-spacing:.1em;}

.field{margin-bottom:13px;}
.field label{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-40);margin-bottom:6px;}
.field input,.field select,.field textarea{width:100%;font-family:var(--sans);font-size:14px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--hair-2);border-radius:10px;padding:11px 13px;outline:none;transition:all .26s;}
.field textarea{resize:vertical;min-height:76px;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);}
.field input::placeholder{color:var(--ink-25);}

/* ============================================================
   CAMPAIGN CARDS (matches the live dashboard)
   ============================================================ */
.filters{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:20px;}
.f-chip{padding:7px 17px;border-radius:999px;font-size:12.5px;font-weight:600;cursor:pointer;background:transparent;
  border:1px solid var(--hair-2);color:var(--ink-55);transition:all .26s;}
.f-chip:hover{border-color:var(--accent);color:var(--ink);}
.f-chip.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);}
.f-count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-40);letter-spacing:.08em;}
.camp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:17px;}
.camp{background:var(--surface);border:1px solid var(--hair);border-radius:18px;padding:16px;cursor:pointer;
  box-shadow:var(--shadow);transition:transform .45s var(--ease),border-color .35s;}
.camp:hover{transform:translateY(-3px);border-color:var(--gold-line);}
.camp .row1{display:flex;align-items:center;gap:11px;}
.camp .ico{width:38px;height:38px;border-radius:11px;flex:none;background:var(--surface-2);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;overflow:hidden;font-family:var(--display);font-size:17px;color:var(--accent);}
.camp .ico img{width:100%;height:100%;object-fit:cover;}
.camp .nm{font-size:15px;font-weight:700;line-height:1.25;letter-spacing:-.01em;}
.camp .meta{display:flex;gap:6px;margin-top:5px;}
.camp .banner{margin-top:14px;height:132px;border-radius:12px;overflow:hidden;background:var(--surface-2);
  border:1px solid var(--hair);display:flex;align-items:center;justify-content:center;}
.camp .banner img{width:100%;height:100%;object-fit:cover;}
.camp .banner .ph{font-family:var(--display);font-style:italic;font-size:26px;color:var(--ink-25);}
.camp .nums{display:flex;margin-top:13px;gap:10px;}
.camp .nums>div{flex:1;padding:10px 14px;background:var(--surface-2);border:1px solid var(--hair);border-radius:11px;}
.camp .nums b{display:block;font-family:var(--sans);font-weight:700;font-size:19px;color:var(--gold);margin-top:2px;letter-spacing:-.02em;}
[data-theme="light"] .camp .nums b{color:var(--ink-2);}
.camp .nums .cl{color:var(--ink-2);}
.camp .budget{margin-top:14px;}
.camp .budget .r{display:flex;justify-content:space-between;margin-bottom:7px;}
.camp .budget .r .lab{font-size:8.5px;}
.camp .budget .r b{font-family:var(--mono);font-size:11px;color:var(--gold);}
[data-theme="light"] .camp .budget .r b{color:var(--ink);}
.camp .foot{display:flex;align-items:center;gap:9px;margin-top:14px;}
.avs{display:flex;}
.avs span{width:23px;height:23px;border-radius:50%;border:2px solid var(--surface);background:var(--surface-2);
  color:var(--accent);font-size:9px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-left:-7px;}
.avs span:first-child{margin-left:0;}
.camp .foot .more{font-size:11.5px;color:var(--ink-40);}
.camp .foot .go{margin-left:auto;font-size:12.5px;font-weight:600;color:var(--accent);display:inline-flex;gap:5px;align-items:center;}
.camp:hover .go{gap:8px;}

/* campaign detail */
.det-head{display:flex;align-items:center;gap:13px;flex-wrap:wrap;margin-bottom:20px;}
.backlink{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:10px;border:1px solid var(--hair-2);
  background:var(--surface);color:var(--ink-70);font-size:13px;font-weight:600;cursor:pointer;transition:all .3s;}
.backlink:hover{border-color:var(--accent);color:var(--ink);transform:translateX(-2px);}
.det-ico{width:52px;height:52px;border-radius:14px;overflow:hidden;background:var(--surface-2);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:22px;color:var(--accent);}
.det-ico img{width:100%;height:100%;object-fit:cover;}
.det-title{font-family:var(--display);font-weight:400;font-size:30px;color:var(--ink-2);line-height:1.1;}
.req{display:flex;align-items:flex-start;gap:12px;padding:13px 4px;border-bottom:1px solid var(--hair);font-size:12.5px;
  color:var(--ink-70);font-weight:500;}
.req:last-child{border-bottom:none;}
.req .tk{width:20px;height:20px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;
  background:var(--ok-dim);color:var(--ok);font-size:10px;border:1px solid var(--ok-line);}
.asset{display:flex;align-items:center;gap:13px;padding:15px 17px;border:1px solid var(--hair);border-radius:14px;
  background:var(--surface);text-decoration:none;transition:all .3s;}
.asset:hover{border-color:var(--gold-line);transform:translateY(-2px);}
.asset .ai{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;
  background:var(--surface-2);border:1px solid var(--hair);font-size:17px;}
.asset b{display:block;font-size:14px;font-weight:700;margin-top:2px;}
.asset .sm{font-size:11px;color:var(--ink-40);}
.asset .ar{margin-left:auto;color:var(--accent);}
.lb{display:flex;align-items:center;gap:12px;padding:11px 14px;border:1px solid var(--hair);border-radius:12px;
  background:var(--surface-2);margin-bottom:7px;transition:border-color .3s;}
.lb:hover{border-color:var(--gold-line);}
.lb.top{background:linear-gradient(90deg,var(--gold-dim),var(--surface-2) 70%);border-color:var(--gold-line);}
.lb .rk{font-family:var(--mono);font-size:10.5px;width:22px;color:var(--accent);}
.lb .cav{width:27px;height:27px;border-radius:50%;background:var(--surface);border:1px solid var(--hair-2);
  display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--accent);}
.lb .who b{display:block;font-size:12.5px;font-weight:600;line-height:1.3;}
.lb .who span{font-family:var(--mono);font-size:10.5px;color:var(--ink-40);}
.lb .n{margin-left:auto;text-align:right;}
.lb .n b{display:block;font-size:13px;font-weight:700;}
.lb .n span{font-size:11.5px;color:var(--ok);}

/* misc blocks */
.pay-row{display:flex;align-items:center;gap:12px;padding:12px 3px;border-bottom:1px solid var(--hair);}
.pay-row:last-child{border-bottom:none;}
.pay-ico{width:34px;height:34px;border-radius:10px;background:var(--surface-2);border:1px solid var(--hair);
  display:flex;align-items:center;justify-content:center;font-size:13px;}
.pay-row .t b{display:block;font-size:12.5px;font-weight:600;}
.pay-row .t span{font-size:11px;color:var(--ink-40);}
.pay-amt{margin-left:auto;text-align:right;}
.pay-amt b{display:block;font-family:var(--sans);font-weight:700;font-size:14px;}
.empty{text-align:center;padding:44px 20px;color:var(--ink-40);font-size:13px;}
.empty .ei{font-size:22px;opacity:.5;margin-bottom:7px;}
.note-strip{display:flex;gap:10px;padding:13px 16px;border-radius:12px;border:1px solid var(--hair);background:var(--surface);
  font-size:12.5px;color:var(--ink-55);}
.note-strip b{color:var(--ink-70);}
.kv{display:flex;align-items:center;gap:12px;padding:12px 2px;border-bottom:1px solid var(--hair);}
.kv:last-child{border-bottom:none;}
.kv .k{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-40);}
.kv .v{margin-left:auto;font-size:14px;font-weight:700;color:var(--ink-2);display:flex;align-items:center;gap:8px;}
.kv .v.gold{color:var(--gold);}
.edit-mini{padding:3px 9px;font-size:10.5px;border-radius:6px;border:1px solid var(--hair-2);background:none;color:var(--ink-55);cursor:pointer;}
.edit-mini:hover{border-color:var(--accent);color:var(--accent);}
.prof-ava{width:74px;height:74px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--display);font-size:33px;background:var(--gold-dim);color:var(--accent);border:1px solid var(--gold-line);}
.rank{margin-left:auto;text-align:center;padding:16px 24px;border-radius:15px;background:var(--inv-bg);color:var(--inv-fg);}
.rank .lab{color:var(--inv-fg-55);}
.rank b{display:block;font-family:var(--display);font-size:31px;line-height:1.1;margin-top:3px;}
.rank span{font-size:10.5px;color:var(--inv-fg-55);}
.acct{display:flex;align-items:flex-start;gap:12px;padding:14px 2px;border-bottom:1px solid var(--hair);}
.acct:last-child{border-bottom:none;}
.p-ico{width:37px;height:37px;border-radius:11px;flex:none;display:flex;align-items:center;justify-content:center;
  border:1px solid var(--hair-2);background:var(--surface-2);}
.p-ico svg{width:16px;height:16px;}
.acct .info b{font-size:13.5px;font-weight:700;}
.handles{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;}
/* remove "×" tucked inside the handle pill - only shows on hover/focus so the
   chips stay clean, but stays keyboard reachable */
.handle .rm{margin-left:2px;border:none;background:none;padding:0 0 0 3px;cursor:pointer;color:inherit;
  font-size:12px;line-height:1;opacity:0;transition:opacity .15s,color .15s;}
.handle:hover .rm,.handle .rm:focus{opacity:.75;}
.handle .rm:hover,.handle .rm:focus{color:var(--danger,#B4796E);opacity:1;}
.pay-row .rm-pm{border:1px solid var(--hair);background:none;border-radius:8px;padding:3px 9px;cursor:pointer;
  font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);
  transition:color .15s,border-color .15s;margin-left:7px;}
.pay-row .rm-pm:hover{color:var(--danger,#B4796E);border-color:var(--danger,#B4796E);}
.handle{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-family:var(--mono);font-size:10.5px;
  border:1px solid var(--hair-2);}
.handle.ver{color:var(--gold);border-color:var(--gold-line);background:var(--gold-dim);}
[data-theme="light"] .handle.ver{color:var(--ink);border-color:var(--hair-2);}
.handle.pend{color:var(--wait);border-color:var(--wait-line);background:var(--wait-dim);}
.acct .none{font-size:11.5px;color:var(--ink-40);margin-top:2px;}
.acct .add{margin-left:auto;}

/* support */
.sup-card{display:flex;align-items:center;gap:18px;padding:26px;border-radius:18px;border:1px solid var(--hair);
  background:var(--surface);box-shadow:var(--shadow);transition:all .4s var(--ease);}
.sup-card:hover{border-color:var(--gold-line);transform:translateY(-2px);}
.sup-ico{width:56px;height:56px;border-radius:16px;flex:none;display:flex;align-items:center;justify-content:center;}
.sup-ico svg{width:26px;height:26px;}
.sup-ico.dc{background:rgba(88,101,242,.14);color:#7C88F5;}
.sup-ico.ml{background:var(--gold-dim);color:var(--accent);border:1px solid var(--gold-line);}
.sup-card h3{font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink-2);line-height:1.15;}
.sup-card p{font-size:13px;color:var(--ink-55);margin-top:3px;}
.sup-card .act{margin-left:auto;}

/* modals */
.veil{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.6);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);padding:22px;}
.veil.on{display:flex;animation:fIn .28s ease both;}
@keyframes fIn{from{opacity:0;}}
.modal{position:relative;width:100%;max-width:420px;background:var(--surface);border:1px solid var(--hair-2);border-radius:18px;
  padding:30px 28px 26px;box-shadow:0 40px 90px -30px rgba(0,0,0,.7);animation:mIn .4s var(--ease) both;}
@keyframes mIn{from{opacity:0;transform:translateY(13px);}to{opacity:1;transform:none;}}
.modal::before{content:"";position:absolute;top:-1px;left:44px;right:44px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.modal .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}

/* ===== 3-STEP WIZARD ===================================================== */
.wz-steps{display:flex;gap:6px;margin-bottom:20px;}
.wz-bar{height:3px;flex:1;border-radius:2px;background:var(--hair-2);transition:background .45s var(--ease);}
.wz-bar.done{background:var(--gold-line);}
.wz-bar.active{background:var(--accent);}

.wz-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px;}
.wz-grid.two{grid-template-columns:repeat(2,1fr);}
.wz-card{display:flex;flex-direction:column;align-items:center;gap:9px;padding:18px 10px;border-radius:14px;
  border:1px solid var(--hair);background:var(--surface-2);cursor:pointer;text-align:center;
  transition:border-color .2s,background .2s,transform .25s var(--ease);}
.wz-card:hover{border-color:var(--gold-line);transform:translateY(-2px);}
.wz-card.on{border-color:var(--accent);background:var(--gold-dim);box-shadow:0 0 0 1px var(--accent) inset;}
/* Monochrome: glyphs stay ink until chosen, then take the one accent colour. */
.wz-ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;justify-content:center;
  background:var(--raise);border:1px solid var(--hair);color:var(--ink-55);transition:color .2s,background .2s,border-color .2s;}
.wz-card.on .wz-ico{color:var(--accent);background:var(--gold-dim);border-color:var(--gold-line);}
.wz-ico svg{width:21px;height:21px;}
.wz-nm{font-size:12.5px;font-weight:600;color:var(--ink);}
.wz-sub{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-40);}
.wz-card.on .wz-nm{color:var(--accent);}

.wz-acct{display:flex;align-items:center;gap:12px;padding:14px 15px;border-radius:13px;border:1px solid var(--hair);
  background:var(--surface-2);cursor:pointer;margin-bottom:9px;transition:border-color .2s,background .2s;}
.wz-acct:hover{border-color:var(--gold-line);}
.wz-acct.on{border-color:var(--accent);background:var(--gold-dim);}
.wz-av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--raise);border:1px solid var(--hair);font-family:var(--display);font-size:16px;color:var(--ink-55);}
.wz-acct.on .wz-av{color:var(--accent);border-color:var(--gold-line);}
.wz-acct .t{flex:1;min-width:0;}
.wz-acct .t b{display:block;font-size:13.5px;color:var(--ink);}
.wz-acct .t span{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-40);}
.wz-rad{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--hair-2);flex-shrink:0;position:relative;transition:border-color .2s;}
.wz-acct.on .wz-rad{border-color:var(--accent);}
.wz-acct.on .wz-rad::after{content:"";position:absolute;inset:3.5px;border-radius:50%;background:var(--accent);}

.wz-empty{text-align:center;padding:24px 8px 6px;}
.wz-empty .ei{font-size:26px;color:var(--ink-25);margin-bottom:10px;}
.wz-empty b{display:block;font-size:14px;color:var(--ink);margin-bottom:5px;}
.wz-empty p{font-size:12.5px;color:var(--ink-55);line-height:1.5;margin-bottom:16px;}

.wz-nav{display:flex;gap:10px;margin-top:20px;}
.wz-nav .btn,.wz-nav .btn-ghost{flex:1;}
.wz-nav .btn[disabled]{opacity:.4;cursor:not-allowed;}

/* Step transitions - the pane slides, the frame (bars, close) stays put. */
@keyframes wzOutF{to{opacity:0;transform:translateX(-14px);}}
@keyframes wzInF{from{opacity:0;transform:translateX(18px);}}
@keyframes wzOutB{to{opacity:0;transform:translateX(14px);}}
@keyframes wzInB{from{opacity:0;transform:translateX(-18px);}}
.wz-pane.out-f{animation:wzOutF .15s ease forwards;}
.wz-pane.out-b{animation:wzOutB .15s ease forwards;}
.wz-pane.in-f{animation:wzInF .33s var(--ease) both;}
.wz-pane.in-b{animation:wzInB .33s var(--ease) both;}
.wz-host{transition:height .33s var(--ease);overflow:hidden;}

/* Theme swap eases instead of snapping. Excludes transform/opacity so the
   modal and chart animations aren't slowed to a crawl. */
body,.card,.modal,.veil,.wz-card,.wz-acct,.wz-ico,.wz-av,.field input,.field select,
.btn,.btn-ghost,.chip,.kpi,.nav-item,table,th,td{
  transition:background-color .35s var(--ease),color .35s var(--ease),border-color .35s var(--ease);}
@media(prefers-reduced-motion:reduce){
  .wz-pane.out-f,.wz-pane.out-b,.wz-pane.in-f,.wz-pane.in-b{animation:none!important;}
  .wz-host{transition:none!important;}
}
.modal h3{font-family:var(--display);font-weight:400;font-size:25px;color:var(--ink-2);line-height:1.2;}
.modal .m-sub{font-size:13px;color:var(--ink-55);margin-top:6px;}
.modal .m-x{position:absolute;top:12px;right:14px;width:26px;height:26px;border-radius:7px;border:1px solid var(--hair);
  background:none;color:var(--ink-40);cursor:pointer;transition:all .3s;}
.modal .m-x:hover{color:var(--no);transform:rotate(90deg);}
.m-actions{display:flex;gap:9px;margin-top:18px;}
.m-actions>*{flex:1;}
.code-box{margin:15px 0;padding:19px;border-radius:13px;text-align:center;border:1px solid var(--gold-line);background:var(--gold-dim);}
.code-box .code{font-family:var(--mono);font-size:29px;letter-spacing:.26em;margin:5px 0 10px;color:var(--gold);}
.steps-box{margin-top:13px;padding:12px 15px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);
  font-size:12.5px;color:var(--ink-55);}
.steps-box b{color:var(--accent);}
.warn-box{margin-top:13px;padding:11px 14px;border-radius:11px;font-size:12px;border:1px solid var(--wait-line);
  background:var(--wait-dim);color:var(--ink-70);}
.center{text-align:center;}
.modal-msg{min-height:18px;font-size:12px;margin-top:10px;text-align:center;}
.modal-msg.err{color:var(--no);} .modal-msg.ok{color:var(--ok);}

#toast{position:fixed;bottom:22px;left:50%;transform:translate(-50%,18px);z-index:90;padding:11px 20px;border-radius:11px;
  background:var(--inv-bg);color:var(--inv-fg);font-size:13px;font-weight:600;opacity:0;pointer-events:none;
  transition:all .4s var(--ease);box-shadow:0 18px 40px -18px rgba(0,0,0,.5);max-width:90vw;}
#toast.on{opacity:1;transform:translate(-50%,0);}

/* ============================================================
   CAMPAIGN CARD - hover reveal + entrance stagger
   ============================================================ */
.camp{animation:cIn .55s var(--ease) both;}
@keyframes cIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:none;}}
/* budget bar + reveal strip: both hidden until the card is hovered */
.camp .budget{max-height:0;opacity:0;overflow:hidden;margin-top:0;
  transition:max-height .5s var(--ease),opacity .35s ease,margin-top .5s var(--ease);}
.camp:hover .budget{max-height:70px;opacity:1;margin-top:14px;}
/* the fill sweeps up from 0 each time the card is hovered */
/* ---- exhausted campaign ------------------------------------------------
   A campaign whose creator pool is spent still looked identical to a live
   one: same bar, same "budget left", same Submit button. Clippers had no way
   to tell there was nothing left to earn, so they kept submitting clips that
   could never be paid. These styles make it unmistakable. */
.chip.spent{color:var(--no);border-color:var(--no-line);background:var(--no-dim);}
.camp.is-spent .banner{filter:grayscale(.65);opacity:.72;}
.camp.is-spent .budget .r b{color:var(--no);}
.camp.is-spent .prog .fill{background:var(--no);}
.prog.is-spent .fill{background:var(--no);}
.camp.is-spent .hmore .in b{color:var(--no);}
.spent-note{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 13px;border-radius:10px;
  background:var(--no-dim);border:1px solid var(--no-line);color:var(--no);
  font-size:12.5px;line-height:1.45;}
.spent-note .ic{font-size:13px;flex:none;}
.btn[disabled]{opacity:.42;cursor:not-allowed;pointer-events:none;}
.camp .budget .fill{width:0;transition:width 1.1s var(--ease) .1s;}
.camp:hover .budget .fill{width:var(--w);}
.camp .hmore{max-height:0;opacity:0;overflow:hidden;margin-top:0;
  transition:max-height .5s var(--ease),opacity .4s ease .08s,margin-top .5s var(--ease);}
.camp:hover .hmore{max-height:60px;opacity:1;margin-top:10px;}
.camp .hmore .in{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;
  border-radius:10px;background:var(--gold-dim);border:1px solid var(--gold-line);font-size:11.5px;color:var(--ink-70);}
[data-theme="light"] .camp .hmore .in{background:var(--surface-2);border-color:var(--hair-2);}
.camp .hmore .in b{color:var(--accent);font-weight:600;}
#campDetail{animation:detIn .55s var(--ease);}
@keyframes detIn{from{opacity:0;transform:translateY(16px) scale(.988);}to{opacity:1;transform:none;}}

/* platform breakdown bars (stats) */
.pbar{margin-bottom:13px;}
.pbar .r{display:flex;justify-content:space-between;font-size:12px;margin-bottom:6px;color:var(--ink-70);}
.pbar .r b{font-family:var(--mono);font-size:11px;color:var(--accent);}
.pbar .track{height:6px;border-radius:99px;background:var(--bar-track);overflow:hidden;}
.pbar .fill{height:100%;border-radius:99px;background:var(--bar-fill);width:0;transition:width 1.1s var(--ease);}

/* support / contact channels (client-portal style) */
.chan{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--hair-2);border-radius:13px;
  background:var(--surface-2);margin-top:10px;text-decoration:none;cursor:pointer;color:var(--ink);
  transition:border-color .3s,transform .4s var(--ease);}
.chan:hover{border-color:var(--gold-line);transform:translateY(-1px);}
.chan .ci{width:38px;height:38px;border-radius:11px;flex:none;background:var(--inv-bg);color:var(--inv-fg);
  display:flex;align-items:center;justify-content:center;}
.chan .ci svg{width:17px;height:17px;}
.chan .cm{flex:1;min-width:0;}
.chan .cm b{display:block;font-size:13.5px;font-weight:700;}
.chan .cm span{font-size:12px;color:var(--ink-55);font-family:var(--mono);}
.chan .ar{color:var(--accent);font-size:15px;}

/* ============================================================
   ONBOARDING WIZARD
   ============================================================ */
.onb-veil{position:fixed;inset:0;z-index:95;display:none;align-items:center;justify-content:center;
  background:rgba(0,0,0,.7);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);padding:20px;}
.onb-veil.on{display:flex;animation:fIn .3s ease both;}
.onb{width:100%;max-width:540px;background:var(--surface);border:1px solid var(--hair-2);border-radius:22px;
  padding:32px 32px 26px;position:relative;box-shadow:0 50px 110px -35px rgba(0,0,0,.8);animation:mIn .45s var(--ease) both;}
.onb::before{content:"";position:absolute;top:-1px;left:52px;right:52px;height:1px;
  background:linear-gradient(90deg,transparent,var(--gold),transparent);}
.onb-dots{display:flex;gap:6px;margin-bottom:20px;}
.onb-dots i{height:3px;flex:1;border-radius:3px;background:var(--bar-track);position:relative;overflow:hidden;}
.onb-dots i.done::after{content:"";position:absolute;inset:0;background:var(--accent);border-radius:3px;}
.onb .eyeb{font-family:var(--mono);font-size:9px;letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:8px;}
.onb h3{font-family:var(--display);font-weight:400;font-size:28px;color:var(--ink-2);line-height:1.15;}
.onb .o-sub{font-size:13.5px;color:var(--ink-55);margin-top:8px;line-height:1.6;}
.role-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px;}
.role-card{padding:22px 18px;border:1px solid var(--hair-2);border-radius:16px;background:var(--surface-2);
  cursor:pointer;text-align:left;transition:border-color .3s,transform .4s var(--ease);font-family:var(--sans);color:var(--ink);}
.role-card:hover{border-color:var(--gold-line);transform:translateY(-2px);}
.role-card .em{font-size:23px;}
.role-card b{display:block;font-size:15.5px;font-weight:700;margin-top:9px;}
.role-card p{font-size:12px;color:var(--ink-55);margin-top:4px;line-height:1.5;}
.pick-grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px;}
.pick{padding:9px 17px;border-radius:999px;border:1px solid var(--hair-2);background:var(--surface-2);
  color:var(--ink-70);font-size:13px;font-weight:600;cursor:pointer;font-family:var(--sans);transition:all .25s;}
.pick:hover{border-color:var(--accent);color:var(--ink);}
.pick.on{background:var(--inv-bg);color:var(--inv-fg);border-color:var(--inv-bg);}
.onb-foot{display:flex;gap:9px;margin-top:24px;align-items:center;}
.onb-skip{margin-right:auto;background:none;border:none;color:var(--ink-40);font-size:12px;cursor:pointer;font-family:var(--sans);transition:color .3s;}
.onb-skip:hover{color:var(--ink);}

/* ============================================================
   TOUR - spotlight + card (client-portal style)
   ============================================================ */
.tour-hl{position:fixed;z-index:96;border-radius:14px;pointer-events:none;display:none;
  box-shadow:0 0 0 9999px rgba(0,0,0,.66),0 0 0 2px var(--gold);transition:all .5s var(--ease);}
.tour-hl.on{display:block;}
.tour-tip{position:fixed;z-index:97;width:min(340px,calc(100vw - 36px));background:var(--surface);
  border:1px solid var(--hair-2);border-radius:16px;padding:20px 22px 16px;display:none;
  box-shadow:0 30px 70px -24px rgba(0,0,0,.75);transition:all .5s var(--ease);}
.tour-tip.on{display:block;}
.tour-tip .stp{font-family:var(--mono);font-size:9px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);}
.tour-tip h4{font-family:var(--display);font-weight:400;font-size:20px;color:var(--ink-2);margin-top:6px;line-height:1.2;}
.tour-tip p{font-size:12.5px;color:var(--ink-55);margin-top:6px;line-height:1.6;}
.tour-tip .tdots{display:flex;gap:5px;margin-top:14px;}
.tour-tip .tdots i{width:5px;height:5px;border-radius:50%;background:var(--hair-2);transition:background .3s;}
.tour-tip .tdots i.on{background:var(--accent);}
.tour-tip .tt-foot{display:flex;gap:8px;margin-top:14px;align-items:center;}
.tour-tip .tt-foot .onb-skip{font-size:12px;}

@media (max-width:1000px){
  .app{grid-template-columns:1fr;}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px;border-right:none;
    border-bottom:1px solid var(--hair);padding:12px;}
  .nav-lab{display:none;} .curr-wrap{margin:0;width:120px;} .user{margin:0;border:none;padding:0;}
  .main{padding:0 16px 60px;}
  .g4,.g3,.g2{grid-template-columns:1fr 1fr;}
  h1.pg{font-size:34px;}
}

/* Logo is white ink on transparent: brightness(0) paints it black for light
   mode while keeping the alpha edges clean. invert() would lift the
   transparent pixels and leave a halo. */
.cx-logo{height:26px;width:auto;display:block;filter:brightness(0);transition:filter .3s ease}
[data-theme="dark"] .cx-logo{filter:none}

/* ============================================================
   ADMIN CONSOLE ADDITIONS
   Everything above is the shared clipper design system. Below is
   what an operations console needs on top: dense tables, queues,
   inline actions and a lot of numbers at a glance.
   ============================================================ */

/* ---- shell tweaks: the console is wider and denser than the
        creator dashboard, because ops work is list work ---- */
.app{grid-template-columns:230px 1fr;}
.main{max-width:1560px;padding:0 30px 70px;}
.side{padding:22px 12px 14px;}
.nav-item{padding:8px 11px;font-size:13px;}
.nav-lab{margin:13px 0 5px;}

/* Role chip beside the operator's name. */
.role-chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:999px;
  font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;
  border:1px solid var(--gold-line);background:var(--gold-dim);color:var(--gold);}
[data-theme="light"] .role-chip{color:var(--ink);border-color:var(--hair-2);background:var(--surface-2);}

/* ---- KPI strip ---------------------------------------------------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:11px;margin-bottom:16px;}
.kpi-s{padding:14px 16px;border-radius:13px;border:1px solid var(--hair);background:var(--surface);
  cursor:default;transition:border-color .3s,transform .35s var(--ease);}
button.kpi-s{cursor:pointer;text-align:left;font-family:var(--sans);width:100%;}
button.kpi-s:hover{border-color:var(--gold-line);transform:translateY(-2px);}
.kpi-s .k{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;
  text-transform:uppercase;color:var(--ink-40);}
.kpi-s .v{display:block;font-family:var(--display);font-weight:400;font-size:29px;line-height:1.1;
  color:var(--ink-2);margin-top:5px;}
.kpi-s .s{display:block;font-size:11px;color:var(--ink-40);margin-top:2px;}
.kpi-s.warn{border-color:var(--wait-line);background:var(--wait-dim);}
.kpi-s.warn .v{color:var(--wait);}
.kpi-s.bad{border-color:var(--no-line);background:var(--no-dim);}
.kpi-s.bad .v{color:var(--no);}
.kpi-s.good{border-color:var(--ok-line);background:var(--ok-dim);}
.kpi-s.good .v{color:var(--ok);}

/* ---- toolbar above every table ------------------------------------ */
.bar-t{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:13px;}
.bar-t .grow{flex:1;min-width:120px;}
.srch{width:100%;max-width:320px;font-family:var(--sans);font-size:13px;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--hair-2);border-radius:9px;padding:9px 12px;outline:none;}
.srch:focus{border-color:var(--accent);}
.mini-sel{font-family:var(--sans);font-size:12.5px;color:var(--ink);background:var(--surface-2);
  border:1px solid var(--hair-2);border-radius:9px;padding:8px 10px;outline:none;cursor:pointer;}

/* ---- dense table --------------------------------------------------- */
.tbl-wrap{border:1px solid var(--hair);border-radius:14px;background:var(--surface);
  overflow-x:auto;box-shadow:var(--shadow);}
.tbl-wrap table{min-width:100%;}
.tbl-wrap th{position:sticky;top:0;background:var(--surface);z-index:2;white-space:nowrap;}
.tbl-wrap td{white-space:nowrap;vertical-align:middle;}
.tbl-wrap td.wrap{white-space:normal;min-width:220px;}
.tbl-wrap tr.sel{background:var(--gold-dim);}
[data-theme="light"] .tbl-wrap tr.sel{background:var(--surface-2);}
.tbl-wrap .acts{display:flex;gap:6px;justify-content:flex-end;}
.who-cell b{display:block;font-size:13px;font-weight:600;color:var(--ink-2);line-height:1.3;}
.who-cell span{font-family:var(--mono);font-size:10px;color:var(--ink-40);}
.age{font-family:var(--mono);font-size:11px;}
.age.warn{color:var(--wait);} .age.bad{color:var(--no);font-weight:600;}
.lnk{color:var(--accent);text-decoration:none;font-size:12px;}
.lnk:hover{text-decoration:underline;}
.mono-s{font-family:var(--mono);font-size:11px;color:var(--ink-55);}

/* ---- inline row buttons -------------------------------------------- */
.b-xs{padding:5px 10px;font-size:11.5px;border-radius:7px;border:1px solid var(--hair-2);
  background:var(--surface-2);color:var(--ink-70);cursor:pointer;font-family:var(--sans);font-weight:600;
  white-space:nowrap;transition:all .2s;}
.b-xs:hover{border-color:var(--accent);color:var(--ink);}
.b-xs.ok{color:var(--ok);border-color:var(--ok-line);background:var(--ok-dim);}
.b-xs.no{color:var(--no);border-color:var(--no-line);background:var(--no-dim);}
.b-xs.wait{color:var(--wait);border-color:var(--wait-line);background:var(--wait-dim);}
.b-xs:disabled{opacity:.4;cursor:not-allowed;}

/* ---- cycle control -------------------------------------------------- */
.phase-line{display:flex;gap:0;border:1px solid var(--hair);border-radius:12px;overflow:hidden;margin-bottom:14px;}
.phase-line button{flex:1;padding:11px 6px;border:none;border-right:1px solid var(--hair);
  background:var(--surface);cursor:pointer;font-family:var(--sans);font-size:11.5px;font-weight:600;
  color:var(--ink-40);transition:all .25s;}
.phase-line button:last-child{border-right:none;}
.phase-line button:hover{background:var(--surface-2);color:var(--ink);}
.phase-line button.on{background:var(--inv-bg);color:var(--inv-fg);}
.phase-line button i{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.14em;
  font-style:normal;opacity:.65;margin-bottom:3px;}

.clock-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;}
.clock-grid .c{padding:12px 14px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);}
.clock-grid .c span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-40);}
.clock-grid .c b{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-top:4px;}
.clock-grid .c.now{border-color:var(--gold-line);background:var(--gold-dim);}
[data-theme="light"] .clock-grid .c.now{background:var(--surface-2);border-color:var(--hair-2);}

/* ---- task point tuner ----------------------------------------------- */
.tune{display:flex;align-items:center;gap:7px;}
.tune input{width:76px;font-family:var(--mono);font-size:13px;text-align:center;color:var(--ink);
  background:var(--surface-2);border:1px solid var(--hair-2);border-radius:8px;padding:7px 6px;outline:none;}
.tune input:focus{border-color:var(--accent);}
.tune .delta{font-family:var(--mono);font-size:11px;min-width:42px;}
.delta.up{color:var(--ok);} .delta.dn{color:var(--no);} .delta.same{color:var(--ink-25);}
.retro{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-55);cursor:pointer;}
.retro input{width:auto;accent-color:var(--accent);}

/* ---- weight sliders --------------------------------------------------- */
.wrow{display:flex;align-items:center;gap:12px;margin-bottom:11px;}
.wrow label{flex:0 0 128px;font-size:12.5px;color:var(--ink-70);}
.wrow input[type=range]{flex:1;accent-color:var(--accent);}
.wrow b{font-family:var(--mono);font-size:12px;width:44px;text-align:right;color:var(--ink-2);}
.wsum{font-family:var(--mono);font-size:11.5px;margin-top:6px;}
.wsum.bad{color:var(--no);} .wsum.ok{color:var(--ok);}

/* ---- misc ------------------------------------------------------------ */
.hint{font-size:12px;color:var(--ink-40);line-height:1.55;}
.danger-note{display:flex;gap:10px;padding:13px 15px;border-radius:12px;border:1px solid var(--no-line);
  background:var(--no-dim);font-size:12.5px;color:var(--ink-70);line-height:1.55;}
.danger-note b{color:var(--no);}
.ok-note{display:flex;gap:10px;padding:13px 15px;border-radius:12px;border:1px solid var(--ok-line);
  background:var(--ok-dim);font-size:12.5px;color:var(--ink-70);line-height:1.55;}
.split{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;align-items:start;}
.stack{display:flex;flex-direction:column;gap:13px;}
#adminSplash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:15px;background:var(--bg);text-align:center;padding:24px;}
#adminSplash.hide{display:none;}
#adminSplash .msg{font-size:13px;color:var(--ink-55);max-width:420px;line-height:1.6;}

@media (max-width:1100px){
  .split{grid-template-columns:1fr;}
  .app{grid-template-columns:1fr;}
  .main{padding:0 16px 60px;}
}

/* ============================================================
   READABILITY LAYER
   An ops console is used by people who did not build it, often
   at speed and under pressure. Every section says in one line
   what it is for, and every consequential control says what will
   happen before it happens. That is what the rules below dress.
   ============================================================ */

/* One-line purpose statement at the top of every section. */
.lede{display:flex;gap:12px;align-items:flex-start;padding:14px 17px;margin-bottom:15px;
  border-radius:13px;border:1px solid var(--hair);background:var(--surface);}
.lede .li{flex:0 0 auto;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;
  background:var(--gold-dim);border:1px solid var(--gold-line);color:var(--gold);
  font-family:var(--mono);font-size:12px;}
[data-theme="light"] .lede .li{background:var(--surface-2);border-color:var(--hair-2);color:var(--ink-70);}
.lede .lt{min-width:0;}
.lede .lt b{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:3px;}
.lede .lt span{display:block;font-size:12.5px;color:var(--ink-55);line-height:1.6;}
.lede .lt span b{display:inline;color:var(--ink-2);font-size:inherit;}

/* Collapsible detail, for the "why does it work this way" answer. */
details.more{margin-top:9px;}
details.more summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none;
  display:inline-flex;align-items:center;gap:5px;}
details.more summary::-webkit-details-marker{display:none;}
details.more summary::before{content:'+';font-family:var(--mono);font-size:12px;}
details.more[open] summary::before{content:'-';}
details.more .mb{margin-top:9px;font-size:12.5px;color:var(--ink-55);line-height:1.65;}
details.more .mb b{color:var(--ink-2);}
details.more .mb ul{margin:7px 0 0 16px;} details.more .mb li{margin-bottom:5px;}

/* "Do this next" panel on the overview. */
.todo{border:1px solid var(--gold-line);background:var(--gold-dim);border-radius:14px;padding:16px 18px;margin-bottom:16px;}
[data-theme="light"] .todo{border-color:var(--hair-2);background:var(--surface-2);}
.todo .th{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-40);margin-bottom:7px;}
.todo h3{font-family:var(--display);font-weight:400;font-size:23px;color:var(--ink-2);margin-bottom:6px;line-height:1.2;}
.todo p{font-size:12.5px;color:var(--ink-55);line-height:1.6;margin-bottom:11px;}
.todo .tl{display:flex;gap:8px;flex-wrap:wrap;}

/* Section sub-tabs, used where one section holds two lists. */
.f-chip{padding:7px 13px;border-radius:999px;border:1px solid var(--hair-2);background:var(--surface-2);
  color:var(--ink-55);font-family:var(--sans);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;}
.f-chip:hover{color:var(--ink);border-color:var(--accent);}
.f-chip.on{background:var(--inv-bg);color:var(--inv-fg);border-color:transparent;}

/* Forms inside modals. */
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 13px;}
.fgrid .field.full{grid-column:1 / -1;}
.field .fh{display:block;font-size:11px;color:var(--ink-40);margin-top:5px;line-height:1.5;}
.m-facts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:15px;}
.m-facts>div{padding:10px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--hair);}
.m-facts span{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.18em;
  text-transform:uppercase;color:var(--ink-40);}
.m-facts b{display:block;font-size:12.5px;color:var(--ink-2);margin-top:3px;word-break:break-word;}

/* Empty states that tell you what to do rather than just shrugging. */
.empty{padding:34px 22px;text-align:center;}
.empty .ei{font-family:var(--display);font-size:30px;color:var(--ink-25);line-height:1;margin-bottom:8px;}
.empty .eh{font-size:13.5px;font-weight:600;color:var(--ink-2);margin-bottom:4px;}
.empty .es{font-size:12.5px;color:var(--ink-40);max-width:400px;margin:0 auto;line-height:1.6;}

/* Priority and stage chips beyond the ok/wait/no trio. */
.chip.gold{color:var(--gold);border-color:var(--gold-line);background:var(--gold-dim);}
[data-theme="light"] .chip.gold{color:var(--ink);border-color:var(--hair-2);background:var(--surface-2);}

/* Ticket thread. */
.thread{display:flex;flex-direction:column;gap:9px;margin-bottom:14px;max-height:270px;overflow-y:auto;padding-right:4px;}
.tmsg{padding:11px 13px;border-radius:11px;border:1px solid var(--hair);background:var(--surface-2);}
.tmsg.staff{border-color:var(--gold-line);background:var(--gold-dim);}
[data-theme="light"] .tmsg.staff{border-color:var(--hair-2);background:var(--surface-2);}
.tmsg.note{border-style:dashed;}
.tmsg .tm-h{display:flex;gap:8px;align-items:center;font-family:var(--mono);font-size:9px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--ink-40);margin-bottom:5px;}
.tmsg p{font-size:12.5px;color:var(--ink-70);line-height:1.6;white-space:pre-wrap;}

/* Row of small buttons that should not crowd on narrow screens. */
.acts-wrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;}

@media (max-width:720px){
  .fgrid{grid-template-columns:1fr;}
  .m-facts{grid-template-columns:1fr;}
  .kpis{grid-template-columns:repeat(auto-fit,minmax(128px,1fr));}
  .phase-line{flex-wrap:wrap;}
  .phase-line button{flex:1 0 33%;border-bottom:1px solid var(--hair);}
}

/* ============================================================
   PIECES THE SHARED BASE DOES NOT CARRY
   ============================================================
   The clipper base CSS above stops at the shell. These are the
   card, modal and list parts the admin markup relies on, defined
   here so the console does not depend on the creator dashboard's
   own additions file.
   ============================================================ */

/* Card headers. */
.sec-h{display:flex;align-items:baseline;gap:10px;margin-bottom:15px;flex-wrap:wrap;}
.sec-h h2{font-family:var(--display);font-weight:400;font-size:21px;color:var(--ink-2);line-height:1.15;}
.sec-h .sh-sub{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-40);}
.sec-h .sh-r{margin-left:auto;display:flex;gap:7px;align-items:center;}
.hr{height:1px;background:var(--hair);margin:20px 0;}

/* Key/value rows inside a card. */
.metric{display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  padding:9px 0;border-bottom:1px solid var(--hair);}
.metric:last-child{border-bottom:none;}
.metric .m-k{font-family:var(--mono);font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-40);}
.metric .m-v{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ink-2);}

/* Modal internals. The height cap is the important line: without it a
   long form runs off the bottom of the screen with no way to reach the
   buttons, which is exactly how it feels broken. */
.modal{display:flex;flex-direction:column;max-height:calc(100vh - 48px);}
.modal.tall{max-width:600px;}
.modal .m-head{padding:26px 28px 0;flex:0 0 auto;}
.modal .m-body{padding:18px 28px 0;overflow-y:auto;flex:1 1 auto;min-height:0;}
.modal .m-actions{padding:16px 28px 22px;margin-top:auto;flex:0 0 auto;
  border-top:1px solid var(--hair);background:var(--surface);}
.modal .m-h{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-40);margin:16px 0 8px;}
.modal .m-h:first-child{margin-top:0;}
.modal .m-p{font-size:13px;color:var(--ink-70);line-height:1.65;margin-bottom:14px;}
.modal .m-p b{color:var(--ink-2);}
.m-steps{margin:0 0 14px 18px;}
.m-steps li{font-size:12.5px;color:var(--ink-70);line-height:1.6;margin-bottom:6px;}
.m-steps li b{color:var(--ink-2);}

/* A confirm button for something that cannot be undone should not look
   like a save button. */
.btn.danger{background:var(--no);border-color:var(--no);color:#fff;}
.btn.danger:hover{filter:brightness(1.08);}

/* Nav count badges. */
.navcount{display:inline-flex;align-items:center;justify-content:center;min-width:19px;height:19px;
  padding:0 6px;border-radius:999px;font-family:var(--mono);font-size:9.5px;font-weight:500;
  background:var(--wait-dim);border:1px solid var(--wait-line);color:var(--wait);}

/* Splash spinner. */
#adminSplash .ld{width:26px;height:26px;border-radius:50%;border:2px solid var(--hair-2);
  border-top-color:var(--accent);animation:aspin .8s linear infinite;}
#adminSplash .ld i{display:none;}
@keyframes aspin{to{transform:rotate(360deg);}}
#adminSplash a.lnk{color:var(--accent);}

/* Sticky table head needs a solid backdrop or rows show through it. */
.tbl-wrap thead th{background:var(--surface);}

/* ============================================================
   NOTHING SPILLS SIDEWAYS
   ============================================================
   A grid or flex child is min-width:auto by default, which means a
   wide table inside one pushes the whole column wider instead of
   scrolling inside its own box. On a dense console that turns into
   the entire page sliding left and right, which is miserable on a
   laptop and unusable on a phone. These rules make every container
   willing to be narrower than its contents, so the scroll happens
   where it belongs: inside the table.
   ============================================================ */
.app,.main,.side{min-width:0;}
.view,.split,.stack,.card,.kpis{min-width:0;}
.split>*,.stack>*,.view>*{min-width:0;}
.tbl-wrap{max-width:100%;}
.thread{min-width:0;}

/* The top bar is a single row of title, help, refresh and the theme
   switch. On a phone that row is wider than the screen, so it wraps
   and the theme switch loses its label rather than the page losing
   its left edge. */
@media (max-width:560px){
  .topbar{flex-wrap:wrap;row-gap:10px;}
  .topbar>div:first-child{flex:1 1 100%;}
  .topbar .sp{display:none;}
  .tsw-lab{display:none;}
  h1.pg{font-size:26px;}
  .main{padding:0 13px 60px;}
  .lede{padding:12px 13px;}
  .todo{padding:13px 14px;}
  .todo h3{font-size:19px;}
}

/* ============================================================
   THE SIDEBAR ON A SMALL SCREEN
   ============================================================
   The shared base turns the sidebar into a wrapping row below
   1000px, which works for the eight sections a creator has and
   falls apart at nineteen: the nav becomes a full page of links
   and the actual work is pushed off the bottom. Here it becomes a
   single sticky strip you scroll sideways, so the section you are
   in stays one thumb away and the content starts at the top.
   ============================================================ */
@media (max-width:1000px){
  .side{position:sticky;top:0;z-index:30;height:auto;
    flex-direction:row;flex-wrap:nowrap;align-items:center;gap:6px;
    overflow-x:auto;overflow-y:hidden;padding:10px 12px;
    background:var(--bg);border-right:none;border-bottom:1px solid var(--hair);
    scrollbar-width:thin;-webkit-overflow-scrolling:touch;}
  .side::-webkit-scrollbar{height:3px;}
  .side::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:3px;}
  .side>*{flex:0 0 auto;}
  .side .logo{margin:0 8px 0 0;}
  .nav-lab{display:none;}
  .nav-item{width:auto;white-space:nowrap;padding:7px 12px;font-size:12.5px;}
  .navcount{margin-left:6px;}
  .curr-wrap{margin:0 0 0 6px;width:auto;}
  .curr-sel{width:158px;}
  .user{margin:0;border:none;padding:0 0 0 8px;}
  .user .nm,.user .rl{display:none;}
}

/* Eight tiles read better as two rows of four than as seven and a
   stray. Below that the auto-fit rule takes over again. */
@media (min-width:1180px){
  .kpis{grid-template-columns:repeat(4,1fr);}
}

/* ============================================================
   THE SIDEBAR SCROLLS
   ============================================================
   Nineteen sections plus four group labels do not fit in a laptop's
   viewport, and the shared base pins the sidebar at 100vh with no
   overflow, so the bottom of the list was simply cut off. Anything
   below Referrals was unreachable on a 900px screen.

   The fix keeps three regions: the wordmark at the top and the cycle
   picker and account block at the bottom stay put, and only the nav
   list between them scrolls. Pinning the cycle picker matters more
   than it looks, because switching cycle is the one control you reach
   for from every section.
   ============================================================ */
.side{overflow:hidden;}
.nav-scroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;
  display:flex;flex-direction:column;
  margin:0 -12px;padding:0 12px 4px;
  scrollbar-width:thin;scrollbar-color:var(--hair-2) transparent;
  -webkit-overflow-scrolling:touch;}
.nav-scroll::-webkit-scrollbar{width:5px;}
.nav-scroll::-webkit-scrollbar-track{background:transparent;}
.nav-scroll::-webkit-scrollbar-thumb{background:var(--hair-2);border-radius:3px;}
.nav-scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-25);}
.nav-scroll>*{flex:0 0 auto;}

/* A hairline that only appears once there is something below the fold,
   so a short list does not get a decoration it has not earned. */
.side .curr-wrap{border-top:1px solid var(--hair);padding-top:12px;}

/* On the horizontal strip the wrapper must not become a scroll box of
   its own. display:contents dissolves it so the nav items go back to
   being direct children of the strip. */
@media (max-width:1000px){
  .side{overflow-x:auto;overflow-y:hidden;}
  .nav-scroll{display:contents;}
  .side .curr-wrap{border-top:none;padding-top:0;}
}

/* ============================================================
   DEMO STRIP
   ============================================================ */
.demobar{position:fixed;top:0;left:0;right:0;z-index:200;display:flex;align-items:center;gap:11px;
  flex-wrap:wrap;padding:8px 16px;background:var(--inv-bg);color:var(--inv-fg);
  font-family:var(--sans);font-size:12px;border-bottom:1px solid rgba(0,0,0,.14);}
.demobar .db-tag{font-family:var(--mono);font-size:8.5px;letter-spacing:.22em;text-transform:uppercase;
  padding:3px 8px;border-radius:999px;border:1px solid rgba(0,0,0,.3);flex:0 0 auto;}
.demobar .db-txt{opacity:.72;min-width:0;}
.demobar .db-sp{flex:1;min-width:8px;}
.demobar .db-lab{font-family:var(--mono);font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.6;}
.demobar .db-sel{font-family:var(--sans);font-size:12px;font-weight:600;color:var(--inv-fg);
  background:transparent;border:1px solid rgba(0,0,0,.3);border-radius:7px;padding:4px 8px;cursor:pointer;}
.demobar .db-what{opacity:.6;font-size:11.5px;}
.demobar .db-btn{font-family:var(--sans);font-size:11.5px;font-weight:600;color:var(--inv-fg);
  background:transparent;border:1px solid rgba(0,0,0,.3);border-radius:7px;padding:4px 10px;cursor:pointer;}
.demobar .db-btn:hover{background:rgba(0,0,0,.08);}

/* The strip is fixed, so everything underneath moves down by its height.
   The sidebar is 100vh and sticky, so it has to lose exactly that much
   height too, otherwise its bottom hangs off the screen and the account
   block it pins there goes with it. */
body.has-demobar .app{padding-top:42px;}
body.has-demobar .side{top:42px;height:calc(100vh - 42px);}
@media (max-width:1000px){ body.has-demobar .side{top:42px;height:auto;} }
@media (max-width:760px){
  .demobar .db-txt,.demobar .db-what{display:none;}
  body.has-demobar .app{padding-top:38px;}
  body.has-demobar .side{top:38px;height:auto;}
}
#adminSplash{padding-top:60px;}
</style>

<script>
/* ============================================================
   CLIPATHON ADMIN, DEMO BUILD
   ============================================================
   This file is the real console with a fake database bolted
   underneath. There is no network, no login and no Supabase: the
   client below answers from an array in memory that is generated
   fresh every time the page loads.

   Everything is live. Approving a registration really does clear
   the row and drop the counter. Repricing a task really does write
   the back-credit entries. Running scoring really does rank people
   from their snapshots. Reload and it all goes back to how it
   started, because none of it ever left the browser.
   ============================================================ */
(function(){
'use strict';

/* ---------- deterministic randomness, so the demo is the same
     shape every time without being obviously patterned ---------- */
var seed = 20260821;
function rnd(){ seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
function pick(a){ return a[Math.floor(rnd()*a.length)]; }
function int(lo,hi){ return lo + Math.floor(rnd()*(hi-lo+1)); }
function chance(p){ return rnd() < p; }

var NOW = Date.now();
function hrs(h){ return new Date(NOW + h*3600000).toISOString(); }
var idn = 0;
function uid(){ idn++; return 'demo-' + String(idn).padStart(4,'0') + '-0000-4000-8000-000000000000'; }

var FIRST = ['Aarav','Ishita','Rohan','Ananya','Kabir','Meera','Arjun','Diya','Vivaan','Sneha',
  'Aditya','Priya','Karan','Nandini','Rahul','Tanvi','Siddharth','Riya','Yash','Kavya',
  'Advait','Sanya','Dev','Anjali','Nikhil','Pooja','Manish','Shreya','Aryan','Isha',
  'Farhan','Zoya','Rudra','Aisha','Om','Trisha','Harsh','Neha','Vikram','Ridhi',
  'Soumya','Ipsita','Debasish','Smruti','Alok','Pragyan','Subhra','Jyoti'];
var LAST = ['Sharma','Patel','Mohanty','Das','Nayak','Iyer','Reddy','Khan','Mishra','Sahoo',
  'Behera','Panda','Rout','Jena','Swain','Pradhan','Ghosh','Banerjee','Verma','Singh',
  'Kar','Dash','Mahapatra','Tripathy','Bose','Chatterjee','Rao','Menon'];
var CAMPUS = ['KIIT University','NIT Rourkela','SOA University','CET Bhubaneswar',
  'Utkal University','Ravenshaw University','IIIT Bhubaneswar','Silicon Institute'];
var CITY = ['Bhubaneswar','Cuttack','Rourkela','Puri','Sambalpur','Berhampur'];
var BANDS = ['1k-5k','5k-10k','10k-50k','50k-100k','100k+'];
var CATS = [['comedy','skits'],['food'],['tech','gadgets'],['fashion','beauty'],
  ['fitness'],['study','productivity'],['travel'],['music']];

var DB = {};
var CID, SEASON_ID;

/* ---------- season and cycle ---------- */
SEASON_ID = uid();
DB.seasons = [{ id:SEASON_ID, code:'S1', name:'Season One, 2026',
  starts_at:hrs(-24*120), ends_at:hrs(24*245), is_current:true, closed_at:null, created_at:hrs(-24*130) }];

CID = uid();
DB.cycles = [{
  id:CID, code:'CYC-01', name:'Clipathon Cycle 01', city:'Bhubaneswar',
  status:'tracking',
  registration_opens:hrs(-24*14), registration_closes:hrs(-24*9),
  brands_reveal_at:hrs(-24*4-12), slots_open_at:hrs(-24*4),
  slots_close_at:hrs(-24*3-16), submission_cutoff_at:hrs(-20),
  finale_at:hrs(26), brand_count:5, slots_per_brand:100, total_slots:500,
  prize_pool_minor:75000000, currency:'INR',
  scoring_weights:{ views:40, engagement:25, quality:20, compliance:15 },
  scoring_locked_at:hrs(-24*10), final_snapshot_at:null,
  venue:'Campus 6 Auditorium, KIIT', notes:'First run. Two brands sold out inside forty minutes.',
  created_at:hrs(-24*40), updated_at:hrs(-2), created_by:null, season_id:SEASON_ID
},{
  id:uid(), code:'CYC-00', name:'Pilot, invite only', city:'Bhubaneswar',
  status:'archived', registration_opens:hrs(-24*200), registration_closes:hrs(-24*190),
  brands_reveal_at:hrs(-24*186), slots_open_at:hrs(-24*185), slots_close_at:hrs(-24*184),
  submission_cutoff_at:hrs(-24*181), finale_at:hrs(-24*180),
  brand_count:2, slots_per_brand:40, total_slots:80, prize_pool_minor:5000000, currency:'INR',
  scoring_weights:{ views:40, engagement:25, quality:20, compliance:15 },
  scoring_locked_at:hrs(-24*195), venue:'Studio', notes:'Eighty creators, two brands.',
  created_at:hrs(-24*220), updated_at:hrs(-24*180), season_id:SEASON_ID
}];

/* ---------- brands ----------
   Invented names, deliberately. A demo that borrows a real brand's
   identity is a demo somebody eventually screenshots out of context. */
var BRAND_SPEC = [
  { name:'Kettle and Co',    slug:'kettle',    cat:'Food and drink',
    sum:'A cold brew brand that wants students to see it as the thing you drink while working, not while resting.',
    must:['Say the name in the first five seconds','Show the bottle label clearly once','Film somewhere you actually study'],
    never:['Any health or medical claim','Comparisons to a named competitor'],
    reward:'Three months of product plus ₹4,000', taken:100 },
  { name:'Zephyr Audio',     slug:'zephyr',    cat:'Consumer tech',
    sum:'Budget earbuds. The brief is honest reviewing, not hype, and they mean it.',
    must:['Show the case opening','Say the price out loud','One genuine drawback'],
    never:['Claiming noise cancelling it does not have','Fake unboxing of a unit you were not sent'],
    reward:'Keep the unit plus ₹5,000', taken:100 },
  { name:'Mudra Skincare',   slug:'mudra',     cat:'Beauty',
    sum:'A three step routine for people who have never had one. Plain language, no jargon.',
    must:['Show all three steps','Use the phrase "for beginners"','Disclose the partnership on screen'],
    never:['Before and after skin claims','Anything implying it treats a condition'],
    reward:'Full range plus ₹4,500', taken:87 },
  { name:'Tapri Chai',       slug:'tapri',     cat:'Food and drink',
    sum:'Instant chai that does not taste instant. They want the hostel kettle, the 2am version.',
    must:['Make it on camera','Say how long it takes','Show the sachet'],
    never:['Suggesting it replaces a meal'],
    reward:'A year of chai plus ₹3,500', taken:64 },
  { name:'Northbeam Fitness',slug:'northbeam', cat:'Fitness',
    sum:'A campus gym chain opening four branches. They want it to feel local, not corporate.',
    must:['Film inside a real gym','Name your campus','Show the app once'],
    never:['Body shaming of any kind','Promising specific weight results'],
    reward:'One year membership plus ₹6,000', taken:41 }
];
DB.brands = BRAND_SPEC.map(function(b,i){
  return { id:uid(), cycle_id:CID, slug:b.slug, name:b.name, category:b.cat, logo_url:'',
    summary:b.sum, brief:b.sum + ' Keep it to one idea. The clips that do best are the ones where you clearly ' +
      'like the thing, so if you do not, pick a different brand.',
    must_include:b.must, never_say:b.never, hashtags:['#clipathon','#'+b.slug],
    mentions:['@'+b.slug], disclosure_text:'Paid partnership with ' + b.name,
    content_style:'Handheld, spoken to camera, natural light',
    duration_min_sec:15, duration_max_sec:60, reward_note:b.reward, drive_folder:'',
    slots_total:100, slots_taken:b.taken, display_order:i+1, is_reserve:false,
    created_at:hrs(-24*30), updated_at:hrs(-24*6) };
});

/* ---------- ambassadors ---------- */
DB.ambassadors = CAMPUS.slice(0,6).map(function(c,i){
  var f=pick(FIRST), l=pick(LAST);
  return { id:uid(), cycle_id:CID, creator_id:null, full_name:f+' '+l,
    email:(f+'.'+l).toLowerCase()+'@campus.test', phone:'9'+int(100000000,999999999),
    campus:c, ref_code:c.split(' ')[0].toUpperCase().slice(0,4)+'-'+String.fromCharCode(65+i)+int(10,99),
    reward_note:'Merch drop plus ₹2,000 at 25 approved', is_active:i!==5,
    created_at:hrs(-24*20), updated_at:hrs(-24*20) };
});

/* ---------- creators, registrations, accounts ----------
   460 entries, shaped like a real cycle: most approved, a tail still
   in the queue, a handful rejected, and a gap between "approved" and
   "actually ready" because people do not finish setting up. */
DB.creators = []; DB.registrations = []; DB.creator_accounts = [];
var TOTAL = 460;
var used = {};
for(var i=0;i<TOTAL;i++){
  var f=pick(FIRST), l=pick(LAST), base=(f+'.'+l).toLowerCase(), em=base+'@student.test';
  if(used[em]) em = base + (i % 90 + 10) + '@student.test';
  used[em]=1;
  var cid_ = uid();
  var hasLogin, status;
  if(i < 400)      status = 'approved';
  else if(i < 428) status = 'pending';
  else if(i < 438) status = 'needs_info';
  else             status = 'rejected';
  hasLogin = status==='approved' ? chance(0.88) : false;

  DB.creators.push({ id:cid_, auth_user_id: hasLogin ? uid() : null,
    creator_code:'CLP'+String(1000+i), full_name:f+' '+l, display_name:f,
    email:em, phone:'9'+int(100000000,999999999), phone_verified_at:hrs(-int(50,400)),
    email_verified_at:hrs(-int(50,400)), city:pick(CITY), campus:pick(CAMPUS), country:'India',
    referral_code:'REF'+String(1000+i), is_blocked:false, blocked_reason:null,
    created_at:hrs(-int(210,340)), updated_at:hrs(-int(1,200)) });

  var amb = chance(0.45) ? pick(DB.ambassadors) : null;
  /* Anything still awaiting a decision arrived recently, because a queue
     with two week old rows in it is a queue nobody is working. A handful
     are deliberately past the 24 hour promise, so the amber and red ages
     on the screen have something to colour. */
  var made = (status==='pending' || status==='needs_info')
    ? hrs(-(chance(0.22) ? int(26,46) : int(1,23)))
    : hrs(-int(200, 330));
  DB.registrations.push({ id:uid(), cycle_id:CID, creator_id:cid_,
    primary_profile_url:'https://instagram.com/'+base.replace('.','_'),
    secondary_profile_url: chance(0.3) ? 'https://youtube.com/@'+base.replace('.','') : null,
    follower_band:pick(BANDS), content_categories:pick(CATS),

/* index helpers used all over the generators below */
function regOf(creatorId){
  for(var i=0;i<DB.registrations.length;i++) if(DB.registrations[i].creator_id===creatorId) return DB.registrations[i];
  return null;
}
function creatorOf(id){ for(var i=0;i<DB.creators.length;i++) if(DB.creators[i].id===id) return DB.creators[i]; return null; }
function verifiedHandle(creatorId){
  for(var i=0;i<DB.creator_accounts.length;i++)
    if(DB.creator_accounts[i].creator_id===creatorId && DB.creator_accounts[i].status==='verified') return true;
  return false;
}

   392 taken across five brands, matching the counters on the brands
   themselves. The two popular ones are full. */
